<!DOCTYPE html>
<html lang="pl" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sushi Planner — food cost i menu</title>
<style>
:root{
  color-scheme:light;
  --plane:#f9f9f7; --surface:#fcfcfb; --surface-2:#f2f2ef;
  --ink:#0b0b0b; --ink-2:#52514e; --muted:#898781;
  --grid:#e1e0d9; --axis:#c3c2b7; --border:rgba(11,11,11,.10);
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300; --s7:#4a3aa7; --s8:#e34948;
  --good:#0ca30c; --warn:#fab219; --serious:#ec835a; --crit:#d03b3b;
  --good-ink:#006300; --crit-ink:#b02c2c; --warn-ink:#8a6100;
  --r:10px;
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --plane:#0d0d0d; --surface:#1a1a19; --surface-2:#242422;
  --ink:#fff; --ink-2:#c3c2b7; --muted:#898781;
  --grid:#2c2c2a; --axis:#383835; --border:rgba(255,255,255,.10);
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
  --good-ink:#0ca30c; --crit-ink:#e66767; --warn-ink:#fab219;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--plane); color:var(--ink);
  font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;font-weight:640;letter-spacing:-.01em}
h1{font-size:18px} h2{font-size:16px} h3{font-size:13px}
a{color:var(--s1)}

/* ---------- layout ---------- */
.app{display:flex;min-height:100vh}
.side{
  width:216px;flex:none;background:var(--surface);border-right:1px solid var(--border);
  padding:16px 12px;display:flex;flex-direction:column;gap:2px;position:sticky;top:0;height:100vh;overflow:auto;
}
.brand{display:flex;align-items:center;gap:9px;padding:4px 8px 16px}
.brand .dot{width:22px;height:22px;border-radius:7px;background:linear-gradient(135deg,var(--s1),var(--s3));flex:none}
.brand b{font-size:14.5px;letter-spacing:-.01em}
.brand small{display:block;color:var(--muted);font-size:11px;font-weight:400}
.nav{background:none;border:0;text-align:left;padding:8px 10px;border-radius:8px;cursor:pointer;color:var(--ink-2);display:flex;gap:9px;align-items:center;width:100%}
.nav:hover{background:var(--surface-2);color:var(--ink)}
.nav.on{background:var(--surface-2);color:var(--ink);font-weight:600}
.nav .ic{width:16px;text-align:center;opacity:.75}
.nav .cnt{margin-left:auto;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.navgrp{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  color:var(--muted);padding:14px 10px 5px}
.navgrp:first-of-type{padding-top:2px}
/* grupy poza Pulpitem zwijają się — na co dzień potrzebny jest tylko Pulpit */
button.navgrp{background:none;border:0;width:100%;display:flex;align-items:center;
  justify-content:space-between;gap:8px;cursor:pointer;font-family:inherit;text-align:left}
button.navgrp:hover{color:var(--ink-2)}
button.navgrp.zwin{padding-bottom:9px}         /* zwinięte nagłówki nie mogą się kleić */
button.navgrp .ch{font-size:9px;opacity:.8;transition:transform .15s}
button.navgrp.zwin .ch{transform:rotate(-90deg)}
.navitems{display:flex;flex-direction:column;gap:2px}
.navitems.zwin{display:none}
.daybar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.daybar input[type=date]{max-width:170px}
.sidefoot{margin-top:auto;padding-top:14px;display:flex;flex-direction:column;gap:6px}
.main{flex:1;min-width:0;padding:20px 24px 64px;max-width:1400px}
.topbar{display:flex;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.topbar .sub{color:var(--muted);font-size:12.5px}
.spacer{flex:1}

/* ---------- primitives ---------- */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:16px}
.card h2{margin-bottom:2px}
.card .hint{color:var(--muted);font-size:12px;margin-bottom:12px}
.grid{display:grid;gap:12px}
.btn{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:7px 12px;cursor:pointer;color:var(--ink);font-weight:520;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.pri{background:var(--s1);border-color:transparent;color:#fff}
.btn.pri:hover{filter:brightness(1.07)}
.btn.sm{padding:4px 9px;font-size:12.5px;border-radius:7px}
.btn.danger{color:var(--crit-ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
input[type=text],input[type=number],input[type=search],input[type=email],input[type=password],select,textarea{
  background:var(--plane);border:1px solid var(--border);border-radius:8px;padding:7px 9px;width:100%;
}
input:focus,select:focus,textarea:focus{outline:2px solid var(--s1);outline-offset:-1px}
label.f{display:block;font-size:12px;color:var(--ink-2);margin-bottom:4px;font-weight:540}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;padding:2px 8px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);font-weight:560;white-space:nowrap}
.tag.good{background:color-mix(in srgb,var(--good) 14%,transparent);color:var(--good-ink)}
.tag.warn{background:color-mix(in srgb,var(--warn) 22%,transparent);color:var(--warn-ink)}
.tag.crit{background:color-mix(in srgb,var(--crit) 15%,transparent);color:var(--crit-ink)}
.num{font-variant-numeric:tabular-nums}
.mut{color:var(--muted)}
.small{font-size:12px}

/* ---------- table ---------- */
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{text-align:left;font-size:11.5px;font-weight:620;color:var(--muted);padding:7px 8px;border-bottom:1px solid var(--grid);white-space:nowrap;letter-spacing:.01em}
th.r,td.r{text-align:right}
th.sortable{cursor:pointer;user-select:none}
th.sortable:hover{color:var(--ink)}
th.sortable::after{content:'⇅';margin-left:5px;opacity:.3;font-size:10px}
th.sortable.asc::after{content:'↑';opacity:1;color:var(--s1)}
th.sortable.desc::after{content:'↓';opacity:1;color:var(--s1)}
td{padding:8px;border-bottom:1px solid var(--grid);vertical-align:middle}
tbody tr:hover{background:var(--surface-2)}
tbody tr.sel{background:color-mix(in srgb,var(--s1) 8%,transparent)}
.tw{overflow:auto;border:1px solid var(--border);border-radius:var(--r);background:var(--surface)}
td .cellin{background:transparent;border:1px solid transparent;padding:3px 5px;border-radius:6px;text-align:right}
td .cellin:hover{border-color:var(--border);background:var(--plane)}

/* ---------- stat tiles ---------- */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:14px 16px}
.tile .lab{font-size:11.5px;color:var(--muted);font-weight:600;letter-spacing:.02em;text-transform:uppercase}
.tile .val{font-size:27px;font-weight:660;letter-spacing:-.02em;margin-top:5px;line-height:1.1}
.tile .note{font-size:12px;color:var(--ink-2);margin-top:3px}

/* ---------- chart ---------- */
.chart{width:100%;display:block}
@media(max-width:820px){
  .chart{min-width:520px}
  .card>div[id^="ch"]{overflow-x:auto;-webkit-overflow-scrolling:touch}
}
.chart text{font:11px system-ui,-apple-system,"Segoe UI",sans-serif;fill:var(--muted)}
.chart .lbl{fill:var(--ink-2);font-weight:540}
.chart .val{fill:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.chart .gl{stroke:var(--grid);stroke-width:1}
.chart .base{stroke:var(--axis);stroke-width:1}
.chart .bar{rx:4}
.chart .hit{fill:transparent;cursor:pointer}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink-2);margin-top:10px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block;margin-right:6px;vertical-align:-1px}
#tip{
  position:fixed;pointer-events:none;z-index:99;background:var(--surface);border:1px solid var(--border);
  border-radius:8px;padding:7px 10px;font-size:12.5px;box-shadow:0 6px 20px rgba(0,0,0,.16);opacity:0;transition:opacity .1s;
  max-width:280px
}
#tip b{display:block;margin-bottom:2px}

/* ---------- misc ---------- */
.alert{display:flex;gap:10px;padding:10px 12px;border-radius:9px;background:var(--surface-2);align-items:flex-start;margin-bottom:8px}
.alert .ic{flex:none;width:18px;height:18px;border-radius:5px;display:grid;place-items:center;font-size:11px;font-weight:700;color:#fff;margin-top:1px}
.alert.crit .ic{background:var(--crit)} .alert.warn .ic{background:var(--warn);color:#3a2a00} .alert.info .ic{background:var(--s1)}
.alert .txt{font-size:13px;color:var(--ink-2)} .alert .txt b{color:var(--ink)}
dialog{border:1px solid var(--border);border-radius:14px;background:var(--surface);color:var(--ink);padding:0;max-width:min(880px,94vw);width:100%}
dialog::backdrop{background:rgba(0,0,0,.42)}
.dlg-h{padding:16px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
.dlg-b{padding:18px;max-height:min(70vh,660px);overflow:auto}
.dlg-f{padding:13px 18px;border-top:1px solid var(--border);display:flex;gap:9px;justify-content:flex-end;background:var(--surface-2);border-radius:0 0 14px 14px}
/* nazwa prowadząca do składu — ma wyglądać jak tekst, nie jak odnośnik */
a[data-sklad]{color:inherit;text-decoration:none;border-bottom:1px dotted var(--border)}
a[data-sklad]:hover{border-bottom-color:var(--ink-2)}
a[data-sklad]::after{content:' ›';color:var(--muted);font-weight:600}
/* kafelki ekranu głównego pulpitu */
.pulpit{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.pulpit a.card{display:block;text-decoration:none;color:inherit;padding:16px;transition:.12s}
.pulpit a.card:hover{border-color:var(--accent);transform:translateY(-1px)}
.pulpit .ic-big{font-size:22px;line-height:1;opacity:.55}
/* --- pulpit na telefonie: dwie kolumny zamiast jednej, mniejsze liczby --- */
@media(max-width:640px){
  .tiles{grid-template-columns:repeat(2,1fr);gap:8px}
  .tiles .tile{padding:11px}
  .tile .lab{font-size:10px}
  .tile .val{font-size:20px}
  .tile .sub2,.tile .note{font-size:11px}
  .pulpit{grid-template-columns:repeat(2,1fr);gap:8px}
  .pulpit a.card{padding:12px}
  .pulpit .ic-big{display:none}          /* ikona zawijała się do drugiej linii */
  .pulpit .val{font-size:20px;margin-top:6px}
  .daybar .btn{padding:7px 11px}
  .daybar input[type=date]{flex:1 1 130px;max-width:none}
  /* nagłówek kafelka: liczba pod nazwą, nie w prawym rogu */
  .dz-head{flex-direction:column;align-items:flex-start!important;gap:4px}
  .dz-head .licz{text-align:left!important;display:flex;align-items:baseline;gap:6px}
  .dz-head .licz .hint{margin:0}
  .zal-slot{padding-left:26px}
  .zal-slot .nm{font-size:11px}
}
/* szeroka tabela na wąskim ekranie — pierwsza kolumna zostaje na widoku */
@media(max-width:760px){
  .tw.przyklej table td:first-child,.tw.przyklej table th:first-child{
    position:sticky;left:0;background:var(--surface);z-index:2;box-shadow:1px 0 0 var(--grid)}
}
/* siatka załadunku: dwie kolumny szafek na automat, klik przełącza */
.zal-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
.zal-cols{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.zal-slot{position:relative;border-radius:9px;padding:9px 10px 9px 30px;cursor:pointer;
  border:1px solid transparent;text-align:left;width:100%;font:inherit;min-height:44px;
  display:flex;align-items:center;line-height:1.2}
.zal-slot .nr{position:absolute;left:6px;top:50%;transform:translateY(-50%);
  font-size:12px;font-weight:800;opacity:.9;font-variant-numeric:tabular-nums}
.zal-slot .nm{font-size:12px;font-weight:600;overflow:hidden;display:-webkit-box;
  -webkit-line-clamp:2;-webkit-box-orient:vertical}
.zal-slot.on{background:var(--good);color:#fff}
.zal-slot.off{background:var(--crit);color:#fff}
.zal-slot.pusto{background:var(--surface-2);color:var(--muted);cursor:default}
.zal-slot:not(.pusto):hover{filter:brightness(1.07)}
.lockers{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:1100px){.lockers{grid-template-columns:1fr}}
.lock{display:grid;grid-template-columns:34px 1fr 86px 78px 58px;gap:8px;align-items:center;margin-bottom:6px}
@media(max-width:640px){.lock{grid-template-columns:30px 1fr 70px}}
.lock .no{width:28px;height:28px;border-radius:7px;background:var(--surface-2);color:var(--ink-2);
  display:grid;place-items:center;font-size:12px;font-weight:640;font-variant-numeric:tabular-nums}
.lock.pusta .no{background:transparent;border:1px dashed var(--border);color:var(--muted)}
.lock .num{text-align:right;font-variant-numeric:tabular-nums;font-size:12.5px}
.combo{position:relative;display:inline-block;width:100%}
.combo input.combo-q{width:100%}
.combo-pop{position:fixed;z-index:70;background:var(--surface);border:1px solid var(--border);
  border-radius:9px;box-shadow:0 8px 24px rgba(0,0,0,.14);max-height:260px;overflow:auto;display:none;padding:4px}
.combo-pop.open{display:block}
.combo-pop .opt{padding:6px 9px;border-radius:6px;cursor:pointer;font-size:13px;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.combo-pop .opt:hover,.combo-pop .opt.on{background:var(--surface-2)}
.combo-pop .none{padding:8px 9px;color:var(--muted);font-size:12.5px}
.empty{text-align:center;padding:40px 20px;color:var(--muted)}
.bar-mini{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden;min-width:60px}
.bar-mini i{display:block;height:100%;border-radius:3px}
.split{display:grid;grid-template-columns:1fr 340px;gap:12px;align-items:start}
.tiles-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(268px,1fr));gap:12px;align-content:start}
.tcard .kv:first-of-type{padding-top:0}
.tcard{cursor:pointer;transition:border-color .12s}
.tcard:hover{border-color:var(--axis)}
.tcard.sel{border-color:var(--s1);box-shadow:0 0 0 1px var(--s1)}
.tcard .th{display:flex;gap:9px;align-items:flex-start;justify-content:space-between;margin-bottom:8px}
.tcard h3{margin:0;font-size:14.5px;line-height:1.25}
.tcard .acts{display:flex;gap:5px;flex-wrap:wrap;margin-top:10px;padding-top:9px;border-top:1px solid var(--grid)}
@media(max-width:1080px){.split{grid-template-columns:1fr}}
/* Na telefonie menu chowa się pod hamburgerem — pasek przewijany w bok gubił
   połowę pozycji i nie dało się na nim rozróżnić grup. */
.burger,.scrim{display:none}
@media(max-width:760px){
  .app{flex-direction:column}
  /* pasek na całą szerokość, przyklejony do góry — nie zasłania niczego pod spodem */
  .burger{display:flex;align-items:center;gap:10px;position:fixed;top:0;left:0;right:0;
    width:100%;height:48px;padding:0 14px;z-index:80;
    background:var(--surface);border:0;border-bottom:1px solid var(--border);border-radius:0;
    font:inherit;font-weight:620;color:var(--ink);cursor:pointer;text-align:left;
    box-shadow:0 1px 4px rgba(0,0,0,.05)}
  .side{position:fixed;left:0;top:0;bottom:0;width:min(272px,84vw);z-index:90;
    flex-direction:column;overflow-y:auto;padding:14px;border-right:1px solid var(--border);
    transform:translateX(-102%);transition:transform .18s ease-out}
  .side.open{transform:none;box-shadow:0 0 40px rgba(0,0,0,.25)}
  .scrim.open{display:block;position:fixed;inset:0;z-index:85;background:rgba(0,0,0,.35)}
  .brand,.sidefoot{display:flex}
  .nav{padding:11px 10px}
  .main{padding:14px;padding-top:62px}
}
.hidden{display:none!important}
tr.arch{opacity:.55}
tr.arch:hover{opacity:.85}
.card.arch{opacity:.6}
.card.arch:hover{opacity:1}
.pill-group{display:inline-flex;background:var(--surface-2);border-radius:9px;padding:3px;gap:2px}
.pill-group button{background:none;border:0;padding:5px 11px;border-radius:7px;cursor:pointer;color:var(--ink-2);font-size:12.5px;font-weight:540}
.pill-group button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
/* kolejność ręczna: uchwyt do przeciągania, numer pozycji, strzałki */
.uch{cursor:grab;color:var(--muted);user-select:none;font-size:15px;line-height:1}
.uch:active{cursor:grabbing}
.ordcell{display:flex;align-items:center;gap:5px;white-space:nowrap}
.ordcell .nr{font-size:11px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.btn.mv{padding:2px 6px;font-size:11px;line-height:1.3}
.dragging{opacity:.4}
.dropzone{box-shadow:inset 0 3px 0 -1px var(--s1)}
th.ordth{cursor:pointer}
th.ordth.on{color:var(--ink)}
.compline{display:grid;grid-template-columns:1fr 92px 74px 90px 32px;gap:8px;align-items:center;margin-bottom:7px}
.compline.ord{grid-template-columns:96px 1fr 92px 74px 90px 32px}
@media(max-width:640px){.compline.ord{grid-template-columns:92px 1fr 74px 56px;grid-auto-rows:auto}}
.compline.wst{grid-template-columns:1fr 78px 78px 60px 84px 32px}
@media(max-width:640px){.compline.wst{grid-template-columns:1fr 70px 70px}}
.compline .cost{text-align:right;font-variant-numeric:tabular-nums;color:var(--ink-2)}
@media(max-width:640px){.compline{grid-template-columns:1fr 80px 60px;grid-auto-rows:auto}}
.kv{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--grid);font-size:13px}
.kv:last-child{border:0}
.kv b{font-variant-numeric:tabular-nums}
.banner{border:1px solid var(--border);border-left:3px solid var(--s4);background:var(--surface);border-radius:9px;padding:11px 14px;margin-bottom:14px;font-size:13px;color:var(--ink-2)}
/* ---------- zdjęcia ---------- */
.thumb{width:38px;height:38px;border-radius:7px;object-fit:cover;background:var(--surface-2);display:block;flex:none}
.thumb.ph{display:grid;place-items:center;color:var(--muted);font-size:15px}
.hero{width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:9px;background:var(--surface-2);display:block;margin-bottom:12px}
.drop{border:1.5px dashed var(--axis);border-radius:9px;padding:14px;text-align:center;color:var(--muted);font-size:12.5px;cursor:pointer;max-width:280px}
.drop:hover{border-color:var(--s1);color:var(--ink-2)}
.drop.has{padding:0;border-style:solid;overflow:hidden;position:relative}
.drop.has img{width:100%;aspect-ratio:16/10;object-fit:cover;display:block}
.namecell{display:flex;align-items:center;gap:9px;min-width:0}
body.ro [data-ro-hide]{display:none!important}
.login-wrap{position:fixed;inset:0;background:var(--plane);display:grid;place-items:center;z-index:200;padding:20px}
.login-box{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:26px;width:100%;max-width:370px;box-shadow:0 10px 40px rgba(0,0,0,.12)}
.login-box .brand{padding:0 0 18px}
</style>
</head>
<body>
<div id="tip"></div>
<button class="burger" id="burger" aria-label="Menu">☰ <span id="burgerNazwa">Menu</span></button>
<div class="scrim" id="scrim"></div>
<div class="app">
  <nav class="side" id="side">
    <div class="brand">
      <div class="dot"></div>
      <div><b>Sushi Planner</b><small id="brandSub">food cost &amp; menu</small></div>
    </div>
    <div class="navgrp">Pulpit</div>
    <div class="navitems">
    <button class="nav on" data-v="dHome"><span class="ic">▣</span>Pulpit</button>
    <button class="nav" data-v="dPrep"><span class="ic">◍</span>Przygotowanie</button>
    <button class="nav" data-v="dRolki"><span class="ic">◈</span>Rolki</button>
    <button class="nav" data-v="dZest"><span class="ic">▦</span>Zestawy</button>
    <button class="nav" data-v="dPack"><span class="ic">▥</span>Pakowanie</button>
    <button class="nav" data-v="driver"><span class="ic">➜</span>Kierowca</button>
    <button class="nav" data-v="stock"><span class="ic">⚖</span>Kontrola zasobów</button>

let DB = null;
let VIEW = 'dHome';   // kuchnia zaczyna dzień od przygotowania
let SEL = {item:null, set:null, ing:null, prep:null, mach:null, load:null};

const STORE_KEY = 'sushi-planner-v1';
function safeGet(){ try{ return localStorage.getItem(STORE_KEY); }catch(e){ return null; } }
function safeSet(v){ try{ localStorage.setItem(STORE_KEY,v); return true; }catch(e){ return false; } }
let STORAGE_OK = true;

function uid(p){ return p+'-'+Math.random().toString(36).slice(2,9); }

/* ---------- archiwum ---------- */
const ARCH = {ing:'active', prep:'active', items:'active', sets:'active', mach:'active', load:'active'};
const ARCH_LIST = {ing:()=>DB.ingredients, prep:()=>DB.preps, items:()=>DB.items,
                   sets:()=>DB.sets, mach:()=>DB.machines, load:()=>DB.loads};

function active(list){ return list.filter(x=>!x.archived); }
function archFilter(list, key){
  const m = ARCH[key];
  if(m==='all') return list;
  if(m==='arch') return list.filter(x=>x.archived);
  return list.filter(x=>!x.archived);
}

/* ---------- automaty vendingowe ----------
   Sześć maszyn, każda z dwiema kolumnami po dziesięć szafek: 1–10 i 11–20.
   Układ szafek jest wspólny dla wszystkich — tak jest w rzeczywistości i tak
   jest prościej planować załadunek. */
const VEND_SLOTS = 20;
const VEND_PER_COL = 10;
const AUTOMATY_START = [
  {id:'aut-zabierzow',   code:'ZAB', name:'Zabierzów, Biedronka',       addr:'Krakowska 232, 32-080 Zabierzów'},
  {id:'aut-imbramowski', code:'IMB', name:'Plac Imbramowski',           addr:'pl. Imbramowski 179, 31-212 Kraków'},
  {id:'aut-przewoz',     code:'PRZ', name:'Przewóz, Delikatesy Premium', addr:'Przewóz 34A, 30-603 Kraków'},
  {id:'aut-galicyjska',  code:'GAL', name:'Kaufland, Galicyjska',       addr:'Galicyjska 8, 31-586 Kraków'},
  {id:'aut-jasnogorska', code:'JAS', name:'Kraków, Jasnogórska',        addr:'Jasnogórska 62, 31-358 Kraków'},
  {id:'aut-norymberska', code:'NOR', name:'Kaufland, Norymberska',      addr:'Norymberska 1, 30-376 Kraków'},
];
/** krótki kod z nazwy — awaryjnie, gdy ktoś doda automat bez kodu */
function kodZNazwy(nazwa, zajete){
  const baza = bezOgonkow(nazwa).replace(/[^a-z0-9]/g,'').slice(0,3).toUpperCase() || 'AUT';
  let k = baza, i = 1;
  while(zajete.has(k)) k = baza.slice(0,2) + (++i);
  return k;
}
function migrateVending(){
  if(!DB) return;
  if(!Array.isArray(DB.machines))
    DB.machines = AUTOMATY_START.map(a=>Object.assign({note:''}, a));
  // kod identyfikuje automat na stronie załadunku i w wersji mobilnej
  const zajete = new Set(DB.machines.map(m=>m.code).filter(Boolean));
  DB.machines.forEach(m=>{
    if(m.code) return;
    const wzor = AUTOMATY_START.find(a=>a.id===m.id);
    m.code = (wzor && !zajete.has(wzor.code)) ? wzor.code : kodZNazwy(m.name, zajete);
    zajete.add(m.code);
  });
  DB.vending = Object.assign({perCol:VEND_PER_COL, slots:VEND_SLOTS, layout:{}}, DB.vending||{});
  if(!DB.vending.layout || typeof DB.vending.layout!=='object') DB.vending.layout={};
}
/** świeży załadunek: wszystkie szafki z przypisanym zestawem włączone */
function nowyZaladunek(nazwa){
  const z = {id:uid('zal'), name:nazwa||'', note:'', slots:{}};
  DB.machines.forEach(m=>{
    z.slots[m.id] = {};
    for(let n=1;n<=DB.vending.slots;n++)
      if(DB.vending.layout[String(n)]) z.slots[m.id][String(n)] = true;
  });
  return z;
}
/** czy szafka `n` automatu `mid` jest w tym załadunku zaznaczona */
function slotOn(z, mid, n){
  return !!(z.slots && z.slots[mid] && z.slots[mid][String(n)]);
}
function setSlotOn(z, mid, n, on){
  z.slots = z.slots||{}; z.slots[mid] = z.slots[mid]||{};
  if(on) z.slots[mid][String(n)] = true; else delete z.slots[mid][String(n)];
}
/** podsumowanie załadunku: ile szafek, wartość brutto i koszt netto (kanał Vending) */
function zalSuma(z, mid){
  let szt=0, wartosc=0, koszt=0; const wgZestawu={};
  const maszyny = mid ? DB.machines.filter(m=>m.id===mid) : active(DB.machines);
  maszyny.forEach(m=>{
    for(let n=1;n<=DB.vending.slots;n++){
      if(!slotOn(z, m.id, n)) continue;
      const s = slotSet(n); if(!s) continue;
      const c = CALC.setCalc(s,'vending');
      szt++; wartosc += c.priceGross||0; koszt += c.net;
      wgZestawu[s.id] = (wgZestawu[s.id]||0)+1;
    }
  });
  return {szt, wartosc, koszt, wgZestawu};
}
/** wartość pełnego załadunku jednego automatu — wszystkie szafki z zestawem */
function pelnyAutomat(){
  let wartosc=0, koszt=0, szt=0;
  for(let n=1;n<=DB.vending.slots;n++){
    const s = slotSet(n); if(!s) continue;
    const c = CALC.setCalc(s,'vending');
    szt++; wartosc += c.priceGross||0; koszt += c.net;
  }
  return {szt, wartosc, koszt};
}

/** Rozwija załadunek w dół: z zestawów na rolki, z rolek na półprodukty
    i surowe składniki. Półprodukty pokazujemy osobno (bo kucharz je robi)
    i jednocześnie rozkładamy na surowce (bo trzeba je mieć w lodówce).
    Odpad wchodzi do zapotrzebowania — kupujesz całe kilo, nie pół. */
function zalRozpiska(z){
  const zestawy={}, rolki={}, polprodukty={}, skladniki={};

  const dodajSkladnik = (refId, ile, seen) => {
    if(!(ile>0)) return;
    const p = CALC.prep(refId);
    if(p){
      polprodukty[refId] = (polprodukty[refId]||0) + ile;
      if(seen.has(refId)) return;                       // ochrona przed pętlą
      const s2 = new Set(seen); s2.add(refId);
      if(!p.yieldQty) return;
      const partii = ile / p.yieldQty;
      p.items.forEach(c=>{
        const potrzeba = ((c.qty||0)+(c.waste||0)) * partii;
        if(c.kind==='raw'){ skladniki['raw:'+c.name] = (skladniki['raw:'+c.name]||0) + potrzeba; return; }
        dodajSkladnik(c.refId, potrzeba, s2);
      });
      return;
    }
    if(CALC.ing(refId)) skladniki[refId] = (skladniki[refId]||0) + ile;
  };

  active(DB.machines).forEach(m=>{
    for(let n=1;n<=DB.vending.slots;n++){
      if(!slotOn(z, m.id, n)) continue;
      const s = slotSet(n); if(!s) continue;
      zestawy[s.id] = (zestawy[s.id]||0) + 1;
    }
  });
  Object.keys(zestawy).forEach(sid=>{
    const s = CALC.set(sid), n = zestawy[sid];
    (s.entries||[]).forEach(e=>{ rolki[e.itemId] = (rolki[e.itemId]||0) + (e.pieces||0)*n; });
    (s.comps||[]).forEach(c=>dodajSkladnik(c.refId, (c.qty||0)*n, new Set()));
  });
  Object.keys(rolki).forEach(iid=>{
    const it = CALC.item(iid); if(!it || !it.pieces) return;
    const mnoznik = rolki[iid] / it.pieces;
    (it.comps||[]).forEach(c=>dodajSkladnik(c.refId, (c.qty||0)*mnoznik, new Set()));
  });
  return {zestawy, rolki, polprodukty, skladniki};
}

/* ---------- wybrany dzień ----------
   Widoki z grupy „Pulpit" pokazują jeden dzień: co ugotować, co zwinąć,
   co spakować. Dzień → dzień tygodnia → załadunek standardowy. */
let DAY = null;   // ustawiane przy starcie na dziś
function przesunDate(iso, n){
  const d = new Date(iso+'T12:00:00'); d.setDate(d.getDate()+n);
  return d.toISOString().slice(0,10);
}
function dzienKlucz(iso){
  const d = new Date(iso+'T12:00:00');
  return ['nd','pn','wt','sr','cz','pt','so'][d.getDay()];
}
function dzienNazwa(iso){
  const d = DNI.find(x=>x.k===dzienKlucz(iso));
  return d ? d.pl : '';
}
function zaladunekNaDate(iso){ return zaladunekNaDzien(dzienKlucz(iso)); }
/** komplet danych dnia: załadunek i rozpisany na czynniki plan produkcji */
function daneDnia(iso){
  const z = zaladunekNaDate(iso);
  return {iso, z, r: z ? zalRozpiska(z) : null};
}

/* ---------- dni tygodnia ----------
   Załadunek standardowy obowiązuje w wybrane dni. Każdy dzień może należeć
   tylko do jednego załadunku — inaczej nie wiadomo, co jedzie w poniedziałek. */
const DNI = [
  {k:'pn', l:'Pn', pl:'poniedziałek'},
  {k:'wt', l:'Wt', pl:'wtorek'},
  {k:'sr', l:'Śr', pl:'środa'},
  {k:'cz', l:'Cz', pl:'czwartek'},
  {k:'pt', l:'Pt', pl:'piątek'},
  {k:'so', l:'So', pl:'sobota'},
  {k:'nd', l:'Nd', pl:'niedziela'},
];
const DZIEN_IDX = {}; DNI.forEach((d,i)=>DZIEN_IDX[d.k]=i);

/** „Pn–Cz, So" zamiast „Pn, Wt, Śr, Cz, So" — zakresy zwijamy */
function dniLabel(days){
  const idx = (days||[]).map(k=>DZIEN_IDX[k]).filter(i=>i!=null).sort((a,b)=>a-b);
  if(!idx.length) return '';
  const grupy=[]; let od=idx[0], po=idx[0];
  for(let i=1;i<idx.length;i++){
    if(idx[i]===po+1){ po=idx[i]; continue; }
    grupy.push([od,po]); od=po=idx[i];
  }
  grupy.push([od,po]);
  return grupy.map(([a,b])=> a===b ? DNI[a].l : (b-a===1 ? DNI[a].l+', '+DNI[b].l : DNI[a].l+'–'+DNI[b].l)).join(', ');
}
/* Plan tygodnia trzymamy jako mapa dzień → załadunek, a nie listę dni przy
   załadunku. Dzięki temu „jeden dzień, jeden załadunek" wynika z samej
   struktury danych i nie da się tego złamać — nie ma czego walidować. */
function zaladunekNaDzien(k){
  const id = (DB.week||{})[k];
  if(!id) return null;
  const z = DB.loads.find(x=>x.id===id);
  return (z && !z.archived) ? z : null;
}
/** w które dni jedzie ten załadunek */
function dniZaladunku(z){
  return DNI.filter(d=>(DB.week||{})[d.k]===z.id).map(d=>d.k);
}
function ustawDzien(k, loadId){
  DB.week = DB.week || {};
  if(loadId) DB.week[k] = loadId; else delete DB.week[k];
}
function migrateLoads(){
  if(!Array.isArray(DB.loads)) DB.loads = [];
  DB.week = DB.week || {};
  // starszy zapis trzymał dni przy załadunku — przenosimy do mapy tygodnia
  DB.loads.forEach(z=>{
    if(!Array.isArray(z.days)) return;
    z.days.forEach(k=>{ if(DZIEN_IDX[k]!=null && !DB.week[k]) DB.week[k] = z.id; });
    delete z.days;
  });
  // wpisy wskazujące na nieistniejący załadunek tylko myliłyby plan
  Object.keys(DB.week).forEach(k=>{
    if(DZIEN_IDX[k]==null || !DB.loads.some(z=>z.id===DB.week[k])) delete DB.week[k];
  });
}

/** zestaw przypisany do szafki (null = pusta) */
function slotSet(n){
  const id = DB.vending.layout[String(n)];
  return id ? CALC.set(id) : null;
}

/** Do wersji 1.14 odpad był osobną linią receptury z flagą `waste:true`.
    Teraz jest drugą ilością przy tym samym składniku: `qty` idzie do produktu,
    `waste` tylko do kosztu. Czytelniej i o połowę mniej wierszy. */
function migrateWaste(p){
  if(!p || !Array.isArray(p.items)) return;
  const out = [];
  p.items.forEach(c=>{
    if(c.waste === true) return;                       // stare linie odpadu w drugim przebiegu
    out.push(Object.assign({}, c, {waste: typeof c.waste === 'number' ? c.waste : 0}));
  });
  p.items.forEach(c=>{
    if(c.waste !== true) return;
    const cel = out.find(x=>x.kind===c.kind && x.refId===c.refId && x.name===c.name);
    if(cel) cel.waste = (cel.waste||0) + (c.qty||0);
    else out.push(Object.assign({}, c, {qty:0, waste:(c.qty||0)}));
  });
  p.items = out;
}

/** Do wersji 1.8 zestaw trzymał tackę, pałeczki i sos w osobnym polu `pack`.
    Teraz to zwykłe dodatki — przenosimy je do `comps` i kasujemy stare pole.
    Ilości sumują się, gdy ten sam składnik był i w opakowaniu, i w dodatkach. */
function migratePack(s){
  s.comps = s.comps || [];
  const p = s.pack;
  if(!p) return;
  [[p.trayId,p.trayQty],[p.chopId,p.chopQty],[p.sauceId,p.sauceQty]].forEach(pair=>{
    const id=pair[0], q=pair[1];
    if(!id || !q) return;
    const ex = s.comps.find(c=>c.refId===id);
    if(ex) ex.qty = (ex.qty||0) + q; else s.comps.push({refId:id, qty:q});
  });
  delete s.pack;
}

/* ---------- podmiana składnika w całym menu ---------- */

/** wszystkie miejsca, w których występuje dany składnik lub półprodukt */
function occurrences(refId){
  const out=[];
  DB.items.forEach(i=>i.comps.forEach((c,idx)=>{ if(c.refId===refId)
    out.push({where:'rolka', name:i.name, obj:i, list:i.comps, idx, kindField:false}); }));
  DB.preps.forEach(p=>p.items.forEach((c,idx)=>{ if(c.refId===refId)
    out.push({where:'półprodukt', name:p.name, obj:p, list:p.items, idx, kindField:true}); }));
  DB.sets.forEach(st=>{
    (st.comps||[]).forEach((c,idx)=>{ if(c.refId===refId)
      out.push({where:'dodatek zestawu', name:st.name, obj:st, list:st.comps, idx, kindField:false}); });
  });
  return out;
}

/** wystąpienia, których NIE wolno podmienić na `toId` — bo powstałaby pętla.

    Klasyczny przypadek: zamiana „Ryż” na półprodukt „Ryż gotowany”. Ryż surowy jest
    składnikiem tego półproduktu, więc podmiana w jego wnętrzu kazałaby mu liczyć
    samego siebie i koszt zapadłby się do zera. */
function skipsForCycle(fromId, toId){
  return occurrences(fromId).filter(o => o.obj && o.obj.id === toId);
}

/** podmienia wszystkie wystąpienia; qty przemnożone przez factor.
    Zwraca {zmienione, pominiete}. */
function replaceEverywhere(fromId, toId, factor){
  const isPrep = !!CALC.prep(toId);
  let n=0, skip=0;
  occurrences(fromId).forEach(o=>{
    if(o.obj && o.obj.id === toId){ skip++; return; }      // ochrona przed pętlą
    const c=o.list[o.idx];
    c.refId=toId;
    c.qty=(c.qty||0)*factor;
    if(o.kindField) c.kind = isPrep ? 'prep' : 'ing';
    n++;
  });
  return {zmienione:n, pominiete:skip};
}

/** JEDNO miejsce na wszystkie migracje i uzupełnienia struktury.
    Dane wchodzą do aplikacji trzema drogami — localStorage, serwer i import —
    i każda musi przejść przez tę funkcję. Trzymanie tego w dwóch miejscach
    już dwa razy skończyło się pustym widokiem po aktualizacji. */
function migrateAll(){
  if(!DB) return;
  DB.settings = Object.assign({targetFc:.30, alertFc:.35, currency:'zł', roundTo:.9,
                               pdfMinFont:11, pdfMaxCols:3}, DB.settings||{});
  DB.settings.vats = Object.assign({vending:0.05, dostawa:0.08}, DB.settings.vats||{});
  DB.history     = DB.history || [];
  DB.preps       = DB.preps || [];
  DB.ingredients = DB.ingredients || [];
  DB.items       = DB.items || [];
  DB.sets        = DB.sets || [];
  migrateVending();
  migrateLoads();
  DB.preps.forEach(p=>migrateWaste(p));
  DB.sets.forEach(s=>{ s.comps = s.comps||[]; migratePack(s); migrateChannels(s); });
  DB.items.forEach(i=>{ i.comps = i.comps||[]; migrateChannels(i); });
}

function load(){
  const s = safeGet();
  if(s){ try{ DB = JSON.parse(s); }catch(e){ DB=null; } }
  if(!DB) DB = clone(SEED);
  migrateAll();
  STORAGE_OK = safeSet('probe')!==false; try{localStorage.removeItem('probe');}catch(e){}
}
function save(){
  if(!canEdit()){ alert('Twoje konto ma tylko podgląd — zmiany nie zostaną zapisane.'); return; }
  const ok = safeSet(JSON.stringify(DB));
  if(!ok) STORAGE_OK=false;
  if(SRV.on && SRV.user) SRV.push();
  else if(SUPA.on) SUPA.push();
}

/* ============================================================================
   LISTY ROZWIJANE Z WYSZUKIWANIEM
   Zwykły <select> pozwala skakać tylko po pierwszej literze, a przy 50 składnikach
   to za mało. Ten komponent filtruje po dowolnym fragmencie i ignoruje polskie
   ogonki, więc „losos" znajduje „Łosoś". Ukryty input trzyma id wybranej pozycji,
   dzięki czemu reszta kodu czyta wartość tak samo jak z selecta.
   ========================================================================== */
const COMBO = {};
function bezOgonkow(s){
  return String(s||'').toLowerCase()
    .replace(/ą/g,'a').replace(/ć/g,'c').replace(/ę/g,'e').replace(/ł/g,'l').replace(/ń/g,'n')
    .replace(/ó/g,'o').replace(/ś/g,'s').replace(/ź/g,'z').replace(/ż/g,'z');
}
/** markup listy: widoczne pole tekstowe + ukryta wartość + wysuwana lista */
function combo(id, ph, style){
  return `<div class="combo" style="${style||''}">
    <input type="text" class="combo-q" id="${id}_q" placeholder="${esc(ph||'Szukaj…')}"
           autocomplete="off" spellcheck="false">

    <div class="combo-pop" id="${id}_p"></div>
  </div>`;

/** opts: [{v,l}] — sortowane po etykiecie, po polsku */
function fillCombo(id, opts, current, onPick){
  const q=document.getElementById(id+'_q'), h=document.getElementById(id), pop=document.getElementById(id+'_p');
  if(!q||!h||!pop) return;
  // pozycje z `pin` zostają na górze w podanej kolejności (np. „Wszystkie kategorie")
  const przypiete=opts.filter(o=>o.pin), reszta=opts.filter(o=>!o.pin);
  reszta.sort((a,b)=>String(a.l).localeCompare(String(b.l),'pl',{numeric:true,sensitivity:'base'}));
  const lista=[...przypiete, ...reszta];
  COMBO[id]={lista, onPick, idx:-1};
  const wybierz=o=>{ h.value=o?o.v:''; q.value=o?o.l:''; };
  wybierz(lista.find(o=>o.v===current) || lista[0] || null);

  const rysuj=()=>{
    const f=bezOgonkow(q.value.trim());
    const wid = (f && q.dataset.tknieto==='1') ? lista.filter(o=>bezOgonkow(o.l).includes(f)) : lista;
    COMBO[id].widoczne=wid; if(COMBO[id].idx>=wid.length) COMBO[id].idx=wid.length-1;
    pop.innerHTML = wid.length
      ? wid.map((o,i)=>`<div class="opt ${i===COMBO[id].idx?'on':''}" data-i="${i}">${esc(o.l)}</div>`).join('')
      : '<div class="none">Nic nie pasuje</div>';
    pop.querySelectorAll('.opt').forEach(el=>el.addEventListener('mousedown',e=>{
      e.preventDefault(); const o=wid[+el.dataset.i]; wybierz(o); zamknij();
      if(COMBO[id].onPick) COMBO[id].onPick(o.v);
    }));
  };
  const ustawPozycje=()=>{
    const r=q.getBoundingClientRect();
    const podSpodem = window.innerHeight - r.bottom;
    pop.style.left=r.left+'px'; pop.style.width=r.width+'px';
    if(podSpodem < 180 && r.top > podSpodem){ pop.style.top='auto'; pop.style.bottom=(window.innerHeight-r.top+4)+'px'; }
    else { pop.style.bottom='auto'; pop.style.top=(r.bottom+4)+'px'; }
  };
  const otworz=()=>{ rysuj(); ustawPozycje(); pop.classList.add('open'); };
  const zamknij=()=>{ pop.classList.remove('open'); q.dataset.tknieto='0'; COMBO[id].idx=-1;
    const o=lista.find(x=>x.v===h.value); if(o) q.value=o.l; };
  COMBO[id].zamknij=zamknij;

  q.addEventListener('focus',()=>{ q.dataset.tknieto='0'; q.select(); otworz(); });
  q.addEventListener('input',()=>{ q.dataset.tknieto='1'; COMBO[id].idx=0; rysuj(); ustawPozycje(); pop.classList.add('open'); });
  q.addEventListener('blur',()=>setTimeout(zamknij,120));
  q.addEventListener('keydown',e=>{
    const w=COMBO[id].widoczne||lista;
    if(e.key==='ArrowDown'||e.key==='ArrowUp'){
      e.preventDefault();
      if(!pop.classList.contains('open')) otworz();
      COMBO[id].idx=Math.max(0,Math.min(w.length-1,COMBO[id].idx+(e.key==='ArrowDown'?1:-1)));
      rysuj();
      const on=pop.querySelector('.opt.on'); if(on) on.scrollIntoView({block:'nearest'});
    } else if(e.key==='Enter'){
      e.preventDefault();
      const o=w[COMBO[id].idx<0?0:COMBO[id].idx]; if(o){ wybierz(o); zamknij(); if(COMBO[id].onPick) COMBO[id].onPick(o.v); }
    } else if(e.key==='Escape'){
      // Escape ma zamknąć samą listę, nie cały dialog pod spodem
      if(pop.classList.contains('open')){ e.preventDefault(); e.stopPropagation(); zamknij(); }
    }
  });
  window.addEventListener('scroll',()=>{ if(pop.classList.contains('open')) ustawPozycje(); }, true);
}

function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/** wczytuje zdjęcie z pliku i zmniejsza je do miniatury (max 1200 px, JPEG) */
function readPhoto(file, cb){
  if(!file){ cb(null); return; }
  if(!/^image\//.test(file.type)){ alert('To nie jest plik graficzny.'); cb(null); return; }
  const fr=new FileReader();
  fr.onload=()=>{
    const img=new Image();
    img.onload=()=>{
      const MAX=1200;
      let {width:w, height:h}=img;
      if(w>MAX||h>MAX){ const r=Math.min(MAX/w,MAX/h); w=Math.round(w*r); h=Math.round(h*r); }
      const cv=document.createElement('canvas'); cv.width=w; cv.height=h;
      const cx=cv.getContext('2d');
      cx.fillStyle='#fff'; cx.fillRect(0,0,w,h);
      cx.drawImage(img,0,0,w,h);
      cb(cv.toDataURL('image/jpeg',0.72));
    };
    img.onerror=()=>{ alert('Nie udało się odczytać zdjęcia.'); cb(null); };
    img.src=fr.result;
  };
  fr.onerror=()=>{ alert('Nie udało się odczytać pliku.'); cb(null); };
  fr.readAsDataURL(file);
}

  if(!drop||!inp) return;
  const paint=()=>{
    drop.className = 'drop'+(obj.photo?' has':'');
    drop.innerHTML = obj.photo
      ? `<img src="${obj.photo}" alt="">`
      : '⊕ Kliknij, żeby dodać zdjęcie<br><span class="small">JPG lub PNG — zostanie zmniejszone do 1200 px</span>';
  };
  drop.addEventListener('click',()=>inp.click());
  drop.addEventListener('dragover',e=>{e.preventDefault();});
  drop.addEventListener('drop',e=>{ e.preventDefault();
    readPhoto(e.dataTransfer.files[0], d=>{ if(d){ obj.photo=d; paint(); if(onDone)onDone(); } }); });
  inp.addEventListener('change',()=>{
    readPhoto(inp.files[0], d=>{ if(d){ obj.photo=d; paint(); if(onDone)onDone(); } inp.value=''; }); });
  const rm=document.getElementById(dropId+'Rm');
  if(rm) rm.addEventListener('click',()=>{ obj.photo=null; paint(); if(onDone)onDone(); });

}

/* ============================================================================
   WARTOŚCI ODŻYWCZE I ALERGENY
   Tabela składnika jest zawsze **na 100 g** — tak podają ją producenci i tego
   wymaga rozporządzenie 1169/2011. Przeliczenie na jednostkę składnika idzie
   przez masę tej jednostki (`gPerUnit`), bo nori liczymy w arkuszach,
   a krewetki w sztukach.
   ========================================================================== */
const NUTR = [
  {k:'kcal',    l:'Wartość energetyczna', u:'kcal'},
  {k:'fat',     l:'Tłuszcz',              u:'g'},
  {k:'satfat',  l:'w tym kwasy nasycone', u:'g', sub:true},
  {k:'carbs',   l:'Węglowodany',          u:'g'},
  {k:'sugars',  l:'w tym cukry',          u:'g', sub:true},
  {k:'protein', l:'Białko',               u:'g'},
  {k:'salt',    l:'Sól',                  u:'g'},
];
const ALERG = [
  ['gluten','Zboża zawierające gluten'], ['skorupiaki','Skorupiaki'], ['jaja','Jaja'],
  ['ryby','Ryby'], ['orzeszki','Orzeszki ziemne'], ['soja','Soja'], ['mleko','Mleko'],
  ['orzechy','Orzechy'], ['seler','Seler'], ['gorczyca','Gorczyca'], ['sezam','Nasiona sezamu'],
  ['siarczyny','Dwutlenek siarki i siarczyny'], ['lubin','Łubin'], ['mieczaki','Mięczaki'],
];
const ALERG_NAME = {}; ALERG.forEach(a=>ALERG_NAME[a[0]]=a[1]);

/** ile surowca schodzi na linię receptury: to, co zostaje, plus to, co się wyrzuca */
function lineQty(c){ return (c.qty||0) + (c.waste||0); }

function emptyNutr(){ const o={}; NUTR.forEach(n=>o[n.k]=0); return o; }
function addNutr(a,b,f){ NUTR.forEach(n=>a[n.k]+=(b[n.k]||0)*(f==null?1:f)); return a; }
/** czy składnik ma wypełnioną tabelę. Same zera to też odpowiedź —
    tacka naprawdę ma zero kalorii i nie powinna trafiać na listę braków. */
function hasNutr(n){ return !!n && NUTR.some(x=>n[x.k]!=null); }
/** ile gramów waży jedna jednostka; null = nie wiadomo */
function unitGrams(unit, explicit){
  if(unit==='g'||unit==='ml') return 1;
  if(unit==='kg'||unit==='l') return 1000;
  return explicit==null ? null : explicit;
}

const CALC = {
  ing(id){ return DB.ingredients.find(x=>x.id===id); },
  prep(id){ return DB.preps.find(x=>x.id===id); },
  item(id){ return DB.items.find(x=>x.id===id); },
  set(id){ return DB.sets.find(x=>x.id===id); },

  /** koszt jednostkowy składnika (za 1 jednostkę bazową) */
  ingUnitCost(id){
    const g = this.ing(id);
    if(!g || g.packPrice==null || !g.packQty) return null;
    return g.packPrice / g.packQty;
  },

  /** koszt jednostkowy półproduktu (za 1 jednostkę wydajności) */
  prepUnitCost(id, seen){
    seen = seen || new Set();
    if(seen.has(id)) return null;         // ochrona przed pętlą
    seen.add(id);
    const p = this.prep(id);
    if(!p || !p.yieldQty) return null;
    let tot = 0;
    for(const c of p.items){
      let uc = 0;
      if(c.kind==='raw') uc = c.unitCost||0;
      else if(c.kind==='ing') uc = this.ingUnitCost(c.refId)||0;
      else if(c.kind==='prep') uc = this.prepUnitCost(c.refId, seen)||0;
      tot += ((c.qty||0)+(c.waste||0))*uc;   // odpad też kosztuje
    }
    return tot / p.yieldQty;
  },

  /** koszt jednostkowy dowolnego komponentu + etykieta */
  compInfo(refId){
    const g = this.ing(refId);
    if(g) return {name:g.name, unit:g.unit, unitCost:this.ingUnitCost(refId), kind:'ing', cat:g.cat};
    const p = this.prep(refId);
    if(p) return {name:p.name, unit:p.yieldUnit, unitCost:this.prepUnitCost(refId), kind:'prep', cat:'Półprodukt'};
    return {name:'⚠ brak: '+refId, unit:'', unitCost:null, kind:'missing', cat:'—'};
  },

  /** rozbicie kosztu listy komponentów */
  breakdown(comps){
    const rows=[]; let tot=0; const missing=[];
    for(const c of comps){
      const info = this.compInfo(c.refId);
      const uc = info.unitCost;
      const cost = (c.qty||0) * (uc||0);
      if(uc==null) missing.push(info.name);
      rows.push({refId:c.refId, name:info.name, unit:info.unit, qty:c.qty, unitCost:uc, cost, kind:info.kind});
      tot += cost;
    }
    rows.sort((a,b)=>b.cost-a.cost);
    return {rows, total:tot, missing};
  },

  /** cena brutto w danym kanale */
  priceOf(o, chan){ return (o && o.prices) ? o.prices[chan||CHAN] : null; },
  /** stawka VAT w danym kanale */
  vatOf(o, chan){
    const c = chan||CHAN;
    if(o && o.vats && o.vats[c]!=null) return o.vats[c];
    return (DB.settings.vats && DB.settings.vats[c]!=null)
      ? DB.settings.vats[c]
      : (CHANNELS.find(x=>x.k===c)||{vat:0.08}).vat;
  },

  /** pełna kalkulacja pozycji menu w wybranym kanale */
  itemCalc(it, chan){
    const b = this.breakdown(it.comps);
    const vat = this.vatOf(it, chan);
    const pieces = it.pieces||1;
    const priceGross = this.priceOf(it, chan)||0;
    const priceNet = priceGross/(1+vat);
    return {
      ...b,
      net: b.total,
      gross: b.total*(1+vat),
      perPiece: b.total/pieces,
      pricePerPiece: priceGross/pieces,
      priceGross, priceNet, vat, pieces, chan: chan||CHAN,
      fc: priceNet>0 ? b.total/priceNet : null,
      margin: priceNet>0 ? priceNet-b.total : null,
      suggested: this.suggest(b.total, vat, DB.settings.targetFc),
    };
  },

  /** pełna kalkulacja zestawu */
  setCalc(st, chan){
    let cost=0, pieces=0; const parts=[]; const missing=[];
    for(const e of (st.entries||[])){
      const it = this.item(e.itemId);
      if(!it){ missing.push('pozycja '+e.itemId); continue; }
      const ic = this.itemCalc(it, chan);
      const c = ic.perPiece*(e.pieces||0);
      cost += c; pieces += (e.pieces||0);
      parts.push({name:it.name, itemId:it.id, pieces:e.pieces, perPiece:ic.perPiece, cost:c,
                  alaCarte: ic.pricePerPiece*(e.pieces||0)});
      ic.missing.forEach(m=>missing.push(m));
    }
    const extra = this.breakdown(st.comps||[]);
    extra.missing.forEach(m=>missing.push(m));
    cost += extra.total;
    const vat = this.vatOf(st, chan);
    const priceGross = this.priceOf(st, chan)||0, priceNet = priceGross/(1+vat);
    const alaCarte = parts.reduce((s,p)=>s+p.alaCarte,0);
    return {
      parts, extra, packaging:extra.total,
      pieces, net:cost, gross:cost*(1+vat),
      priceGross, priceNet, vat, alaCarte, chan: chan||CHAN,
      discount: alaCarte>0 ? 1-priceGross/alaCarte : null,
      fc: priceNet>0 ? cost/priceNet : null,
      margin: priceNet>0 ? priceNet-cost : null,
      perPiece: pieces? cost/pieces : null,
      suggested: this.suggest(cost, vat, DB.settings.targetFc),
      missing:[...new Set(missing)],
    };
  },

  /** cena sprzedaży brutto dla zadanego food cost */
  suggest(net, vat, targetFc){
    if(!targetFc||!net) return null;
    const raw = net*(1+vat)/targetFc;
    const step = DB.settings.roundTo;
    if(!step) return raw;
    // zaokrąglenie w górę do najbliższej końcówki ,90 / pełnej złotówki
    if(step===0.9){ const base=Math.floor(raw); return (raw<=base+0.9? base+0.9 : base+1.9); }
    return Math.ceil(raw/step)*step;
  },

  /* -------- wartości odżywcze -------- */

  /** masa 1 jednostki składnika w gramach */
  ingGrams(id){ const g=this.ing(id); return g ? unitGrams(g.unit, g.gPerUnit) : null; },

  /** wartości odżywcze 1 jednostki składnika (tabela jest na 100 g) */
  ingNutr(id){
    const g=this.ing(id);
    if(!g || !hasNutr(g.nutr)) return null;
    const gr=unitGrams(g.unit, g.gPerUnit);
    if(gr==null) return null;
    const o={}; NUTR.forEach(n=>o[n.k]=(g.nutr[n.k]||0)*gr/100);
    return o;
  },

  /** wartości odżywcze 1 jednostki półproduktu.
      Linie oznaczone jako **odpad** wchodzą do kosztu, ale nie do wartości
      odżywczych — z kilograma ogórka zostaje pół kilo miąższu i pół kilo
      obierek, a płacisz za całość. */
  prepNutr(id, seen){
    // przyjmuje id albo gotowy obiekt — dzięki temu edytor liczy na kopii,
    // bez podmieniania czegokolwiek w DB
    const p = (id && typeof id === 'object') ? id : this.prep(id);
    if(!p || !p.yieldQty) return null;
    seen = seen || new Set();
    if(seen.has(p.id)) return null;
    seen.add(p.id);
    const tot=emptyNutr(); let any=false; const missing=[];
    for(const c of p.items){
      if(!(c.qty>0)) continue;             // linia to sam odpad — kosztuje, nie odżywia
      let n=null, nazwa='';
      if(c.kind==='raw'){
        nazwa=c.name;
        if(hasNutr(c.nutr)){
          const gr=unitGrams(c.unit, c.gPerUnit);
          if(gr!=null){ n={}; NUTR.forEach(x=>n[x.k]=(c.nutr[x.k]||0)*gr/100); }
        }
      } else if(this.prep(c.refId)){
        const r=this.prepNutr(c.refId, seen); nazwa=(this.prep(c.refId)||{}).name;
        if(r && r.ok) n=r.nutr;
      } else {
        n=this.ingNutr(c.refId); nazwa=this.compInfo(c.refId).name;
      }
      if(!n){ missing.push(nazwa); continue; }
      addNutr(tot, n, c.qty||0); any=true;
    }
    const o={}; NUTR.forEach(x=>o[x.k]=tot[x.k]/p.yieldQty);
    return {nutr:o, grams:unitGrams(p.yieldUnit, p.gPerUnit), ok:any&&!missing.length, missing};
  },

  /** alergeny półproduktu — także z linii oznaczonych jako odpad,
      bo obierki i tak dotykają produktu */
  prepAlerg(id, seen){
    seen = seen || new Set();
    if(seen.has(id)) return [];
    seen.add(id);
    const p=this.prep(id); if(!p) return [];
    const out=new Set();
    p.items.forEach(c=>{
      if(c.kind==='raw'){ (c.alerg||[]).forEach(a=>out.add(a)); return; }
      if(this.prep(c.refId)) this.prepAlerg(c.refId, seen).forEach(a=>out.add(a));
      else { const g=this.ing(c.refId); if(g) (g.alerg||[]).forEach(a=>out.add(a)); }
    });
    return [...out];
  },

  /** suma wartości odżywczych i masy dla listy komponentów */
  nutrOf(comps){
    const tot=emptyNutr(); let mass=0; const missing=[], noMass=[]; const al=new Set();
    for(const c of (comps||[])){
      const g=this.ing(c.refId), p=this.prep(c.refId);
      const nazwa=this.compInfo(c.refId).name;
      let n=null, gr=null;
      if(g){ n=this.ingNutr(c.refId); gr=unitGrams(g.unit,g.gPerUnit); (g.alerg||[]).forEach(a=>al.add(a)); }
      else if(p){ const r=this.prepNutr(c.refId); if(r){ n=r.ok?r.nutr:null; gr=r.grams; }
                  this.prepAlerg(c.refId).forEach(a=>al.add(a)); }
      if(gr==null) noMass.push(nazwa); else mass += (c.qty||0)*gr;
      if(!n){ if(g||p) missing.push(nazwa); continue; }
      addNutr(tot, n, c.qty||0);
    }
    return {nutr:tot, mass, missing:[...new Set(missing)], noMass:[...new Set(noMass)], alerg:[...al]};
  },

  /** wartości odżywcze rolki */
  itemNutr(it){ return this.nutrOf(it.comps); },

  /** wartości odżywcze zestawu: rolki przeliczone po kawałkach + dodatki */
  setNutr(st){
    const tot=emptyNutr(); let mass=0; const missing=[], noMass=[]; const al=new Set();
    for(const e of (st.entries||[])){
      const it=this.item(e.itemId); if(!it || !it.pieces) continue;
      const r=this.itemNutr(it); const f=(e.pieces||0)/it.pieces;
      addNutr(tot, r.nutr, f); mass += r.mass*f;
      r.missing.forEach(m=>missing.push(m)); r.noMass.forEach(m=>noMass.push(m));
      r.alerg.forEach(a=>al.add(a));
    }
    const ex=this.nutrOf(st.comps);
    addNutr(tot, ex.nutr, 1); mass += ex.mass;
    ex.missing.forEach(m=>missing.push(m)); ex.noMass.forEach(m=>noMass.push(m));
    ex.alerg.forEach(a=>al.add(a));
    return {nutr:tot, mass, missing:[...new Set(missing)], noMass:[...new Set(noMass)], alerg:[...al]};
  },

  /** gdzie użyty jest składnik */
  usedBy(refId){
    const out=[];
    DB.items.forEach(i=>{ if(i.comps.some(c=>c.refId===refId)) out.push({type:'item',id:i.id,name:i.name}); });
    DB.preps.forEach(p=>{ if(p.items.some(c=>c.refId===refId)) out.push({type:'prep',id:p.id,name:p.name}); });
    DB.sets.forEach(s=>{
      if((s.comps||[]).some(c=>c.refId===refId)
         || (s.entries||[]).some(e=>e.itemId===refId))
        out.push({type:'set',id:s.id,name:s.name});
    });
    return out;
  },

  status(fc){
    if(fc==null) return 'none';
    const t=DB.settings.targetFc, a=DB.settings.alertFc;
    if(fc>a) return 'crit';
    if(fc>t) return 'warn';
    return 'good';
  },
};

/* ============================================================================

   ========================================================================== */
function problems(){
  const out=[];
  const idle=[];
  active(DB.ingredients).forEach(g=>{
    if(g.packPrice==null || !g.packQty){
      const used = CALC.usedBy(g.id);
      if(used.length) out.push({sev:'crit', k:'noprice',
        title:'Brak ceny: '+g.name,
        msg:'Używany w '+used.length+' recepturach ('+used.map(u=>u.name).join(', ')+') — ich koszt jest zaniżony.',
        go:{v:'ing', id:g.id}});
      else idle.push(g.name);
    }
  });
  if(idle.length) out.push({sev:'info',k:'idle',
    title:idle.length+' składników bez ceny, nieużywanych w recepturach',
    msg:idle.join(', ')+'. Uzupełnij ceny, zanim dopiszesz je do receptur lub zestawów.',
    go:{v:'ing'}});
  active(DB.items).forEach(i=>{
    const c = CALC.itemCalc(i);
    const bezCeny = CHANNELS.filter(ch=>!CALC.priceOf(i, ch.k));
    if(bezCeny.length && i.comps.length)
      out.push({sev: bezCeny.length===CHANNELS.length?'warn':'info', k:'noprice2',
        title:'Brak ceny sprzedaży: '+i.name,
        msg:'Nie podano ceny w kanale: '+bezCeny.map(ch=>ch.l).join(', ')+'. Bez niej nie da się policzyć food costu.',
        go:{v:'items',id:i.id}});
    if(!CALC.priceOf(i)) return;
    if(c.fc!=null && c.fc>DB.settings.alertFc)
      out.push({sev:'crit',k:'fc',title:i.name+' — food cost '+pct(c.fc),
        msg:'Powyżej progu alertu '+pct(DB.settings.alertFc)+'. Sugerowana cena: '+zl(c.suggested)+'.',go:{v:'items',id:i.id}});
    else if(c.fc!=null && c.fc>DB.settings.targetFc)
      out.push({sev:'warn',k:'fc',title:i.name+' — food cost '+pct(c.fc),
        msg:'Powyżej celu '+pct(DB.settings.targetFc)+'.',go:{v:'items',id:i.id}});
  });
  const bezNutr = active(DB.ingredients).filter(g=>!hasNutr(g.nutr) && CALC.usedBy(g.id).length);
  if(bezNutr.length) out.push({sev:'info',k:'nonutr',
    title:bezNutr.length+' składników bez tabeli odżywczej',
    msg:bezNutr.map(g=>g.name).join(', ')+'. Bez nich wartości odżywcze rolek i zestawów są niepełne.',
    go:{v:'ing'}});
  const bezMasy = active(DB.ingredients).filter(g=>unitGrams(g.unit,g.gPerUnit)==null && CALC.usedBy(g.id).length);
  if(bezMasy.length) out.push({sev:'warn',k:'nomass',
    title:bezMasy.length+' składników bez wagi jednostki',
    msg:bezMasy.map(g=>g.name).join(', ')+'. Liczone w sztukach — podaj, ile waży jedna, inaczej nie da się policzyć wartości na 100 g.',
    go:{v:'ing'}});
  const noExtra = active(DB.sets).filter(s=>!(s.comps||[]).length);
  if(noExtra.length) out.push({sev:'warn',k:'nopack',
    title:noExtra.length+' zestawów bez dodatków',
    msg:'Poza rolkami nie mają nic — ani tacki, ani pałeczek, ani sosu: '+noExtra.map(s=>s.name).join(', ')+'. Food cost tych zestawów jest zaniżony.',
    go:{v:'sets'}});
  active(DB.sets).forEach(s=>{
    const c = CALC.setCalc(s);
    if(c.missing.length) out.push({sev:'crit',k:'setmiss',title:'Zestaw '+s.name+' — niekompletne dane',msg:'Brakuje: '+c.missing.join(', '),go:{v:'sets',id:s.id}});
    if(c.fc!=null && c.fc>DB.settings.alertFc)
      out.push({sev:'crit',k:'setfc',title:s.name+' — food cost '+pct(c.fc),msg:'Powyżej progu alertu. Sugerowana cena: '+zl(c.suggested)+'.',go:{v:'sets',id:s.id}});
  });
  [['ing',DB.ingredients],['prep',DB.preps],['items',DB.items]].forEach(([k,list])=>{
    list.filter(x=>x.archived).forEach(o=>{
      const used = usedByActive(o.id);
      if(used.length) out.push({sev:'warn', k:'archused',
        title:'W archiwum, ale wciąż używane: '+o.name,
        msg:'Występuje w: '+used.map(u=>u.name).join(', ')+'. Koszt liczy się normalnie, '
            +'ale warto podmienić na aktualny odpowiednik albo przywrócić z archiwum.',
        go:{v:k, id:o.id}});
    });
  });
  const rank={crit:0,warn:1,info:2};
  out.sort((a,b)=>rank[a.sev]-rank[b.sev]);
  return out;
}

/** poziomy wykres słupkowy z progiem — status wg food cost */
function barChartFc(rows, opts){
  opts = opts||{};
  const H=26, PAD=6, LW=opts.labelW||168, RW=64, W=opts.width||760;
  const h = rows.length*H + 34;
  const max = Math.max(opts.max||0, ...rows.map(r=>r.v||0), DB.settings.alertFc*1.15);
  const plotW = W-LW-RW;
  const x = v => LW + (v/max)*plotW;
  const ticks=[];
  const stepN = 0.1;
  for(let t=0;t<=max+1e-9;t+=stepN) ticks.push(t);
  let s = `<svg class="chart" viewBox="0 0 ${W} ${h}" width="100%" height="${h}" role="img">`;
  ticks.forEach(t=>{ s+=`<line class="gl" x1="${x(t).toFixed(1)}" y1="20" x2="${x(t).toFixed(1)}" y2="${rows.length*H+20}"/>
    <text x="${x(t).toFixed(1)}" y="13" text-anchor="middle">${Math.round(t*100)}%</text>`; });
  // linia celu
  const tx = x(DB.settings.targetFc);
  s+=`<line x1="${tx.toFixed(1)}" y1="16" x2="${tx.toFixed(1)}" y2="${rows.length*H+20}" stroke="var(--ink-2)" stroke-width="1.5" stroke-dasharray="3 3"/>`;
  s+=`<text class="lbl" x="${tx.toFixed(1)}" y="${rows.length*H+32}" text-anchor="middle">cel ${Math.round(DB.settings.targetFc*100)}%</text>`;
  rows.forEach((r,i)=>{
    const y=20+i*H, bw=Math.max(2,x(r.v)-LW);
    const col = r.st==='crit'?'var(--crit)':r.st==='warn'?'var(--warn)':'var(--good)';
    s+=`<text class="lbl" x="${LW-10}" y="${y+15}" text-anchor="end">${esc(r.label.length>26?r.label.slice(0,25)+'…':r.label)}</text>`;
    s+=`<rect class="bar" x="${LW}" y="${y+4}" width="${bw.toFixed(1)}" height="14" fill="${col}"/>`;
    s+=`<text class="val" x="${(LW+bw+8).toFixed(1)}" y="${y+15}">${pct(r.v)}</text>`;
    s+=`<rect class="hit" x="0" y="${y}" width="${W}" height="${H}" data-i="${i}"/>`;
  });
  s+='</svg>';
  return s;
}

/** pionowy/poziomy wykres udziału kosztów (jedna seria → sekwencyjny błękit) */
function barChartCost(rows, W){
  W = W||520;

  const h=rows.length*H+8;
  const max=Math.max(...rows.map(r=>r.cost),0.0001);

/** wykres liniowy historii ceny */
function lineChart(pts, W, Hh){
  W=W||640; Hh=Hh||190;
  if(pts.length<2) return '<div class="empty">Za mało punktów, żeby narysować wykres (potrzebne min. 2 zmiany ceny).</div>';
  const PL=52,PR=16,PT=14,PB=26;
  const xs=pts.map((p,i)=>i), ys=pts.map(p=>p.v);
  const ymin=Math.min(...ys), ymax=Math.max(...ys);
  const pad=(ymax-ymin)*0.15||Math.abs(ymax*0.1)||1;
  const lo=Math.max(0,ymin-pad), hi=ymax+pad;
  const X=i=>PL+(i/(pts.length-1))*(W-PL-PR);
  const Y=v=>PT+(1-(v-lo)/(hi-lo||1))*(Hh-PT-PB);
  let s=`<svg class="chart" viewBox="0 0 ${W} ${Hh}" width="100%" height="${Hh}">`;
  for(let k=0;k<=4;k++){ const v=lo+(hi-lo)*k/4;
    s+=`<line class="gl" x1="${PL}" y1="${Y(v).toFixed(1)}" x2="${W-PR}" y2="${Y(v).toFixed(1)}"/>
        <text x="${PL-8}" y="${(Y(v)+4).toFixed(1)}" text-anchor="end">${num(v)}</text>`; }
  const d=pts.map((p,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(p.v).toFixed(1)).join(' ');
  s+=`<path d="${d}" fill="none" stroke="var(--s1)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
  pts.forEach((p,i)=>{
    s+=`<circle cx="${X(i).toFixed(1)}" cy="${Y(p.v).toFixed(1)}" r="4" fill="var(--s1)" stroke="var(--surface)" stroke-width="2"/>`;
    if(i===0||i===pts.length-1) s+=`<text x="${X(i).toFixed(1)}" y="${Hh-8}" text-anchor="${i?'end':'start'}">${esc(p.d)}</text>`;
    s+=`<rect class="hit" x="${(X(i)-14).toFixed(1)}" y="0" width="28" height="${Hh}" data-i="${i}"/>`;
  });
  s+='</svg>';
  return s;
}

/* ============================================================================
   SORTOWANIE TABEL
   Jeden mechanizm dla wszystkich tabel: <table data-tbl="klucz">, a kolumny
   bez sensu do sortowania dostają <th data-nosort>. Wybór trzyma się między
   przerysowaniami widoku, bo siedzi w SORT, a nie w DOM-ie.
   ========================================================================== */
const SORT = {};
const ORD = {items:false, sets:false};   // tryb „Ustaw kolejność" na listach

/** liczba wyciągnięta z komórki („6,48 zł" → 6.48); null gdy to nie liczba */
function cellNum(t){
  const s = t.replace(/[\s\u00a0]/g,'').replace(/zł|%/g,'').replace(',','.');
  return /^[+-]?\d*\.?\d+$/.test(s) ? parseFloat(s) : null;
}
function cellTxt(td){
  return td.dataset.sv !== undefined ? td.dataset.sv : td.textContent.trim();
}
function applySort(tb, key){
  const st = SORT[key]; if(!st) return;
  const body = tb.tBodies[0]; if(!body) return;
  const rows = [...body.rows].filter(r=>!r.querySelector('.empty'));
  if(rows.length < 2) return;
  rows.sort((ra,rb)=>{
    const a = ra.cells[st.i], b = rb.cells[st.i];
    if(!a || !b) return 0;
    const A = cellTxt(a), B = cellTxt(b);
    // puste zawsze na końcu, w obie strony — inaczej połowa sortowań
    // pokazuje najpierw same myślniki
    const ea = A===''||A==='—', eb = B===''||B==='—';
    if(ea !== eb) return ea ? 1 : -1;
    if(ea && eb) return 0;
    const na = cellNum(A), nb = cellNum(B);
    if(na!=null && nb!=null) return (na-nb)*st.dir;
    return A.localeCompare(B,'pl',{numeric:true,sensitivity:'base'})*st.dir;
  });
  rows.forEach(r=>body.appendChild(r));
}
/* ---------------------------------------------------------------------------
   WYDRUKI
   Serwer ma Gotenberga, więc PDF powstaje po jego stronie — HTML leci do
   /api/pdf i wraca gotowy plik. Poza trybem serwerowym (plik z dysku) nie ma
   czym generować, więc otwieramy okno drukowania: „Zapisz jako PDF" daje ten
   sam efekt, tylko rękami.
   ------------------------------------------------------------------------- */
function drukujOkno(html){
  const w = window.open('', '_blank');
  if(!w){ alert('Przeglądarka zablokowała nowe okno — zezwól na wyskakujące okna i spróbuj ponownie.'); return; }
  w.document.write(html);
  w.document.close();
  w.focus();
  setTimeout(()=>{ try{ w.print(); }catch(e){} }, 350);
}
async function zrobPdf(html, nazwa, stopka){
  if(!SRV.on){ drukujOkno(html); return; }
  try{
    const r = await fetch('/api/pdf', {method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({html, name:nazwa, footer:stopka})});
    if(!r.ok){
      const o = await r.json().catch(()=>({}));
      if(!confirm((o.error||'Serwer nie wygenerował PDF-u.')
        + '\n\nOtworzyć okno drukowania zamiast tego?')) return;
      drukujOkno(html); return;
    }
    const blob = await r.blob();
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = nazwa + '.pdf';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
  }catch(e){
    drukujOkno(html);
  }
}
/* Kolumny dobieramy pod treść: im mniej, tym czytelniej, ale wszystko ma się
   zmieścić na jednej stronie. Mierzymy naprawdę — w ukrytej ramce o wymiarach
   pola zadruku A4 (210×297 mm minus marginesy, przy 96 dpi). */
const DRUK_SZER = 717, DRUK_WYS = 1026;   // pole zadruku A4 przy 96 dpi
const DRUK_MAX_PX = 26;
/** Dobiera układ wydruku: liczy się jak największa czcionka, nie jak mało kolumn.

    Dla każdej dozwolonej liczby kolumn szukamy największego stopnia pisma, przy
    którym całość mieści się na jednej stronie, i bierzemy najlepszy wynik; przy
    remisie wygrywa mniej kolumn. Gdy nawet minimum nie wchodzi na stronę, nie
    schodzimy poniżej minimum — wtedy wydruk po prostu ma więcej stron. */
function dopasujDruk(buduj, maksKolumn, minPx){
  const maks = Math.max(1, Math.min(6, maksKolumn || 3));
  const min = Math.max(6, minPx || 11);
  const ram = document.createElement('iframe');
  ram.setAttribute('aria-hidden','true');
  ram.style.cssText = 'position:fixed;left:-10000px;top:0;border:0;width:'
    + DRUK_SZER + 'px;height:' + DRUK_WYS + 'px';
  document.body.appendChild(ram);
  let best = null;
  try{
    const mieści = (k, px) => {
      const d = ram.contentDocument;
      d.open(); d.write(buduj(k, px)); d.close();
      return d.body.scrollHeight <= DRUK_WYS;
    };
    for(let k=1; k<=maks; k++){
      if(!mieści(k, min)) continue;                 // przy tylu kolumnach się nie da
      let lo = min, hi = DRUK_MAX_PX;               // największe pismo, które wchodzi
      for(let i=0; i<7; i++){
        const mid = (lo + hi) / 2;
        if(mieści(k, mid)) lo = mid; else hi = mid;
      }
      const px = Math.floor(lo * 4) / 4;
      if(!best || px > best.px + 0.01) best = {kol:k, px};
    }
  }catch(e){ /* gdyby przeglądarka blokowała ramkę — zostaje bezpieczne minimum */ }
  ram.remove();
  return best || {kol:maks, px:min, wieleStron:true};
}

/* ---------------------------------------------------------------------------
   KOLEJNOŚĆ RĘCZNA
   Kolejność nakładania składników i zwijania rolek to informacja z arkusza,
   której nie da się odtworzyć z żadnej innej kolumny. Trzymamy ją jako kolejność
   tablicy — sortowanie tabeli przestawia tylko wiersze w widoku, więc nigdy jej
   nie nadpisze. Trzeci klik w nagłówek (albo klik w „#") wraca do kolejności ręcznej.
   ------------------------------------------------------------------------- */
function przestawIndeks(arr, od, doo){
  od = +od; doo = +doo;
  if(!Array.isArray(arr) || od===doo) return false;
  if(od<0 || doo<0 || od>=arr.length || doo>=arr.length) return false;
  const [x] = arr.splice(od,1);
  arr.splice(doo,0,x);
  return true;
}
/** przestawia po identyfikatorach — indeks widoku ≠ indeks w bazie, gdy działa filtr */
function przestawPoId(arr, idOd, idDo){
  if(!Array.isArray(arr)) return false;
  return przestawIndeks(arr, arr.findIndex(x=>x.id===idOd), arr.findIndex(x=>x.id===idDo));
}
const DND = {};   // klucz kontenera → funkcja(od, do); ustawiają ją widoki

/** przeciąganie i strzałki: kontener [data-dnd="klucz"], dzieci [data-di="klucz pozycji"] */
function wireDnd(root, handler){
  root.querySelectorAll('[data-dnd]').forEach(box=>{
    const fn = handler || DND[box.dataset.dnd];
    if(!fn) return;
    let od = null;
    box.querySelectorAll('[data-di]').forEach(el=>{
      el.addEventListener('dragstart',e=>{
        od = el.dataset.di; el.classList.add('dragging');
        e.dataTransfer.effectAllowed = 'move';
        try{ e.dataTransfer.setData('text/plain', String(od)); }catch(_){}
      });
      el.addEventListener('dragend',()=>{
        el.classList.remove('dragging');
        box.querySelectorAll('.dropzone').forEach(x=>x.classList.remove('dropzone'));
      });
      el.addEventListener('dragover',e=>{ e.preventDefault(); el.classList.add('dropzone'); });
      el.addEventListener('dragleave',()=>el.classList.remove('dropzone'));
      el.addEventListener('drop',e=>{
        e.preventDefault(); el.classList.remove('dropzone');
        const doo = el.dataset.di;
        if(od==null || od===doo) return;
        fn(od, doo);
      });
    });
    box.querySelectorAll('[data-mv]').forEach(b=>b.addEventListener('click',e=>{
      e.preventDefault(); e.stopPropagation();
      const [a,bb] = b.dataset.mv.split('|');
      fn(a, bb);
    }));
  });
}

}

function wireSort(root){
  root.querySelectorAll('table[data-tbl]').forEach(tb=>{
    const key = tb.dataset.tbl;
    if(!tb.tHead || !tb.tHead.rows.length) return;
    if(tb.dataset.noSortNow !== undefined) return;   // tryb ustawiania kolejności
    const ths = [...tb.tHead.rows[0].cells];
    const paint = ()=>{
      ths.forEach(x=>x.classList.remove('asc','desc'));
      const st = SORT[key];
      if(st && ths[st.i]) ths[st.i].classList.add(st.dir>0?'asc':'desc');
    };
    const kolOrd = ths.findIndex(x=>x.dataset.ordth !== undefined);
    if(kolOrd >= 0){
      const th = ths[kolOrd];
      th.classList.add('ordth');
      th.classList.toggle('on', !SORT[key]);
      th.title = SORT[key] ? 'Wróć do kolejności ręcznej' : 'Kolejność ręczna';
      th.addEventListener('click',()=>{ if(SORT[key]){ SORT[key] = null; render(); } });
    }
    ths.forEach((th,i)=>{
      if(th.dataset.nosort !== undefined || th.dataset.ordth !== undefined) return;
      th.classList.add('sortable');
      th.title = 'Kliknij, żeby posortować';
      th.addEventListener('click',()=>{
        const st = SORT[key];
        // rosnąco → malejąco → kolejność ręczna
        if(st && st.i===i && st.dir<0){ SORT[key] = null; render(); return; }
        SORT[key] = (st && st.i===i) ? {i, dir:-st.dir} : {i, dir:1};
        applySort(tb, key); paint();
      });
    });
    applySort(tb, key); paint();
  });
}

  const pts = hs.map(h=>({d:h.date, v:(h.to!=null&&h.qty)?h.to/h.qty:0, raw:h}));

  pts.unshift({d:p0.date, v:(p0.from!=null&&p0.qty)?p0.from/p0.qty:0, raw:p0});

      <td>${esc(g.unit)}</td>
      <td class="r num">${g.packPrice!=null?zl(g.packPrice):'<span class="tag crit">brak</span>'}</td>
      <td class="r num"><b>${uc!=null?num(uc,4):'—'}</b></td>
      <td class="r num mut">${used||'—'}</td>
      <td class="r" style="white-space:nowrap">${rowActions('ing', g)}</td></tr>`;
  }).join('');

  const cards=list.map(g=>{
    const uc=CALC.ingUnitCost(g.id), used=CALC.usedBy(g.id).length;
    return `<div class="card tcard ${SEL.ing===g.id?'sel':''} ${g.archived?'arch':''}" data-pick-ing="${g.id}">
      <div class="th"><h3>${esc(g.name)}${g.archived?' <span class="tag">archiwum</span>':''}</h3>
        <span class="tag">${esc(g.cat)}</span></div>
      <div class="hint" style="margin:0 0 8px">${g.packQty!=null?num(g.packQty,g.packQty%1?2:0)+' '+esc(g.unit)+' w opakowaniu':'brak opakowania'}</div>
      <div class="kv"><span>Cena opakowania</span><b>${g.packPrice!=null?zl(g.packPrice):'<span class="tag crit">brak</span>'}</b></div>
      <div class="kv"><span>Cena za ${esc(g.unit)}</span><b style="color:var(--s1)">${uc!=null?num(uc,4):'—'}</b></div>
      <div class="kv"><span>Energia w 100 g</span><b class="${hasNutr(g.nutr)?'':'mut'}">${hasNutr(g.nutr)?num(g.nutr.kcal,0)+' kcal':'—'}</b></div>
      <div class="kv"><span>Użyć w recepturach</span><b class="${used?'':'mut'}">${used||'—'}</b></div>
      <div class="acts">${rowActions('ing', g)}</div></div>`;
  }).join('');

  let detail='<div class="card"><div class="empty">Wybierz składnik, żeby zobaczyć wartości odżywcze i historię ceny.</div></div>';
  if(sel){
    const uc=CALC.ingUnitCost(sel.id);
    const pts=histPts(sel.id);
    const zmiany=DB.history.filter(h=>h.ingId===sel.id).sort((a,b)=>b.date.localeCompare(a.date));
    const gr=unitGrams(sel.unit, sel.gPerUnit);
    detail=`<div class="card">
      <div class="row" style="justify-content:space-between"><h2>${esc(sel.name)}</h2>
        <button class="btn sm pri" data-edit-ing="${sel.id}">Edytuj</button></div>
      <div class="hint">${esc(sel.cat)}${sel.archived?' · w archiwum':''}</div>
      <div class="tiles" style="grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px">
        <div class="tile" style="padding:10px 12px"><div class="lab">Cena za ${esc(sel.unit)}</div>
          <div class="val num" style="font-size:22px;color:var(--s1)">${uc!=null?num(uc,4):'—'}</div></div>
        <div class="tile" style="padding:10px 12px"><div class="lab">Użyć w recepturach</div>
          <div class="val num" style="font-size:22px">${CALC.usedBy(sel.id).length}</div></div>
      </div>
      <div class="kv"><span>Opakowanie</span><b>${sel.packQty!=null?num(sel.packQty,sel.packQty%1?2:0)+' '+esc(sel.unit):'—'}</b></div>
      <div class="kv"><span>Cena opakowania</span><b>${sel.packPrice!=null?zl(sel.packPrice):'<span class="tag crit">brak</span>'}</b></div>
      <div class="kv"><span>Waga 1 ${esc(sel.unit)}</span><b class="${gr==null?'mut':''}">${gr==null?'nie podano':num(gr,gr%1?2:0)+' g'}</b></div>
      ${gr?`<div class="kv"><span>Cena za 1 kg</span><b>${uc!=null?zl(uc*1000/gr):'—'}</b></div>`:''}

      <h3 style="margin:16px 0 6px">Wartości odżywcze</h3>
      ${nutr100(sel.nutr)}
      ${alergBlock(sel.alerg)}

      <h3 style="margin:16px 0 6px">Historia ceny</h3>
      ${pts.length>1
        ? `<div id="chIngHist">${lineChart(pts, 320, 150)}</div>`
        : '<div class="hint">Brak zapisanych zmian ceny. Pierwszy wpis pojawi się, gdy zmienisz cenę opakowania.</div>'}
      ${zmiany.slice(0,6).map(h=>{
        const od=(h.from!=null&&h.qty)?h.from/h.qty:null, doo=(h.to!=null&&h.qty)?h.to/h.qty:null;
        const d=(od&&doo)?doo/od-1:null;
        return `<div class="kv"><span>${esc(h.date)} <span class="mut small">${esc(h.note||'')}</span></span>
          <b>${zl(h.from)} → ${zl(h.to)} ${d==null?'':`<span class="tag ${d>0.02?'crit':d<-0.02?'good':''}">${(d>0?'+':'')+pct(d,1)}</span>`}</b></div>`;
      }).join('')}

      <h3 style="margin:16px 0 6px">Gdzie używany</h3>
      ${usedByBlock(sel.id)}
    </div>`;
  }

  return `
  <div class="topbar"><h1>Składniki</h1><span class="sub">${active(DB.ingredients).length} aktywnych</span><div class="spacer"></div>
    ${viewPills('ing')}
    <button class="btn pri" data-act="addIng">+ Składnik</button></div>
  <div class="card" style="padding:12px;margin-bottom:12px"><div class="row">
    <input id="ingQ" type="search" placeholder="Szukaj składnika…" value="${esc(ingFilter.q)}" style="max-width:280px">
    ${combo('ingCat','Kategoria…','max-width:200px')}
    ${archPills('ing')}
    <span class="mut small">${list.length} wyników</span>
  </div></div>
  ${listLayout('ing',
    `<div class="tw"><table data-tbl="ing"><thead><tr>
      <th>Nazwa</th><th>Kategoria</th><th class="r">Ilość w op.</th><th>j.m.</th>
      <th class="r">Cena opak.</th><th class="r">Cena / j.m.</th><th class="r">Użyć</th><th class="r" data-nosort>Akcje</th>
    </tr></thead><tbody>${rows||'<tr><td colspan="8" class="empty">Brak wyników</td></tr>'}</tbody></table></div>`,
    cards||'<div class="empty">Brak wyników</div>',
    detail)}`;
}

  const cats=[...new Set(DB.ingredients.map(x=>x.cat))].sort();
  const oldPrice = g.packPrice;
  openDlg(id?'Edytuj składnik':'Nowy składnik', `
    <div class="grid" style="grid-template-columns:1fr 1fr">
      <div style="grid-column:1/-1"><label class="f">Nazwa</label><input id="fName" type="text" value="${esc(g.name)}"></div>
      <div><label class="f">Kategoria</label><input id="fCat" type="text" list="catList" value="${esc(g.cat)}">
        <datalist id="catList">${cats.map(c=>`<option>${esc(c)}</option>`).join('')}</datalist></div>
      <div><label class="f">Jednostka</label><input id="fUnit" type="text" list="unitList" value="${esc(g.unit)}">
        <datalist id="unitList"><option>g</option><option>ml</option><option>szt.</option><option>l</option><option>kg</option><option>liść</option><option>gał.</option></datalist></div>
      <div><label class="f">Ilość w opakowaniu</label><input id="fQty" type="number" step="any" value="${g.packQty??''}"></div>
      <div><label class="f">Cena opakowania (netto)</label><input id="fPrice" type="number" step="any" value="${g.packPrice??''}"></div>
      <div><label class="f">Waga 1 jednostki [g]</label>
        <input id="fGram" type="number" step="any" value="${g.gPerUnit??''}" placeholder="${['g','ml'].includes(g.unit)?'1 (z jednostki)':['kg','l'].includes(g.unit)?'1000 (z jednostki)':'np. 2,8 dla arkusza nori'}">
        <div class="small mut" style="margin-top:5px">Potrzebne tylko dla jednostek innych niż g, ml, kg, l. Opakowania wpisz jako 0.</div></div>
      <div style="grid-column:1/-1" class="card" style="background:var(--surface-2);border:0">
        <div class="row" style="justify-content:space-between;margin-bottom:8px">
          <b>Wartości odżywcze w 100 g</b><span class="mut small">jak na etykiecie producenta</span></div>
        <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr))">
          ${NUTR.map(n=>`<div><label class="f">${esc(n.l)} [${n.u}]</label>
            <input id="fN_${n.k}" type="number" step="any" value="${(g.nutr&&g.nutr[n.k]!=null)?g.nutr[n.k]:''}"></div>`).join('')}
        </div>
      </div>
      <div style="grid-column:1/-1"><label class="f">Alergeny</label>
        <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:2px 10px">
          ${ALERG.map(a=>`<label class="row" style="gap:6px;cursor:pointer;font-size:12.5px">
            <input type="checkbox" id="fA_${a[0]}" ${(g.alerg||[]).includes(a[0])?'checked':''} style="width:auto;margin:0">
            <span>${esc(a[1])}</span></label>`).join('')}
        </div></div>
      <div style="grid-column:1/-1" class="card" style="background:var(--surface-2);border:0">
        <div class="kv"><span>Cena za jednostkę</span><b id="fCalc">—</b></div>
        <div class="kv"><span>Używany w pozycjach</span><b>${id?CALC.usedBy(id).length:0}</b></div>
      </div>
      ${id?'<div style="grid-column:1/-1"><label class="f">Notatka do zmiany ceny (opcjonalnie)</label><input id="fNote" type="text" placeholder="np. nowy cennik dostawcy, faktura FV/12/2026"></div>':''}
    </div>`,
    [ ...(id?[{label:'Zamień wszędzie…', fn:()=>{ replaceDialog(id); return false; }}]:[]),
      ...(id?[archBtn('ing', g)]:[]),
      {label:'Anuluj',cls:''},{label:'Zapisz',cls:'pri',fn:()=>{
      const nv = {
        name:val('fName').trim(), cat:val('fCat').trim()||'Inne', unit:val('fUnit').trim()||'szt.',
        packQty:numOrNull('fQty'), packPrice:numOrNull('fPrice'), gPerUnit:numOrNull('fGram'),
        nutr:(()=>{ const o={}; let any=false;
          NUTR.forEach(n=>{ const v=numOrNull('fN_'+n.k); if(v!=null){o[n.k]=v; any=true;} });
          return any?o:null; })(),
        alerg:ALERG.filter(a=>{const e=document.getElementById('fA_'+a[0]); return e&&e.checked;}).map(a=>a[0])
      };
      if(!nv.name){ alert('Podaj nazwę składnika.'); return false; }
      Object.assign(g,nv);
      if(id){
        const idx=DB.ingredients.findIndex(x=>x.id===id);
        DB.ingredients[idx]=g;
        if(oldPrice!==g.packPrice){
          DB.history.push({id:uid('h'), ingId:g.id, date:todayISO(), from:oldPrice, to:g.packPrice,
                           qty:g.packQty, note:(document.getElementById('fNote')||{}).value||''});
        }
      } else DB.ingredients.push(g);
      save(); render();
    }}],
    ()=>{
      const upd=()=>{ const q=numOrNull('fQty'), p=numOrNull('fPrice');
        document.getElementById('fCalc').textContent = (q&&p!=null)? num(p/q,4)+' '+DB.settings.currency+' / '+val('fUnit') : '—'; };
      ['fQty','fPrice','fUnit'].forEach(i=>document.getElementById(i).addEventListener('input',upd)); upd();
    });
}

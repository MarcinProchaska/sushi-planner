<!DOCTYPE html>
<html lang="pl" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sushi Planner — food cost i menu</title>
<style>
:root{
  color-scheme:light;
  --plane:#f9f9f7; --surface:#fcfcfb; --surface-2:#f2f2ef;
  --ink:#0b0b0b; --ink-2:#52514e; --muted:#898781;
  --grid:#e1e0d9; --axis:#c3c2b7; --border:rgba(11,11,11,.10);
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300; --s7:#4a3aa7; --s8:#e34948;
  --good:#0ca30c; --warn:#fab219; --serious:#ec835a; --crit:#d03b3b;
  --good-ink:#006300; --crit-ink:#b02c2c; --warn-ink:#8a6100;
  --r:10px;
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --plane:#0d0d0d; --surface:#1a1a19; --surface-2:#242422;
  --ink:#fff; --ink-2:#c3c2b7; --muted:#898781;
  --grid:#2c2c2a; --axis:#383835; --border:rgba(255,255,255,.10);
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
  --good-ink:#0ca30c; --crit-ink:#e66767; --warn-ink:#fab219;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--plane); color:var(--ink);
  font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;font-weight:640;letter-spacing:-.01em}
h1{font-size:18px} h2{font-size:16px} h3{font-size:13px}
a{color:var(--s1)}

/* ---------- layout ---------- */
.app{display:flex;min-height:100vh}
.side{
  width:216px;flex:none;background:var(--surface);border-right:1px solid var(--border);
  padding:16px 12px;display:flex;flex-direction:column;gap:2px;position:sticky;top:0;height:100vh;overflow:auto;
}
.brand{display:flex;align-items:center;gap:9px;padding:4px 8px 16px}
.brand .dot{width:22px;height:22px;border-radius:7px;background:linear-gradient(135deg,var(--s1),var(--s3));flex:none}
.brand b{font-size:14.5px;letter-spacing:-.01em}
.brand small{display:block;color:var(--muted);font-size:11px;font-weight:400}
.nav{background:none;border:0;text-align:left;padding:8px 10px;border-radius:8px;cursor:pointer;color:var(--ink-2);display:flex;gap:9px;align-items:center;width:100%}
.nav:hover{background:var(--surface-2);color:var(--ink)}
.nav.on{background:var(--surface-2);color:var(--ink);font-weight:600}
.nav .ic{width:16px;text-align:center;opacity:.75}
.nav .cnt{margin-left:auto;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.sidefoot{margin-top:auto;padding-top:14px;display:flex;flex-direction:column;gap:6px}
.main{flex:1;min-width:0;padding:20px 24px 64px;max-width:1400px}
.topbar{display:flex;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.topbar .sub{color:var(--muted);font-size:12.5px}
.spacer{flex:1}

/* ---------- primitives ---------- */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:16px}
.card h2{margin-bottom:2px}
.card .hint{color:var(--muted);font-size:12px;margin-bottom:12px}
.grid{display:grid;gap:12px}
.btn{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:7px 12px;cursor:pointer;color:var(--ink);font-weight:520;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.pri{background:var(--s1);border-color:transparent;color:#fff}
.btn.pri:hover{filter:brightness(1.07)}
.btn.sm{padding:4px 9px;font-size:12.5px;border-radius:7px}
.btn.danger{color:var(--crit-ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
input[type=text],input[type=number],input[type=search],input[type=email],input[type=password],select,textarea{
  background:var(--plane);border:1px solid var(--border);border-radius:8px;padding:7px 9px;width:100%;
}
input:focus,select:focus,textarea:focus{outline:2px solid var(--s1);outline-offset:-1px}
label.f{display:block;font-size:12px;color:var(--ink-2);margin-bottom:4px;font-weight:540}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;padding:2px 8px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);font-weight:560;white-space:nowrap}
.tag.good{background:color-mix(in srgb,var(--good) 14%,transparent);color:var(--good-ink)}
.tag.warn{background:color-mix(in srgb,var(--warn) 22%,transparent);color:var(--warn-ink)}
.tag.crit{background:color-mix(in srgb,var(--crit) 15%,transparent);color:var(--crit-ink)}
.num{font-variant-numeric:tabular-nums}
.mut{color:var(--muted)}
.small{font-size:12px}

/* ---------- table ---------- */
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{text-align:left;font-size:11.5px;font-weight:620;color:var(--muted);padding:7px 8px;border-bottom:1px solid var(--grid);white-space:nowrap;letter-spacing:.01em}
th.r,td.r{text-align:right}
td{padding:8px;border-bottom:1px solid var(--grid);vertical-align:middle}
tbody tr:hover{background:var(--surface-2)}
tbody tr.sel{background:color-mix(in srgb,var(--s1) 8%,transparent)}
.tw{overflow:auto;border:1px solid var(--border);border-radius:var(--r);background:var(--surface)}
td .cellin{background:transparent;border:1px solid transparent;padding:3px 5px;border-radius:6px;text-align:right}
td .cellin:hover{border-color:var(--border);background:var(--plane)}

/* ---------- stat tiles ---------- */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:14px 16px}
.tile .lab{font-size:11.5px;color:var(--muted);font-weight:600;letter-spacing:.02em;text-transform:uppercase}
.tile .val{font-size:27px;font-weight:660;letter-spacing:-.02em;margin-top:5px;line-height:1.1}
.tile .note{font-size:12px;color:var(--ink-2);margin-top:3px}

/* ---------- chart ---------- */
.chart{width:100%;display:block}
@media(max-width:820px){
  .chart{min-width:520px}
  .card>div[id^="ch"]{overflow-x:auto;-webkit-overflow-scrolling:touch}
}
.chart text{font:11px system-ui,-apple-system,"Segoe UI",sans-serif;fill:var(--muted)}
.chart .lbl{fill:var(--ink-2);font-weight:540}
.chart .val{fill:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.chart .gl{stroke:var(--grid);stroke-width:1}
.chart .base{stroke:var(--axis);stroke-width:1}
.chart .bar{rx:4}
.chart .hit{fill:transparent;cursor:pointer}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink-2);margin-top:10px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block;margin-right:6px;vertical-align:-1px}
#tip{
  position:fixed;pointer-events:none;z-index:99;background:var(--surface);border:1px solid var(--border);
  border-radius:8px;padding:7px 10px;font-size:12.5px;box-shadow:0 6px 20px rgba(0,0,0,.16);opacity:0;transition:opacity .1s;
  max-width:280px
}
#tip b{display:block;margin-bottom:2px}

/* ---------- misc ---------- */
.alert{display:flex;gap:10px;padding:10px 12px;border-radius:9px;background:var(--surface-2);align-items:flex-start;margin-bottom:8px}
.alert .ic{flex:none;width:18px;height:18px;border-radius:5px;display:grid;place-items:center;font-size:11px;font-weight:700;color:#fff;margin-top:1px}
.alert.crit .ic{background:var(--crit)} .alert.warn .ic{background:var(--warn);color:#3a2a00} .alert.info .ic{background:var(--s1)}
.alert .txt{font-size:13px;color:var(--ink-2)} .alert .txt b{color:var(--ink)}
dialog{border:1px solid var(--border);border-radius:14px;background:var(--surface);color:var(--ink);padding:0;max-width:min(880px,94vw);width:100%}
dialog::backdrop{background:rgba(0,0,0,.42)}
.dlg-h{padding:16px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
.dlg-b{padding:18px;max-height:min(70vh,660px);overflow:auto}
.dlg-f{padding:13px 18px;border-top:1px solid var(--border);display:flex;gap:9px;justify-content:flex-end;background:var(--surface-2);border-radius:0 0 14px 14px}
.empty{text-align:center;padding:40px 20px;color:var(--muted)}
.bar-mini{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden;min-width:60px}
.bar-mini i{display:block;height:100%;border-radius:3px}
.split{display:grid;grid-template-columns:1fr 340px;gap:12px;align-items:start}
@media(max-width:1080px){.split{grid-template-columns:1fr}}
@media(max-width:760px){
  .app{flex-direction:column}
  .side{width:auto;height:auto;position:static;flex-direction:row;overflow-x:auto;padding:8px}
  .brand,.sidefoot{display:none}
  .main{padding:14px}
}
.hidden{display:none!important}
tr.arch{opacity:.55}
tr.arch:hover{opacity:.85}
.card.arch{opacity:.6}
.card.arch:hover{opacity:1}
.pill-group{display:inline-flex;background:var(--surface-2);border-radius:9px;padding:3px;gap:2px}
.pill-group button{background:none;border:0;padding:5px 11px;border-radius:7px;cursor:pointer;color:var(--ink-2);font-size:12.5px;font-weight:540}
.pill-group button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.compline{display:grid;grid-template-columns:1fr 92px 74px 90px 32px;gap:8px;align-items:center;margin-bottom:7px}
.compline .cost{text-align:right;font-variant-numeric:tabular-nums;color:var(--ink-2)}
@media(max-width:640px){.compline{grid-template-columns:1fr 80px 60px;grid-auto-rows:auto}}
.kv{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--grid);font-size:13px}
.kv:last-child{border:0}
.kv b{font-variant-numeric:tabular-nums}
.banner{border:1px solid var(--border);border-left:3px solid var(--s4);background:var(--surface);border-radius:9px;padding:11px 14px;margin-bottom:14px;font-size:13px;color:var(--ink-2)}
/* ---------- zdjęcia ---------- */
.thumb{width:38px;height:38px;border-radius:7px;object-fit:cover;background:var(--surface-2);display:block;flex:none}
.thumb.ph{display:grid;place-items:center;color:var(--muted);font-size:15px}
.hero{width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:9px;background:var(--surface-2);display:block;margin-bottom:12px}
.drop{border:1.5px dashed var(--axis);border-radius:9px;padding:14px;text-align:center;color:var(--muted);font-size:12.5px;cursor:pointer;max-width:280px}
.drop:hover{border-color:var(--s1);color:var(--ink-2)}
.drop.has{padding:0;border-style:solid;overflow:hidden;position:relative}
.drop.has img{width:100%;aspect-ratio:16/10;object-fit:cover;display:block}
.namecell{display:flex;align-items:center;gap:9px;min-width:0}
body.ro [data-ro-hide]{display:none!important}
.login-wrap{position:fixed;inset:0;background:var(--plane);display:grid;place-items:center;z-index:200;padding:20px}
.login-box{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:26px;width:100%;max-width:370px;box-shadow:0 10px 40px rgba(0,0,0,.12)}
.login-box .brand{padding:0 0 18px}
.packgrid{display:grid;grid-template-columns:1fr 92px 74px;gap:8px 10px;align-items:end}
@media(max-width:640px){.packgrid{grid-template-columns:1fr 80px}}
</style>
</head>

<div class="app">

    <button class="nav" data-v="sim"><span class="ic">◔</span>Symulacja</button>
    <button class="nav hidden" data-v="users" id="navUsers"><span class="ic">◉</span>Użytkownicy<span class="cnt" id="cUsers"></span></button>
    <button class="nav" data-v="set"><span class="ic">⚙</span>Ustawienia</button>
    <div class="sidefoot">
      <div id="syncBadge" class="tag" style="justify-content:center">tryb lokalny</div>
      <button class="btn sm" id="themeBtn">◐ Motyw</button>
    </div>
  </nav>
  <main class="main" id="main"></main>
</div>

<dialog id="dlg"><form method="dialog" id="dlgForm">
  <div class="dlg-h"><h2 id="dlgTitle"></h2><div class="spacer"></div><button class="btn sm" value="cancel" type="submit">✕</button></div>
  <div class="dlg-b" id="dlgBody"></div>
  <div class="dlg-f" id="dlgFoot"></div>
</form></dialog>

const ARCH = {ing:'active', prep:'active', items:'active', sets:'active'};

function active(list){ return list.filter(x=>!x.archived); }
function archFilter(list, key){
  const m = ARCH[key];
  if(m==='all') return list;
  if(m==='arch') return list.filter(x=>x.archived);
  return list.filter(x=>!x.archived);
}
function archPills(key){

    <button type="button" data-av="all" class="${ARCH[key]==='all'?'on':''}">Wszystko</button>
  </div>`;
}
function wireArchPills(root){
  root.querySelectorAll('[data-archgroup]').forEach(g=>{
    g.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{

/** gdzie obiekt jest jeszcze używany przez coś nieazarchiwizowanego */
function usedByActive(id){
  return CALC.usedBy(id).filter(u=>{
    const o = u.type==='item'?CALC.item(u.id) : u.type==='prep'?CALC.prep(u.id) : CALC.set(u.id);
    return o && !o.archived;
  });
}
/** przełącza archiwum; zwraca true gdy coś się zmieniło */
function toggleArchive(key, id){
  const o = ARCH_LIST[key]().find(x=>x.id===id);
  if(!o) return false;
  if(o.archived){ delete o.archived; save(); return true; }
  const used = key==='sets' ? [] : usedByActive(id);
  if(used.length && !confirm(
      '„'+o.name+'” jest nadal używany w: '+used.map(u=>u.name).join(', ')+'.\n\n'
      +'Archiwizacja tylko schowa tę pozycję z list — koszty będą liczone dalej, '
      +'żeby receptury nie zaczęły nagle wychodzić taniej.\n\nZarchiwizować mimo to?')) return false;
  o.archived = todayISO();
  save(); return true;
}

/** usuwanie z blokadą, gdy coś jeszcze tego używa */
function deleteEntity(key, id){
  const list = ARCH_LIST[key]();
  const o = list.find(x=>x.id===id);
  if(!o) return false;
  const used = key==='sets' ? [] : CALC.usedBy(id);
  if(used.length){
    alert('Nie można usunąć — „'+o.name+'” jest używany w:\n\n'
      +used.map(u=>'• '+u.name).join('\n')
      +'\n\nUsunięcie po cichu zmieniłoby koszty tych pozycji. '
      +'Użyj przycisku Archiwum — schowa z list, a koszty zostaną nienaruszone.');
    return false;
  }
  if(!confirm('Usunąć '+KIND_PL[key]+' „'+o.name+'” bezpowrotnie?\n\n'
      +'Jeśli chcesz tylko uporządkować listę, wybierz Archiwum.')) return false;
  const idx = list.findIndex(x=>x.id===id);
  list.splice(idx,1);
  if(key==='items'){ SEL.item = SEL.item===id?null:SEL.item; }
  if(key==='sets'){ SEL.set = SEL.set===id?null:SEL.set; }
  if(key==='ing'){ SEL.ing = SEL.ing===id?null:SEL.ing; }
  save(); return true;
}

/** wszystkie miejsca, w których występuje dany składnik lub półprodukt */
function occurrences(refId){
  const out=[];
  DB.items.forEach(i=>i.comps.forEach((c,idx)=>{ if(c.refId===refId)
    out.push({where:'rolka', name:i.name, obj:i, list:i.comps, idx, kindField:false}); }));
  DB.preps.forEach(p=>p.items.forEach((c,idx)=>{ if(c.refId===refId)
    out.push({where:'półprodukt', name:p.name, obj:p, list:p.items, idx, kindField:true}); }));
  DB.sets.forEach(st=>{
    (st.comps||[]).forEach((c,idx)=>{ if(c.refId===refId)
      out.push({where:'dodatek zestawu', name:st.name, obj:st, list:st.comps, idx, kindField:false}); });
    ['trayId','chopId','sauceId'].forEach(k=>{ if(st.pack && st.pack[k]===refId)
      out.push({where:'opakowanie zestawu', name:st.name, obj:st, packKey:k}); });
  });
  return out;
}

/** wystąpienia, których NIE wolno podmienić na `toId` — bo powstałaby pętla.

    Klasyczny przypadek: zamiana „Ryż” na półprodukt „Ryż gotowany”. Ryż surowy jest
    składnikiem tego półproduktu, więc podmiana w jego wnętrzu kazałaby mu liczyć
    samego siebie i koszt zapadłby się do zera. */
function skipsForCycle(fromId, toId){
  return occurrences(fromId).filter(o => o.obj && o.obj.id === toId);
}

/** podmienia wszystkie wystąpienia; qty przemnożone przez factor.
    Zwraca {zmienione, pominiete}. */
function replaceEverywhere(fromId, toId, factor){
  const isPrep = !!CALC.prep(toId);
  let n=0, skip=0;
  occurrences(fromId).forEach(o=>{
    if(o.obj && o.obj.id === toId){ skip++; return; }      // ochrona przed pętlą
    if(o.packKey){ o.obj.pack[o.packKey]=toId; n++; return; }
    const c=o.list[o.idx];
    c.refId=toId;
    c.qty=(c.qty||0)*factor;
    if(o.kindField) c.kind = isPrep ? 'prep' : 'ing';
    n++;
  });
  return {zmienione:n, pominiete:skip};
}

/** czy któryś półprodukt przestał dawać się policzyć (pętla) */

function canEdit(){ return !(SRV.on && SRV.user && SRV.user.role==='viewer'); }

function load(){
  const s = safeGet();
  if(s){ try{ DB = JSON.parse(s); }catch(e){ DB=null; } }
  if(!DB) DB = clone(SEED);
  // migracje / uzupełnienia
  DB.settings = Object.assign({targetFc:.30, alertFc:.35, vat:.08, currency:'zł', roundTo:.9}, DB.settings||{});
  DB.history = DB.history || [];
  DB.sets.forEach(s=>{ s.comps = s.comps||[]; s.pack = Object.assign({trayId:null,trayQty:1,chopId:null,chopQty:2,sauceId:null,sauceQty:2}, s.pack||{}); });
  DB.items.forEach(i=>{ i.comps = i.comps||[]; });
  STORAGE_OK = safeSet('probe')!==false; try{localStorage.removeItem('probe');}catch(e){}
}
function save(){
  if(!canEdit()){ alert('Twoje konto ma tylko podgląd — zmiany nie zostaną zapisane.'); return; }
  const ok = safeSet(JSON.stringify(DB));
  if(!ok) STORAGE_OK=false;
  if(SRV.on && SRV.user) SRV.push();
  else if(SUPA.on) SUPA.push();
}

const cur = DB0=>DB.settings.currency;
function zl(n,d=2){ if(n==null||isNaN(n)) return '—'; return n.toFixed(d).replace('.',',')+' '+DB.settings.currency; }
function pct(n,d=1){ if(n==null||isNaN(n)||!isFinite(n)) return '—'; return (n*100).toFixed(d).replace('.',',')+'%'; }
function num(n,d=2){ if(n==null||isNaN(n)) return '—'; return n.toFixed(d).replace('.',','); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function kb(n){ return n>1048576 ? (n/1048576).toFixed(1).replace('.',',')+' MB' : Math.round(n/1024)+' kB'; }

/** wczytuje zdjęcie z pliku i zmniejsza je do miniatury (max 640 px, JPEG) */
function readPhoto(file, cb){
  if(!file){ cb(null); return; }
  if(!/^image\//.test(file.type)){ alert('To nie jest plik graficzny.'); cb(null); return; }
  const fr=new FileReader();
  fr.onload=()=>{
    const img=new Image();
    img.onload=()=>{
      const MAX=640;
      let {width:w, height:h}=img;
      if(w>MAX||h>MAX){ const r=Math.min(MAX/w,MAX/h); w=Math.round(w*r); h=Math.round(h*r); }
      const cv=document.createElement('canvas'); cv.width=w; cv.height=h;
      const cx=cv.getContext('2d');
      cx.fillStyle='#fff'; cx.fillRect(0,0,w,h);
      cx.drawImage(img,0,0,w,h);
      cb(cv.toDataURL('image/jpeg',0.72));
    };
    img.onerror=()=>{ alert('Nie udało się odczytać zdjęcia.'); cb(null); };
    img.src=fr.result;
  };
  fr.onerror=()=>{ alert('Nie udało się odczytać pliku.'); cb(null); };
  fr.readAsDataURL(file);
}

/** podpina pole wgrywania zdjęcia (element .drop + ukryty input) */
function wirePhoto(dropId, inputId, obj, onDone){
  const drop=document.getElementById(dropId), inp=document.getElementById(inputId);
  if(!drop||!inp) return;
  const paint=()=>{
    drop.className = 'drop'+(obj.photo?' has':'');
    drop.innerHTML = obj.photo
      ? `<img src="${obj.photo}" alt="">`
      : '⊕ Kliknij, żeby dodać zdjęcie<br><span class="small">JPG lub PNG — zostanie zmniejszone do 640 px</span>';
  };
  drop.addEventListener('click',()=>inp.click());
  drop.addEventListener('dragover',e=>{e.preventDefault();});
  drop.addEventListener('drop',e=>{ e.preventDefault();
    readPhoto(e.dataTransfer.files[0], d=>{ if(d){ obj.photo=d; paint(); if(onDone)onDone(); } }); });
  inp.addEventListener('change',()=>{
    readPhoto(inp.files[0], d=>{ if(d){ obj.photo=d; paint(); if(onDone)onDone(); } inp.value=''; }); });
  const rm=document.getElementById(dropId+'Rm');
  if(rm) rm.addEventListener('click',()=>{ obj.photo=null; paint(); if(onDone)onDone(); });
  paint();
}

/* ============================================================================
   SILNIK OBLICZEŃ
   ========================================================================== */
const CALC = {
  ing(id){ return DB.ingredients.find(x=>x.id===id); },
  prep(id){ return DB.preps.find(x=>x.id===id); },
  item(id){ return DB.items.find(x=>x.id===id); },
  set(id){ return DB.sets.find(x=>x.id===id); },

  /** koszt jednostkowy składnika (za 1 jednostkę bazową) */
  ingUnitCost(id){
    const g = this.ing(id);
    if(!g || g.packPrice==null || !g.packQty) return null;
    return g.packPrice / g.packQty;
  },

  /** koszt jednostkowy półproduktu (za 1 jednostkę wydajności) */
  prepUnitCost(id, seen){
    seen = seen || new Set();
    if(seen.has(id)) return null;         // ochrona przed pętlą
    seen.add(id);
    const p = this.prep(id);
    if(!p || !p.yieldQty) return null;
    let tot = 0;
    for(const c of p.items){
      let uc = 0;
      if(c.kind==='raw') uc = c.unitCost||0;
      else if(c.kind==='ing') uc = this.ingUnitCost(c.refId)||0;
      else if(c.kind==='prep') uc = this.prepUnitCost(c.refId, seen)||0;
      tot += (c.qty||0)*uc;
    }
    return tot / p.yieldQty;
  },

  /** koszt jednostkowy dowolnego komponentu + etykieta */
  compInfo(refId){
    const g = this.ing(refId);
    if(g) return {name:g.name, unit:g.unit, unitCost:this.ingUnitCost(refId), kind:'ing', cat:g.cat};
    const p = this.prep(refId);
    if(p) return {name:p.name, unit:p.yieldUnit, unitCost:this.prepUnitCost(refId), kind:'prep', cat:'Półprodukt'};
    return {name:'⚠ brak: '+refId, unit:'', unitCost:null, kind:'missing', cat:'—'};
  },

  /** rozbicie kosztu listy komponentów */
  breakdown(comps){
    const rows=[]; let tot=0; const missing=[];
    for(const c of comps){
      const info = this.compInfo(c.refId);
      const uc = info.unitCost;
      const cost = (c.qty||0) * (uc||0);
      if(uc==null) missing.push(info.name);
      rows.push({refId:c.refId, name:info.name, unit:info.unit, qty:c.qty, unitCost:uc, cost, kind:info.kind});
      tot += cost;
    }
    rows.sort((a,b)=>b.cost-a.cost);
    return {rows, total:tot, missing};
  },

  /** pełna kalkulacja pozycji menu */
  itemCalc(it){
    const b = this.breakdown(it.comps);
    const vat = it.vat==null?DB.settings.vat:it.vat;
    const pieces = it.pieces||1;
    const priceGross = it.price||0;
    const priceNet = priceGross/(1+vat);
    return {
      ...b,
      net: b.total,
      gross: b.total*(1+vat),
      perPiece: b.total/pieces,
      pricePerPiece: priceGross/pieces,
      priceGross, priceNet, vat, pieces,
      fc: priceNet>0 ? b.total/priceNet : null,
      margin: priceNet>0 ? priceNet-b.total : null,
      suggested: this.suggest(b.total, vat, DB.settings.targetFc),
    };
  },

  /** składniki dostępne w danej roli opakowania (tacka / pałeczki / sos) */
  byRole(role){
    const live = DB.ingredients.filter(g=>!g.archived);
    const tagged = live.filter(g=>g.role===role);
    return tagged.length ? tagged : live.filter(g=>g.cat==='Opakowania'||g.cat==='Sosy'||g.cat==='Dodatki');
  },

  /** opakowanie zestawu rozbite na pozycje */
  packRows(st){
    const p = st.pack||{};
    const defs = [
      {key:'tray',  label:'Tacka',   refId:p.trayId,  qty:p.trayQty},
      {key:'chop',  label:'Pałeczki',refId:p.chopId,  qty:p.chopQty},
      {key:'sauce', label:'Sos w saszetce', refId:p.sauceId, qty:p.sauceQty},
    ];
    const rows=[]; let total=0; const missing=[];
    for(const d of defs){
      if(!d.refId || !d.qty) continue;
      const info = this.compInfo(d.refId);
      if(info.unitCost==null) missing.push(info.name);
      const cost=(d.qty||0)*(info.unitCost||0);
      rows.push({...d, name:info.name, unit:info.unit, unitCost:info.unitCost, cost});
      total+=cost;
    }
    return {rows, total, missing};
  },

  /** pełna kalkulacja zestawu */
  setCalc(st){
    let cost=0, pieces=0; const parts=[]; const missing=[];
    for(const e of (st.entries||[])){
      const it = this.item(e.itemId);
      if(!it){ missing.push('pozycja '+e.itemId); continue; }
      const ic = this.itemCalc(it);
      const c = ic.perPiece*(e.pieces||0);
      cost += c; pieces += (e.pieces||0);
      parts.push({name:it.name, itemId:it.id, pieces:e.pieces, perPiece:ic.perPiece, cost:c,
                  alaCarte: ic.pricePerPiece*(e.pieces||0)});
      ic.missing.forEach(m=>missing.push(m));
    }
    const pack = this.packRows(st);
    pack.missing.forEach(m=>missing.push(m));
    cost += pack.total;
    const extra = this.breakdown(st.comps||[]);
    extra.missing.forEach(m=>missing.push(m));
    cost += extra.total;
    const vat = st.vat==null?DB.settings.vat:st.vat;
    const priceGross = st.price||0, priceNet = priceGross/(1+vat);
    const alaCarte = parts.reduce((s,p)=>s+p.alaCarte,0);
    return {
      parts, extra, pack, packaging:pack.total+extra.total,
      pieces, net:cost, gross:cost*(1+vat),
      priceGross, priceNet, vat, alaCarte,
      discount: alaCarte>0 ? 1-priceGross/alaCarte : null,
      fc: priceNet>0 ? cost/priceNet : null,
      margin: priceNet>0 ? priceNet-cost : null,
      perPiece: pieces? cost/pieces : null,
      suggested: this.suggest(cost, vat, DB.settings.targetFc),
      missing:[...new Set(missing)],
    };
  },

  /** cena sprzedaży brutto dla zadanego food cost */
  suggest(net, vat, targetFc){
    if(!targetFc||!net) return null;
    const raw = net*(1+vat)/targetFc;
    const step = DB.settings.roundTo;
    if(!step) return raw;
    // zaokrąglenie w górę do najbliższej końcówki ,90 / pełnej złotówki
    if(step===0.9){ const base=Math.floor(raw); return (raw<=base+0.9? base+0.9 : base+1.9); }
    return Math.ceil(raw/step)*step;
  },

  /** gdzie użyty jest składnik */
  usedBy(refId){
    const out=[];
    DB.items.forEach(i=>{ if(i.comps.some(c=>c.refId===refId)) out.push({type:'item',id:i.id,name:i.name}); });
    DB.preps.forEach(p=>{ if(p.items.some(c=>c.refId===refId)) out.push({type:'prep',id:p.id,name:p.name}); });
    DB.sets.forEach(s=>{
      if((s.comps||[]).some(c=>c.refId===refId)
         || (s.entries||[]).some(e=>e.itemId===refId)
         || ['trayId','chopId','sauceId'].some(k=>(s.pack||{})[k]===refId))
        out.push({type:'set',id:s.id,name:s.name});
    });
    return out;
  },

  status(fc){
    if(fc==null) return 'none';
    const t=DB.settings.targetFc, a=DB.settings.alertFc;
    if(fc>a) return 'crit';
    if(fc>t) return 'warn';
    return 'good';
  },
};

/* ============================================================================
   PROBLEMY / ALERTY
   ========================================================================== */
function problems(){
  const out=[];
  const idle=[];
  active(DB.ingredients).forEach(g=>{
    if(g.packPrice==null || !g.packQty){
      const used = CALC.usedBy(g.id);
      if(used.length) out.push({sev:'crit', k:'noprice',
        title:'Brak ceny: '+g.name,
        msg:'Używany w '+used.length+' recepturach ('+used.map(u=>u.name).join(', ')+') — ich koszt jest zaniżony.',
        go:{v:'ing', id:g.id}});
      else idle.push(g.name);
    }
  });
  if(idle.length) out.push({sev:'info',k:'idle',
    title:idle.length+' składników bez ceny, nieużywanych w recepturach',
    msg:idle.join(', ')+'. Uzupełnij ceny, zanim dopiszesz je do receptur lub zestawów.',
    go:{v:'ing'}});
  active(DB.items).forEach(i=>{
    const c = CALC.itemCalc(i);
    if(!i.price){
      if(i.comps.length) out.push({sev:'warn',k:'noprice2',title:'Brak ceny sprzedaży: '+i.name,msg:'Nie da się policzyć food cost ani marży.',go:{v:'items',id:i.id}});
      return; }
    if(c.fc!=null && c.fc>DB.settings.alertFc)
      out.push({sev:'crit',k:'fc',title:i.name+' — food cost '+pct(c.fc),
        msg:'Powyżej progu alertu '+pct(DB.settings.alertFc)+'. Sugerowana cena: '+zl(c.suggested)+'.',go:{v:'items',id:i.id}});
    else if(c.fc!=null && c.fc>DB.settings.targetFc)
      out.push({sev:'warn',k:'fc',title:i.name+' — food cost '+pct(c.fc),
        msg:'Powyżej celu '+pct(DB.settings.targetFc)+'.',go:{v:'items',id:i.id}});
  });
  const noPack = active(DB.sets).filter(s=>!CALC.packRows(s).rows.length);
  if(noPack.length) out.push({sev:'warn',k:'nopack',
    title:noPack.length+' zestawów bez policzonego opakowania',
    msg:'Brakuje tacki, pałeczek i sosu w: '+noPack.map(s=>s.name).join(', ')+'. Food cost tych zestawów jest zaniżony — użyj przycisku „Uzupełnij opakowanie” na liście zestawów.',
    go:{v:'sets'}});
  active(DB.sets).forEach(s=>{
    const c = CALC.setCalc(s);
    if(c.missing.length) out.push({sev:'crit',k:'setmiss',title:'Zestaw '+s.name+' — niekompletne dane',msg:'Brakuje: '+c.missing.join(', '),go:{v:'sets',id:s.id}});
    if(c.fc!=null && c.fc>DB.settings.alertFc)
      out.push({sev:'crit',k:'setfc',title:s.name+' — food cost '+pct(c.fc),msg:'Powyżej progu alertu. Sugerowana cena: '+zl(c.suggested)+'.',go:{v:'sets',id:s.id}});
  });
  [['ing',DB.ingredients],['prep',DB.preps],['items',DB.items]].forEach(([k,list])=>{
    list.filter(x=>x.archived).forEach(o=>{
      const used = usedByActive(o.id);
      if(used.length) out.push({sev:'warn', k:'archused',
        title:'W archiwum, ale wciąż używane: '+o.name,
        msg:'Występuje w: '+used.map(u=>u.name).join(', ')+'. Koszt liczy się normalnie, '
            +'ale warto podmienić na aktualny odpowiednik albo przywrócić z archiwum.',
        go:{v:k, id:o.id}});
    });
  });
  const rank={crit:0,warn:1,info:2};
  out.sort((a,b)=>rank[a.sev]-rank[b.sev]);
  return out;
}

/* ============================================================================
   WYKRESY (inline SVG, hover + tooltip)
   ========================================================================== */
const TIP = document.getElementById('tip');
function showTip(html,x,y){ TIP.innerHTML=html; TIP.style.opacity=1;
  const r=TIP.getBoundingClientRect();
  TIP.style.left=Math.min(x+14, innerWidth-r.width-10)+'px';
  TIP.style.top=Math.max(8, y-r.height-12)+'px'; }
function hideTip(){ TIP.style.opacity=0; }

/** poziomy wykres słupkowy z progiem — status wg food cost */
function barChartFc(rows, opts){
  opts = opts||{};
  const H=26, PAD=6, LW=opts.labelW||168, RW=64, W=opts.width||760;
  const h = rows.length*H + 34;
  const max = Math.max(opts.max||0, ...rows.map(r=>r.v||0), DB.settings.alertFc*1.15);
  const plotW = W-LW-RW;
  const x = v => LW + (v/max)*plotW;
  const ticks=[];
  const stepN = 0.1;
  for(let t=0;t<=max+1e-9;t+=stepN) ticks.push(t);
  let s = `<svg class="chart" viewBox="0 0 ${W} ${h}" width="100%" height="${h}" role="img">`;
  ticks.forEach(t=>{ s+=`<line class="gl" x1="${x(t).toFixed(1)}" y1="20" x2="${x(t).toFixed(1)}" y2="${rows.length*H+20}"/>
    <text x="${x(t).toFixed(1)}" y="13" text-anchor="middle">${Math.round(t*100)}%</text>`; });
  // linia celu
  const tx = x(DB.settings.targetFc);
  s+=`<line x1="${tx.toFixed(1)}" y1="16" x2="${tx.toFixed(1)}" y2="${rows.length*H+20}" stroke="var(--ink-2)" stroke-width="1.5" stroke-dasharray="3 3"/>`;
  s+=`<text class="lbl" x="${tx.toFixed(1)}" y="${rows.length*H+32}" text-anchor="middle">cel ${Math.round(DB.settings.targetFc*100)}%</text>`;
  rows.forEach((r,i)=>{
    const y=20+i*H, bw=Math.max(2,x(r.v)-LW);
    const col = r.st==='crit'?'var(--crit)':r.st==='warn'?'var(--warn)':'var(--good)';
    s+=`<text class="lbl" x="${LW-10}" y="${y+15}" text-anchor="end">${esc(r.label.length>26?r.label.slice(0,25)+'…':r.label)}</text>`;
    s+=`<rect class="bar" x="${LW}" y="${y+4}" width="${bw.toFixed(1)}" height="14" fill="${col}"/>`;
    s+=`<text class="val" x="${(LW+bw+8).toFixed(1)}" y="${y+15}">${pct(r.v)}</text>`;
    s+=`<rect class="hit" x="0" y="${y}" width="${W}" height="${H}" data-i="${i}"/>`;
  });
  s+='</svg>';
  return s;
}

/** pionowy/poziomy wykres udziału kosztów (jedna seria → sekwencyjny błękit) */
function barChartCost(rows, W){
  W = W||520;
  const H=24, LW=Math.min(170, W*0.36), RW=78;
  const h=rows.length*H+8;
  const max=Math.max(...rows.map(r=>r.cost),0.0001);
  const plotW=W-LW-RW;
  const RAMP=['#2a78d6','#3987e5','#5598e7','#6da7ec','#86b6ef','#9ec5f4','#b7d3f6','#cde2fb'];
  let s=`<svg class="chart" viewBox="0 0 ${W} ${h}" width="100%" height="${h}">`;
  const maxCh=Math.max(8, Math.floor((LW-12)/5.9));
  rows.forEach((r,i)=>{
    const y=i*H, bw=Math.max(2,(r.cost/max)*plotW);
    s+=`<text class="lbl" x="${LW-9}" y="${y+15}" text-anchor="end">${esc(r.name.length>maxCh?r.name.slice(0,maxCh-1)+'…':r.name)}</text>`;
    s+=`<rect class="bar" x="${LW}" y="${y+4}" width="${bw.toFixed(1)}" height="13" fill="${RAMP[Math.min(i,RAMP.length-1)]}"/>`;
    s+=`<text class="val" x="${(LW+bw+7).toFixed(1)}" y="${y+15}">${num(r.cost)}</text>`;
    s+=`<rect class="hit" x="0" y="${y}" width="${W}" height="${H}" data-i="${i}"/>`;
  });
  s+='</svg>';
  return s;
}

/** wykres liniowy historii ceny */
function lineChart(pts, W, Hh){
  W=W||640; Hh=Hh||190;
  if(pts.length<2) return '<div class="empty">Za mało punktów, żeby narysować wykres (potrzebne min. 2 zmiany ceny).</div>';
  const PL=52,PR=16,PT=14,PB=26;
  const xs=pts.map((p,i)=>i), ys=pts.map(p=>p.v);
  const ymin=Math.min(...ys), ymax=Math.max(...ys);
  const pad=(ymax-ymin)*0.15||Math.abs(ymax*0.1)||1;
  const lo=Math.max(0,ymin-pad), hi=ymax+pad;
  const X=i=>PL+(i/(pts.length-1))*(W-PL-PR);
  const Y=v=>PT+(1-(v-lo)/(hi-lo||1))*(Hh-PT-PB);
  let s=`<svg class="chart" viewBox="0 0 ${W} ${Hh}" width="100%" height="${Hh}">`;
  for(let k=0;k<=4;k++){ const v=lo+(hi-lo)*k/4;
    s+=`<line class="gl" x1="${PL}" y1="${Y(v).toFixed(1)}" x2="${W-PR}" y2="${Y(v).toFixed(1)}"/>
        <text x="${PL-8}" y="${(Y(v)+4).toFixed(1)}" text-anchor="end">${num(v)}</text>`; }
  const d=pts.map((p,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(p.v).toFixed(1)).join(' ');
  s+=`<path d="${d}" fill="none" stroke="var(--s1)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
  pts.forEach((p,i)=>{
    s+=`<circle cx="${X(i).toFixed(1)}" cy="${Y(p.v).toFixed(1)}" r="4" fill="var(--s1)" stroke="var(--surface)" stroke-width="2"/>`;
    if(i===0||i===pts.length-1) s+=`<text x="${X(i).toFixed(1)}" y="${Hh-8}" text-anchor="${i?'end':'start'}">${esc(p.d)}</text>`;
    s+=`<rect class="hit" x="${(X(i)-14).toFixed(1)}" y="0" width="28" height="${Hh}" data-i="${i}"/>`;
  });
  s+='</svg>';
  return s;
}

function wireChart(el, rows, fmt){
  el.querySelectorAll('.hit').forEach(h=>{
    h.addEventListener('mousemove',e=>{ const r=rows[+h.dataset.i]; if(r) showTip(fmt(r), e.clientX, e.clientY); });
    h.addEventListener('mouseleave',hideTip);
    h.addEventListener('click',()=>{ const r=rows[+h.dataset.i]; if(r&&r.go) go(r.go.v, r.go.id); });
  });
}

function go(v,id){

}

   RENDER — router
   ========================================================================== */
function render(){
  document.getElementById('cIng').textContent=active(DB.ingredients).length;
  document.getElementById('cPrep').textContent=active(DB.preps).length;
  document.getElementById('cItems').textContent=active(DB.items).length;
  document.getElementById('cSets').textContent=active(DB.sets).length;
  document.getElementById('cHist').textContent=DB.history.length||'';
  const m=document.getElementById('main');
  const navU=document.getElementById('navUsers');
  const canUsers = SRV.on && SRV.user && SRV.user.role==='owner';
  navU.classList.toggle('hidden', !canUsers);
  if(VIEW==='users' && !canUsers) VIEW='dash';
  m.innerHTML = ({dash:vDash, ing:vIng, prep:vPrep, items:vItems, sets:vSets,
                  hist:vHist, sim:vSim, users:vUsers, set:vSet})[VIEW]();
  (POST[VIEW]||[]).forEach(f=>f());
  POST[VIEW]=[];
  m.querySelectorAll('[data-go]').forEach(el=>el.addEventListener('click',()=>{
    const [v,id]=el.dataset.go.split(':'); go(v,id);
  }));
  wireArchPills(m);
  m.querySelectorAll('[data-arch-toggle]').forEach(b=>b.addEventListener('click',e=>{
    e.stopPropagation();
    const [k,id]=b.dataset.archToggle.split(':');
    if(toggleArchive(k,id)) render();
  }));
  m.querySelectorAll('[data-del-row]').forEach(b=>b.addEventListener('click',e=>{
    e.stopPropagation();
    const [k,id]=b.dataset.delRow.split(':');
    if(deleteEntity(k,id)) render();
  }));
  if(!canEdit()){
    m.querySelectorAll('[data-edit-ing],[data-del-ing],[data-edit-item],[data-edit-set],'
      +'[data-edit-prep],[data-act],#fillPack,#saveSet,#resetBtn,#supaSave,#supaLogin')
      .forEach(el=>el.style.display='none');
    const imp=m.querySelector('#impJson'); if(imp) imp.closest('.card').querySelectorAll('input[type=file]').forEach(e=>e.disabled=true);
  }
}

/* ============================================================================
   WIDOK: PULPIT
   ========================================================================== */
function vDash(){
  const prob = problems();
  const itemsPriced = active(DB.items).filter(i=>i.price);
  const fcs = itemsPriced.map(i=>CALC.itemCalc(i)).filter(c=>c.fc!=null);
  const avg = fcs.length ? fcs.reduce((s,c)=>s+c.fc,0)/fcs.length : null;
  const over = fcs.filter(c=>c.fc>DB.settings.alertFc).length;
  const noPrice = active(DB.ingredients).filter(g=>g.packPrice==null||!g.packQty).length;

  const setRows = active(DB.sets).map(s=>{ const c=CALC.setCalc(s);
    return {label:s.name, v:c.fc||0, st:CALC.status(c.fc), c, go:{v:'sets',id:s.id}}; })
    .filter(r=>r.v>0).sort((a,b)=>b.v-a.v);

  const itemRows = active(DB.items).map(i=>{ const c=CALC.itemCalc(i);
    return {label:i.name, v:c.fc||0, st:CALC.status(c.fc), c, go:{v:'items',id:i.id}}; })
    .filter(r=>r.v>0).sort((a,b)=>b.v-a.v).slice(0,12);

  after('dash',()=>{
    const a=document.getElementById('chSets'); if(a) wireChart(a,setRows,r=>
      `<b>${esc(r.label)}</b>food cost ${pct(r.v)} · koszt ${zl(r.c.net)} · cena ${zl(r.c.priceGross)}<br><span class="mut">marża ${zl(r.c.margin)} netto · ${r.c.pieces} kawałków</span>`);
    const b=document.getElementById('chItems'); if(b) wireChart(b,itemRows,r=>
      `<b>${esc(r.label)}</b>food cost ${pct(r.v)} · koszt ${zl(r.c.net)} · cena ${zl(r.c.priceGross)}`);
  });

  const alertsHtml = prob.length
    ? prob.slice(0,14).map(p=>`<div class="alert ${p.sev}" ${p.go?`data-go="${p.go.v}:${p.go.id||''}" style="cursor:pointer"`:''}>
        <div class="ic">${p.sev==='crit'?'!':p.sev==='warn'?'?':'i'}</div>
        <div class="txt"><b>${esc(p.title)}</b><br>${esc(p.msg)}</div></div>`).join('')
      + (prob.length>14?`<div class="small mut" style="padding:4px 2px">…i jeszcze ${prob.length-14}</div>`:'')
    : '<div class="empty">Brak problemów. Wszystkie pozycje mieszczą się w progach.</div>';

  return `
  <div class="topbar"><h1>Pulpit</h1><span class="sub">stan na ${todayISO()}</span><div class="spacer"></div>
    <button class="btn sm" data-act="addItem">+ Rolka</button>
    <button class="btn sm pri" data-act="addSet">+ Zestaw</button></div>

  ${STORAGE_OK?'':'<div class="banner">Przeglądarka blokuje zapis lokalny w tym trybie. Zmiany są tylko w pamięci karty — <b>eksportuj plik JSON</b> w Ustawieniach albo podłącz Supabase, żeby ich nie stracić.</div>'}

  <div class="tiles">
    <div class="tile"><div class="lab">Rolek w menu</div><div class="val num">${active(DB.items).length}</div>
      <div class="note">${active(DB.sets).length} zestawów · ${active(DB.ingredients).length} składników</div></div>
    <div class="tile"><div class="lab">Średni food cost</div>
      <div class="val num" style="color:${avg==null?'var(--muted)':avg>DB.settings.alertFc?'var(--crit-ink)':avg>DB.settings.targetFc?'var(--warn-ink)':'var(--good-ink)'}">${pct(avg)}</div>
      <div class="note">cel ${pct(DB.settings.targetFc,0)} · alert ${pct(DB.settings.alertFc,0)}</div></div>
    <div class="tile"><div class="lab">Powyżej progu</div><div class="val num" style="color:${over?'var(--crit-ink)':'var(--good-ink)'}">${over}</div>
      <div class="note">pozycji z food cost > ${pct(DB.settings.alertFc,0)}</div></div>
    <div class="tile"><div class="lab">Braki w danych</div><div class="val num" style="color:${noPrice?'var(--warn-ink)':'var(--good-ink)'}">${noPrice}</div>
      <div class="note">składników bez ceny zakupu</div></div>
  </div>

  <div class="split" style="margin-top:12px">
    <div class="grid">
      <div class="card"><h2>Food cost zestawów</h2>
        <div class="hint">Kliknij słupek, żeby otworzyć zestaw. Przerywana linia to cel ${pct(DB.settings.targetFc,0)}.</div>
        <div id="chSets">${setRows.length?barChartFc(setRows):'<div class="empty">Brak zestawów z ceną.</div>'}</div>
        <div class="legend"><span><i style="background:var(--good)"></i>w celu</span><span><i style="background:var(--warn)"></i>powyżej celu</span><span><i style="background:var(--crit)"></i>powyżej alertu</span></div>
      </div>
      <div class="card"><h2>Rolki o najwyższym food cost</h2>
        <div class="hint">12 rolek z najgorszym stosunkiem kosztu do ceny.</div>
        <div id="chItems">${itemRows.length?barChartFc(itemRows):'<div class="empty">Brak pozycji z ceną.</div>'}</div>
      </div>
    </div>
    <div class="card"><h2>Do sprawdzenia</h2><div class="hint">${prob.length} pozycji wymaga uwagi</div>${alertsHtml}</div>
  </div>`;
}

let ingFilter={q:'',cat:''};
function vIng(){
  const cats=[...new Set(DB.ingredients.map(g=>g.cat))].sort();
  const list=archFilter(DB.ingredients,'ing').filter(g=>
    (!ingFilter.cat||g.cat===ingFilter.cat) &&
    (!ingFilter.q||g.name.toLowerCase().includes(ingFilter.q.toLowerCase())));

  after('ing',()=>{
    const q=document.getElementById('ingQ');
    q.addEventListener('input',()=>{ingFilter.q=q.value; const s=q.selectionStart; render(); const n=document.getElementById('ingQ'); n.focus(); n.setSelectionRange(s,s);});
    document.getElementById('ingCat').addEventListener('change',e=>{ingFilter.cat=e.target.value;render();});
    document.querySelectorAll('[data-edit-ing]').forEach(b=>b.addEventListener('click',()=>editIng(b.dataset.editIng)));
    document.querySelector('[data-act="addIng"]').addEventListener('click',()=>editIng(null));

  const rows=list.map(g=>{

      <td><span class="tag">${esc(g.cat)}</span>${g.role?` <span class="tag good">${g.role==='tray'?'tacka':g.role==='chopsticks'?'pałeczki':'sos'}</span>`:''}</td>

      <td>${esc(g.unit)}</td>
      <td class="r num">${g.packPrice!=null?zl(g.packPrice):'<span class="tag crit">brak</span>'}</td>
      <td class="r num"><b>${uc!=null?num(uc,4):'—'}</b></td>

  return `

    <button class="btn pri" data-act="addIng">+ Składnik</button></div>

    <input id="ingQ" type="search" placeholder="Szukaj składnika…" value="${esc(ingFilter.q)}" style="max-width:280px">
    <select id="ingCat" style="max-width:200px"><option value="">Wszystkie kategorie</option>
      ${cats.map(c=>`<option ${ingFilter.cat===c?'selected':''}>${esc(c)}</option>`).join('')}</select>
    ${archPills('ing')}
    <span class="mut small">${list.length} wyników</span>
  </div></div>
  <div class="tw"><table><thead><tr>
    <th>Nazwa</th><th>Kategoria</th><th class="r">Ilość w op.</th><th>j.m.</th>
    <th class="r">Cena opak.</th><th class="r">Cena / j.m.</th><th class="r">Użyć</th><th class="r">Akcje</th>
  </tr></thead><tbody>${rows||'<tr><td colspan="8" class="empty">Brak wyników</td></tr>'}</tbody></table></div>`;
}

function editIng(id){
  const g = id ? clone(CALC.ing(id)) : {id:uid('ing'),name:'',cat:'Inne',unit:'g',packQty:1000,packPrice:null,role:null};
  const cats=[...new Set(DB.ingredients.map(x=>x.cat))].sort();
  const oldPrice = g.packPrice;
  openDlg(id?'Edytuj składnik':'Nowy składnik', `
    <div class="grid" style="grid-template-columns:1fr 1fr">
      <div style="grid-column:1/-1"><label class="f">Nazwa</label><input id="fName" type="text" value="${esc(g.name)}"></div>
      <div><label class="f">Kategoria</label><input id="fCat" type="text" list="catList" value="${esc(g.cat)}">
        <datalist id="catList">${cats.map(c=>`<option>${esc(c)}</option>`).join('')}</datalist></div>
      <div><label class="f">Jednostka</label><input id="fUnit" type="text" list="unitList" value="${esc(g.unit)}">
        <datalist id="unitList"><option>g</option><option>ml</option><option>szt.</option><option>l</option><option>kg</option><option>liść</option><option>gał.</option></datalist></div>
      <div><label class="f">Ilość w opakowaniu</label><input id="fQty" type="number" step="any" value="${g.packQty??''}"></div>
      <div><label class="f">Cena opakowania (netto)</label><input id="fPrice" type="number" step="any" value="${g.packPrice??''}"></div>
      <div style="grid-column:1/-1"><label class="f">Rola w opakowaniu zestawu</label>
        <select id="fRole">
          <option value="" ${!g.role?'selected':''}>— zwykły składnik —</option>
          <option value="tray" ${g.role==='tray'?'selected':''}>Tacka</option>
          <option value="chopsticks" ${g.role==='chopsticks'?'selected':''}>Pałeczki</option>
          <option value="sauce" ${g.role==='sauce'?'selected':''}>Sos w saszetce</option>
        </select>
        <div class="small mut" style="margin-top:5px">Składniki z rolą pojawiają się w listach wyboru w edytorze zestawu.</div></div>
      <div style="grid-column:1/-1" class="card" style="background:var(--surface-2);border:0">
        <div class="kv"><span>Cena za jednostkę</span><b id="fCalc">—</b></div>
        <div class="kv"><span>Używany w pozycjach</span><b>${id?CALC.usedBy(id).length:0}</b></div>
      </div>
      ${id?'<div style="grid-column:1/-1"><label class="f">Notatka do zmiany ceny (opcjonalnie)</label><input id="fNote" type="text" placeholder="np. nowy cennik dostawcy, faktura FV/12/2026"></div>':''}
    </div>`,
    [ ...(id?[{label:'Zamień wszędzie…', fn:()=>{ replaceDialog(id); return false; }}]:[]),
      ...(id?[archBtn('ing', g)]:[]),
      {label:'Anuluj',cls:''},{label:'Zapisz',cls:'pri',fn:()=>{
      const nv = {
        name:val('fName').trim(), cat:val('fCat').trim()||'Inne', unit:val('fUnit').trim()||'szt.',
        packQty:numOrNull('fQty'), packPrice:numOrNull('fPrice'), role:val('fRole')||null
      };
      if(!nv.name){ alert('Podaj nazwę składnika.'); return false; }
      Object.assign(g,nv);
      if(id){
        const idx=DB.ingredients.findIndex(x=>x.id===id);
        DB.ingredients[idx]=g;
        if(oldPrice!==g.packPrice){
          DB.history.push({id:uid('h'), ingId:g.id, date:todayISO(), from:oldPrice, to:g.packPrice,
                           qty:g.packQty, note:(document.getElementById('fNote')||{}).value||''});
        }
      } else DB.ingredients.push(g);
      save(); render();
    }}],
    ()=>{
      const upd=()=>{ const q=numOrNull('fQty'), p=numOrNull('fPrice');
        document.getElementById('fCalc').textContent = (q&&p!=null)? num(p/q,4)+' '+DB.settings.currency+' / '+val('fUnit') : '—'; };
      ['fQty','fPrice','fUnit'].forEach(i=>document.getElementById(i).addEventListener('input',upd)); upd();
    });
}

      <div class="kv"><span><b>Koszt jednostkowy</b></span>
        <b style="color:var(--s1)">${uc!=null?num(uc,4)+' '+DB.settings.currency+'/'+p.yieldUnit:'—'}</b></div>

    Aplikacja liczy jego koszt za jednostkę i podstawia go automatycznie do receptur. <b>Dzięki temu ryż liczy się po cenie ryżu ugotowanego, a nie suchego.</b></div>

function editPrep(id){
  const p = id ? clone(CALC.prep(id)) : {id:uid('prep'),name:'',yieldQty:1000,yieldUnit:'g',note:'',items:[]};
  const draw=()=>{
    const body=document.getElementById('prepComps');
    body.innerHTML = p.items.map((c,i)=>{
      const info = c.kind==='raw' ? {name:c.name,unit:c.unit,unitCost:c.unitCost} : CALC.compInfo(c.refId);
      return `<div class="compline">
        <div>${esc(info.name)} ${c.kind==='raw'?'<span class="tag">poza bazą</span>':''}</div>
        <input type="number" step="any" value="${c.qty??''}" data-q="${i}">
        <span class="mut small">${esc(info.unit||'')}</span>
        <span class="cost">${zl((c.qty||0)*(info.unitCost||0))}</span>
        <button type="button" class="btn sm danger" data-rm="${i}">✕</button></div>`;
    }).join('') || '<div class="empty" style="padding:16px">Brak składników</div>';
    body.querySelectorAll('[data-q]').forEach(inp=>inp.addEventListener('input',()=>{ p.items[+inp.dataset.q].qty=parseFloat(inp.value)||0; drawTot(); }));
    body.querySelectorAll('[data-rm]').forEach(b=>b.addEventListener('click',()=>{ p.items.splice(+b.dataset.rm,1); draw(); }));
    drawTot();
  };
  const drawTot=()=>{
    let tot=0;
    p.items.forEach(c=>{ const info=c.kind==='raw'?{unitCost:c.unitCost}:CALC.compInfo(c.refId); tot+=(c.qty||0)*(info.unitCost||0); });
    const y=numOrNull('pYield')||1;
    document.getElementById('pTot').textContent=zl(tot);
    document.getElementById('pUnit').textContent=num(tot/y,4)+' '+DB.settings.currency+'/'+val('pYUnit');
    // odśwież koszty w liniach
    document.querySelectorAll('#prepComps .compline').forEach((el,i)=>{
      const c=p.items[i]; const info=c.kind==='raw'?{unitCost:c.unitCost}:CALC.compInfo(c.refId);
      el.querySelector('.cost').textContent=zl((c.qty||0)*(info.unitCost||0));
    });
  };
  openDlg(id?'Edytuj półprodukt':'Nowy półprodukt',`
    <div class="grid" style="grid-template-columns:2fr 1fr 1fr">
      <div><label class="f">Nazwa</label><input id="pName" type="text" value="${esc(p.name)}"></div>
      <div><label class="f">Wydajność</label><input id="pYield" type="number" step="any" value="${p.yieldQty}"></div>
      <div><label class="f">Jednostka</label><input id="pYUnit" type="text" value="${esc(p.yieldUnit)}"></div>
      <div style="grid-column:1/-1"><label class="f">Notatka</label><input id="pNote" type="text" value="${esc(p.note||'')}"></div>
    </div>
    <h3 style="margin:16px 0 8px">Składniki</h3>
    <div id="prepComps"></div>
    <div class="row" style="margin-top:8px"><select id="pAdd" style="max-width:280px"></select>
      <button type="button" class="btn sm" id="pAddBtn">+ Dodaj</button></div>
    <div class="card" style="background:var(--surface-2);border:0;margin-top:14px">
      <div class="kv"><span>Koszt całej partii</span><b id="pTot">—</b></div>
      <div class="kv"><span>Koszt jednostkowy</span><b id="pUnit" style="color:var(--s1)">—</b></div>
    </div>`,
    [ ...(id?[{label:'Zamień wszędzie…', fn:()=>{ replaceDialog(id); return false; }}]:[]),
      ...(id?[archBtn('prep', p)]:[]),
      {label:'Anuluj'},{label:'Zapisz',cls:'pri',fn:()=>{
      p.name=val('pName').trim(); p.yieldQty=numOrNull('pYield')||1; p.yieldUnit=val('pYUnit').trim()||'g'; p.note=val('pNote');
      if(!p.name){ alert('Podaj nazwę.'); return false; }
      if(id){ const i=DB.preps.findIndex(x=>x.id===id); DB.preps[i]=p; } else DB.preps.push(p);
      save(); render();
    }}],
    ()=>{
      const sel=document.getElementById('pAdd');
      const inUseP = new Set(p.items.map(c=>c.refId));
      const pickP = x=>!x.archived || inUseP.has(x.id);
      sel.innerHTML = DB.ingredients.filter(pickP).map(g=>`<option value="ing:${g.id}">${esc(g.name)} (${esc(g.cat)})</option>`).join('')
        + DB.preps.filter(x=>x.id!==p.id).filter(pickP).map(x=>`<option value="prep:${x.id}">◍ ${esc(x.name)}</option>`).join('');
      document.getElementById('pAddBtn').addEventListener('click',()=>{
        const [k,rid]=sel.value.split(':'); p.items.push({kind:k,refId:rid,qty:0}); draw();
      });
      ['pYield','pYUnit'].forEach(i=>document.getElementById(i).addEventListener('input',drawTot));
      draw();
    });
}

      ${sel.photo?`<img class="hero" src="${sel.photo}" alt="${esc(sel.name)}">`:''}
      <div class="tiles" style="grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px">
        <div class="tile" style="padding:10px 12px"><div class="lab">Food cost</div>

        <div class="tile" style="padding:10px 12px"><div class="lab">Marża netto</div>
          <div class="val num" style="font-size:22px">${c.margin!=null?zl(c.margin):'—'}</div></div>
      </div>
      <div class="kv"><span>Koszt składników (netto)</span><b>${zl(c.net)}</b></div>
      <div class="kv"><span>Koszt 1 kawałka</span><b>${zl(c.perPiece)}</b></div>
      <div class="kv"><span>Cena sprzedaży (brutto)</span><b>${c.priceGross?zl(c.priceGross):'—'}</b></div>

      <div class="kv"><span>Cena 1 kawałka</span><b>${c.priceGross?zl(c.pricePerPiece):'—'}</b></div>
      <div class="kv"><span>Sugerowana cena przy ${pct(DB.settings.targetFc,0)}</span>
        <b style="color:var(--s1)">${c.suggested?zl(c.suggested):'—'}</b></div>
      ${c.missing.length?`<div class="alert crit" style="margin-top:12px"><div class="ic">!</div><div class="txt">Brak ceny: <b>${esc(c.missing.join(', '))}</b>. Koszt jest zaniżony.</div></div>`:''}

function editItem(id){
  const it = id ? clone(CALC.item(id)) : {id:uid('it'),name:'',cat:'',pieces:8,vat:DB.settings.vat,price:null,comps:[],photo:null};
  const draw=()=>{
    const body=document.getElementById('itComps');
    body.innerHTML = it.comps.map((c,i)=>{
      const info=CALC.compInfo(c.refId);
      return `<div class="compline">
        <div>${info.kind==='prep'?'◍ ':''}${esc(info.name)}${info.unitCost==null?' <span class="tag crit">brak ceny</span>':''}</div>
        <input type="number" step="any" value="${c.qty??''}" data-q="${i}">
        <span class="mut small">${esc(info.unit||'')}</span>
        <span class="cost">${zl((c.qty||0)*(info.unitCost||0))}</span>
        <button type="button" class="btn sm danger" data-rm="${i}">✕</button></div>`;
    }).join('') || '<div class="empty" style="padding:16px">Brak składników — dodaj poniżej</div>';
    body.querySelectorAll('[data-q]').forEach(inp=>inp.addEventListener('input',()=>{ it.comps[+inp.dataset.q].qty=parseFloat(inp.value)||0; recalc(); }));
    body.querySelectorAll('[data-rm]').forEach(b=>b.addEventListener('click',()=>{ it.comps.splice(+b.dataset.rm,1); draw(); }));
    recalc();
  };
  const recalc=()=>{
    it.pieces=numOrNull('iPieces')||1; it.price=numOrNull('iPrice'); it.vat=(numOrNull('iVat')??8)/100;
    const c=CALC.itemCalc(it);
    document.querySelectorAll('#itComps .compline').forEach((el,i)=>{
      const info=CALC.compInfo(it.comps[i].refId);
      el.querySelector('.cost').textContent=zl((it.comps[i].qty||0)*(info.unitCost||0));
    });
    document.getElementById('iNet').textContent=zl(c.net);
    document.getElementById('iPer').textContent=zl(c.perPiece);
    document.getElementById('iFc').textContent=pct(c.fc);
    document.getElementById('iFc').style.color = c.fc==null?'':CALC.status(c.fc)==='crit'?'var(--crit-ink)':CALC.status(c.fc)==='warn'?'var(--warn-ink)':'var(--good-ink)';
    document.getElementById('iMar').textContent=c.margin!=null?zl(c.margin):'—';
    document.getElementById('iSug').textContent=c.suggested?zl(c.suggested):'—';
  };
  openDlg(id?'Edytuj rolkę':'Nowa rolka',`
    <div class="grid" style="grid-template-columns:2fr 1fr 1fr 1fr">
      <div><label class="f">Nazwa</label><input id="iName" type="text" value="${esc(it.name)}"></div>
      <div><label class="f">Liczba kawałków</label><input id="iPieces" type="number" step="1" value="${it.pieces}"></div>

    </div>
    <div style="margin-top:14px">${photoField('iPhoto','iPhotoIn','Zdjęcie rolki')}</div>
    <h3 style="margin:16px 0 8px">Receptura</h3>
    <div id="itComps"></div>
    <div class="row" style="margin-top:8px"><select id="iAdd" style="max-width:300px"></select>
      <button type="button" class="btn sm" id="iAddBtn">+ Dodaj składnik</button></div>
    <div class="card" style="background:var(--surface-2);border:0;margin-top:14px">
      <div class="kv"><span>Koszt netto</span><b id="iNet">—</b></div>
      <div class="kv"><span>Koszt 1 kawałka</span><b id="iPer">—</b></div>
      <div class="kv"><span>Food cost</span><b id="iFc">—</b></div>
      <div class="kv"><span>Marża netto</span><b id="iMar">—</b></div>
      <div class="kv"><span>Sugerowana cena przy ${pct(DB.settings.targetFc,0)}</span><b id="iSug" style="color:var(--s1)">—</b></div>
    </div>`,
    [ ...(id?[archBtn('items', it)]:[]),
      ...(id?[{label:'Usuń',cls:'danger',fn:()=>{ if(!deleteEntity('items', id)) return false; render(); }}]:[]),
      {label:'Anuluj'},
      {label:'Zapisz',cls:'pri',fn:()=>{
        it.name=val('iName').trim(); recalc();
        if(!it.name){ alert('Podaj nazwę.'); return false; }
        if(id){ const i=DB.items.findIndex(x=>x.id===id); DB.items[i]=it; } else { DB.items.push(it); SEL.item=it.id; }
        save(); render();
      }}],
    ()=>{
      const sel=document.getElementById('iAdd');
      const inUse = new Set(it.comps.map(c=>c.refId));
      const pick = x=>!x.archived || inUse.has(x.id);
      sel.innerHTML = DB.preps.filter(pick).map(p=>`<option value="${p.id}">◍ ${esc(p.name)}</option>`).join('')
        + DB.ingredients.filter(pick).map(g=>`<option value="${g.id}">${esc(g.name)} — ${esc(g.cat)}</option>`).join('');
      document.getElementById('iAddBtn').addEventListener('click',()=>{ it.comps.push({refId:sel.value,qty:0}); draw(); });
      ['iPieces','iPrice','iVat'].forEach(i=>document.getElementById(i).addEventListener('input',recalc));
      wirePhoto('iPhoto','iPhotoIn',it);
      draw();
    });
}

function setBreakRows(c){
  return c.parts.map(p=>({name:p.name,cost:p.cost}))
    .concat(c.pack.rows.map(r=>({name:r.label+': '+r.name, cost:r.cost})))
    .concat(c.extra.rows.map(r=>({name:r.name,cost:r.cost})))
    .filter(r=>r.cost>0).sort((a,b)=>b.cost-a.cost);
}
/** proponuje domyślne opakowanie: najtańsza tacka, pałeczki, sos */
function defaultPack(){
  const pick = role => {
    const c = DB.ingredients.filter(g=>g.role===role);
    if(!c.length) return null;
    const priced = c.filter(g=>CALC.ingUnitCost(g.id)!=null);
    return (priced.length?priced:c)[0].id;
  };
  return {trayId:pick('tray'), chopId:pick('chopsticks'), sauceId:pick('sauce')};
}

function vSets(){
  const sel = SEL.set ? CALC.set(SEL.set) : null;
  const noPack = active(DB.sets).filter(s=>!CALC.packRows(s).rows.length);
  const anySetPhoto = DB.sets.some(s=>s.photo);
  after('sets',()=>{
    const fp=document.getElementById('fillPack');
    if(fp) fp.addEventListener('click',()=>{
      const d=defaultPack();
      if(!d.trayId&&!d.chopId&&!d.sauceId){ alert('Najpierw oznacz w zakładce Składniki, które pozycje są tacką, pałeczkami i sosem (pole „Rola w opakowaniu”).'); return; }
      const names=['tray','chopsticks','sauce'].map(r=>{const g=DB.ingredients.find(x=>x.id===d[r==='tray'?'trayId':r==='chopsticks'?'chopId':'sauceId']); return g?g.name:'—';});
      if(!confirm('Ustawić we wszystkich '+noPack.length+' zestawach bez opakowania:\n\n'
        +'• tacka: '+names[0]+' × 1\n• pałeczki: '+names[1]+' × 2\n• sos: '+names[2]+' × 2\n\n'
        +'Ilości i rodzaje poprawisz potem w każdym zestawie osobno.')) return;
      noPack.forEach(st=>{ st.pack = {trayId:d.trayId, trayQty:1, chopId:d.chopId, chopQty:2, sauceId:d.sauceId, sauceQty:2}; });
      save(); render();
    });
    document.querySelectorAll('[data-pick-set]').forEach(r=>r.addEventListener('click',e=>{
      if(e.target.closest('button'))return; SEL.set=r.dataset.pickSet; render(); }));
    document.querySelector('[data-act="addSet2"]').addEventListener('click',()=>editSet(null));
    document.querySelectorAll('[data-edit-set]').forEach(b=>b.addEventListener('click',()=>editSet(b.dataset.editSet)));
    if(sel){ const c=CALC.setCalc(sel);
      const el=document.getElementById('chSetBreak'); if(el) wireChart(el,setBreakRows(c),r=>`<b>${esc(r.name)}</b>${zl(r.cost)} · ${pct(r.cost/c.net)} kosztu zestawu`);
    }
  });
  const rows=archFilter(DB.sets,'sets').map(s=>{
    const c=CALC.setCalc(s), st=CALC.status(c.fc);
    return `<tr data-pick-set="${s.id}" style="cursor:pointer" class="${SEL.set===s.id?'sel':''} ${s.archived?'arch':''}">
      <td><div class="namecell">${thumb(s.photo,s.name,anySetPhoto)}<span><b>${esc(s.name)}</b>${s.archived?' <span class="tag">archiwum</span>':''}${c.missing.length?' <span class="tag crit">braki</span>':''}</span></div></td>
      <td class="r num">${c.pieces}</td>
      <td class="r num">${zl(c.net)}</td>
      <td class="r num ${c.packaging?'':'mut'}">${c.packaging?zl(c.packaging):'<span class="tag warn">brak</span>'}</td>
      <td class="r num">${s.price?zl(c.priceGross):'—'}</td>
      <td class="r"><span class="tag ${st==='none'?'':st}">${pct(c.fc)}</span></td>
      <td class="r num">${c.margin!=null?zl(c.margin):'—'}</td>
      <td class="r num mut">${c.discount!=null?pct(c.discount,0):'—'}</td>
      <td class="r" style="white-space:nowrap">${rowActions('sets', s)}</td></tr>`;
  }).join('');

  let detail='<div class="card"><div class="empty">Wybierz zestaw, żeby zobaczyć jego skład i rentowność.</div></div>';
  if(sel){
    const c=CALC.setCalc(sel);
    detail=`<div class="card">
      <div class="row" style="justify-content:space-between"><h2>${esc(sel.name)}</h2>
        <button class="btn sm pri" data-edit-set="${sel.id}">Edytuj</button></div>
      <div class="hint">${c.pieces} kawałków · ${c.parts.length} rolek</div>
      ${sel.photo?`<img class="hero" src="${sel.photo}" alt="${esc(sel.name)}">`:''}
      <div class="tiles" style="grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px">
        <div class="tile" style="padding:10px 12px"><div class="lab">Food cost</div>
          <div class="val num" style="font-size:22px;color:${c.fc==null?'var(--muted)':CALC.status(c.fc)==='crit'?'var(--crit-ink)':CALC.status(c.fc)==='warn'?'var(--warn-ink)':'var(--good-ink)'}">${pct(c.fc)}</div></div>
        <div class="tile" style="padding:10px 12px"><div class="lab">Marża netto</div>
          <div class="val num" style="font-size:22px">${c.margin!=null?zl(c.margin):'—'}</div></div>
      </div>
      ${c.parts.map(p=>`<div class="kv"><span>${esc(p.name)} <span class="mut">× ${p.pieces} kaw.</span></span><b>${zl(p.cost)}</b></div>`).join('')}
      ${c.pack.rows.length?`<div class="kv" style="border-top:1px solid var(--grid);margin-top:6px;padding-top:9px">
          <span class="mut small">OPAKOWANIE</span><b class="mut">${zl(c.pack.total)}</b></div>`:''}
      ${c.pack.rows.map(r=>`<div class="kv"><span>${esc(r.label)}: ${esc(r.name)} <span class="mut">× ${num(r.qty,r.qty%1?2:0)}</span></span><b>${zl(r.cost)}</b></div>`).join('')}
      ${c.extra.rows.map(r=>`<div class="kv"><span>${esc(r.name)} <span class="mut">${num(r.qty,r.qty%1?2:0)} ${esc(r.unit||'')}</span></span><b>${zl(r.cost)}</b></div>`).join('')}
      ${!c.pack.rows.length?`<div class="alert warn" style="margin-top:10px"><div class="ic">?</div>
        <div class="txt">Ten zestaw nie ma policzonej <b>tacki, pałeczek ani sosu</b> — food cost jest zaniżony.</div></div>`:''}
      <div class="kv" style="border-top:1px solid var(--axis);padding-top:9px"><span><b>Koszt razem</b></span><b>${zl(c.net)}</b></div>
      <div class="kv"><span>Cena brutto / netto</span><b>${zl(c.priceGross)} / ${zl(c.priceNet)}</b></div>
      <div class="kv"><span>Suma cen à la carte</span><b>${zl(c.alaCarte)}</b></div>
      <div class="kv"><span>Rabat zestawu</span><b>${c.discount!=null?pct(c.discount,1):'—'}</b></div>
      <div class="kv"><span>Koszt 1 kawałka</span><b>${zl(c.perPiece)}</b></div>
      <div class="kv"><span>Sugerowana cena przy ${pct(DB.settings.targetFc,0)}</span><b style="color:var(--s1)">${c.suggested?zl(c.suggested):'—'}</b></div>
      ${c.missing.length?`<div class="alert crit" style="margin-top:12px"><div class="ic">!</div><div class="txt">Brakujące dane: <b>${esc(c.missing.join(', '))}</b></div></div>`:''}
      <h3 style="margin:16px 0 6px">Co kosztuje najwięcej</h3>
      <div id="chSetBreak">${setBreakRows(c).length?barChartCost(setBreakRows(c),330):'<div class="empty">Brak pozycji</div>'}</div>
    </div>`;
  }
  return `<div class="topbar"><h1>Zestawy</h1><span class="sub">${active(DB.sets).length} aktywnych</span><div class="spacer"></div>
    ${archPills('sets')}
    <button class="btn pri" data-act="addSet2">+ Zestaw</button></div>
  ${noPack.length?`<div class="banner"><b>${noPack.length} z ${DB.sets.length} zestawów nie ma policzonego opakowania.</b>
    Tacka, pałeczki i sos potrafią dołożyć kilkanaście punktów procentowych food costu — najmocniej przy tanich zestawach.
    <div style="margin-top:9px"><button class="btn sm pri" id="fillPack">Uzupełnij opakowanie we wszystkich zestawach</button></div></div>`:''}
  <div class="split">
    <div class="tw"><table><thead><tr><th>Zestaw</th><th class="r">Kaw.</th><th class="r">Koszt</th>
      <th class="r">Opak.</th><th class="r">Cena</th><th class="r">Food cost</th><th class="r">Marża</th><th class="r">Rabat</th><th class="r">Akcje</th>
      </tr></thead><tbody>${rows||'<tr><td colspan="9" class="empty">Brak zestawów</td></tr>'}</tbody></table></div>
    ${detail}
  </div>`;
}

function editSet(id){
  const st = id ? clone(CALC.set(id)) : {id:uid('set'),name:'',vat:DB.settings.vat,price:null,entries:[],comps:[],photo:null};
  st.comps = st.comps||[];
  st.pack = Object.assign({trayId:null,trayQty:1,chopId:null,chopQty:2,sauceId:null,sauceQty:2}, st.pack||{});
  const draw=()=>{
    const b1=document.getElementById('setEntries');
    b1.innerHTML = st.entries.map((e,i)=>{
      const it=CALC.item(e.itemId);
      const per = it? CALC.itemCalc(it).perPiece : 0;
      return `<div class="compline">
        <div>${it?esc(it.name):'<span class="tag crit">brak pozycji '+esc(e.itemId)+'</span>'}</div>
        <input type="number" step="1" value="${e.pieces??''}" data-e="${i}">
        <span class="mut small">kaw.</span>
        <span class="cost">${zl(per*(e.pieces||0))}</span>
        <button type="button" class="btn sm danger" data-rme="${i}">✕</button></div>`;
    }).join('') || '<div class="empty" style="padding:14px">Brak pozycji</div>';
    b1.querySelectorAll('[data-e]').forEach(inp=>inp.addEventListener('input',()=>{ st.entries[+inp.dataset.e].pieces=parseInt(inp.value)||0; recalc(); }));
    b1.querySelectorAll('[data-rme]').forEach(x=>x.addEventListener('click',()=>{ st.entries.splice(+x.dataset.rme,1); draw(); }));

    const b2=document.getElementById('setComps');
    b2.innerHTML = st.comps.map((c,i)=>{
      const info=CALC.compInfo(c.refId);
      return `<div class="compline">
        <div>${esc(info.name)}${info.unitCost==null?' <span class="tag crit">brak ceny</span>':''}</div>
        <input type="number" step="any" value="${c.qty??''}" data-c="${i}">
        <span class="mut small">${esc(info.unit||'')}</span>
        <span class="cost">${zl((c.qty||0)*(info.unitCost||0))}</span>
        <button type="button" class="btn sm danger" data-rmc="${i}">✕</button></div>`;
    }).join('') || '<div class="empty" style="padding:14px">Brak dodatków</div>';
    b2.querySelectorAll('[data-c]').forEach(inp=>inp.addEventListener('input',()=>{ st.comps[+inp.dataset.c].qty=parseFloat(inp.value)||0; recalc(); }));
    b2.querySelectorAll('[data-rmc]').forEach(x=>x.addEventListener('click',()=>{ st.comps.splice(+x.dataset.rmc,1); draw(); }));
    recalc();
  };
  const recalc=()=>{
    st.price=numOrNull('sPrice'); st.vat=(numOrNull('sVat')??8)/100;
    st.pack={
      trayId: val('pTray')||null,  trayQty: numOrNull('pTrayQ')||0,
      chopId: val('pChop')||null,  chopQty: numOrNull('pChopQ')||0,
      sauceId:val('pSauce')||null, sauceQty:numOrNull('pSauceQ')||0,
    };
    const c=CALC.setCalc(st);
    const cell=(k,id)=>{ const r=c.pack.rows.find(x=>x.key===k); const e=document.getElementById(id);
      if(e) e.textContent = r ? (r.unitCost==null?'brak ceny':zl(r.cost)) : '—'; };
    cell('tray','pTrayC'); cell('chop','pChopC'); cell('sauce','pSauceC');
    document.getElementById('pPackTot').textContent = zl(c.pack.total + c.extra.total);
    document.querySelectorAll('#setEntries .compline').forEach((el,i)=>{
      const it=CALC.item(st.entries[i].itemId); const per=it?CALC.itemCalc(it).perPiece:0;
      el.querySelector('.cost').textContent=zl(per*(st.entries[i].pieces||0)); });
    document.querySelectorAll('#setComps .compline').forEach((el,i)=>{
      const info=CALC.compInfo(st.comps[i].refId);
      el.querySelector('.cost').textContent=zl((st.comps[i].qty||0)*(info.unitCost||0)); });
    document.getElementById('sNet').textContent=zl(c.net);
    document.getElementById('sPieces').textContent=c.pieces+' kaw.';
    document.getElementById('sFc').textContent=pct(c.fc);
    document.getElementById('sFc').style.color=c.fc==null?'':CALC.status(c.fc)==='crit'?'var(--crit-ink)':CALC.status(c.fc)==='warn'?'var(--warn-ink)':'var(--good-ink)';
    document.getElementById('sMar').textContent=c.margin!=null?zl(c.margin):'—';
    document.getElementById('sSug').textContent=c.suggested?zl(c.suggested):'—';
    document.getElementById('sAla').textContent=zl(c.alaCarte)+(c.discount!=null?' (rabat '+pct(c.discount,0)+')':'');
  };
  openDlg(id?'Edytuj zestaw':'Nowy zestaw',`
    <div class="grid" style="grid-template-columns:2fr 1fr 1fr">
      <div><label class="f">Nazwa</label><input id="sName" type="text" value="${esc(st.name)}"></div>
      <div><label class="f">Cena brutto</label><input id="sPrice" type="number" step="any" value="${st.price??''}"></div>
      <div><label class="f">VAT %</label><input id="sVat" type="number" step="any" value="${Math.round((st.vat??DB.settings.vat)*100)}"></div>
    </div>
    <div style="margin-top:14px">${photoField('sPhoto','sPhotoIn','Zdjęcie zestawu')}</div>
    <h3 style="margin:16px 0 8px">Rolki w zestawie</h3>
    <div id="setEntries"></div>
    <div class="row" style="margin-top:8px"><select id="sAdd" style="max-width:300px"></select>
      <input id="sAddQty" type="number" value="8" style="max-width:80px">
      <button type="button" class="btn sm" id="sAddBtn">+ Dodaj</button></div>
    <h3 style="margin:18px 0 8px">Opakowanie zestawu</h3>
    <div class="hint" style="margin-bottom:10px">To, co wychodzi z zestawem do klienta. Ceny tacek i pałeczek uzupełnisz w zakładce Składniki.</div>
    <div class="packgrid">
      <div><label class="f">Rodzaj tacki</label><select id="pTray"></select></div>
      <div><label class="f">Ilość</label><input id="pTrayQ" type="number" step="1" min="0" value="${st.pack.trayQty??1}"></div>
      <div style="text-align:right;padding-bottom:8px"><span class="mut small" id="pTrayC">—</span></div>

      <div><label class="f">Pałeczki</label><select id="pChop"></select></div>
      <div><label class="f">Ilość par</label><input id="pChopQ" type="number" step="1" min="0" value="${st.pack.chopQty??2}"></div>
      <div style="text-align:right;padding-bottom:8px"><span class="mut small" id="pChopC">—</span></div>

      <div><label class="f">Sos w saszetce</label><select id="pSauce"></select></div>
      <div><label class="f">Ilość saszetek</label><input id="pSauceQ" type="number" step="1" min="0" value="${st.pack.sauceQty??2}"></div>
      <div style="text-align:right;padding-bottom:8px"><span class="mut small" id="pSauceC">—</span></div>
    </div>
    <div class="kv" style="margin-top:4px"><span class="small mut">Koszt opakowania</span><b id="pPackTot">—</b></div>

    <h3 style="margin:18px 0 8px">Inne dodatki</h3>
    <div class="hint" style="margin-bottom:8px">Wasabi, imbir, opłata SUP, serwetki — cokolwiek jeszcze dokładasz do zestawu.</div>
    <div id="setComps"></div>
    <div class="row" style="margin-top:8px"><select id="sAddC" style="max-width:300px"></select>
      <input id="sAddCQty" type="number" value="1" step="any" style="max-width:80px">
      <button type="button" class="btn sm" id="sAddCBtn">+ Dodaj</button></div>
    <div class="card" style="background:var(--surface-2);border:0;margin-top:14px">
      <div class="kv"><span>Koszt zestawu</span><b id="sNet">—</b></div>
      <div class="kv"><span>Kawałków</span><b id="sPieces">—</b></div>
      <div class="kv"><span>Food cost</span><b id="sFc">—</b></div>
      <div class="kv"><span>Marża netto</span><b id="sMar">—</b></div>
      <div class="kv"><span>Suma cen à la carte</span><b id="sAla">—</b></div>
      <div class="kv"><span>Sugerowana cena przy ${pct(DB.settings.targetFc,0)}</span><b id="sSug" style="color:var(--s1)">—</b></div>
    </div>`,
    [ ...(id?[archBtn('sets', st)]:[]),
      ...(id?[{label:'Usuń',cls:'danger',fn:()=>{ if(!deleteEntity('sets', id)) return false; render(); }}]:[]),
      {label:'Anuluj'},
      {label:'Zapisz',cls:'pri',fn:()=>{
        st.name=val('sName').trim(); recalc();
        if(!st.name){ alert('Podaj nazwę.'); return false; }
        if(id){ const i=DB.sets.findIndex(x=>x.id===id); DB.sets[i]=st; } else { DB.sets.push(st); SEL.set=st.id; }
        save(); render();
      }}],
    ()=>{
      const s1=document.getElementById('sAdd');
      const usedItems = new Set(st.entries.map(e=>e.itemId));
      s1.innerHTML=DB.items.filter(i=>!i.archived||usedItems.has(i.id))
        .map(i=>`<option value="${i.id}">${esc(i.name)}</option>`).join('');
      document.getElementById('sAddBtn').addEventListener('click',()=>{
        st.entries.push({itemId:s1.value,pieces:parseInt(val('sAddQty'))||1}); draw(); });
      const s2=document.getElementById('sAddC');
      const usedC = new Set(st.comps.map(c=>c.refId));
      const pickC = x=>!x.archived || usedC.has(x.id);
      s2.innerHTML=DB.ingredients.filter(pickC).map(g=>`<option value="${g.id}">${esc(g.name)} — ${esc(g.cat)}</option>`).join('')
        + DB.preps.filter(pickC).map(p=>`<option value="${p.id}">◍ ${esc(p.name)}</option>`).join('');
      document.getElementById('sAddCBtn').addEventListener('click',()=>{
        st.comps.push({refId:s2.value,qty:parseFloat(val('sAddCQty'))||1}); draw(); });
      const fill=(selId, role, current)=>{
        const el=document.getElementById(selId);
        const opts=CALC.byRole(role);
        el.innerHTML='<option value="">— nie dotyczy —</option>'+opts.map(g=>{
          const uc=CALC.ingUnitCost(g.id);
          return `<option value="${g.id}" ${current===g.id?'selected':''}>${esc(g.name)}${uc!=null?' — '+num(uc,2)+' '+DB.settings.currency:' — brak ceny'}</option>`;
        }).join('');
        el.addEventListener('change',recalc);
      };
      fill('pTray','tray',st.pack.trayId);
      fill('pChop','chopsticks',st.pack.chopId);
      fill('pSauce','sauce',st.pack.sauceId);
      ['sPrice','sVat','pTrayQ','pChopQ','pSauceQ'].forEach(i=>document.getElementById(i).addEventListener('input',recalc));
      wirePhoto('sPhoto','sPhotoIn',st);
      draw();
    });
}

   WIDOK: HISTORIA CEN
   ========================================================================== */
let histIng='';
function vHist(){
  const withHist=[...new Set(DB.history.map(h=>h.ingId))];
  if(!histIng && withHist.length) histIng=withHist[0];
  const pts = DB.history.filter(h=>h.ingId===histIng)
    .sort((a,b)=>a.date.localeCompare(b.date))
    .map(h=>({d:h.date, v:(h.to!=null&&h.qty)?h.to/h.qty:0, raw:h}));
  const g = CALC.ing(histIng);
  if(g && pts.length){ pts.unshift({d:pts[0].raw.date, v:(pts[0].raw.from!=null&&pts[0].raw.qty)?pts[0].raw.from/pts[0].raw.qty:0, raw:pts[0].raw}); }

  after('hist',()=>{
    const s=document.getElementById('hIng'); if(s) s.addEventListener('change',e=>{histIng=e.target.value;render();});
    const el=document.getElementById('chHist'); if(el) wireChart(el,pts,p=>`<b>${esc(p.d)}</b>${num(p.v,4)} ${DB.settings.currency}/${esc(g?g.unit:'')}`);
  });

  const rows=[...DB.history].sort((a,b)=>b.date.localeCompare(a.date)).map(h=>{
    const gg=CALC.ing(h.ingId);
    const from = (h.from!=null&&h.qty)?h.from/h.qty:null, to=(h.to!=null&&h.qty)?h.to/h.qty:null;
    const d = (from&&to)? to/from-1 : null;
    return `<tr><td>${esc(h.date)}</td><td><b>${esc(gg?gg.name:h.ingId)}</b></td>
      <td class="r num">${h.from!=null?zl(h.from):'—'}</td><td class="r num">${h.to!=null?zl(h.to):'—'}</td>
      <td class="r"><span class="tag ${d==null?'':d>0.02?'crit':d<-0.02?'good':''}">${d==null?'—':(d>0?'+':'')+pct(d,1)}</span></td>
      <td class="mut small">${esc(h.note||'')}</td></tr>`;
  }).join('');

  return `<div class="topbar"><h1>Historia cen</h1><span class="sub">${DB.history.length} zmian</span></div>
  ${DB.history.length?'':'<div class="banner">Historia zapisuje się automatycznie za każdym razem, gdy zmienisz cenę opakowania w zakładce <b>Składniki</b>. Na start jest pusta — pierwszy wpis pojawi się po pierwszej aktualizacji cennika.</div>'}
  ${withHist.length?`<div class="card" style="margin-bottom:12px"><div class="row" style="margin-bottom:10px">
      <label class="f" style="margin:0">Składnik</label>
      <select id="hIng" style="max-width:280px">${withHist.map(i=>{const x=CALC.ing(i);return `<option value="${i}" ${histIng===i?'selected':''}>${esc(x?x.name:i)}</option>`;}).join('')}</select></div>
    <div id="chHist">${lineChart(pts)}</div></div>`:''}
  <div class="tw"><table><thead><tr><th>Data</th><th>Składnik</th><th class="r">Cena przed</th><th class="r">Cena po</th>
    <th class="r">Zmiana</th><th>Notatka</th></tr></thead>
    <tbody>${rows||'<tr><td colspan="6" class="empty">Brak zapisanych zmian cen</td></tr>'}</tbody></table></div>`;
}

<!-- Montserrat to krój z identyfikacji Noto Sushi. Gdy sieci nie ma (plik z dysku,
     kiosk bez internetu), zapasowy stos systemowy przejmuje bez migotania układu. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap">
<style>
/* ---------------------------------------------------------------------------
   IDENTYFIKACJA NOTO SUSHI
   Ze strony i z plików logo schodzą trzy wartości: czerwień #BD172F, czerń znaku
   #1D1D1B i biel. Czerwień jest JEDNYM akcentem — nosi akcję i wybór, nigdy tła
   i nigdy statusu. Statusy mają własną skalę i zawsze idą z liczbą albo słowem,
   żeby „czerwony" nie znaczył naraz „firma" i „uwaga".
   ------------------------------------------------------------------------- */
:root{
  color-scheme:light;
  --marka:#BD172F; --marka-ciemna:#9E1227; --marka-tlo:#FBEFF1;
  --znak-czerwien:#BD172F;
  --plane:#F7F6F4; --surface:#fff; --surface-2:#F1EFEB; --pasek:#F1EFEB;
  /* #8A8781 dawało 3,1:1 na szarym tle — poniżej 4,5:1 wymaganych dla tekstu,
     a tym kolorem są wszystkie podpowiedzi i etykiety. #6F6C67 wygląda prawie
     tak samo, a da się przeczytać. */
  --ink:#1D1D1B; --ink-2:#4E4C48; --muted:#6F6C67;
  --grid:#E5E2DC; --axis:#C6C2BA; --border:rgba(29,29,27,.11);
  --good:#0ca30c; --warn:#fab219; --crit:#d03b3b;
  --good-ink:#006300; --crit-ink:#b02c2c; --warn-ink:#8a6100;
  /* Jedyny akcent poza marką i statusami: barwa DANYCH. Nosi ją linia na wykresie
     historii cen i znacznik informacji — czyli rzeczy, które nie są ani akcją,
     ani ostrzeżeniem. Po ośmiu bezimiennych `--s1…--s8` (z czego siedem nie było
     używanych) zostaje jeden kolor, który wiadomo, co znaczy. */
  --dane:#2a78d6;

  /* --- skale ---------------------------------------------------------------
     Cztery promienie, osiem stopni pisma, trzy grubości, sześć odstępów.
     Wcześniej było odpowiednio 12, 18, 9 i 10 wartości dobieranych pojedynczo —
     przez co nic nie leżało w linii z niczym, a każda nowa rzecz dokładała kolejną.
     Grubości są tylko trzy, bo Montserrat ma cztery wagi: 520 czy 640 i tak było
     zaokrąglane przez przeglądarkę do najbliższej dostępnej.
     ---------------------------------------------------------------------- */
  --r-0:4px;      /* paski postępu, słupki wykresu, mikroplakietki */
  --r-1:7px;      /* kontrolki: przycisk, pole, plakietka, kafelek zmiany */
  --r-2:10px;     /* pojemniki: karta, tabela, kafelek z liczbą, alert */
  --r-3:14px;     /* dialog i okno logowania */
  --r:10px;       /* zgodność wstecz — to samo co --r-2 */

  --t-0:10px; --t-1:11px; --t-2:12px; --t-3:13px;
  --t-4:15px; --t-5:18px; --t-6:22px; --t-7:28px;
  --w-1:500; --w-2:600; --w-3:700;
  --sp-0:2px; --sp-1:4px; --sp-2:6px; --sp-3:8px; --sp-4:12px; --sp-5:16px; --sp-6:24px;

  /* Jedna zasada w całej aplikacji: czerwona ramka wewnętrzna znaczy „to jest
     wybrane". Wiersz tabeli, kafelek pozycji, dzień w kalendarzu, zakładka menu —
     wszystkie używają tego samego cienia, więc wybór wygląda wszędzie tak samo. */
  --ramka-wybor:inset 0 0 0 2px var(--marka);

  /* Jedna receptura na tło stanu — używają jej przegródki, paski zmian w kalendarzu
     i kafelki zmian. Wcześniej każde z tych miejsc mieszało sobie kolor osobno,
     przez co „komplet" w kalendarzu i „szafka jedzie" w załadunku miały inny odcień
     zieleni, choć znaczą to samo: jest jak ma być. */
  --tlo-ok:color-mix(in srgb,var(--good) 14%,var(--surface));
  --tlo-brak:color-mix(in srgb,var(--crit) 11%,var(--surface));
  --tlo-nieczynny:var(--surface-2);
}
:root[data-theme="dark"]{
  color-scheme:dark;
  /* czernie z materiałów firmowych — te same, co tło notosushi.pl */
  --marka:#D8283F; --marka-ciemna:#BD172F; --marka-tlo:#2A1215;
  --znak-czerwien:#D8283F;
  --plane:#0F0F0F; --surface:#1A1A1A; --surface-2:#242424; --pasek:#000;
  --ink:#fff; --ink-2:#C6C3BE; --muted:#8E8B86;
  --grid:#2C2C2A; --axis:#3A3A37; --border:rgba(255,255,255,.11);
  --good-ink:#0ca30c; --crit-ink:#e66767; --warn-ink:#fab219;
  --dane:#3987e5;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--plane); color:var(--ink);
  font:14px/1.5 Montserrat,system-ui,-apple-system,"Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased;
  /* Cyfry o równej szerokości w całej aplikacji, nie tam, gdzie ktoś pamiętał
     dopisać klasę `.num`. To narzędzie do liczenia kosztów — kolumny liczb mają
     stać w pionie z definicji, a nie przez przypadek. */
  font-variant-numeric:tabular-nums;
}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;font-weight:600;letter-spacing:-.01em}
h1{font-size:18px} h2{font-size:15px} h3{font-size:13px}
/* Odnośnik poznaje się po kolorze, nie po kresce. Podkreślenie pojawia się dopiero
   pod kursorem — w gęstych tabelach stała kreska pod każdą nazwą robi z ekranu siatkę. */
a{color:var(--marka);text-decoration:none}
a:hover{color:var(--marka-ciemna);text-decoration:underline;text-underline-offset:2px}

/* ---------- layout ---------- */
.app{display:flex;min-height:100vh}
.side{
  /* pasek nawigacji jest stonowany, arkusz roboczy jasny — jak czarna belka
     na notosushi.pl, tylko wyciszona do pracy z liczbami przez osiem godzin */
  width:216px;flex:none;background:var(--pasek);border-right:1px solid var(--border);
  padding:16px 12px;display:flex;flex-direction:column;gap:2px;position:sticky;top:0;height:100vh;overflow:auto;
}
.brand{padding:2px 8px 18px}
.brand svg{display:block;width:100%;max-width:158px;height:auto;color:var(--ink)}
.brand small{display:block;color:var(--muted);font-size:11px;font-weight:600;
  letter-spacing:.13em;text-transform:uppercase;margin-top:7px;padding-left:2px}
.nav{background:none;border:0;text-align:left;padding:8px 10px;border-radius:7px;cursor:pointer;color:var(--ink-2);display:flex;gap:8px;align-items:center;width:100%}
.nav:hover{background:var(--surface-2);color:var(--ink)}
/* Wybrana zakładka w czerwonej ramce — tak samo jak wybrany dzień w kalendarzu
   i wybrany wiersz na liście. Jedna zasada w całej aplikacji: czerwona ramka to wybór. */
.nav.on{background:var(--surface-2);color:var(--ink);font-weight:var(--w-2);
  box-shadow:var(--ramka-wybor)}
.nav.on .ic{opacity:1;color:var(--marka)}
.nav .ic{width:17px;height:17px;flex:none;display:grid;place-items:center;opacity:.8}
.nav .lbl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav.on .ic{opacity:1}
.nav .cnt{margin-left:auto;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
/* Licznik „ile tego jest" i sygnał „zajmij się tym" to dwie różne rzeczy. Do tej pory
   wyglądały tak samo, więc „24" przy Kalendarzu czytało się jak „49" przy Składnikach —
   choć jedno znaczy „24 zmiany bez obsady", a drugie „mamy 49 składników". */
.nav .cnt.uwaga{color:var(--crit-ink);font-weight:var(--w-3)}
.navgrp{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  color:var(--muted);padding:14px 10px 5px}
.navgrp:first-of-type{padding-top:2px}
/* grupy poza Pulpitem zwijają się — na co dzień potrzebny jest tylko Pulpit */
button.navgrp{background:none;border:0;width:100%;display:flex;align-items:center;
  justify-content:space-between;gap:8px;cursor:pointer;font-family:inherit;text-align:left}
button.navgrp:hover{color:var(--ink-2)}
button.navgrp.zwin{padding-bottom:9px}         /* zwinięte nagłówki nie mogą się kleić */
button.navgrp .ch{font-size:10px;opacity:.8;transition:transform .15s}
button.navgrp.zwin .ch{transform:rotate(-90deg)}
.navitems{display:flex;flex-direction:column;gap:2px}
.navitems.zwin{display:none}
.daybar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.daybar input[type=date]{max-width:170px}
.sidefoot{margin-top:auto;padding-top:12px;display:flex;flex-direction:column;gap:6px}
.sidefoot .btn{display:flex;align-items:center;gap:8px;justify-content:center}
.sidefoot .btn .ic{width:17px;height:17px;display:grid;place-items:center;flex:none}
#brandZnak{display:none}
#brandZnak svg{display:block;width:30px;height:auto;margin:0 auto;color:var(--marka)}

/* --- pasek zwinięty do samych znaków --------------------------------------
   Ten sam pasek, tylko bez podpisów: przy dwudziestu trzech pozycjach i pracy
   na jednym ekranie przez osiem godzin 216 px szerokości to realna strata miejsca.
   Zwinięty pasek pokazuje grupy jako kreski, a licznik jako kropkę — liczba i tak
   jest nieczytelna w 46 px, a sam fakt „tu coś czeka" niesie się kropką. Na telefonie
   pasek jest szufladą i zwijanie go nie ma sensu, więc reguły działają od 901 px.
   ------------------------------------------------------------------------ */
@media(min-width:901px){
  .side.ikony{width:62px;padding:16px 8px}
  .side.ikony .nav{justify-content:center;padding:9px 0;position:relative}
  .side.ikony .nav .lbl{display:none}
  .side.ikony .navgrp{display:none}
  .side.ikony .navitems{display:flex!important;border-top:1px solid var(--border);
    margin-top:6px;padding-top:6px}
  .side.ikony .navitems:first-of-type{border-top:0;margin-top:0;padding-top:0}
  /* Zwykłe sumy po zwinięciu znikają — liczba „49" i tak nie zmieści się w 46 px,
     a czerwona kropka obiecywałaby, że coś na ciebie czeka, choć nie czeka nic. */
  .side.ikony .nav .cnt{display:none}
  .side.ikony .nav .cnt.uwaga:not(:empty){display:block;position:absolute;top:5px;right:9px;
    margin:0;width:6px;height:6px;border-radius:999px;background:var(--crit);font-size:0}
  .side.ikony #brandLogo{display:none}
  .side.ikony #brandZnak{display:block}
  .side.ikony .brand{padding:2px 0 14px}
  .side.ikony .brand small{display:none}
  .side.ikony .sidefoot .lbl{display:none}
  .side.ikony .sidefoot #syncBadge{display:none}
  .side.ikony .sidefoot .btn{padding:7px 0}
}
.main{flex:1;min-width:0;padding:20px 24px 64px;max-width:1400px}
/* --- dwie gęstości ----------------------------------------------------------
   Ekrany dnia i grafik czyta się z tabletu na blacie i z telefonu w samochodzie —
   z półtora metra, przy zajętych rękach, w kilka sekund. Ekrany pieniędzy ogląda się
   z bliska i godzinami, więc mogą zostać gęste. Do tej pory jedne i drugie były
   rysowane tym samym stopniem pisma. To jedna klasa na <main>, nie dwa zestawy widoków.
   -------------------------------------------------------------------------- */
.main.dzien{font-size:var(--t-4)}
.main.dzien h1{font-size:var(--t-6)}
.main.dzien h2{font-size:var(--t-5)}
.main.dzien td{padding:11px 10px}
.main.dzien th{padding:9px 10px;font-size:var(--t-2)}
.main.dzien .card{padding:18px}
.main.dzien .kv{padding:9px 0;font-size:14px}
.main.dzien .tile .val{font-size:var(--t-7)}
.main.dzien .hint,.main.dzien .banner{font-size:var(--t-3)}
.topbar{display:flex;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.topbar .sub{color:var(--muted);font-size:12px}
.spacer{flex:1}

/* ---------- primitives ---------- */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:16px}
.card h2{margin-bottom:2px}
.card .hint{color:var(--muted);font-size:12px;margin-bottom:12px}
.grid{display:grid;gap:12px}
.btn{background:var(--surface);border:1px solid var(--border);border-radius:7px;padding:7px 12px;cursor:pointer;color:var(--ink);font-weight:500;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.pri{background:var(--marka);border-color:transparent;color:#fff;font-weight:600}
/* Był tu dubel: pierwsza reguła ciemniła tło, druga rozjaśniała je z powrotem
   filtrem, więc najazd na przycisk główny prawie nic nie zmieniał. */
.btn.pri:hover{background:var(--marka-ciemna)}
.btn.sm{padding:4px 9px;font-size:12px;border-radius:7px}
.btn.danger{color:var(--crit-ink)}
/* `opacity:.45` dawało ~2,5:1 — nie dało się przeczytać, co właściwie jest wyłączone.
   Wyłączony przycisk ma być czytelny i widocznie nieaktywny, a nie wyblakły. */
.btn:disabled{background:var(--surface-2);border-color:transparent;color:var(--muted);
  cursor:not-allowed;box-shadow:none}
.btn.pri:disabled{background:var(--surface-2);color:var(--muted)}
input[type=text],input[type=number],input[type=search],input[type=email],input[type=password],select,textarea{
  background:var(--plane);border:1px solid var(--border);border-radius:7px;padding:7px 9px;width:100%;
}
input:focus,select:focus,textarea:focus{outline:2px solid var(--marka);outline-offset:-1px}
/* Widoczny fokus na WSZYSTKIM, co klikalne. Wcześniej miały go tylko pola formularza,
   więc osoba pracująca z klawiatury nie wiedziała, gdzie jest w menu, w tabeli
   ani w kalendarzu. `:focus-visible`, żeby nie migało po kliknięciu myszą. */
:focus-visible{outline:2px solid var(--marka);outline-offset:2px;border-radius:var(--r-0)}
.kal td:focus-visible,.nav:focus-visible{outline-offset:-2px}

/* Narzędzie pracy nie ma prawa kręcić ekranem komuś, kto sobie tego nie życzy. */
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;
    transition-duration:.01ms!important;scroll-behavior:auto!important}
}
label.f{display:block;font-size:12px;color:var(--ink-2);margin-bottom:4px;font-weight:500}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
/* ZNACZNIK, nie plakietka.

   Pigułka z wypełnionym tłem to mocny sygnał — mówi „to jest osobny obiekt". Tymczasem
   nosiła u nas byle co: rolę konta, słowo „archiwum", procent food costu. Zielona pigułka
   przy 11,7% krzyczała głośniej niż sama liczba, którą miała opisać, a przy nazwie automatu
   udawała etykietkę, choć to zwykły tekst. Plakietka jako kształt należy teraz do jednej
   rzeczy w całej aplikacji: do osoby w grafiku (`.kod`, `.osbtn`). Reszta mówi krojem
   i kolorem. */
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11px;
  color:var(--muted);font-weight:var(--w-2);white-space:nowrap;letter-spacing:.01em}
.tag.good{color:var(--good-ink);font-weight:var(--w-3)}
.tag.warn{color:var(--warn-ink);font-weight:var(--w-3)}
.tag.crit{color:var(--crit-ink);font-weight:var(--w-3)}
/* Food cost w tabeli: sama liczba, pogrubiona, w kolorze progu. Kolumna liczb ma się
   czytać z góry na dół jednym rzutem oka, a rząd kolorowych pigułek to uniemożliwiał. */
td .tag, th .tag{font-size:inherit}
/* Pole daty leży niewidoczne na napisie — klik w datę otwiera kalendarz przeglądarki. */
.datawyb{position:relative;display:inline-flex;align-items:center;
  border:1px solid var(--border);border-radius:var(--r-1);background:var(--surface);
  padding:6px 10px;font-weight:var(--w-2);white-space:nowrap;cursor:pointer}
.datawyb:hover{border-color:var(--axis)}
.datawyb input{position:absolute;inset:0;width:100%;height:100%;opacity:0;
  padding:0;border:0;cursor:pointer}
.num{font-variant-numeric:tabular-nums}
.mut{color:var(--muted)}
/* Liczba wyliczona przez aplikację (sugerowana cena, koszt jednostkowy) — inna niż
   wpisana ręcznie. Wcześniej mówił to niebieski, który wyglądał jak odnośnik i nie
   znaczył nic. Teraz mówi to waga i etykieta obok, a kolor zostaje przy marce i statusach. */
.wylicz{font-weight:var(--w-3)}
/* Liczba, która nie wychodzi na całą sztukę — nie błąd, ale decyzja do poprawienia. */
.ulamek{color:var(--crit-ink);font-weight:var(--w-3)}
.small{font-size:12px}

/* ---------- table ---------- */
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{text-align:left;font-size:11px;font-weight:600;color:var(--muted);padding:7px 8px;border-bottom:1px solid var(--grid);white-space:nowrap;letter-spacing:.01em}
th.r,td.r{text-align:right}
th.sortable{cursor:pointer;user-select:none}
th.sortable:hover{color:var(--ink)}
th.sortable::after{content:'⇅';margin-left:5px;opacity:.3;font-size:10px}
th.sortable.asc::after{content:'↑';opacity:1;color:var(--marka)}
th.sortable.desc::after{content:'↓';opacity:1;color:var(--marka)}
td{padding:8px;border-bottom:1px solid var(--grid);vertical-align:middle}
tbody tr:hover{background:var(--surface-2)}
/* Wiersz wybrany — ta sama czerwona ramka co wszędzie. Cień kładziemy na komórki,
   bo przy `border-collapse:collapse` cień na `tr` nie rysuje się w części przeglądarek;
   skrajne komórki domykają ramkę z boków. */
tbody tr.sel>td{background:var(--marka-tlo);
  box-shadow:inset 0 2px 0 var(--marka),inset 0 -2px 0 var(--marka)}
tbody tr.sel>td:first-child{box-shadow:inset 0 2px 0 var(--marka),
  inset 0 -2px 0 var(--marka),inset 2px 0 0 var(--marka)}
tbody tr.sel>td:last-child{box-shadow:inset 0 2px 0 var(--marka),
  inset 0 -2px 0 var(--marka),inset -2px 0 0 var(--marka)}
tbody tr.sel:hover>td{background:var(--marka-tlo)}
.tw{overflow:auto;border:1px solid var(--border);border-radius:var(--r);background:var(--surface)}
td .cellin{background:transparent;border:1px solid transparent;padding:3px 5px;border-radius:7px;text-align:right}
td .cellin:hover{border-color:var(--border);background:var(--plane)}

/* ---------- stat tiles ---------- */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:14px 16px}
.tile .lab{font-size:11px;color:var(--muted);font-weight:600;letter-spacing:.02em;text-transform:uppercase}
.tile .val{font-size:28px;font-weight:700;letter-spacing:-.02em;margin-top:5px;line-height:1.1}
.tile .note{font-size:12px;color:var(--ink-2);margin-top:3px}
/* Mniejszy wariant do podglądów. Wcześniej te same kafelki rysowały się stylami
   w locie (`padding:10px 12px;font-size:22px`), przez co „etykieta i wartość"
   miało w aplikacji cztery różne postacie. */
.tile.sm{padding:8px 12px}
.tile.sm .val{font-size:var(--t-6);margin-top:2px}

/* ---------- chart ---------- */
.chart{width:100%;display:block}
@media(max-width:820px){
  .chart{min-width:520px}
  .card>div[id^="ch"]{overflow-x:auto;-webkit-overflow-scrolling:touch}
}
.chart text{font:11px system-ui,-apple-system,"Segoe UI",sans-serif;fill:var(--muted)}
.chart .lbl{fill:var(--ink-2);font-weight:500}
.chart .val{fill:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.chart .gl{stroke:var(--grid);stroke-width:1}
.chart .base{stroke:var(--axis);stroke-width:1}
.chart .bar{rx:4}
.chart .hit{fill:transparent;cursor:pointer}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--ink-2);margin-top:10px}
.legend i{width:10px;height:10px;border-radius:4px;display:inline-block;margin-right:6px;vertical-align:-1px}
#tip{
  position:fixed;pointer-events:none;z-index:99;background:var(--surface);border:1px solid var(--border);
  border-radius:7px;padding:7px 10px;font-size:12px;box-shadow:0 6px 20px rgba(0,0,0,.16);opacity:0;transition:opacity .1s;
  max-width:280px
}
#tip b{display:block;margin-bottom:2px}

/* ---------- misc ---------- */
.alert{display:flex;gap:8px;padding:10px 12px;border-radius:10px;background:var(--surface-2);align-items:flex-start;margin-bottom:8px}
.alert .ic{flex:none;width:18px;height:18px;border-radius:7px;display:grid;place-items:center;font-size:11px;font-weight:700;color:#fff;margin-top:1px}
.alert.crit .ic{background:var(--crit)} .alert.warn .ic{background:var(--warn);color:#3a2a00} .alert.info .ic{background:var(--dane)}
.alert .txt{font-size:13px;color:var(--ink-2)} .alert .txt b{color:var(--ink)}
dialog{border:1px solid var(--border);border-radius:14px;background:var(--surface);color:var(--ink);padding:0;max-width:min(880px,94vw);width:100%}
dialog::backdrop{background:rgba(0,0,0,.42)}
.dlg-h{padding:16px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px}
.dlg-b{padding:18px;max-height:min(70vh,660px);overflow:auto}
.dlg-f{padding:13px 18px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end;background:var(--surface-2);border-radius:0 0 14px 14px}
/* nazwa prowadząca do składu — ma wyglądać jak tekst, nie jak odnośnik */
a[data-sklad]{color:inherit;text-decoration:none}
a[data-sklad]:hover{color:inherit;text-decoration:underline;text-underline-offset:2px}
a[data-sklad]::after{content:' ›';color:var(--muted);font-weight:600}
/* kafelki ekranu głównego pulpitu */
.pulpit{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.pulpit a.card{display:block;text-decoration:none;color:inherit;padding:16px;transition:.12s}
/* `--accent` nigdy nie istniał, więc to podświetlenie od zawsze nic nie robiło */
.pulpit a.card:hover{border-color:var(--marka);transform:translateY(-1px)}
.pulpit .ic-big{line-height:0;color:var(--muted);flex:none}
/* --- pulpit na telefonie: dwie kolumny zamiast jednej, mniejsze liczby --- */
@media(max-width:640px){
  .tiles{grid-template-columns:repeat(2,1fr);gap:8px}
  .tiles .tile{padding:11px}
  .tile .lab{font-size:10px}
  .tile .val{font-size:22px}
  .tile .sub2,.tile .note{font-size:11px}
  .pulpit{grid-template-columns:repeat(2,1fr);gap:8px}
  .pulpit a.card{padding:12px}
  .pulpit .ic-big{display:none}          /* ikona zawijała się do drugiej linii */
  .pulpit .val{font-size:22px;margin-top:6px}
  .daybar .btn{padding:7px 11px}
  .daybar input[type=date]{flex:1 1 130px;max-width:none}
  /* nagłówek kafelka: liczba pod nazwą, nie w prawym rogu */
  .dz-head{flex-direction:column;align-items:flex-start!important;gap:4px}
  .dz-head .licz{text-align:left!important;display:flex;align-items:baseline;gap:6px}
  .dz-head .licz .hint{margin:0}
  .slot{padding-left:26px}
  .slot>.nm{font-size:11px}
}
/* szeroka tabela na wąskim ekranie — pierwsza kolumna zostaje na widoku */
@media(max-width:760px){
  .tw.przyklej table td:first-child,.tw.przyklej table th:first-child{
    position:sticky;left:0;background:var(--surface);z-index:2;box-shadow:1px 0 0 var(--grid)}
}
/* siatka załadunku: dwie kolumny szafek na automat, klik przełącza */
.zal-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
.zal-cols{display:grid;grid-template-columns:1fr 1fr;gap:8px}
/* --- PRZEGRÓDKA -----------------------------------------------------------
   Szafka w załadunku, szafka u kierowcy, a docelowo każda ponumerowana komórka.
   Numer siedzi w lewym marginesie, nazwa wypełnia resztę, tło mówi o stanie.
   Wcześniej szafki miały pełne wypełnienie zielenią i czerwienią, czyli mocniejsze
   niż cokolwiek innego w aplikacji — a znaczą to samo co blade paski w kalendarzu.
   -------------------------------------------------------------------------- */
.slot{position:relative;border:1px solid var(--border);border-radius:var(--r-1);
  background:var(--surface);color:var(--ink);padding:9px 10px 9px 30px;
  text-align:left;width:100%;font:inherit;min-height:44px;
  display:flex;align-items:center;line-height:1.25}
.slot>.nr{position:absolute;left:8px;top:50%;transform:translateY(-50%);
  font-size:var(--t-1);font-weight:var(--w-3);color:var(--muted);font-variant-numeric:tabular-nums}
.slot>.nm{font-size:var(--t-2);font-weight:var(--w-2);overflow:hidden;display:-webkit-box;
  -webkit-line-clamp:2;-webkit-box-orient:vertical}
.slot.pelny{background:var(--tlo-ok);border-color:transparent}
.slot.pelny>.nr{color:var(--good-ink)}
.slot.wylaczony{background:var(--tlo-brak);border-color:transparent}
.slot.wylaczony>.nr{color:var(--crit-ink)}
.slot.pusty{background:var(--tlo-nieczynny);color:var(--muted);border-color:transparent}
.slot.wybrany{box-shadow:var(--ramka-wybor)}
button.slot{cursor:pointer}
button.slot.pusty{cursor:default}
button.slot:not(.pusty):hover{border-color:var(--axis)}
.lockers{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:1100px){.lockers{grid-template-columns:1fr}}
.lock{display:grid;grid-template-columns:34px 1fr 86px 78px 58px;gap:8px;align-items:center;margin-bottom:6px}
@media(max-width:640px){.lock{grid-template-columns:30px 1fr 70px}}
/* numer szafki w układzie automatu — ta sama typografia co numer w przegródce */
.lock .no{width:28px;height:28px;border-radius:var(--r-1);background:var(--surface-2);
  color:var(--ink-2);display:grid;place-items:center;font-size:var(--t-1);
  font-weight:var(--w-3);font-variant-numeric:tabular-nums}
.lock.pusta .no{background:transparent;border:1px dashed var(--border);color:var(--muted)}
.lock .num{text-align:right;font-variant-numeric:tabular-nums;font-size:12px}
.combo{position:relative;display:inline-block;width:100%}
.combo input.combo-q{width:100%}
.combo-pop{position:fixed;z-index:70;background:var(--surface);border:1px solid var(--border);
  border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.14);max-height:260px;overflow:auto;display:none;padding:4px}
.combo-pop.open{display:block}
.combo-pop .opt{padding:6px 9px;border-radius:7px;cursor:pointer;font-size:13px;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.combo-pop .opt:hover,.combo-pop .opt.on{background:var(--surface-2)}
.combo-pop .none{padding:8px 9px;color:var(--muted);font-size:12px}
.empty{text-align:center;padding:40px 20px;color:var(--muted)}
.bar-mini{height:6px;border-radius:4px;background:var(--surface-2);overflow:hidden;min-width:60px}
.bar-mini i{display:block;height:100%;border-radius:4px}
.split{display:grid;grid-template-columns:1fr 340px;gap:12px;align-items:start}
.tiles-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(268px,1fr));gap:12px;align-content:start}
/* Drugi rząd paska listy: wszystko, co zmienia sposób patrzenia na tę samą rzecz.
   Osobny rząd, bo w jednym akcja główna przestawała się mieścić i zawijała pod tytuł. */
.paskopcji{display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  margin:-4px 0 14px;padding:8px 10px;border:1px solid var(--border);
  border-radius:var(--r-2);background:var(--surface)}
.paskopcji input[type=search]{max-width:240px}
@media(max-width:640px){.paskopcji{padding:8px}.paskopcji input[type=search]{max-width:none;flex:1 1 140px}}
.tcard .kv:first-of-type{padding-top:0}
.tcard{cursor:pointer;transition:border-color .12s}
.tcard:hover{border-color:var(--axis)}
.tcard.sel{border-color:var(--marka);box-shadow:var(--ramka-wybor)}
.tcard .th{display:flex;gap:8px;align-items:flex-start;justify-content:space-between;margin-bottom:8px}
.tcard h3{margin:0;font-size:15px;line-height:1.25}
.tcard .acts{display:flex;gap:4px;flex-wrap:wrap;margin-top:10px;padding-top:9px;border-top:1px solid var(--grid)}
@media(max-width:1080px){.split{grid-template-columns:1fr}}
/* Na telefonie menu chowa się pod hamburgerem — pasek przewijany w bok gubił
   połowę pozycji i nie dało się na nim rozróżnić grup. */
.burger,.scrim{display:none}
@media(max-width:760px){
  .app{flex-direction:column}
  /* pasek na całą szerokość, przyklejony do góry — nie zasłania niczego pod spodem */
  .burger{display:flex;align-items:center;gap:8px;position:fixed;top:0;left:0;right:0;
    width:100%;height:48px;padding:0 14px;z-index:80;
    background:var(--surface);border:0;border-bottom:1px solid var(--border);border-radius:0;
    font:inherit;font-weight:600;color:var(--ink);cursor:pointer;text-align:left;
    box-shadow:0 1px 4px rgba(0,0,0,.05)}
  /* sygnet po prawej stronie paska — marka jest obecna też wtedy, gdy menu jest schowane */
  #burgerZnak{margin-left:auto;display:flex;align-items:center}
  #burgerZnak svg{width:22px;height:22px;color:var(--ink)}
  .side{position:fixed;left:0;top:0;bottom:0;width:min(272px,84vw);z-index:90;
    flex-direction:column;overflow-y:auto;padding:14px;border-right:1px solid var(--border);
    transform:translateX(-102%);transition:transform .18s ease-out}
  .side.open{transform:none;box-shadow:0 0 40px rgba(0,0,0,.25)}
  .scrim.open{display:block;position:fixed;inset:0;z-index:85;background:rgba(0,0,0,.35)}
  .sidefoot{display:flex}
  .nav{padding:11px 10px}
  .main{padding:14px;padding-top:62px}
}
/* zwijane sekcje podglądu */
.sek{border-top:1px solid var(--grid);margin-top:12px}
.sek:first-of-type{border-top:0;margin-top:4px}
.sek h3{margin:0;font-size:13px}
.sekh{background:none;border:0;padding:10px 0 8px;width:100%;display:flex;align-items:center;
  gap:8px;cursor:pointer;font:inherit;font-weight:600;color:var(--ink);text-align:left}
.sekh:hover{color:var(--marka)}
/* strzałka rysowana z CSS — dzięki temu w treści nagłówka zostaje sama nazwa */
.sekh::before{content:'▾';font-size:10px;color:var(--muted);display:inline-block;
  transition:transform .15s;flex:none}
.sek.zwin .sekh::before{transform:rotate(-90deg)}
.sek.zwin .sekb{display:none}
.sekb{padding-bottom:8px}

/* strefa ryzykowna: wyraźnie oddzielona od pól, ale bez krzyku */
.ryzyko{margin-top:22px;padding-top:14px;border-top:1px solid var(--grid);
  display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}
.ryzyko .txt{flex:1;min-width:220px}
.ryzyko .hint{color:var(--muted);font-size:12px;margin-top:3px}
.hidden{display:none!important}
/* grupy w listach dnia: nagłówek kategorii i suma pośrednia */
tr.grp>td{background:var(--surface-2);font-weight:700;font-size:11px;letter-spacing:.06em;
  text-transform:uppercase;color:var(--ink-2);padding-top:9px;padding-bottom:5px}
tr.suma>td{border-top:1px solid var(--axis);font-weight:600;color:var(--ink-2)}
/* liczby w nagłówku grupy zostają liczbami — wersaliki i rozstrzelenie tylko na nazwie */
tr.grp>td+td{letter-spacing:normal;text-transform:none;font-size:12px;color:var(--ink)}
tr.arch{opacity:.55}
tr.arch:hover{opacity:.85}
.card.arch{opacity:.6}
.card.arch:hover{opacity:1}
.pill-group{display:inline-flex;background:var(--surface-2);border-radius:10px;padding:3px;gap:2px}
.pill-group button{background:none;border:0;padding:5px 11px;border-radius:7px;cursor:pointer;color:var(--ink-2);font-size:12px;font-weight:500}
.pill-group button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
/* kolejność ręczna: uchwyt do przeciągania, numer pozycji, strzałki */
.uch{cursor:grab;color:var(--muted);user-select:none;font-size:15px;line-height:1}
.uch:active{cursor:grabbing}
.ordcell{display:flex;align-items:center;gap:4px;white-space:nowrap}
.ordcell .nr{font-size:11px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.btn.mv{padding:2px 6px;font-size:11px;line-height:1.3}
.dragging{opacity:.4}
.dropzone{box-shadow:inset 0 3px 0 -1px var(--marka)}
th.ordth{cursor:pointer}
th.ordth.on{color:var(--ink)}
.compline{display:grid;grid-template-columns:1fr 92px 74px 90px 32px;gap:8px;align-items:center;margin-bottom:7px}
.compline.ord{grid-template-columns:96px 1fr 92px 74px 90px 32px}
@media(max-width:640px){.compline.ord{grid-template-columns:92px 1fr 74px 56px;grid-auto-rows:auto}}
.compline.wst{grid-template-columns:1fr 78px 78px 60px 84px 32px}
@media(max-width:640px){.compline.wst{grid-template-columns:1fr 70px 70px}}
.compline .cost{text-align:right;font-variant-numeric:tabular-nums;color:var(--ink-2)}
.compline .combo{min-width:0}
.compline .combo-q{width:100%}
/* wiersz bez wybranej pozycji — widać, że czeka na uzupełnienie */
.compline.pusty{outline:1px dashed var(--axis);outline-offset:3px;border-radius:7px}
@media(max-width:640px){.compline{grid-template-columns:1fr 80px 60px;grid-auto-rows:auto}}
.kv{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--grid);font-size:13px}
.kv:last-child{border:0}
.kv b{font-variant-numeric:tabular-nums}
.banner{border:1px solid var(--border);background:var(--surface);border-radius:10px;padding:11px 14px;margin-bottom:14px;font-size:13px;color:var(--ink-2)}
/* ---------- zdjęcia ---------- */
.hero{width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:10px;background:var(--surface-2);display:block;margin-bottom:12px}
.drop{border:1.5px dashed var(--axis);border-radius:10px;padding:14px;text-align:center;color:var(--muted);font-size:12px;cursor:pointer;max-width:280px}
.drop:hover{border-color:var(--marka);color:var(--ink-2)}
.drop.has{padding:0;border-style:solid;overflow:hidden;position:relative}
.drop.has img{width:100%;aspect-ratio:16/10;object-fit:cover;display:block}
body.ro [data-ro-hide]{display:none!important}
.login-wrap{position:fixed;inset:0;background:var(--plane);display:grid;place-items:center;z-index:200;padding:20px}
.login-box{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:26px;width:100%;max-width:370px;box-shadow:0 10px 40px rgba(0,0,0,.12)}
.login-box .brand{padding:0 0 18px}
/* ---------- grafik zmian ---------- */
.kal{width:100%;border-collapse:separate;border-spacing:4px;table-layout:fixed}
.kal th{font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;
  letter-spacing:.03em;padding-bottom:2px}
/* Na telefonie kolumna ma ~50 px — „poniedziałek" nie ma prawa się zmieścić
   i nachodzi na sąsiadów. Poniżej 760 px zostaje samo „Pn". */
.kal th .dk{display:none}
@media(max-width:760px){.kal th .dl{display:none}.kal th .dk{display:inline}}
.kal td{vertical-align:top;background:var(--surface);border:1px solid var(--border);
  border-radius:var(--r-1);padding:6px;height:82px;cursor:pointer}
.kal td.poza{background:var(--plane);border-style:dashed}
.kal td.poza .dn{color:var(--muted)}
/* Ramka znaczy WYBÓR i tylko wybór. „Dziś" miało własną, cieńszą — i przy dwóch
   ramkach tego samego koloru obok siebie trzeba było się zastanawiać, która z nich
   coś od nas chce. Dzisiejszy dzień poznaje się teraz po czerwonej cyfrze: mówi to
   samo, a nie wchodzi w drogę zaznaczeniu. */
.kal td.dzis .dn{color:var(--marka)}
.kal td.zaz{box-shadow:var(--ramka-wybor)}
/* Dzień, który już był, jest tylko do wglądu — nic się w nim nie zmieni. */
.kal td.przeszly{opacity:.55}
.tyg .kol.przeszly{opacity:.55}
.tyg .kol.zaz h3{color:var(--marka)}
/* pasek nad kalendarzem: wszystko w jednej linii, godziny wyrównane do prawej */
.grafbar h1{font-size:18px;margin:0}
.grafbar .godzsuma{font-size:13px;white-space:nowrap;font-variant-numeric:tabular-nums}
.grafbar .godzsuma b{font-size:15px}
/* w wąskiej kolumnie tygodnia zostaje sama plakietka — ma nie łamać wiersza */
.tyg .zmk .os .im{flex:0 0 auto;white-space:nowrap}
/* Shift+klik zaznaczałby przy okazji tekst w komórkach */
.kal{user-select:none}
@media(max-width:760px){.klawisze{display:none}}
.kal .dn{font-size:12px;font-weight:600;font-variant-numeric:tabular-nums}
/* pasek zmiany w komórce dnia: nazwa z lewej, obsada z prawej — kolor mówi,
   czy jest komplet, zanim ktokolwiek zacznie czytać cyfry */
/* Pasek musi być wyraźnie wyższy od plakietki, którą w sobie mieści — inaczej
   plakietka wychodzi na jego zaokrąglone rogi i wygląda, jakby zasłaniała ramkę. */
.kal .zm{display:flex;align-items:center;justify-content:space-between;gap:4px;
  font-size:11px;margin-top:3px;padding:3px 5px;min-height:21px;
  border-radius:7px;background:var(--surface-2);color:var(--ink-2)}
.kal .zm b{font-variant-numeric:tabular-nums;font-weight:600}
/* Dwa stany na przyszłość i jeden na przeszłość: zielono, gdy komplet, czerwono,
   gdy brakuje ludzi, szaro, gdy dzień już był. Odcienie są jasne, bo cały miesiąc
   pomalowany mocnym kolorem przestaje cokolwiek znaczyć. */
.kal .zm.pelna{background:var(--tlo-ok);color:var(--good-ink)}
.kal .zm.brak{background:var(--tlo-brak);color:var(--crit-ink)}
.kal .zm.minione{background:var(--tlo-nieczynny);color:var(--muted)}
/* Plakietka osoby: skrót w jej kolorze. Ma być czytelna na tle paska stanu zmiany
   (zielonym, pomarańczowym albo czerwonym), stąd pełne wypełnienie i biała obwódka
   zamiast półprzezroczystości. */
.kod{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.02em;
  padding:0 4px;border-radius:4px;line-height:1.55;white-space:nowrap;
  box-shadow:0 0 0 1px rgba(255,255,255,.65)}
.zmk .kod, .osoby-tab .kod{font-size:11px;padding:1px 6px}
/* Stała szerokość, bo inaczej „AB" i „MarPro" dają dwa różne rytmy i sąsiadujące dni
   przestają się zgadzać w pionie. Sześć znaków to maksimum skrótu, więc szerokość jest
   dobrana pod nie — dłuższego napisu tu nie będzie. */
.kal .zm .kod{line-height:1.3;padding:0;width:54px;flex:none;
  display:inline-flex;align-items:center;justify-content:center;overflow:hidden}
/* Plakietka osoby w rozmiarze przycisku: w kolumnie tygodnia stoi w jednym rzędzie
   z „Zapisz się", więc musi mieć tę samą wysokość, inaczej rząd faluje. Ramka
   przylegała wcześniej do liter — plakietka z sześcioma znakami wyglądała na ciasną,
   a to jedyny element w aplikacji, który nosi czyjeś nazwisko. */
.osbtn{display:inline-flex;align-items:center;padding:0 10px;
  border-radius:7px;font-size:12px;font-weight:700;letter-spacing:.02em;
  min-height:30px;white-space:nowrap;box-sizing:border-box}
/* Klawisz stoi OBOK plakietki, nie w niej. Krzyżyk przy plakietce znaczy „wypisz tę
   osobę", plusik przy „Zapisz się" — „dopisz kogoś innego". Jedna geometria dla obu,
   bo to jedna rodzina: mały kwadratowy klawisz przy elemencie, którego dotyczy.
   Wcześniej krzyżyk siedział wewnątrz plakietki, a plusik obok i mniejszy — trzy
   rozmiary i dwie różne relacje na przestrzeni jednego rzędu. */
.osgrp{display:inline-flex;align-items:center;gap:3px}
.btn.xbtn,.btn.plusbtn{width:30px;height:30px;box-sizing:border-box;display:grid;
  place-items:center;padding:0;border-radius:7px;line-height:1;cursor:pointer;
  flex:none;min-height:30px;font-weight:600}
.btn.xbtn{font-size:12px;color:var(--crit-ink)}
.btn.plusbtn{font-size:16px}
/* Skład zmiany: jeden wiersz na jedno miejsce, każdy na całą szerokość kolumny.
   Dzięki temu plakietka, „Zapisz się" i puste miejsce są równe z definicji — nie przez
   dobieranie pikseli pod długość napisu — a krzyżyki i plusiki stoją w jednej kolumnie
   przy prawej krawędzi zamiast skakać w zależności od tego, kto ma dłuższy skrót. */
.sklad{display:flex;flex-direction:column;align-items:stretch;gap:5px;margin-top:6px}
.sklad .osgrp{width:100%}
.sklad .osgrp>:first-child{flex:1 1 auto;min-width:0;overflow:hidden}
.sklad .btn.sm:not(.xbtn):not(.plusbtn){min-height:30px}
/* Wolne miejsce w siatce miesiąca: pusty prostokąt wielkości plakietki. Wcześniej stał
   tam ułamek „1/2" — liczba o zmiennej długości, przez którą kafelki dnia rozjeżdżały
   się na różne szerokości. Puste miejsce mówi to samo i nic nie rozpycha. */
/* Puste miejsce to plakietka bez nikogo — ta sama szerokość, ta sama wysokość,
   tylko obrys zamiast koloru. Inaczej rząd „dwie osoby" i rząd „jedna osoba i wolne"
   miałyby różną długość i cała siatka by falowała. */
.kod.wolne{background:transparent;box-shadow:inset 0 0 0 1px var(--axis);height:14px;padding:0}
/* To samo puste miejsce w kolumnie tygodnia — dla kogoś, kto nie może się tu zapisać
   (bo już stoi albo dzień minął), a miejsce jest dalej wolne. */
.osbtn.wolne{background:transparent;box-shadow:inset 0 0 0 1px var(--axis)}
.kal .zm{flex-wrap:wrap}
.kal .zm .ludzie{display:flex;gap:2px;flex-wrap:wrap;margin-left:auto;padding-right:3px}
/* Bez ułamka pasek zmiany nie ma już nic po prawej stronie poza ludźmi — plakietki
   i puste miejsca dosuwamy do prawej krawędzi, żeby wszystkie dni ustawiły się w pion. */
.kal .zm .ludzie{align-items:center}
/* Na telefonie komórka dnia ma ~50 px — sześcioznakowa plakietka i tak by się nie
   zmieściła, a rozpychałaby wiersze na różną wysokość. Kto stoi, widać w panelu dnia
   i w widoku tygodnia; siatka miesiąca zostaje przy „ile z ilu". */
@media(max-width:760px){.kal .zm .ludzie{display:none}}
/* wąski ekran: „czeka" wraca pod godziny zamiast wystawać poza tabelę */
.osoby-tab .czeka-obok{display:none}
@media(max-width:640px){
  .osoby-tab .czeka-kol{display:none}
  .osoby-tab .czeka-obok{display:block;font-size:11px}
}
/* pasek godzin nad kalendarzem — jedna liczba, po którą sięga pracownik */
/* Nazwa automatu w rozbiciu zestawu: pełna, jeśli się mieści, ucięta wielokropkiem,
   jeśli nie. Kod w plakietce mówił mniej („A3") i zajmował tyle samo miejsca. */
.nazwa-auto{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.moje-godz{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.moje-godz b{font-size:22px;font-weight:700;letter-spacing:-.01em}
.osoby-tab td:first-child{white-space:nowrap}
/* wybór koloru: same próbki, bez nazw — kolor opisuje się sam */
.kolorbtn{width:30px;height:30px;border-radius:7px;border:1px solid var(--border);cursor:pointer;padding:0}
.kolorbtn.on{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--marka)}
/* Przełącznik segmentowy zostaje przy wypełnionej pigułce: wybór jest tam widoczny
   z samego wypełnienia, a trzy czerwone ramki obok siebie w pasku listy krzyczałyby
   głośniej niż akcja główna. Kolor marki niesie za to napis — należy do tej samej rodziny. */
.pill-group button.on{color:var(--marka)}
.kal .nadp{font-size:10px;color:var(--marka);font-weight:700;letter-spacing:.03em;
  display:block;margin-top:2px}
/* minmax(0,1fr), nie 1fr: samo `1fr` ma minimum `auto`, więc kolumna z nazwiskami
   rozpycha się kosztem pustych i tydzień przestaje wyglądać jak tydzień */
.tyg{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;align-items:start}
.tyg .kol h3{font-size:12px;margin:0 0 6px;color:var(--ink-2)}
.tyg .kol.dzis h3{color:var(--marka)}
@media(max-width:980px){.tyg{grid-template-columns:1fr}.kal td{height:auto}}
/* Kafelek zmiany wygląda tak samo w tygodniu i w panelu dnia: szara ramka, a obsadę
   niesie TŁO — dokładnie jak paski w siatce miesiąca. Pogrubiona krawędź z lewej była
   trzecim sposobem mówienia tej samej rzeczy i nie pasowała do reszty. */
.zmk{border:1px solid var(--border);border-radius:7px;padding:8px 10px;margin-bottom:6px;
  background:var(--surface)}
.zmk.pelna{background:var(--tlo-ok)}
.zmk.brak{background:var(--tlo-brak)}
.zmk.minione{background:var(--tlo-nieczynny);opacity:.75}
/* Kolumna tygodnia bywa wąska — nagłówek kafelka ma się zawinąć, a nie rozjechać.
   Nazwa zmiany zostaje w jednej linii, bo „I zmiana" złamane na „I / zmiana" wygląda
   jak dwie różne zmiany. */
.zmk .th{display:flex;justify-content:space-between;align-items:baseline;gap:4px 6px;
  margin-bottom:4px;flex-wrap:wrap}
.zmk .th b{white-space:nowrap;font-size:var(--t-2)}
.zmk .os{display:flex;align-items:center;gap:6px;font-size:12px;padding:3px 0}
.zmk .os .im{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.zmk .os.pr .im{font-weight:600}
.zmk .os.ch .im{color:var(--ink-2)}
.zmk .os.ja .im{color:var(--marka)}
/* W kolumnie tygodnia stoi sama plakietka z kodem — nazwisko rozpychało wiersz
   na dwie linie, a kod i tak mówi, kto to. Wiersz zostaje jednolinijkowy. */
.tyg .zmk .os{flex-wrap:nowrap;padding:3px 0}
/* Pole wyboru godziny w Chrome ma własną ikonę zegara i poniżej ~92 px zaczyna
   ucinać cyfry — to ono dyktuje szerokość karty, nie odwrotnie. Nazwa dostaje
   twarde minimum, żeby nie została ściśnięta do dwóch znaków. */
.zmline{display:grid;grid-template-columns:minmax(120px,1fr) 92px 92px 66px 30px;gap:6px;
  align-items:center;margin-bottom:7px}
@media(max-width:640px){.zmline{grid-template-columns:minmax(90px,1fr) 84px 84px 56px 30px}}
.zmline.pusty{outline:1px dashed var(--axis);outline-offset:3px;border-radius:7px}
/* Wiersz zmiany ma pięć kolumn i minimum ~360 px — kafelki szablonu muszą być
   szersze niż zwykłe, inaczej pole nazwy ściska się do zera. */
.szabgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(470px,1fr));
  gap:12px;align-content:start}
/* Grafik nie jest już osobną grupą w menu: to jeden ekran, a grupa z jedną pozycją
   (drugą, „Szablon zmian", widzi tylko układający grafik) była nagłówkiem nad niczym.
   Kalendarz stanął przy ekranach dnia, bo tam się na niego patrzy; szablon — w Edycji,
   bo to ustawianie, nie oglądanie.

   Konto pracownika nie ma po co widzieć reszty aplikacji: zostaje sam Grafik i wyjście
   (przycisk wylogowania przenosi się do tej grupy w render()). */
body.tylkoGrafik .side .navgrp{display:none}
body.tylkoGrafik .side .navitems:not(#grp-pulpit){display:none}
body.tylkoGrafik .side #grp-pulpit .nav:not([data-v="graf"]):not(#navOut){display:none}
</style>

/* ---------- stan ---------- */
let DB = null;
let VIEW = 'dHome';   // kuchnia zaczyna dzień od przygotowania
let SEL = {item:null, set:null, ing:null, prep:null, mach:null, load:null};

const STORE_KEY = 'sushi-planner-v1';
function safeGet(){ try{ return localStorage.getItem(STORE_KEY); }catch(e){ return null; } }
function safeSet(v){ try{ localStorage.setItem(STORE_KEY,v); return true; }catch(e){ return false; } }
let STORAGE_OK = true;

function uid(p){ return p+'-'+Math.random().toString(36).slice(2,9); }

/* ---------- archiwum ---------- */
const ARCH = {ing:'active', prep:'active', items:'active', sets:'active', mach:'active', load:'active'};
const ARCH_LIST = {ing:()=>DB.ingredients, prep:()=>DB.preps, items:()=>DB.items,
                   sets:()=>DB.sets, mach:()=>DB.machines, load:()=>DB.loads};

function active(list){ return list.filter(x=>!x.archived); }
function archFilter(list, key){
  const m = ARCH[key];
  if(m==='all') return list;
  if(m==='arch') return list.filter(x=>x.archived);
  return list.filter(x=>!x.archived);
}
/* ---------- lista czy kafelki ----------
   To ustawienie interfejsu, a nie dane lokalu — trzymamy je w osobnym kluczu
   localStorage, żeby nie wędrowało na serwer i nie zmieniało widoku kolegom. */
/* ---------- kanały sprzedaży ----------
   Ta sama rolka sprzedana z automatu i przez aplikację dostawczą ma inną cenę
   i inną stawkę VAT. Koszt wytworzenia jest jeden, więc food cost różni się
   między kanałami — i o to właśnie chodzi, żeby było widać. */
const CHANNELS = [
  {k:'vending', l:'Vending', vat:0.05},
  {k:'dostawa', l:'Dostawa', vat:0.08},
];
const CHAN_KEY = 'sp_kanal';
let CHAN = 'vending';
try{ const z=localStorage.getItem(CHAN_KEY); if(CHANNELS.some(c=>c.k===z)) CHAN=z; }catch(e){}
function setChan(k){ CHAN=k; try{ localStorage.setItem(CHAN_KEY,k); }catch(e){} }
function chanLabel(k){ const c=CHANNELS.find(x=>x.k===k); return c?c.l:k; }
function chanPills(){
  return `<div class="pill-group" data-changroup="1">
    ${CHANNELS.map(c=>`<button type="button" data-ch="${c.k}" class="${CHAN===c.k?'on':''}">${esc(c.l)}</button>`).join('')}
  </div>`;
}
function wireChanPills(root){
  root.querySelectorAll('[data-changroup] button').forEach(b=>
    b.addEventListener('click',()=>{ setChan(b.dataset.ch); render(); }));
}

/** starsze dane miały jedną cenę i jedną stawkę — rozdzielamy na dwa kanały */
function migrateChannels(o){
  if(!o.prices || typeof o.prices!=='object')
    o.prices = {vending: o.price==null?null:o.price, dostawa: o.price==null?null:o.price};
  if(!o.vats || typeof o.vats!=='object')
    o.vats = {vending:0.05, dostawa:0.08};
  CHANNELS.forEach(c=>{
    if(o.prices[c.k]===undefined) o.prices[c.k]=null;
    if(o.vats[c.k]==null) o.vats[c.k]=c.vat;
  });
  delete o.price; delete o.vat;
}

const VIEW_KEY = 'sp_widok';
const VMODE = {ing:'list', prep:'cards', items:'list', sets:'list', mach:'cards', load:'cards'};
try{
  const z = JSON.parse(localStorage.getItem(VIEW_KEY)||'{}');
  Object.keys(VMODE).forEach(k=>{ if(z[k]==='list'||z[k]==='cards') VMODE[k]=z[k]; });
}catch(e){}
function setVMode(key, tryb){
  VMODE[key]=tryb;
  try{ localStorage.setItem(VIEW_KEY, JSON.stringify(VMODE)); }catch(e){}
}
function viewPills(key){
  return `<div class="pill-group" data-viewgroup="${key}">
    <button type="button" data-vm="list" class="${VMODE[key]==='list'?'on':''}" title="Widok listy">☰ Lista</button>
    <button type="button" data-vm="cards" class="${VMODE[key]==='cards'?'on':''}" title="Widok kafelków">▦ Kafelki</button>
  </div>`;
}
/** na przycisku hamburgera piszemy, gdzie jesteśmy */
function odswiezBurger(){
  const el = document.getElementById('burgerNazwa');
  if(!el) return;
  const b = document.querySelector('.nav.on');
  if(!b){ el.textContent = 'Menu'; return; }
  const k = b.cloneNode(true);                       // ikona i licznik nie są nazwą
  k.querySelectorAll('.ic,.cnt').forEach(x=>x.remove());
  el.textContent = k.textContent.trim() || 'Menu';
}
function wireViewPills(root){
  root.querySelectorAll('[data-viewgroup]').forEach(g=>{
    g.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{
      setVMode(g.dataset.viewgroup, b.dataset.vm); render();
    }));
  });
}

function archPills(key){
  const n = ARCH_LIST[key]().filter(x=>x.archived).length;
  return `<div class="pill-group" data-archgroup="${key}">
    <button type="button" data-av="active" class="${ARCH[key]==='active'?'on':''}">Aktywne</button>
    <button type="button" data-av="arch" class="${ARCH[key]==='arch'?'on':''}">Archiwum${n?' '+n:''}</button>

/** gdzie obiekt jest jeszcze używany przez coś nieazarchiwizowanego */
function usedByActive(id){

    const o = u.type==='item'?CALC.item(u.id) : u.type==='prep'?CALC.prep(u.id) : CALC.set(u.id);

/** przełącza archiwum; zwraca true gdy coś się zmieniło */
function toggleArchive(key, id){

      +'żeby receptury nie zaczęły nagle wychodzić taniej.\n\nZarchiwizować mimo to?')) return false;

}

/** usuwanie z blokadą, gdy coś jeszcze tego używa */
function deleteEntity(key, id){
  const list = ARCH_LIST[key]();
  const o = list.find(x=>x.id===id);

      +used.map(u=>'• '+u.name).join('\n')

      +'Użyj przycisku Archiwum — schowa z list, a koszty zostaną nienaruszone.');

/* ---------- automaty vendingowe ----------
   Sześć maszyn, każda z dwiema kolumnami po dziesięć szafek: 1–10 i 11–20.
   Układ szafek jest wspólny dla wszystkich — tak jest w rzeczywistości i tak
   jest prościej planować załadunek. */
const VEND_SLOTS = 20;
const VEND_PER_COL = 10;
const AUTOMATY_START = [
  {id:'aut-zabierzow',   code:'ZAB', name:'Zabierzów, Biedronka',       addr:'Krakowska 232, 32-080 Zabierzów'},
  {id:'aut-imbramowski', code:'IMB', name:'Plac Imbramowski',           addr:'pl. Imbramowski 179, 31-212 Kraków'},
  {id:'aut-przewoz',     code:'PRZ', name:'Przewóz, Delikatesy Premium', addr:'Przewóz 34A, 30-603 Kraków'},
  {id:'aut-galicyjska',  code:'GAL', name:'Kaufland, Galicyjska',       addr:'Galicyjska 8, 31-586 Kraków'},
  {id:'aut-jasnogorska', code:'JAS', name:'Kraków, Jasnogórska',        addr:'Jasnogórska 62, 31-358 Kraków'},
  {id:'aut-norymberska', code:'NOR', name:'Kaufland, Norymberska',      addr:'Norymberska 1, 30-376 Kraków'},
];
/** krótki kod z nazwy — awaryjnie, gdy ktoś doda automat bez kodu */
/** Kod z nazwy: pierwsze trzy litery, a przy nazwie dwuczłonowej — trzy i trzy
    przez spację. „Kaufland, Galicyjska" daje KAU GAL, a nie KAU i KA2, bo druga
    Kaufland dostałaby numer, którego nikt nie skojarzy z lokalizacją. */
function kodZNazwy(nazwa, zajete){
  const slowa = bezOgonkow(nazwa).split(/[^a-z0-9]+/).filter(w=>w.length > 2);
  const trzy = w => w.slice(0,3).toUpperCase();
  const krotki = slowa.length ? trzy(slowa[0]) : 'AUT';
  const dlugi  = slowa.length > 1 ? krotki + ' ' + trzy(slowa[1]) : krotki;
  if(!zajete.has(krotki)) return krotki;
  if(!zajete.has(dlugi)) return dlugi;
  let k = dlugi, i = 1;
  while(zajete.has(k)) k = dlugi + (++i);
  return k;
}
function migrateVending(){
  if(!DB) return;
  if(!Array.isArray(DB.machines))
    DB.machines = AUTOMATY_START.map(a=>Object.assign({note:''}, a));
  // kod identyfikuje automat na stronie załadunku i w wersji mobilnej
  const zajete = new Set(DB.machines.map(m=>m.code).filter(Boolean));
  DB.machines.forEach(m=>{
    if(m.code) return;
    const wzor = AUTOMATY_START.find(a=>a.id===m.id);
    m.code = (wzor && !zajete.has(wzor.code)) ? wzor.code : kodZNazwy(m.name, zajete);
    zajete.add(m.code);
  });
  DB.vending = Object.assign({perCol:VEND_PER_COL, slots:VEND_SLOTS, layout:{}}, DB.vending||{});
  if(!DB.vending.layout || typeof DB.vending.layout!=='object') DB.vending.layout={};
}
/** świeży załadunek: wszystkie szafki z przypisanym zestawem włączone */
function nowyZaladunek(nazwa){
  const z = {id:uid('zal'), name:nazwa||'', note:'', slots:{}};
  DB.machines.forEach(m=>{
    z.slots[m.id] = {};
    for(let n=1;n<=DB.vending.slots;n++)
      if(DB.vending.layout[String(n)]) z.slots[m.id][String(n)] = true;
  });
  return z;
}
/** czy szafka `n` automatu `mid` jest w tym załadunku zaznaczona */
function slotOn(z, mid, n){
  return !!(z.slots && z.slots[mid] && z.slots[mid][String(n)]);
}
function setSlotOn(z, mid, n, on){
  z.slots = z.slots||{}; z.slots[mid] = z.slots[mid]||{};
  if(on) z.slots[mid][String(n)] = true; else delete z.slots[mid][String(n)];
}
/** podsumowanie załadunku: ile szafek, wartość brutto i koszt netto (kanał Vending) */
function zalSuma(z, mid){
  // netto zbieramy zestaw po zestawie, bo stawka VAT siedzi przy zestawie, nie przy
  // załadunku — dzielenie sumy brutto przez jedną stawkę myli się, gdy któryś zestaw ma inną
  let szt=0, wartosc=0, netto=0, koszt=0; const wgZestawu={};
  const maszyny = mid ? DB.machines.filter(m=>m.id===mid) : active(DB.machines);
  maszyny.forEach(m=>{
    for(let n=1;n<=DB.vending.slots;n++){
      if(!slotOn(z, m.id, n)) continue;
      const s = slotSet(n); if(!s) continue;
      const c = CALC.setCalc(s,'vending');
      szt++; wartosc += c.priceGross||0; netto += c.priceNet||0; koszt += c.net;
      wgZestawu[s.id] = (wgZestawu[s.id]||0)+1;
    }
  });
  return {szt, wartosc, netto, koszt, wgZestawu};
}
/** wartość pełnego załadunku jednego automatu — wszystkie szafki z zestawem */
function pelnyAutomat(){
  let wartosc=0, netto=0, koszt=0, szt=0;
  for(let n=1;n<=DB.vending.slots;n++){
    const s = slotSet(n); if(!s) continue;
    const c = CALC.setCalc(s,'vending');
    szt++; wartosc += c.priceGross||0; netto += c.priceNet||0; koszt += c.net;
  }
  return {szt, wartosc, netto, koszt};
}

/** Rozwija załadunek w dół: z zestawów na rolki, z rolek na półprodukty
    i surowe składniki. Półprodukty pokazujemy osobno (bo kucharz je robi)
    i jednocześnie rozkładamy na surowce (bo trzeba je mieć w lodówce).
    Odpad wchodzi do zapotrzebowania — kupujesz całe kilo, nie pół. */
function zalRozpiska(z){
  const zestawy={}, rolki={}, polprodukty={}, skladniki={};

  const dodajSkladnik = (refId, ile, seen) => {
    if(!(ile>0)) return;
    const p = CALC.prep(refId);
    if(p){
      polprodukty[refId] = (polprodukty[refId]||0) + ile;
      if(seen.has(refId)) return;                       // ochrona przed pętlą
      const s2 = new Set(seen); s2.add(refId);
      if(!p.yieldQty) return;
      const partii = ile / p.yieldQty;
      p.items.forEach(c=>{
        const potrzeba = ((c.qty||0)+(c.waste||0)) * partii;
        if(c.kind==='raw'){ skladniki['raw:'+c.name] = (skladniki['raw:'+c.name]||0) + potrzeba; return; }
        dodajSkladnik(c.refId, potrzeba, s2);
      });
      return;
    }
    if(CALC.ing(refId)) skladniki[refId] = (skladniki[refId]||0) + ile;
  };

  active(DB.machines).forEach(m=>{
    for(let n=1;n<=DB.vending.slots;n++){
      if(!slotOn(z, m.id, n)) continue;
      const s = slotSet(n); if(!s) continue;
      zestawy[s.id] = (zestawy[s.id]||0) + 1;
    }
  });
  Object.keys(zestawy).forEach(sid=>{
    const s = CALC.set(sid), n = zestawy[sid];
    (s.entries||[]).forEach(e=>{ rolki[e.itemId] = (rolki[e.itemId]||0) + (e.pieces||0)*n; });
    (s.comps||[]).forEach(c=>dodajSkladnik(c.refId, (c.qty||0)*n, new Set()));
  });
  Object.keys(rolki).forEach(iid=>{
    const it = CALC.item(iid); if(!it || !it.pieces) return;
    const mnoznik = rolki[iid] / it.pieces;
    (it.comps||[]).forEach(c=>dodajSkladnik(c.refId, (c.qty||0)*mnoznik, new Set()));
  });
  return {zestawy, rolki, polprodukty, skladniki};
}

/* ---------- wybrany dzień ----------
   Widoki z grupy „Pulpit" pokazują jeden dzień: co ugotować, co zwinąć,
   co spakować. Dzień → dzień tygodnia → załadunek standardowy. */
let DAY = null;   // ustawiane przy starcie na dziś
function przesunDate(iso, n){
  const d = new Date(iso+'T12:00:00'); d.setDate(d.getDate()+n);
  return d.toISOString().slice(0,10);
}
function dzienKlucz(iso){
  const d = new Date(iso+'T12:00:00');
  return ['nd','pn','wt','sr','cz','pt','so'][d.getDay()];
}
function dzienNazwa(iso){
  const d = DNI.find(x=>x.k===dzienKlucz(iso));
  return d ? d.pl : '';
}
/** Data tak, jak się ją mówi: „piątek 07.08.2026". Nazwa dnia stała wcześniej obok,
    w osobnej plakietce — a to jest jedna informacja, nie dwie, i czyta się ją razem. */
function dataDluga(iso){
  return dzienNazwa(iso) + ' ' + iso.slice(8) + '.' + iso.slice(5,7) + '.' + iso.slice(0,4);
}
function zaladunekNaDate(iso){ return zaladunekNaDzien(dzienKlucz(iso)); }
/** komplet danych dnia: załadunek i rozpisany na czynniki plan produkcji */
function daneDnia(iso){
  const z = zaladunekNaDate(iso);
  return {iso, z, r: z ? zalRozpiska(z) : null};
}

/* ---------- dni tygodnia ----------
   Załadunek standardowy obowiązuje w wybrane dni. Każdy dzień może należeć
   tylko do jednego załadunku — inaczej nie wiadomo, co jedzie w poniedziałek. */
const DNI = [
  {k:'pn', l:'Pn', pl:'poniedziałek'},
  {k:'wt', l:'Wt', pl:'wtorek'},
  {k:'sr', l:'Śr', pl:'środa'},
  {k:'cz', l:'Cz', pl:'czwartek'},
  {k:'pt', l:'Pt', pl:'piątek'},
  {k:'so', l:'So', pl:'sobota'},
  {k:'nd', l:'Nd', pl:'niedziela'},
];
const DZIEN_IDX = {}; DNI.forEach((d,i)=>DZIEN_IDX[d.k]=i);

/** „Pn–Cz, So" zamiast „Pn, Wt, Śr, Cz, So" — zakresy zwijamy */
function dniLabel(days){
  const idx = (days||[]).map(k=>DZIEN_IDX[k]).filter(i=>i!=null).sort((a,b)=>a-b);
  if(!idx.length) return '';
  const grupy=[]; let od=idx[0], po=idx[0];
  for(let i=1;i<idx.length;i++){
    if(idx[i]===po+1){ po=idx[i]; continue; }
    grupy.push([od,po]); od=po=idx[i];
  }
  grupy.push([od,po]);
  return grupy.map(([a,b])=> a===b ? DNI[a].l : (b-a===1 ? DNI[a].l+', '+DNI[b].l : DNI[a].l+'–'+DNI[b].l)).join(', ');
}
/* Plan tygodnia trzymamy jako mapa dzień → załadunek, a nie listę dni przy
   załadunku. Dzięki temu „jeden dzień, jeden załadunek" wynika z samej
   struktury danych i nie da się tego złamać — nie ma czego walidować. */
function zaladunekNaDzien(k){
  const id = (DB.week||{})[k];
  if(!id) return null;
  const z = DB.loads.find(x=>x.id===id);
  return (z && !z.archived) ? z : null;
}
/** w które dni jedzie ten załadunek */
function dniZaladunku(z){
  return DNI.filter(d=>(DB.week||{})[d.k]===z.id).map(d=>d.k);
}
function ustawDzien(k, loadId){
  DB.week = DB.week || {};
  if(loadId) DB.week[k] = loadId; else delete DB.week[k];
}
function migrateLoads(){
  if(!Array.isArray(DB.loads)) DB.loads = [];
  DB.week = DB.week || {};
  // starszy zapis trzymał dni przy załadunku — przenosimy do mapy tygodnia
  DB.loads.forEach(z=>{
    if(!Array.isArray(z.days)) return;
    z.days.forEach(k=>{ if(DZIEN_IDX[k]!=null && !DB.week[k]) DB.week[k] = z.id; });
    delete z.days;
  });
  // wpisy wskazujące na nieistniejący załadunek tylko myliłyby plan
  Object.keys(DB.week).forEach(k=>{
    if(DZIEN_IDX[k]==null || !DB.loads.some(z=>z.id===DB.week[k])) delete DB.week[k];
  });
}

/** zestaw przypisany do szafki (null = pusta) */
function slotSet(n){
  const id = DB.vending.layout[String(n)];
  return id ? CALC.set(id) : null;
}

/** Do wersji 1.14 odpad był osobną linią receptury z flagą `waste:true`.
    Teraz jest drugą ilością przy tym samym składniku: `qty` idzie do produktu,
    `waste` tylko do kosztu. Czytelniej i o połowę mniej wierszy. */
function migrateWaste(p){
  if(!p || !Array.isArray(p.items)) return;
  const out = [];
  p.items.forEach(c=>{
    if(c.waste === true) return;                       // stare linie odpadu w drugim przebiegu
    out.push(Object.assign({}, c, {waste: typeof c.waste === 'number' ? c.waste : 0}));
  });
  p.items.forEach(c=>{
    if(c.waste !== true) return;
    const cel = out.find(x=>x.kind===c.kind && x.refId===c.refId && x.name===c.name);
    if(cel) cel.waste = (cel.waste||0) + (c.qty||0);
    else out.push(Object.assign({}, c, {qty:0, waste:(c.qty||0)}));
  });
  p.items = out;
}

/** Do wersji 1.8 zestaw trzymał tackę, pałeczki i sos w osobnym polu `pack`.
    Teraz to zwykłe dodatki — przenosimy je do `comps` i kasujemy stare pole.
    Ilości sumują się, gdy ten sam składnik był i w opakowaniu, i w dodatkach. */
function migratePack(s){
  s.comps = s.comps || [];
  const p = s.pack;
  if(!p) return;
  [[p.trayId,p.trayQty],[p.chopId,p.chopQty],[p.sauceId,p.sauceQty]].forEach(pair=>{
    const id=pair[0], q=pair[1];
    if(!id || !q) return;
    const ex = s.comps.find(c=>c.refId===id);
    if(ex) ex.qty = (ex.qty||0) + q; else s.comps.push({refId:id, qty:q});
  });
  delete s.pack;
}

/* ---------- podmiana składnika w całym menu ---------- */

/** wszystkie miejsca, w których występuje dany składnik lub półprodukt */
function occurrences(refId){
  const out=[];
  DB.items.forEach(i=>i.comps.forEach((c,idx)=>{ if(c.refId===refId)
    out.push({where:'rolka', name:itName(i), obj:i, list:i.comps, idx, kindField:false}); }));
  DB.preps.forEach(p=>p.items.forEach((c,idx)=>{ if(c.refId===refId)
    out.push({where:'półprodukt', name:p.name, obj:p, list:p.items, idx, kindField:true}); }));
  DB.sets.forEach(st=>{
    (st.comps||[]).forEach((c,idx)=>{ if(c.refId===refId)
      out.push({where:'dodatek zestawu', name:st.name, obj:st, list:st.comps, idx, kindField:false}); });
  });
  return out;
}

/** wystąpienia, których NIE wolno podmienić na `toId` — bo powstałaby pętla.

    Klasyczny przypadek: zamiana „Ryż” na półprodukt „Ryż gotowany”. Ryż surowy jest
    składnikiem tego półproduktu, więc podmiana w jego wnętrzu kazałaby mu liczyć
    samego siebie i koszt zapadłby się do zera. */
function skipsForCycle(fromId, toId){
  return occurrences(fromId).filter(o => o.obj && o.obj.id === toId);
}

/** podmienia wszystkie wystąpienia; qty przemnożone przez factor.
    Zwraca {zmienione, pominiete}. */
function replaceEverywhere(fromId, toId, factor){
  const isPrep = !!CALC.prep(toId);
  let n=0, skip=0;
  occurrences(fromId).forEach(o=>{
    if(o.obj && o.obj.id === toId){ skip++; return; }      // ochrona przed pętlą
    const c=o.list[o.idx];
    c.refId=toId;
    c.qty=(c.qty||0)*factor;
    if(o.kindField) c.kind = isPrep ? 'prep' : 'ing';
    n++;
  });
  return {zmienione:n, pominiete:skip};
}

/** czy któryś półprodukt przestał dawać się policzyć (pętla) */
function prepsBroken(){
  return DB.preps.some(p=>CALC.prepUnitCost(p.id)==null);
}

/* ---------------------------------------------------------------------------
   ARCHIWUM I USUWANIE — na końcu edycji, nie w ramce okna
   Stopka okna to miejsce na „Zapisz” i „Anuluj”. Przycisk, który kasuje pozycję
   bezpowrotnie, nie ma prawa stać obok przycisku klikanego dziesięć razy dziennie.
   Trafia więc na koniec bloku edycji, za wszystkie pola, z opisem, co robi.
   ------------------------------------------------------------------------- */
function strefaRyzykowna(o){
  if(!o) return '';
  return `<div class="ryzyko">
    <div class="txt"><b>Archiwum i usuwanie</b>
      <div class="hint">Archiwum chowa pozycję z list, ale zostawia ją w recepturach —
        koszty liczą się dalej. Usunięcie jest nieodwracalne i zadziała tylko wtedy,
        gdy nic już tej pozycji nie używa.</div></div>
    <div class="row">
      <button type="button" class="btn sm" data-strefa-arch>${
        o.archived?'Przywróć z archiwum':'Przenieś do archiwum'}</button>
      <button type="button" class="btn sm danger" data-strefa-del>Usuń bezpowrotnie</button>
    </div></div>`;
}
/** podpina oba przyciski strefy; `po` sprząta stan widoku po usunięciu */
function wireStrefa(key, id, po){
  const a = document.querySelector('[data-strefa-arch]');
  if(a) a.addEventListener('click', ()=>{
    if(toggleArchive(key, id)){ DLG.close(); render(); } });
  const d = document.querySelector('[data-strefa-del]');
  if(d) d.addEventListener('click', ()=>{
    if(deleteEntity(key, id)){ DLG.close(); if(po) po(); render(); } });
}
/** czy bieżący użytkownik może edytować dane */
/* Konto „pracownik" nie zapisuje bazy przez PUT /api/data — mogłoby wtedy zmienić
   ceny i receptury. Jego jedyna droga zapisu to POST /api/shift, który rusza wyłącznie
   własne zgłoszenie. Serwer pilnuje tego samego niezależnie od tego, co robi przeglądarka. */
function canEdit(){
  return !(SRV.on && SRV.user && (SRV.user.role==='viewer' || SRV.user.role==='staff'));
}
function clone(o){ return JSON.parse(JSON.stringify(o)); }
function todayISO(){ return new Date().toISOString().slice(0,10); }

/* ============================================================================
   WARTOŚCI ODŻYWCZE I ALERGENY
   Tabela składnika jest zawsze **na 100 g** — tak podają ją producenci i tego
   wymaga rozporządzenie 1169/2011. Przeliczenie na jednostkę składnika idzie
   przez masę tej jednostki (`gPerUnit`), bo nori liczymy w arkuszach,
   a krewetki w sztukach.
   ========================================================================== */
const NUTR = [
  {k:'kcal',    l:'Wartość energetyczna', u:'kcal'},
  {k:'fat',     l:'Tłuszcz',              u:'g'},
  {k:'satfat',  l:'w tym kwasy nasycone', u:'g', sub:true},
  {k:'carbs',   l:'Węglowodany',          u:'g'},
  {k:'sugars',  l:'w tym cukry',          u:'g', sub:true},
  {k:'protein', l:'Białko',               u:'g'},
  {k:'salt',    l:'Sól',                  u:'g'},
];
const ALERG = [
  ['gluten','Zboża zawierające gluten'], ['skorupiaki','Skorupiaki'], ['jaja','Jaja'],
  ['ryby','Ryby'], ['orzeszki','Orzeszki ziemne'], ['soja','Soja'], ['mleko','Mleko'],
  ['orzechy','Orzechy'], ['seler','Seler'], ['gorczyca','Gorczyca'], ['sezam','Nasiona sezamu'],
  ['siarczyny','Dwutlenek siarki i siarczyny'], ['lubin','Łubin'], ['mieczaki','Mięczaki'],
];
const ALERG_NAME = {}; ALERG.forEach(a=>ALERG_NAME[a[0]]=a[1]);

/** ile surowca schodzi na linię receptury: to, co zostaje, plus to, co się wyrzuca */
function lineQty(c){ return (c.qty||0) + (c.waste||0); }

function emptyNutr(){ const o={}; NUTR.forEach(n=>o[n.k]=0); return o; }
function addNutr(a,b,f){ NUTR.forEach(n=>a[n.k]+=(b[n.k]||0)*(f==null?1:f)); return a; }
/** czy składnik ma wypełnioną tabelę. Same zera to też odpowiedź —
    tacka naprawdę ma zero kalorii i nie powinna trafiać na listę braków. */
function hasNutr(n){ return !!n && NUTR.some(x=>n[x.k]!=null); }
/** ile gramów waży jedna jednostka; null = nie wiadomo */
function unitGrams(unit, explicit){
  if(unit==='g'||unit==='ml') return 1;
  if(unit==='kg'||unit==='l') return 1000;
  return explicit==null ? null : explicit;
}

const CALC = {
  ing(id){ return DB.ingredients.find(x=>x.id===id); },
  prep(id){ return DB.preps.find(x=>x.id===id); },
  item(id){ return DB.items.find(x=>x.id===id); },
  set(id){ return DB.sets.find(x=>x.id===id); },

  /** koszt jednostkowy składnika (za 1 jednostkę bazową) */
  ingUnitCost(id){
    const g = this.ing(id);
    if(!g || g.packPrice==null || !g.packQty) return null;
    return g.packPrice / g.packQty;
  },

  /** koszt jednostkowy półproduktu (za 1 jednostkę wydajności) */
  prepUnitCost(id, seen){
    seen = seen || new Set();
    if(seen.has(id)) return null;         // ochrona przed pętlą
    seen.add(id);
    const p = this.prep(id);
    if(!p || !p.yieldQty) return null;
    let tot = 0;
    for(const c of p.items){
      let uc = 0;
      if(c.kind==='raw') uc = c.unitCost||0;
      else if(c.kind==='ing') uc = this.ingUnitCost(c.refId)||0;
      else if(c.kind==='prep') uc = this.prepUnitCost(c.refId, seen)||0;
      tot += ((c.qty||0)+(c.waste||0))*uc;   // odpad też kosztuje
    }
    return tot / p.yieldQty;
  },

  /** koszt jednostkowy dowolnego komponentu + etykieta */
  compInfo(refId){
    const g = this.ing(refId);
    if(g) return {name:g.name, unit:g.unit, unitCost:this.ingUnitCost(refId), kind:'ing', cat:g.cat};
    const p = this.prep(refId);
    if(p) return {name:p.name, unit:p.yieldUnit, unitCost:this.prepUnitCost(refId), kind:'prep', cat:'Półprodukt'};
    return {name:'⚠ brak: '+refId, unit:'', unitCost:null, kind:'missing', cat:'—'};
  },

  /** rozbicie kosztu listy komponentów */
  breakdown(comps){
    const rows=[]; let tot=0; const missing=[];
    for(const c of comps){
      const info = this.compInfo(c.refId);
      const uc = info.unitCost;
      const cost = (c.qty||0) * (uc||0);
      if(uc==null) missing.push(info.name);
      rows.push({refId:c.refId, name:info.name, unit:info.unit, qty:c.qty, unitCost:uc, cost, kind:info.kind});
      tot += cost;
    }
    rows.sort((a,b)=>b.cost-a.cost);
    return {rows, total:tot, missing};
  },

  /** cena brutto w danym kanale */
  priceOf(o, chan){ return (o && o.prices) ? o.prices[chan||CHAN] : null; },
  /** stawka VAT w danym kanale */
  vatOf(o, chan){
    const c = chan||CHAN;
    if(o && o.vats && o.vats[c]!=null) return o.vats[c];
    return (DB.settings.vats && DB.settings.vats[c]!=null)
      ? DB.settings.vats[c]
      : (CHANNELS.find(x=>x.k===c)||{vat:0.08}).vat;
  },

  /** pełna kalkulacja pozycji menu w wybranym kanale */
  itemCalc(it, chan){
    const b = this.breakdown(it.comps);
    const vat = this.vatOf(it, chan);
    const pieces = it.pieces||1;
    const priceGross = this.priceOf(it, chan)||0;
    const priceNet = priceGross/(1+vat);
    return {
      ...b,
      net: b.total,
      gross: b.total*(1+vat),
      perPiece: b.total/pieces,
      pricePerPiece: priceGross/pieces,
      priceGross, priceNet, vat, pieces, chan: chan||CHAN,
      fc: priceNet>0 ? b.total/priceNet : null,
      margin: priceNet>0 ? priceNet-b.total : null,
      suggested: this.suggest(b.total, vat, DB.settings.targetFc),
    };
  },

  /** pełna kalkulacja zestawu */
  setCalc(st, chan){
    let cost=0, pieces=0; const parts=[]; const missing=[];
    for(const e of (st.entries||[])){
      const it = this.item(e.itemId);
      if(!it){ missing.push('pozycja '+e.itemId); continue; }
      const ic = this.itemCalc(it, chan);
      const c = ic.perPiece*(e.pieces||0);
      cost += c; pieces += (e.pieces||0);
      parts.push({name:itName(it), itemId:it.id, pieces:e.pieces, perPiece:ic.perPiece, cost:c,
                  alaCarte: ic.pricePerPiece*(e.pieces||0)});
      ic.missing.forEach(m=>missing.push(m));
    }
    const extra = this.breakdown(st.comps||[]);
    extra.missing.forEach(m=>missing.push(m));
    cost += extra.total;
    const vat = this.vatOf(st, chan);
    const priceGross = this.priceOf(st, chan)||0, priceNet = priceGross/(1+vat);
    const alaCarte = parts.reduce((s,p)=>s+p.alaCarte,0);
    return {
      parts, extra, packaging:extra.total,
      pieces, net:cost, gross:cost*(1+vat),
      priceGross, priceNet, vat, alaCarte, chan: chan||CHAN,
      discount: alaCarte>0 ? 1-priceGross/alaCarte : null,
      fc: priceNet>0 ? cost/priceNet : null,
      margin: priceNet>0 ? priceNet-cost : null,
      perPiece: pieces? cost/pieces : null,
      suggested: this.suggest(cost, vat, DB.settings.targetFc),
      missing:[...new Set(missing)],
    };
  },

  /** cena sprzedaży brutto dla zadanego food cost */
  suggest(net, vat, targetFc){
    if(!targetFc||!net) return null;
    const raw = net*(1+vat)/targetFc;
    const step = DB.settings.roundTo;
    if(!step) return raw;
    // zaokrąglenie w górę do najbliższej końcówki ,90 / pełnej złotówki
    if(step===0.9){ const base=Math.floor(raw); return (raw<=base+0.9? base+0.9 : base+1.9); }
    return Math.ceil(raw/step)*step;
  },

  /* -------- wartości odżywcze -------- */

  /** masa 1 jednostki składnika w gramach */
  ingGrams(id){ const g=this.ing(id); return g ? unitGrams(g.unit, g.gPerUnit) : null; },

  /** wartości odżywcze 1 jednostki składnika (tabela jest na 100 g) */
  ingNutr(id){
    const g=this.ing(id);
    if(!g || !hasNutr(g.nutr)) return null;
    const gr=unitGrams(g.unit, g.gPerUnit);
    if(gr==null) return null;
    const o={}; NUTR.forEach(n=>o[n.k]=(g.nutr[n.k]||0)*gr/100);
    return o;
  },

  /** wartości odżywcze 1 jednostki półproduktu.
      Linie oznaczone jako **odpad** wchodzą do kosztu, ale nie do wartości
      odżywczych — z kilograma ogórka zostaje pół kilo miąższu i pół kilo
      obierek, a płacisz za całość. */
  prepNutr(id, seen){
    // przyjmuje id albo gotowy obiekt — dzięki temu edytor liczy na kopii,
    // bez podmieniania czegokolwiek w DB
    const p = (id && typeof id === 'object') ? id : this.prep(id);
    if(!p || !p.yieldQty) return null;
    seen = seen || new Set();
    if(seen.has(p.id)) return null;
    seen.add(p.id);
    const tot=emptyNutr(); let any=false; const missing=[];
    for(const c of p.items){
      if(!(c.qty>0)) continue;             // linia to sam odpad — kosztuje, nie odżywia
      let n=null, nazwa='';
      if(c.kind==='raw'){
        nazwa=c.name;
        if(hasNutr(c.nutr)){
          const gr=unitGrams(c.unit, c.gPerUnit);
          if(gr!=null){ n={}; NUTR.forEach(x=>n[x.k]=(c.nutr[x.k]||0)*gr/100); }
        }
      } else if(this.prep(c.refId)){
        const r=this.prepNutr(c.refId, seen); nazwa=(this.prep(c.refId)||{}).name;
        if(r && r.ok) n=r.nutr;
      } else {
        n=this.ingNutr(c.refId); nazwa=this.compInfo(c.refId).name;
      }
      if(!n){ missing.push(nazwa); continue; }
      addNutr(tot, n, c.qty||0); any=true;
    }
    const o={}; NUTR.forEach(x=>o[x.k]=tot[x.k]/p.yieldQty);
    return {nutr:o, grams:unitGrams(p.yieldUnit, p.gPerUnit), ok:any&&!missing.length, missing};
  },

  /** alergeny półproduktu — także z linii oznaczonych jako odpad,
      bo obierki i tak dotykają produktu */
  prepAlerg(id, seen){
    seen = seen || new Set();
    if(seen.has(id)) return [];
    seen.add(id);
    const p=this.prep(id); if(!p) return [];
    const out=new Set();
    p.items.forEach(c=>{
      if(c.kind==='raw'){ (c.alerg||[]).forEach(a=>out.add(a)); return; }
      if(this.prep(c.refId)) this.prepAlerg(c.refId, seen).forEach(a=>out.add(a));
      else { const g=this.ing(c.refId); if(g) (g.alerg||[]).forEach(a=>out.add(a)); }
    });
    return [...out];
  },

  /** suma wartości odżywczych i masy dla listy komponentów */
  nutrOf(comps){
    const tot=emptyNutr(); let mass=0; const missing=[], noMass=[]; const al=new Set();
    for(const c of (comps||[])){
      const g=this.ing(c.refId), p=this.prep(c.refId);
      const nazwa=this.compInfo(c.refId).name;
      let n=null, gr=null;
      if(g){ n=this.ingNutr(c.refId); gr=unitGrams(g.unit,g.gPerUnit); (g.alerg||[]).forEach(a=>al.add(a)); }
      else if(p){ const r=this.prepNutr(c.refId); if(r){ n=r.ok?r.nutr:null; gr=r.grams; }
                  this.prepAlerg(c.refId).forEach(a=>al.add(a)); }
      if(gr==null) noMass.push(nazwa); else mass += (c.qty||0)*gr;
      if(!n){ if(g||p) missing.push(nazwa); continue; }
      addNutr(tot, n, c.qty||0);
    }
    return {nutr:tot, mass, missing:[...new Set(missing)], noMass:[...new Set(noMass)], alerg:[...al]};
  },

  /** wartości odżywcze rolki */
  itemNutr(it){ return this.nutrOf(it.comps); },

  /** wartości odżywcze zestawu: rolki przeliczone po kawałkach + dodatki */
  setNutr(st){
    const tot=emptyNutr(); let mass=0; const missing=[], noMass=[]; const al=new Set();
    for(const e of (st.entries||[])){
      const it=this.item(e.itemId); if(!it || !it.pieces) continue;
      const r=this.itemNutr(it); const f=(e.pieces||0)/it.pieces;
      addNutr(tot, r.nutr, f); mass += r.mass*f;
      r.missing.forEach(m=>missing.push(m)); r.noMass.forEach(m=>noMass.push(m));
      r.alerg.forEach(a=>al.add(a));
    }
    const ex=this.nutrOf(st.comps);
    addNutr(tot, ex.nutr, 1); mass += ex.mass;
    ex.missing.forEach(m=>missing.push(m)); ex.noMass.forEach(m=>noMass.push(m));
    ex.alerg.forEach(a=>al.add(a));
    return {nutr:tot, mass, missing:[...new Set(missing)], noMass:[...new Set(noMass)], alerg:[...al]};
  },

  /** gdzie użyty jest składnik */
  usedBy(refId){
    const out=[];
    DB.items.forEach(i=>{ if(i.comps.some(c=>c.refId===refId)) out.push({type:'item',id:i.id,name:itName(i)}); });
    DB.preps.forEach(p=>{ if(p.items.some(c=>c.refId===refId)) out.push({type:'prep',id:p.id,name:p.name}); });
    DB.sets.forEach(s=>{
      if((s.comps||[]).some(c=>c.refId===refId)
         || (s.entries||[]).some(e=>e.itemId===refId))
        out.push({type:'set',id:s.id,name:s.name});
    });
    return out;
  },

  status(fc){
    if(fc==null) return 'none';
    const t=DB.settings.targetFc, a=DB.settings.alertFc;
    if(fc>a) return 'crit';
    if(fc>t) return 'warn';
    return 'good';
  },
};

/* ============================================================================
   PROBLEMY / ALERTY
   ========================================================================== */
function problems(){
  const out=[];
  const idle=[];
  active(DB.ingredients).forEach(g=>{
    if(g.packPrice==null || !g.packQty){
      const used = CALC.usedBy(g.id);
      if(used.length) out.push({sev:'crit', k:'noprice',
        title:'Brak ceny: '+g.name,
        msg:'Używany w '+used.length+' recepturach ('+used.map(u=>u.name).join(', ')+') — ich koszt jest zaniżony.',
        go:{v:'ing', id:g.id}});
      else idle.push(g.name);
    }
  });
  if(idle.length) out.push({sev:'info',k:'idle',
    title:idle.length+' składników bez ceny, nieużywanych w recepturach',
    msg:idle.join(', ')+'. Uzupełnij ceny, zanim dopiszesz je do receptur lub zestawów.',
    go:{v:'ing'}});
  active(DB.items).forEach(i=>{
    const c = CALC.itemCalc(i);
    const bezCeny = CHANNELS.filter(ch=>!CALC.priceOf(i, ch.k));
    if(bezCeny.length && i.comps.length)
      out.push({sev: bezCeny.length===CHANNELS.length?'warn':'info', k:'noprice2',
        title:'Brak ceny sprzedaży: '+itName(i),
        msg:'Nie podano ceny w kanale: '+bezCeny.map(ch=>ch.l).join(', ')+'. Bez niej nie da się policzyć food costu.',
        go:{v:'items',id:i.id}});
    if(c.missing.length) out.push({sev:'crit', k:'itemmiss',
      title:'Rolka '+itName(i)+' — niekompletne dane',
      msg:'Brakuje ceny: '+c.missing.join(', ')+'. Koszt jest zaniżony o ten składnik, '
          +'więc food cost tej rolki jest za niski. Pozycja nie wchodzi do średniej.',
      go:{v:'items',id:i.id}});
    if(!CALC.priceOf(i)) return;
    if(c.fc!=null && c.fc>DB.settings.alertFc)
      out.push({sev:'crit',k:'fc',title:itName(i)+' — food cost '+pct(c.fc),
        msg:'Powyżej progu alertu '+pct(DB.settings.alertFc)+'. Sugerowana cena: '+zl(c.suggested)+'.',go:{v:'items',id:i.id}});
    else if(c.fc!=null && c.fc>DB.settings.targetFc)
      out.push({sev:'warn',k:'fc',title:itName(i)+' — food cost '+pct(c.fc),
        msg:'Powyżej celu '+pct(DB.settings.targetFc)+'.',go:{v:'items',id:i.id}});
  });
  const bezNutr = active(DB.ingredients).filter(g=>!hasNutr(g.nutr) && CALC.usedBy(g.id).length);
  if(bezNutr.length) out.push({sev:'info',k:'nonutr',
    title:bezNutr.length+' składników bez tabeli odżywczej',
    msg:bezNutr.map(g=>g.name).join(', ')+'. Bez nich wartości odżywcze rolek i zestawów są niepełne.',
    go:{v:'ing'}});
  const bezMasy = active(DB.ingredients).filter(g=>unitGrams(g.unit,g.gPerUnit)==null && CALC.usedBy(g.id).length);
  if(bezMasy.length) out.push({sev:'warn',k:'nomass',
    title:bezMasy.length+' składników bez wagi jednostki',
    msg:bezMasy.map(g=>g.name).join(', ')+'. Liczone w sztukach — podaj, ile waży jedna, inaczej nie da się policzyć wartości na 100 g.',
    go:{v:'ing'}});
  const noExtra = active(DB.sets).filter(s=>!(s.comps||[]).length);
  if(noExtra.length) out.push({sev:'warn',k:'nopack',
    title:noExtra.length+' zestawów bez dodatków',
    msg:'Poza rolkami nie mają nic — ani tacki, ani pałeczek, ani sosu: '+noExtra.map(s=>s.name).join(', ')+'. Food cost tych zestawów jest zaniżony.',
    go:{v:'sets'}});
  active(DB.sets).forEach(s=>{
    const c = CALC.setCalc(s);
    if(c.missing.length) out.push({sev:'crit',k:'setmiss',title:'Zestaw '+s.name+' — niekompletne dane',msg:'Brakuje: '+c.missing.join(', '),go:{v:'sets',id:s.id}});
    if(c.fc!=null && c.fc>DB.settings.alertFc)
      out.push({sev:'crit',k:'setfc',title:s.name+' — food cost '+pct(c.fc),msg:'Powyżej progu alertu. Sugerowana cena: '+zl(c.suggested)+'.',go:{v:'sets',id:s.id}});
  });
  [['ing',DB.ingredients],['prep',DB.preps],['items',DB.items]].forEach(([k,list])=>{
    list.filter(x=>x.archived).forEach(o=>{
      const used = usedByActive(o.id);
      if(used.length) out.push({sev:'warn', k:'archused',
        title:'W archiwum, ale wciąż używane: '+o.name,
        msg:'Występuje w: '+used.map(u=>u.name).join(', ')+'. Koszt liczy się normalnie, '
            +'ale warto podmienić na aktualny odpowiednik albo przywrócić z archiwum.',
        go:{v:k, id:o.id}});
    });
  });
  const rank={crit:0,warn:1,info:2};
  out.sort((a,b)=>rank[a.sev]-rank[b.sev]);
  return out;
}

/* ============================================================================
   WYKRESY (inline SVG, hover + tooltip)
   ========================================================================== */
const TIP = document.getElementById('tip');
function showTip(html,x,y){ TIP.innerHTML=html; TIP.style.opacity=1;
  const r=TIP.getBoundingClientRect();
  TIP.style.left=Math.min(x+14, innerWidth-r.width-10)+'px';
  TIP.style.top=Math.max(8, y-r.height-12)+'px'; }
function hideTip(){ TIP.style.opacity=0; }

/* Dymek przeglądarki (`title`) wygląda w każdym systemie inaczej i nigdzie nie wygląda
   jak nasza aplikacja: żółte pudełko, systemowy krój, sekunda opóźnienia. Skoro mamy
   własny dymek do wykresów, to samo pudełko obsługuje teraz plakietki osób. */
document.addEventListener('mouseover', e=>{
  const el = e.target.closest && e.target.closest('[data-tip]');
  if(!el || !el.dataset.tip) return;
  const r = el.getBoundingClientRect();
  showTip(esc(el.dataset.tip), r.left + r.width / 2 - 14, r.top);
});
document.addEventListener('mouseout', e=>{
  if(e.target.closest && e.target.closest('[data-tip]')) hideTip();
});
/* Klawiatura też musi go dostać — plakietka bywa jedynym miejscem, gdzie widać,
   kto się kryje pod skrótem. */
document.addEventListener('focusin', e=>{
  const el = e.target.closest && e.target.closest('[data-tip]');
  if(!el || !el.dataset.tip) return;
  const r = el.getBoundingClientRect();
  showTip(esc(el.dataset.tip), r.left + r.width / 2 - 14, r.top);
});
document.addEventListener('focusout', hideTip);

/** poziomy wykres słupkowy z progiem — status wg food cost */
function barChartFc(rows, opts){
  opts = opts||{};
  const H=26, PAD=6, LW=opts.labelW||168, RW=64, W=opts.width||760;
  const h = rows.length*H + 34;
  const max = Math.max(opts.max||0, ...rows.map(r=>r.v||0), DB.settings.alertFc*1.15);
  const plotW = W-LW-RW;
  const x = v => LW + (v/max)*plotW;
  const ticks=[];
  const stepN = 0.1;
  for(let t=0;t<=max+1e-9;t+=stepN) ticks.push(t);
  let s = `<svg class="chart" viewBox="0 0 ${W} ${h}" width="100%" height="${h}" role="img">`;
  ticks.forEach(t=>{ s+=`<line class="gl" x1="${x(t).toFixed(1)}" y1="20" x2="${x(t).toFixed(1)}" y2="${rows.length*H+20}"/>
    <text x="${x(t).toFixed(1)}" y="13" text-anchor="middle">${Math.round(t*100)}%</text>`; });
  // linia celu
  const tx = x(DB.settings.targetFc);
  s+=`<line x1="${tx.toFixed(1)}" y1="16" x2="${tx.toFixed(1)}" y2="${rows.length*H+20}" stroke="var(--ink-2)" stroke-width="1.5" stroke-dasharray="3 3"/>`;
  s+=`<text class="lbl" x="${tx.toFixed(1)}" y="${rows.length*H+32}" text-anchor="middle">cel ${Math.round(DB.settings.targetFc*100)}%</text>`;
  rows.forEach((r,i)=>{
    const y=20+i*H, bw=Math.max(2,x(r.v)-LW);
    const col = r.st==='crit'?'var(--crit)':r.st==='warn'?'var(--warn)':'var(--good)';
    s+=`<text class="lbl" x="${LW-10}" y="${y+15}" text-anchor="end">${esc(r.label.length>26?r.label.slice(0,25)+'…':r.label)}</text>`;
    s+=`<rect class="bar" x="${LW}" y="${y+4}" width="${bw.toFixed(1)}" height="14" fill="${col}"/>`;
    s+=`<text class="val" x="${(LW+bw+8).toFixed(1)}" y="${y+15}">${pct(r.v)}</text>`;
    s+=`<rect class="hit" x="0" y="${y}" width="${W}" height="${H}" data-i="${i}"/>`;
  });
  s+='</svg>';
  return s;
}

/** pionowy/poziomy wykres udziału kosztów (jedna seria → sekwencyjny błękit) */
function barChartCost(rows, W){
  W = W||520;
  const H=24, LW=Math.min(170, W*0.36), RW=78;
  const h=rows.length*H+8;
  const max=Math.max(...rows.map(r=>r.cost),0.0001);
  const plotW=W-LW-RW;
  const RAMP=['#2a78d6','#3987e5','#5598e7','#6da7ec','#86b6ef','#9ec5f4','#b7d3f6','#cde2fb'];
  let s=`<svg class="chart" viewBox="0 0 ${W} ${h}" width="100%" height="${h}">`;
  const maxCh=Math.max(8, Math.floor((LW-12)/5.9));
  rows.forEach((r,i)=>{
    const y=i*H, bw=Math.max(2,(r.cost/max)*plotW);
    s+=`<text class="lbl" x="${LW-9}" y="${y+15}" text-anchor="end">${esc(r.name.length>maxCh?r.name.slice(0,maxCh-1)+'…':r.name)}</text>`;
    s+=`<rect class="bar" x="${LW}" y="${y+4}" width="${bw.toFixed(1)}" height="13" fill="${RAMP[Math.min(i,RAMP.length-1)]}"/>`;
    s+=`<text class="val" x="${(LW+bw+7).toFixed(1)}" y="${y+15}">${num(r.cost)}</text>`;
    s+=`<rect class="hit" x="0" y="${y}" width="${W}" height="${H}" data-i="${i}"/>`;
  });
  s+='</svg>';
  return s;
}

/** wykres liniowy historii ceny */
function lineChart(pts, W, Hh){
  W=W||640; Hh=Hh||190;
  if(pts.length<2) return '<div class="empty">Za mało punktów, żeby narysować wykres (potrzebne min. 2 zmiany ceny).</div>';
  const PL=52,PR=16,PT=14,PB=26;
  const xs=pts.map((p,i)=>i), ys=pts.map(p=>p.v);
  const ymin=Math.min(...ys), ymax=Math.max(...ys);
  const pad=(ymax-ymin)*0.15||Math.abs(ymax*0.1)||1;
  const lo=Math.max(0,ymin-pad), hi=ymax+pad;
  const X=i=>PL+(i/(pts.length-1))*(W-PL-PR);
  const Y=v=>PT+(1-(v-lo)/(hi-lo||1))*(Hh-PT-PB);
  let s=`<svg class="chart" viewBox="0 0 ${W} ${Hh}" width="100%" height="${Hh}">`;
  for(let k=0;k<=4;k++){ const v=lo+(hi-lo)*k/4;
    s+=`<line class="gl" x1="${PL}" y1="${Y(v).toFixed(1)}" x2="${W-PR}" y2="${Y(v).toFixed(1)}"/>
        <text x="${PL-8}" y="${(Y(v)+4).toFixed(1)}" text-anchor="end">${num(v)}</text>`; }
  const d=pts.map((p,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(p.v).toFixed(1)).join(' ');
  s+=`<path d="${d}" fill="none" stroke="var(--dane)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
  pts.forEach((p,i)=>{
    s+=`<circle cx="${X(i).toFixed(1)}" cy="${Y(p.v).toFixed(1)}" r="4" fill="var(--dane)" stroke="var(--surface)" stroke-width="2"/>`;
    if(i===0||i===pts.length-1) s+=`<text x="${X(i).toFixed(1)}" y="${Hh-8}" text-anchor="${i?'end':'start'}">${esc(p.d)}</text>`;
    s+=`<rect class="hit" x="${(X(i)-14).toFixed(1)}" y="0" width="28" height="${Hh}" data-i="${i}"/>`;
  });
  s+='</svg>';
  return s;
}

function wireChart(el, rows, fmt){
  el.querySelectorAll('.hit').forEach(h=>{
    h.addEventListener('mousemove',e=>{ const r=rows[+h.dataset.i]; if(r) showTip(fmt(r), e.clientX, e.clientY); });
    h.addEventListener('mouseleave',hideTip);
    h.addEventListener('click',()=>{ const r=rows[+h.dataset.i]; if(r&&r.go) go(r.go.v, r.go.id); });
  });
}

/* ============================================================================
   NAWIGACJA
   ========================================================================== */
/** który element listy jest wybrany w danym widoku */
const SEL_KEY = {items:'item', sets:'set', ing:'ing', prep:'prep', vend:'mach', load:'load'};
/* Ekrany, które ktoś czyta w ruchu: kuchnia przy blacie, kierowca w aucie, pracownik
   w telefonie. Dostają większe pismo i luźniejsze wiersze — reszta zostaje gęsta. */
const EKRANY_DNIA = new Set(['dHome','dPrep','dRolki','dZest','dPack','driver','stock',
                             'dSklad','graf']);

/** `go(v)` bez id znaczy „pokaż listę" — dlatego czyści wybór.
    `go(v, id)` znaczy „pokaż tę jedną pozycję". */
/* ---------------------------------------------------------------------------
   HISTORIA PRZEGLĄDARKI
   Aplikacja jest jednym plikiem i nigdy nie zmieniała adresu, więc dla przeglądarki
   cała praca była JEDNYM wpisem w historii — „wstecz" wychodziło z aplikacji,
   gdziekolwiek się je nacisnęło. Na telefonie to podstawowy gest nawigacji, często
   systemowy przycisk albo przesunięcie palcem od krawędzi: najnaturalniejszy ruch
   wyrzucał człowieka z pracy.

   Nowy wpis dostaje ZMIANA EKRANU i zejście głębiej (skład pozycji, wybór automatu).
   Wybór wiersza, zmiana daty i przełączniki widoku odświeżają tylko adres — inaczej
   „wstecz" cofałoby o jedno kliknięcie w tabeli zamiast o jeden ekran.
   ------------------------------------------------------------------------- */
let ZHISTORII = false;   // trwa przywracanie stanu — nie dokładamy wtedy wpisów
let WPIS = 0;            // ile razy weszliśmy głębiej; 0 = wejście do aplikacji

/** Wszystko, co trzeba znać, żeby odtworzyć to, na co człowiek patrzy. */
function stanWidoku(){
  const s = {v: VIEW};
  const k = SEL_KEY[VIEW];
  if(k && SEL[k]) s.id = SEL[k];
  if(VIEW === 'dSklad' && PODGLAD){ s.typ = PODGLAD.typ; s.id = PODGLAD.id; }
  if(VIEW === 'driver' && KIER) s.id = KIER;
  if(VIEW === 'graf') s.tryb = GRAF.tryb;
  if(EKRANY_DNIA.has(VIEW) && DAY) s.dzien = DAY;
  return s;
}
/** Adres do paska przeglądarki — ma dać się przeczytać i wysłać dalej. */
function adresStanu(s){
  if(s.v === 'dSklad') return '#sklad/' + (s.typ||'') + (s.id ? '/' + s.id : '');
  return '#' + s.v + (s.tryb ? '/' + s.tryb : '') + (s.id ? '/' + s.id : '');
}
function stanZAdresu(hash){
  const cz = String(hash||'').replace(/^#/, '').split('/').filter(Boolean);
  if(!cz.length) return null;
  if(cz[0] === 'sklad') return cz[1] ? {v:'dSklad', typ:cz[1], id:cz[2]} : null;
  const s = {v: cz[0]};
  if(cz[1] === 'tydz' || cz[1] === 'mies'){ s.tryb = cz[1]; if(cz[2]) s.id = cz[2]; }
  else if(cz[1]) s.id = cz[1];
  return s;
}
/** `glebiej` = nowy wpis w historii; bez tego tylko odświeżamy adres bieżącego. */
function zapiszHistorie(glebiej){
  if(ZHISTORII) return;
  const s = stanWidoku();
  // Kliknięcie w tę samą zakładkę drugi raz nie jest przejściem. Bez tego dziesięć
  // kliknięć w „Rolki" kładło dziesięć identycznych wpisów i „wstecz" przestawało
  // cokolwiek zmieniać na ekranie.
  const teraz = history.state;
  if(glebiej && teraz && teraz.v === s.v && teraz.id === s.id
     && teraz.typ === s.typ && teraz.tryb === s.tryb) glebiej = false;
  s.n = glebiej ? ++WPIS : WPIS;
  try{
    history[glebiej ? 'pushState' : 'replaceState'](s, '', adresStanu(s));
  }catch(e){}
}
/** Odtworzenie stanu z wpisu historii — bez dokładania nowych wpisów. */
function przywrocStan(s){
  if(!s || !s.v) return;
  ZHISTORII = true;
  try{
    WPIS = s.n || 0;
    VIEW = s.v;
    if(s.dzien) DAY = s.dzien;
    if(s.v === 'dSklad'){ PODGLAD = s.id ? {typ:s.typ, id:s.id} : null; }
    else {
      PODGLAD = null;          // wychodzimy ze składu — podgląd przestaje istnieć
      const k = SEL_KEY[s.v];
      if(k) SEL[k] = s.id || null;
      if(s.v === 'driver') KIER = s.id || null;
      if(s.v === 'graf' && s.tryb) GRAF.tryb = s.tryb;
    }
    document.querySelectorAll('.nav').forEach(b=>b.classList.toggle('on', b.dataset.v===VIEW));
    odslonGrupeAktywnej();
    odswiezBurger();
    render();
  }finally{ ZHISTORII = false; }
}
/* --- WARSTWY NA WIERZCHU EKRANU -------------------------------------------
   Okno edycji i szuflada menu na telefonie to warstwy nad ekranem, nie osobne miejsca.
   „Wstecz" ma je zdejmować, zanim ruszy ekran pod spodem — na telefonie to ten sam gest,
   którym zamyka się wszystko inne.

   Warstwa dokłada wpis bliźniaczy do bieżącego ekranu: ten sam widok, tylko z etykietą.
   „Wstecz" zdejmuje warstwę i nie przerysowuje ekranu, a „dalej" wraca do wpisu, który
   opisuje dokładnie ten sam widok — więc nie ma czego zepsuć.
   ------------------------------------------------------------------------- */
function czyWarstwaOtwarta(){
  if(DLG && DLG.open) return 'dlg';
  if(document.getElementById('side').classList.contains('open')) return 'menu';
  return null;
}
function zamknijWarstwe(nazwa){
  if(nazwa === 'dlg'){ if(DLG && DLG.open) DLG.close(); }
  else menuMobilne(false);
}
/** Otwarcie warstwy — dokłada wpis, żeby „wstecz" miało co zdjąć. */
function warstwaOtwarta(nazwa){
  if(ZHISTORII) return;
  const s = stanWidoku();
  s.warstwa = nazwa; s.n = ++WPIS;
  try{ history.pushState(s, '', adresStanu(s)); }catch(e){}
}
/** Zamknięcie warstwy z wnętrza aplikacji (przycisk, Escape, klik w tło) — zdejmujemy
    też jej wpis, żeby „wstecz" nie musiało być naciskane dwa razy. */
function warstwaZamknieta(){
  if(ZHISTORII) return;
  if(history.state && history.state.warstwa){ ZAMYKAM = true; history.back(); }
}
let ZAMYKAM = false;    // trwa zdejmowanie wpisu po zamkniętej już warstwie

window.addEventListener('popstate', e=>{
  const s = e.state || stanZAdresu(location.hash) || {v:'dHome', n:0};
  WPIS = s.n || 0;
  // 1. wpis po warstwie, którą sami przed chwilą zamknęliśmy — nie ma nic do roboty
  if(ZAMYKAM){ ZAMYKAM = false; return; }
  // 2. „wstecz" przy otwartej warstwie: zdejmujemy warstwę, ekran zostaje
  const otwarta = czyWarstwaOtwarta();
  if(otwarta && !s.warstwa){ zamknijWarstwe(otwarta); return; }
  // 3. „dalej" na wpis warstwy, której już nie ma: widok jest ten sam, więc nic nie robimy
  if(!otwarta && s.warstwa && s.v === VIEW) return;
  przywrocStan(s);
});
/** „← Wróć" i „wstecz" mają robić to samo. Gdy przed nami nie ma naszego wpisu
    (ktoś wszedł prosto z adresu), cofamy się do wskazanego ekranu zamiast wychodzić
    z aplikacji. */
function wrocWstecz(cel){
  if(WPIS > 0){ history.back(); return; }
  go(cel || 'dHome');
}

function go(v, id){
  const klucz = SEL_KEY[v];
  const bylTen = VIEW===v;
  VIEW=v;
  if(klucz) SEL[klucz] = id || null;
  document.querySelectorAll('.nav').forEach(b=>b.classList.toggle('on', b.dataset.v===v));
  odslonGrupeAktywnej();
  odswiezBurger();
  // Wpis do historii POWSTAJE PRZED przerysowaniem. Odwrotna kolejność kasowała
  // poprzedni ekran: `render()` odświeża adres bieżącego wpisu, więc zdążyłby nadpisać
  // wpis, z którego właśnie wychodzimy — i „wstecz" trzeba było naciskać dwa razy.
  zapiszHistorie(true);
  render();
  if(!bylTen || !id) window.scrollTo(0,0);
}

/* ============================================================================
   SORTOWANIE TABEL
   Jeden mechanizm dla wszystkich tabel: <table data-tbl="klucz">, a kolumny
   bez sensu do sortowania dostają <th data-nosort>. Wybór trzyma się między
   przerysowaniami widoku, bo siedzi w SORT, a nie w DOM-ie.
   ========================================================================== */
const SORT = {};
const ORD = {items:false, sets:false};   // tryb „Ustaw kolejność" na listach

/** liczba wyciągnięta z komórki („6,48 zł" → 6.48); null gdy to nie liczba */
function cellNum(t){
  const s = t.replace(/[\s\u00a0]/g,'').replace(/zł|%/g,'').replace(',','.');
  return /^[+-]?\d*\.?\d+$/.test(s) ? parseFloat(s) : null;
}
function cellTxt(td){
  return td.dataset.sv !== undefined ? td.dataset.sv : td.textContent.trim();
}
function applySort(tb, key){
  const st = SORT[key]; if(!st) return;
  const body = tb.tBodies[0]; if(!body) return;
  const rows = [...body.rows].filter(r=>!r.querySelector('.empty'));
  if(rows.length < 2) return;
  rows.sort((ra,rb)=>{
    const a = ra.cells[st.i], b = rb.cells[st.i];
    if(!a || !b) return 0;
    const A = cellTxt(a), B = cellTxt(b);
    // puste zawsze na końcu, w obie strony — inaczej połowa sortowań
    // pokazuje najpierw same myślniki
    const ea = A===''||A==='—', eb = B===''||B==='—';
    if(ea !== eb) return ea ? 1 : -1;
    if(ea && eb) return 0;
    const na = cellNum(A), nb = cellNum(B);
    if(na!=null && nb!=null) return (na-nb)*st.dir;
    return A.localeCompare(B,'pl',{numeric:true,sensitivity:'base'})*st.dir;
  });
  rows.forEach(r=>body.appendChild(r));
}
/* ---------------------------------------------------------------------------
   FINANSE ZAŁADUNKÓW
   Tydzień to naturalna jednostka: plan tygodnia mówi, który załadunek jedzie
   którego dnia, więc wolumen tygodniowy da się policzyć wprost, bez zgadywania.
   Miesiąc liczymy jako 30 dni, czyli 30/7 tygodnia — okrągło i tak samo dla
   każdego miesiąca, żeby porównywać jabłka z jabłkami. To wolumen ZAŁADOWANY,
   nie sprzedany: mówi, ile towaru wjeżdża do maszyn, a nie ile z nich wyjeżdża.
   ------------------------------------------------------------------------- */
const DNI_MIES = 30;
const TYG_W_MIES = DNI_MIES / 7;

function finanseTygodnia(){
  const maszyny = active(DB.machines);
  const perM = maszyny.map(m=>({m, szt:0, wartosc:0, netto:0, koszt:0, dni:0}));
  const perZest = {};
  const dni = DNI.map(d=>{
    const z = zaladunekNaDzien(d.k);
    const s = z ? zalSuma(z) : {szt:0, wartosc:0, netto:0, koszt:0, wgZestawu:{}};
    if(z){
      perM.forEach(x=>{
        const sm = zalSuma(z, x.m.id);
        x.szt += sm.szt; x.wartosc += sm.wartosc; x.netto += sm.netto;
        x.koszt += sm.koszt; x.dni++;
      });
      Object.keys(s.wgZestawu).forEach(id=>{
        perZest[id] = (perZest[id]||0) + s.wgZestawu[id];
      });
    }
    // rozpiska dnia wchodzi do wyniku, bo tabele tygodniowe liczą z niej rolki i zestawy
    return {d, z, r: z ? zalRozpiska(z) : null,
            szt:s.szt, wartosc:s.wartosc, netto:s.netto, koszt:s.koszt};
  });
  const suma = perM.reduce((a,x)=>({szt:a.szt+x.szt, wartosc:a.wartosc+x.wartosc,
                                    netto:a.netto+x.netto, koszt:a.koszt+x.koszt}),
                           {szt:0, wartosc:0, netto:0, koszt:0});
  const zestawy = Object.keys(perZest).map(id=>{
    const s = CALC.set(id);
    if(!s) return {id, name:'⚠ brak zestawu', szt:perZest[id], wartosc:0, koszt:0};
    const c = CALC.setCalc(s, 'vending');
    return {id, name:s.name, szt:perZest[id],
            wartosc:(c.priceGross||0)*perZest[id], koszt:c.net*perZest[id]};
  }).sort((a,b)=>b.wartosc-a.wartosc);
  return {perM, dni, suma, zestawy, dniBezZaladunku: dni.filter(x=>!x.z).length};
}
/** Food cost liczony po stronie przychodu netto, tak jak wszędzie w aplikacji.
    Netto przychodzi policzone zestaw po zestawie — każdy ze swoją stawką VAT. */
function fcZ(koszt, netto){
  return netto > 0 ? koszt/netto : null;
}
/** ważony food cost zbioru kalkulacji: suma kosztów ÷ suma przychodu netto.
    Średnia arytmetyczna po pozycjach kłamie — tania rolka waży w niej tyle samo,
    co Party Mix. Pozycje z niekompletną recepturą wypadają, bo ich koszt jest
    zaniżony o brakujący składnik i ciągnęłyby wynik w dół po cichu. */
function fcWazony(kalkulacje){
  const zCena = kalkulacje.filter(c=>c.priceNet>0);
  const pelne = zCena.filter(c=>!c.missing.length);
  // licznik pominiętych musi wyjść także wtedy, gdy pominięte są wszystkie —
  // wtedy właśnie najbardziej trzeba o tym powiedzieć
  const pominiete = zCena.length - pelne.length;
  if(!pelne.length) return {fc:null, n:0, pominiete};
  const koszt = pelne.reduce((a,c)=>a+c.net, 0);
  const netto = pelne.reduce((a,c)=>a+c.priceNet, 0);
  return {fc: netto>0 ? koszt/netto : null, n:pelne.length, pominiete};
}

/* ---------------------------------------------------------------------------
   WYDRUKI
   Serwer ma Gotenberga, więc PDF powstaje po jego stronie — HTML leci do
   /api/pdf i wraca gotowy plik. Poza trybem serwerowym (plik z dysku) nie ma
   czym generować, więc otwieramy okno drukowania: „Zapisz jako PDF" daje ten
   sam efekt, tylko rękami.
   ------------------------------------------------------------------------- */
function drukujOkno(html){
  const w = window.open('', '_blank');
  if(!w){ alert('Przeglądarka zablokowała nowe okno — zezwól na wyskakujące okna i spróbuj ponownie.'); return; }
  w.document.write(html);
  w.document.close();
  w.focus();
  setTimeout(()=>{ try{ w.print(); }catch(e){} }, 350);
}
async function zrobPdf(html, nazwa, stopka){
  if(!SRV.on){ drukujOkno(html); return; }
  try{
    const r = await fetch('/api/pdf', {method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({html, name:nazwa, footer:stopka})});
    if(!r.ok){
      const o = await r.json().catch(()=>({}));
      if(!confirm((o.error||'Serwer nie wygenerował PDF-u.')
        + '\n\nOtworzyć okno drukowania zamiast tego?')) return;
      drukujOkno(html); return;
    }
    const blob = await r.blob();
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = nazwa + '.pdf';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
  }catch(e){
    drukujOkno(html);
  }
}
/** Stopka strony dla Gotenberga: tytuł z datą wygenerowania po lewej, numeracja po prawej.

    Osobna funkcja, bo dokumenty są już dwa rodzaje — kafelki z kuchni i tabela raportu —
    a stopka jest tym, co je łączy w jedną serię wydruków. */
function stopkaDruku(tytul){
  const dzis = new Date().toLocaleDateString('pl-PL');
  return `<html><head><style>
      body{font:8px system-ui,sans-serif;color:#8A8781;margin:0;padding:0 10mm;width:100%}
      .s{display:flex;justify-content:space-between;width:100%;
         border-top:.5px solid #DDD9D2;padding-top:2.5px}
    </style></head><body><div class="s">
      <span>${esc(tytul)} · wygenerowano ${esc(dzis)}</span>
      <span>strona <span class="pageNumber"></span> z <span class="totalPages"></span></span>
    </div></body></html>`;
}

/* Kolumny dobieramy pod treść: im mniej, tym czytelniej, ale wszystko ma się
   zmieścić na jednej stronie. Mierzymy naprawdę — w ukrytej ramce o wymiarach
   pola zadruku A4 (210×297 mm minus marginesy, przy 96 dpi). */
/* Pole zadruku A4 przy 96 dpi, dokładnie takie, jakie wycina Gotenberg
   (marginesy 0,4″ na boki i 0,5″ na górę i dół). Zapas na dole bierze na siebie
   drobne różnice w metrykach fontów między przeglądarką a kontenerem. */
const DRUK_SZER = 710, DRUK_WYS = 1026, DRUK_ZAPAS = 0.96;
const DRUK_MAX_PX = 26;
/** Dobiera układ wydruku: liczy się jak największa czcionka, nie jak mało kolumn.

    Dla każdej dozwolonej liczby kolumn szukamy największego stopnia pisma, przy
    którym całość mieści się na jednej stronie, i bierzemy najlepszy wynik; przy
    remisie wygrywa mniej kolumn. Gdy nawet minimum nie wchodzi na stronę, nie
    schodzimy poniżej minimum — wtedy wydruk po prostu ma więcej stron. */
/** Skraca pierwszy wyraz nazwy: „Średni Mieszany" → „Śre. Mieszany" → „Ś. Mieszany".

    Skracamy pierwszy, a nie ostatni, bo w nazwach zestawów pierwszy wyraz to rozmiar
    („Mały", „Średni", „Duży”), a drugi mówi, co jest w środku — i to on musi zostać
    czytelny. Poziom 0 zostawia nazwę w spokoju. */
function skrocPierwszy(nazwa, poziom){
  if(!poziom) return nazwa;
  const i = String(nazwa).indexOf(' ');
  if(i < 1) return nazwa;                       // jeden wyraz — nie ma czego skracać
  const ile = poziom === 1 ? 3 : 1;
  if(i <= ile + 1) return nazwa;                // skrót byłby dłuższy niż zysk
  return nazwa.slice(0, ile) + '.' + nazwa.slice(i);
}

/** Czy w gotowym dokumencie któryś tytuł karty zajmuje więcej niż jedną linię.
    Liczymy prostokąty zakresu, a nie wysokość elementu — element bywa wyższy
    z powodu rezerwy na drugą linię, a nas interesuje samo złamanie tekstu. */
function maLamaneTytuly(html){
  const ram = document.createElement('iframe');
  ram.setAttribute('aria-hidden','true');
  ram.style.cssText = 'position:fixed;left:-10000px;top:0;border:0;width:'
    + DRUK_SZER + 'px;height:' + DRUK_WYS + 'px';
  document.body.appendChild(ram);
  let lamane = false;
  try{
    const d = ram.contentDocument;
    d.open(); d.write(html); d.close();
    lamane = [].slice.call(d.querySelectorAll('.rolka > h2')).some(h=>{
      // Zakres musi objąć SAM tekst nazwy. Objęcie całego nagłówka dałoby osobny
      // prostokąt dla numeru w <span> i każdy tytuł wyglądałby na złamany.
      const t = h.lastChild;
      if(!t || t.nodeType !== 3) return false;
      const r = d.createRange(); r.selectNode(t);
      return r.getClientRects().length > 1;
    });
  }catch(e){ /* gdyby przeglądarka blokowała ramkę — zostawiamy nazwy w spokoju */ }
  ram.remove();
  return lamane;
}

function dopasujDruk(buduj, maksKolumn, minPx){
  const maks = Math.max(1, Math.min(6, maksKolumn || 3));
  const min = Math.max(6, minPx || 11);
  const ram = document.createElement('iframe');
  ram.setAttribute('aria-hidden','true');
  ram.style.cssText = 'position:fixed;left:-10000px;top:0;border:0;width:'
    + DRUK_SZER + 'px;height:' + DRUK_WYS + 'px';
  document.body.appendChild(ram);
  let best = null;
  // Gdy nic nie mieści się na jednej stronie, ratunkiem jest najwięcej kolumn,
  // które mieszczą się WSZERZ — w bok nic nie może wystawać, bo wiersze się nie
  // zawijają i tekst zostałby ucięty. W pionie wolno dołożyć stronę.
  let zapasowy = {kol:1, px:min, wieleStron:true};
  try{
    const zmierz = (k, px) => {
      const d = ram.contentDocument;
      d.open(); d.write(buduj(k, px)); d.close();
      // W układzie wielokolumnowym za długi wiersz NIE rozpycha strony — wychodzi
      // na sąsiednią kolumnę i nachodzi na cudzy tekst, a body.scrollWidth tego nie
      // widzi. Dlatego pytamy każdy wiersz z osobna, czy mieści się w swojej kolumnie.
      const wiersze = [].slice.call(d.querySelectorAll('.siatka .skl div'));
      const wystaje = wiersze.some(el=>el.scrollWidth > el.clientWidth + 1);
      return {wszerz: !wystaje && d.body.scrollWidth <= DRUK_SZER + 1,
              wpion:  d.body.scrollHeight <= DRUK_WYS * DRUK_ZAPAS};
    };
    const mieści = (k, px) => { const m = zmierz(k, px); return m.wszerz && m.wpion; };
    for(let k=1; k<=maks; k++){
      const m = zmierz(k, min);
      if(m.wszerz) zapasowy = {kol:k, px:min, wieleStron:true};
      if(!m.wszerz || !m.wpion) continue;           // przy tylu kolumnach się nie da
      let lo = min, hi = DRUK_MAX_PX;               // największe pismo, które wchodzi
      for(let i=0; i<7; i++){
        const mid = (lo + hi) / 2;
        if(mieści(k, mid)) lo = mid; else hi = mid;
      }
      const px = Math.floor(lo * 4) / 4;
      if(!best || px > best.px + 0.01) best = {kol:k, px};
    }
  }catch(e){ /* gdyby przeglądarka blokowała ramkę — zostaje bezpieczne minimum */ }
  ram.remove();
  return best || zapasowy;
}

/* ---------------------------------------------------------------------------
   KOLEJNOŚĆ RĘCZNA
   Kolejność nakładania składników i zwijania rolek to informacja z arkusza,
   której nie da się odtworzyć z żadnej innej kolumny. Trzymamy ją jako kolejność
   tablicy — sortowanie tabeli przestawia tylko wiersze w widoku, więc nigdy jej
   nie nadpisze. Trzeci klik w nagłówek (albo klik w „#") wraca do kolejności ręcznej.
   ------------------------------------------------------------------------- */
function przestawIndeks(arr, od, doo){
  od = +od; doo = +doo;
  if(!Array.isArray(arr) || od===doo) return false;
  if(od<0 || doo<0 || od>=arr.length || doo>=arr.length) return false;
  const [x] = arr.splice(od,1);
  arr.splice(doo,0,x);
  return true;
}
/** przestawia po identyfikatorach — indeks widoku ≠ indeks w bazie, gdy działa filtr */
function przestawPoId(arr, idOd, idDo){
  if(!Array.isArray(arr)) return false;
  return przestawIndeks(arr, arr.findIndex(x=>x.id===idOd), arr.findIndex(x=>x.id===idDo));
}
const DND = {};   // klucz kontenera → funkcja(od, do); ustawiają ją widoki

/** przeciąganie i strzałki: kontener [data-dnd="klucz"], dzieci [data-di="klucz pozycji"] */
function wireDnd(root, handler){
  root.querySelectorAll('[data-dnd]').forEach(box=>{
    const fn = handler || DND[box.dataset.dnd];
    if(!fn) return;
    let od = null;
    box.querySelectorAll('[data-di]').forEach(el=>{
      el.addEventListener('dragstart',e=>{
        od = el.dataset.di; el.classList.add('dragging');
        e.dataTransfer.effectAllowed = 'move';
        try{ e.dataTransfer.setData('text/plain', String(od)); }catch(_){}
      });
      el.addEventListener('dragend',()=>{
        el.classList.remove('dragging');
        box.querySelectorAll('.dropzone').forEach(x=>x.classList.remove('dropzone'));
      });
      el.addEventListener('dragover',e=>{ e.preventDefault(); el.classList.add('dropzone'); });
      el.addEventListener('dragleave',()=>el.classList.remove('dropzone'));
      el.addEventListener('drop',e=>{
        e.preventDefault(); el.classList.remove('dropzone');
        const doo = el.dataset.di;
        if(od==null || od===doo) return;
        fn(od, doo);
      });
    });
    box.querySelectorAll('[data-mv]').forEach(b=>b.addEventListener('click',e=>{
      e.preventDefault(); e.stopPropagation();
      const [a,bb] = b.dataset.mv.split('|');
      fn(a, bb);
    }));
  });
}
/** komórka z uchwytem, numerem i strzałkami; `sasiedzi` to [poprzedni, następny] */
function ordCell(nr, poprz, nast, edytowalne){

        ${poprz?'':'disabled'}>↑</button>
      <button type="button" class="btn sm mv" data-mv="${nast||''}" title="W dół"
        ${nast?'':'disabled'}>↓</button>`:''}

}

function wireSort(root){
  root.querySelectorAll('table[data-tbl]').forEach(tb=>{
    const key = tb.dataset.tbl;
    if(!tb.tHead || !tb.tHead.rows.length) return;
    if(tb.dataset.noSortNow !== undefined) return;   // tryb ustawiania kolejności
    const ths = [...tb.tHead.rows[0].cells];
    const paint = ()=>{
      ths.forEach(x=>x.classList.remove('asc','desc'));
      const st = SORT[key];
      if(st && ths[st.i]) ths[st.i].classList.add(st.dir>0?'asc':'desc');
    };
    const kolOrd = ths.findIndex(x=>x.dataset.ordth !== undefined);
    if(kolOrd >= 0){
      const th = ths[kolOrd];
      th.classList.add('ordth');
      th.classList.toggle('on', !SORT[key]);
      th.title = SORT[key] ? 'Wróć do kolejności ręcznej' : 'Kolejność ręczna';
      th.addEventListener('click',()=>{ if(SORT[key]){ SORT[key] = null; render(); } });
    }
    ths.forEach((th,i)=>{
      if(th.dataset.nosort !== undefined || th.dataset.ordth !== undefined) return;
      th.classList.add('sortable');
      th.title = 'Kliknij, żeby posortować';
      th.addEventListener('click',()=>{
        const st = SORT[key];
        // rosnąco → malejąco → kolejność ręczna
        if(st && st.i===i && st.dir<0){ SORT[key] = null; render(); return; }
        SORT[key] = (st && st.i===i) ? {i, dir:-st.dir} : {i, dir:1};
        applySort(tb, key); paint();
      });
    });
    applySort(tb, key); paint();
  });
}

/* Straż przed wejściem render() w samego siebie.

   Podmiana `innerHTML` wyrzuca z DOM pole, które trzyma ognisko. Przeglądarka
   wystawia wtedy drugie zdarzenie `change` — na odpiętym już węźle, ze starym
   uchwytem, który znowu woła render(). Zagnieżdżony przebieg rysuje ekran
   i podpina uchwyty, ale przerwana zewnętrzna podmiana zaraz potem nadpisuje
   ten DOM swoim, a jej kolejka POST jest już pusta. Wychodzi ekran bez żadnych
   uchwytów: pola się wpisują, tylko nic nie zapisują.

   Dlatego zagnieżdżone wywołanie nie rysuje — zgłasza powtórkę, a pętla wykonuje
   ją po zamknięciu bieżącego przebiegu. Ostatni przebieg zawsze podpina uchwyty
   do DOM-u, który naprawdę został na ekranie. */
let RYSUJE = false, PONOWNIE = false;
function render(){
  if(RYSUJE){ PONOWNIE = true; return; }
  RYSUJE = true;
  try{
    let bezpiecznik = 0;
    do{ PONOWNIE = false; rysuj(); }while(PONOWNIE && ++bezpiecznik < 5);
  }finally{ RYSUJE = false; }
}

                  dHome:vPulpit, dSklad:vSklad, dPrep:vDzienPrzygotowanie, dRolki:vDzienRolki, dZest:vDzienZestawy,

  (POST[VIEW]||[]).forEach(f=>f());

/** przycisk trybu ustawiania kolejności + podpowiedź, gdy jest włączony */

/** Pasek listy — ten sam we wszystkich sześciu widokach z listą.

    Dwa rzędy, bo to dwie różne rzeczy: górny robi coś nowego (dodaj, wydrukuj),
    dolny zmienia sposób patrzenia na to, co już jest (szukaj, filtruj, przełącz).
    Wcześniej wszystko stało w jednym rzędzie i przy dziewięciu elementach akcja główna
    zawijała się pod tytuł — czyli najważniejszy przycisk lądował tam, gdzie nikt go
    nie szuka. */
function paskListy(o){
  const opcje = [
    o.szukaj ? `<input id="${o.szukaj.id}" type="search" placeholder="${esc(o.szukaj.ph)}"
      value="${esc(o.szukaj.val || '')}" style="max-width:${o.szukaj.szer || '240px'}">` : '',
    o.pola || '',
    o.kanal ? chanPills() : '',
    viewPills(o.klucz),
    archPills(o.klucz),
    o.kolejnosc ? ordBtn(o.klucz) : '',
    o.info ? `<div class="spacer"></div><span class="mut small">${o.info}</span>` : '',
  ].filter(Boolean).join('');

  return `<div class="topbar">
    <h1>${esc(o.tytul)}</h1>${o.licznik ? `<span class="sub">${esc(o.licznik)}</span>` : ''}
    <div class="spacer"></div>${o.akcje || ''}
    ${o.dodaj ? `<button class="btn pri" data-act="${o.dodaj.act}">${esc(o.dodaj.lab)}</button>` : ''}
  </div>
  <div class="paskopcji">${opcje}</div>`;
}

function listLayout(key, tabela, kafelki, podglad){

/** tabela odżywcza w jednej kolumnie — dla składnika i półproduktu */
function nutr100(n, naglowek){
  if(!hasNutr(n)) return '<div class="empty">Brak tabeli odżywczej.</div>';
  const kom=x=> x.k==='kcal'
    ? `${num((n.kcal||0)*4.184,0)} kJ / ${num(n.kcal||0,0)} kcal`
    : `${num(n[x.k]||0,(n[x.k]||0)<1?2:1)} ${x.u}`;
  return `<div class="tw"><table><thead><tr><th>Wartość odżywcza</th>
      <th class="r">${esc(naglowek||'w 100 g')}</th></tr></thead><tbody>
    ${NUTR.map(x=>`<tr><td>${x.sub?`<span class="mut">${esc(x.l)}</span>`:esc(x.l)}</td>
      <td class="r num">${kom(x)}</td></tr>`).join('')}
    </tbody></table></div>`;
}

function alergBlock(lista){
  return (lista && lista.length)
    ? `<div class="kv" style="margin-top:8px"><span>Alergeny</span><b>${lista.map(a=>esc(ALERG_NAME[a]||a)).join(', ')}</b></div>`
    : '<div class="hint" style="margin-top:8px">Brak zadeklarowanych alergenów.</div>';
}

/** punkty do wykresu historii ceny jednostkowej danego składnika */
function histPts(ingId){
  const hs = DB.history.filter(h=>h.ingId===ingId).sort((a,b)=>a.date.localeCompare(b.date));
  if(!hs.length) return [];
  const pts = hs.map(h=>({d:h.date, v:(h.to!=null&&h.qty)?h.to/h.qty:0, raw:h}));
  const p0 = hs[0];
  pts.unshift({d:p0.date, v:(p0.from!=null&&p0.qty)?p0.from/p0.qty:0, raw:p0});
  return pts;
}

/** panel „gdzie to jest używane" */
function usedByBlock(id){
  const u = CALC.usedBy(id);
  if(!u.length) return '<div class="hint">Nieużywany w żadnej recepturze.</div>';
  return u.map(x=>`<div class="kv"><span>${x.type==='item'?'rolka':x.type==='prep'?'półprodukt':'zestaw'}</span>
    <a href="#" data-go="${x.type==='item'?'items':x.type==='prep'?'prep':'sets'}:${x.id}">${esc(x.name)}</a></div>`).join('');
}

    const info = c.kind==='raw' ? {name:c.name, unit:c.unit, unitCost:c.unitCost} : CALC.compInfo(c.refId);

  const zaKilo = p => { const uc=CALC.prepUnitCost(p.id);
    return uc==null ? null : uc*(p.yieldUnit==='g'||p.yieldUnit==='ml'?1000:1); };

  const rows=list.map(p=>{
    const uc=CALC.prepUnitCost(p.id), zk=zaKilo(p);

  const cards=list.map(p=>{
    const uc=CALC.prepUnitCost(p.id), zk=zaKilo(p), n=CALC.prepNutr(p.id);
    return `<div class="card tcard ${SEL.prep===p.id?'sel':''} ${p.archived?'arch':''}" data-pick-prep="${p.id}">
      <div class="th"><h3>${esc(p.name)}${p.archived?' <span class="tag">archiwum</span>':''}</h3></div>
      <div class="hint" style="margin:0 0 8px">${p.items.length} składników · wydajność ${num(p.yieldQty,p.yieldQty%1?2:0)} ${esc(p.yieldUnit)}</div>
      <div class="kv"><span>Koszt partii</span><b>${zl(partia(p))}</b></div>
      <div class="kv"><span>Koszt za ${esc(p.yieldUnit)}</span><b class="wylicz">${uc!=null?num(uc,4):'—'}</b></div>
      <div class="kv"><span>za 1 kg / 1 l</span><b>${zk!=null?zl(zk):'—'}</b></div>
      <div class="kv"><span>Energia w 100 g</span><b class="${n&&n.grams?'':'mut'}">${n&&n.grams?num(n.nutr.kcal*100/n.grams,0)+' kcal':'—'}</b></div>
      <div class="kv"><span>Użyć w recepturach</span><b class="${CALC.usedBy(p.id).length?'':'mut'}">${CALC.usedBy(p.id).length||'—'}</b></div>
      <div class="acts">${rowActions('prep', p)}</div></div>`;
  }).join('');

  let detail='<div class="card"><div class="empty">Wybierz półprodukt, żeby zobaczyć jego recepturę i koszt.</div></div>';
  if(sel){
    const uc = CALC.prepUnitCost(sel.id), zk = zaKilo(sel), n = CALC.prepNutr(sel.id);
    const na100 = (n && n.grams)
      ? Object.fromEntries(NUTR.map(x=>[x.k, n.nutr[x.k]*100/n.grams])) : null;

    const kv = (l, v) => `<div class="kv"><span>${l}</span><b>${v}</b></div>`;
    // rozbicie kosztu liczone tak samo, jak przy rolce — od najdroższej pozycji
    const rozbicie = sel.items.map(c=>{
      const info = c.kind==='raw' ? {name:c.name, unitCost:c.unitCost} : CALC.compInfo(c.refId);
      return {name:info.name, cost:lineQty(c)*(info.unitCost||0)};
    }).filter(r=>r.cost>0).sort((a,b)=>b.cost-a.cost);
    detail = podgladKarta({
      typ:'prep', id:sel.id, nazwa:sel.name,
      podtytul: `wydajność ${num(sel.yieldQty, sel.yieldQty%1?2:0)} ${esc(sel.yieldUnit)} · ${
        sel.items.length} składników${sel.note?' · '+esc(sel.note):''}`,
      kafelki:[{lab:`Koszt za ${sel.yieldUnit}`, val: uc!=null?num(uc,4):'—', kolor:'var(--marka)'},
               {lab:'za 1 kg / 1 l', val: zk!=null?zl(zk):'—'}],
      sekcje:[
        {t:'Skład', html: (skladniki(sel) || '<div class="empty">Brak składników</div>')
          + (odpad.length?`<div class="alert warn" style="margin-top:10px"><div class="ic">i</div><div class="txt">
              Odpad wchodzi do kosztu, ale nie do wartości odżywczych — dlatego kilogram surowca
              potrafi dać pół kilograma produktu w tej samej cenie.</div></div>`:'')},
        {t:'Koszt i cena', html:`
          <div class="kv" style="border-top:1px solid var(--axis);padding-top:9px">
            <span><b>Koszt partii (netto)</b></span><b>${zl(partia(sel))}</b></div>
          ${kv('Wydajność', num(sel.yieldQty, sel.yieldQty%1?2:0)+' '+esc(sel.yieldUnit))}
          ${kv(`Koszt za 1 ${esc(sel.yieldUnit)}`,
               uc!=null?num(uc,4)+' '+DB.settings.currency:'—')}
          ${kv('Koszt za 1 kg / 1 l', zk!=null?zl(zk):'—')}`},
        {t:'Rozbicie kosztu', html:`<div id="chPrepBreak">${rozbicie.length
          ? barChartCost(rozbicie, 330) : '<div class="empty">Brak pozycji</div>'}</div>`},
        {t:'Wartości odżywcze', html:
          (na100 ? nutr100(na100)
                 : '<div class="empty">Nie da się policzyć — brak tabeli przy którymś ze składników albo wagi jednostki.</div>')
          + (n && n.missing && n.missing.length
             ? `<div class="hint">Brak danych: <b>${esc(n.missing.join(', '))}</b></div>` : '')
          + alergBlock(CALC.prepAlerg(sel.id))},
        {t:'Gdzie używany', html: usedByBlock(sel.id)},
      ],
    });
  }

  return paskListy({tytul:'Półprodukty', licznik:`${active(DB.preps).length} aktywnych`,
    klucz:'prep', dodaj:{act:'addPrep', lab:'+ Półprodukt'}}) + `
  <div class="banner">Półprodukt to coś, co przygotowujesz z kilku składników i potem zużywasz na wagę — ryż z zaprawą, sos spicy, sałatka.
    Aplikacja liczy jego koszt za jednostkę i podstawia go automatycznie do receptur. <b>Każdy składnik ma dwie ilości: tę, która trafia do produktu, i odpad. Odpad kosztuje, ale nie wchodzi do wartości odżywczych.</b></div>
  ${listLayout('prep',
    `<div class="tw"><table data-tbl="prep"><thead><tr><th>Nazwa</th><th class="r">Wydajność</th><th>j.m.</th>
      <th class="r">Składników</th><th class="r">Koszt / j.m.</th><th class="r">za 1 kg / 1 l</th><th class="r">Użyć</th>
      </tr></thead>
      <tbody>${rows||'<tr><td colspan="7" class="empty">Brak półproduktów</td></tr>'}</tbody></table></div>`,
    cards||'<div class="empty">Brak półproduktów.</div>',
    detail)}`;
}

function editPrep(id){
  const p = id ? clone(CALC.prep(id)) : {id:uid('prep'),name:'',yieldQty:1000,yieldUnit:'g',note:'',items:[]};
  const draw=()=>{
    const body=document.getElementById('prepComps');
    body.innerHTML = p.items.map((c,i)=>{
      const info = c.kind==='raw' ? {name:c.name,unit:c.unit,unitCost:c.unitCost} : CALC.compInfo(c.refId);
      const suma = lineQty(c);
      // pozycja spoza bazy nie ma czego wybierać — zostaje nazwą wpisaną ręcznie
      return `<div class="compline wst ${c.kind==='raw'||c.refId?'':'pusty'}">
        <div>${c.kind==='raw'
          ? `${esc(info.name)} <span class="tag">poza bazą</span>`
          : combo('pC'+i, 'Szukaj składnika lub półproduktu…')}
          <span class="mut">(${num(suma, suma%1?2:0)})</span></div>
        <input type="number" step="any" value="${c.qty??''}" data-q="${i}" title="Ile trafia do produktu" placeholder="ilość">
        <input type="number" step="any" value="${c.waste||''}" data-w="${i}" placeholder="0" title="Ile się wyrzuca — kosztuje, ale nie odżywia">
        <span class="mut small">${esc(info.unit||'')}</span>
        <span class="cost">${zl(suma*(info.unitCost||0))}</span>
        <button type="button" class="btn sm danger" data-rm="${i}">✕</button></div>`;
    }).join('') || '<div class="empty" style="padding:16px">Brak składników — kliknij „+ Dodaj składnik”</div>';
    const inUseP2 = new Set(p.items.map(c=>c.refId));
    const pickP2 = x=>!x.archived || inUseP2.has(x.id);
    const opcjeP = [PUSTY_WYBOR,
      ...DB.ingredients.filter(pickP2).map(g=>({v:'ing:'+g.id, l:`${g.name} (${g.cat})`})),
      ...DB.preps.filter(x=>x.id!==p.id).filter(pickP2).map(x=>({v:'prep:'+x.id, l:`◍ ${x.name}`}))];
    p.items.forEach((c,i)=>{
      if(c.kind === 'raw') return;
      fillCombo('pC'+i, opcjeP, c.refId ? c.kind+':'+c.refId : '', v=>{
        const [k,rid] = v ? v.split(':') : ['',''];
        c.kind = k || 'ing'; c.refId = rid; setTimeout(draw,0);
      });
    });
    body.querySelectorAll('[data-q]').forEach(inp=>inp.addEventListener('input',()=>{ p.items[+inp.dataset.q].qty=parseFloat(inp.value)||0; drawTot(); }));
    body.querySelectorAll('.compline.wst > div:first-child .mut').forEach((el,i)=>{
      const s=lineQty(p.items[i]); el.textContent='('+num(s, s%1?2:0)+')'; });
    body.querySelectorAll('[data-rm]').forEach(b=>b.addEventListener('click',()=>{ p.items.splice(+b.dataset.rm,1); draw(); }));
    body.querySelectorAll('[data-w]').forEach(x=>x.addEventListener('input',()=>{
      p.items[+x.dataset.w].waste=parseFloat(x.value)||0; drawTot(); }));
    drawTot();
  };
  const drawTot=()=>{
    let tot=0;
    p.items.forEach(c=>{ const info=c.kind==='raw'?{unitCost:c.unitCost}:CALC.compInfo(c.refId); tot+=lineQty(c)*(info.unitCost||0); });
    const y=numOrNull('pYield')||1;
    document.getElementById('pTot').textContent=zl(tot);
    document.getElementById('pUnit').textContent=num(tot/y,4)+' '+DB.settings.currency+'/'+val('pYUnit');
    const kc=document.getElementById('pKcal');
    if(kc){
      const r=CALC.prepNutr(Object.assign({}, p, {yieldQty:y, yieldUnit:val('pYUnit'), gPerUnit:numOrNull('pGram')}));
      const gr=r?r.grams:null;
      kc.textContent = (r && gr) ? num(r.nutr.kcal*100/gr,0)+' kcal' : '—';
    }
    // odśwież koszty w liniach
    document.querySelectorAll('#prepComps .compline').forEach((el,i)=>{
      const c=p.items[i]; const info=c.kind==='raw'?{unitCost:c.unitCost}:CALC.compInfo(c.refId);
      el.querySelector('.cost').textContent=zl(lineQty(c)*(info.unitCost||0));
      const sum=el.querySelector('div:first-child .mut');
      if(sum){ const s=lineQty(c); sum.textContent='('+num(s, s%1?2:0)+')'; }
    });
  };
  openDlg(id?'Edytuj półprodukt':'Nowy półprodukt',`
    <div class="grid" style="grid-template-columns:2fr 1fr 1fr">
      <div><label class="f">Nazwa</label><input id="pName" type="text" value="${esc(p.name)}"></div>
      <div><label class="f">Wydajność</label><input id="pYield" type="number" step="any" value="${p.yieldQty}"></div>
      <div><label class="f">Jednostka</label><input id="pYUnit" type="text" value="${esc(p.yieldUnit)}"></div>
      <div><label class="f">Waga 1 jednostki [g]</label><input id="pGram" type="number" step="any" value="${p.gPerUnit??''}" placeholder="tylko dla jednostek innych niż g/ml/kg/l"></div>
      <div style="grid-column:1/-1"><label class="f">Notatka</label><input id="pNote" type="text" value="${esc(p.note||'')}"></div>
    </div>
    <h3 style="margin:16px 0 8px">Składniki</h3>
    <div class="compline wst" style="margin-bottom:4px">
    <div class="mut small">Składnik <span class="mut">(razem)</span></div>
    <div class="mut small">ilość</div><div class="mut small">odpad</div>
    <div class="mut small">j.m.</div><div class="mut small" style="text-align:right">koszt</div><div></div>
  </div>
  <div id="prepComps"></div>
    <div class="row" style="margin-top:8px">
      <button type="button" class="btn sm" id="pAddBtn">+ Dodaj składnik</button></div>
    <div class="card" style="background:var(--surface-2);border:0;margin-top:14px">
      <div class="kv"><span>Koszt całej partii</span><b id="pTot">—</b></div>
      <div class="kv"><span>Koszt jednostkowy</span><b id="pUnit" class="wylicz">—</b></div>
      <div class="kv"><span>Energia w 100 g gotowego</span><b id="pKcal">—</b></div>
      <div class="hint" style="margin-top:6px"><b>Ilość</b> trafia do produktu i liczy się do wartości odżywczych.
        <b>Odpad</b> tylko kosztuje. W nawiasie przy nazwie widać, ile surowca schodzi razem.
        Ogórek krojony: ilość 500 g, odpad 500 g, wydajność 500 g.</div>
    </div>
    ${strefaRyzykowna(id ? p : null, 'prep')}`,
    [ ...(id?[{label:'Zamień wszędzie…', fn:()=>{ replaceDialog(id); return false; }}]:[]),
      {label:'Anuluj'},{label:'Zapisz',cls:'pri',fn:()=>{
      p.name=val('pName').trim(); p.yieldQty=numOrNull('pYield')||1; p.yieldUnit=val('pYUnit').trim()||'g'; p.note=val('pNote');
      p.gPerUnit=numOrNull('pGram');
      if(!p.name){ alert('Podaj nazwę.'); return false; }
      if(id){ const i=DB.preps.findIndex(x=>x.id===id); DB.preps[i]=p; } else DB.preps.push(p);
      save(); render();
    }}],
    ()=>{
      wireStrefa('prep', id);
      document.getElementById('pAddBtn').addEventListener('click',()=>{
        p.items.push({kind:'ing', refId:'', qty:null, waste:0}); draw();
        const q=document.getElementById('pC'+(p.items.length-1)+'_q'); if(q) q.focus(); });
      ['pYield','pYUnit'].forEach(i=>document.getElementById(i).addEventListener('input',drawTot));
      draw();
    });
}

let itemQ='';
function vItems(){
  const szukaj = bezOgonkow(itemQ.trim());
  const list=archFilter(DB.items,'items')
    .filter(i=>!szukaj || bezOgonkow(itName(i)).includes(szukaj));
  const sel = SEL.item ? CALC.item(SEL.item) : null;

  after('items',()=>{
    const q=document.getElementById('itQ');
    q.addEventListener('input',()=>{itemQ=q.value;const s=q.selectionStart;render();const n=document.getElementById('itQ');n.focus();n.setSelectionRange(s,s);});
    document.querySelectorAll('[data-pick-item]').forEach(r=>r.addEventListener('click',e=>{
      if(e.target.closest('button'))return; SEL.item=r.dataset.pickItem; render();
    }));
    document.querySelector('[data-act="addItem2"]').addEventListener('click',()=>editItem(null));
    document.querySelector('[data-act="pdfItems"]').addEventListener('click',()=>pdfReceptury());
    document.querySelectorAll('[data-edit-item]').forEach(b=>b.addEventListener('click',()=>editItem(b.dataset.editItem)));
    if(sel){
      const c=CALC.itemCalc(sel);
      const el=document.getElementById('chBreak'); if(el) wireChart(el,c.rows,r=>
        `<b>${esc(r.name)}</b>${num(r.qty,r.qty%1?3:0)} ${esc(r.unit||'')} × ${num(r.unitCost,4)} = ${zl(r.cost)}<br><span class="mut">${pct(r.cost/c.net,1)} kosztu pozycji</span>`);
    }
  });

  DND.items = (od, doo)=>{ if(przestawPoId(DB.items, od, doo)){ save(); render(); } };
  const rows=list.map((i,ix)=>{
    const c=CALC.itemCalc(i), st=CALC.status(c.fc);
    const poprz = ix>0 ? list[ix-1].id : '', nast = ix<list.length-1 ? list[ix+1].id : '';
    return `<tr data-pick-item="${i.id}" data-di="${i.id}" ${ORD.items?'draggable="true"':''}
        style="cursor:${ORD.items?'grab':'pointer'}" class="${SEL.item===i.id?'sel':''} ${i.archived?'arch':''}">
      <td>${ordCell(DB.items.indexOf(i)+1, poprz?`${i.id}|${poprz}`:'', nast?`${i.id}|${nast}`:'', ORD.items)}</td>
      <td data-sv="${esc(itName(i))}">${
        katRolki(i)?`<span class="mut">${esc(katRolki(i).name)}</span> `:''}<b>${esc(i.name)}</b>${i.archived?' <span class="tag">archiwum</span>':''}${c.missing.length?' <span class="tag crit">brak cen</span>':''}</td>
      <td class="r num">${i.pieces}</td>
      <td class="r num">${zl(c.net)}</td>
      <td class="r num">${zl(c.perPiece)}</td>
      <td class="r num">${c.priceGross?zl(c.priceGross):'<span class="tag warn">brak</span>'}</td>
      <td class="r"><span class="tag ${st==='none'?'':st}">${pct(c.fc)}</span></td>
      <td class="r num">${c.margin!=null?zl(c.margin):'—'}</td>
      </tr>`;
  }).join('');

  let detail='<div class="card"><div class="empty">Wybierz rolkę z listy, żeby zobaczyć jej skład i rentowność.</div></div>';
  if(sel){
    const c = CALC.itemCalc(sel);
    // skład idzie w kolejności nakładania na matę, nie od najdroższego składnika —
    // ta sama kolejność co w recepturze na kartce; od kosztu jest wykres niżej
    const wgKosztu = {}; c.rows.forEach(r=>{ wgKosztu[r.refId] = r; });
    const sklad = (sel.comps||[]).map(k=>wgKosztu[k.refId]).filter(Boolean)
      .map(r=>({n:r.name, opis:`${num(r.qty, r.qty%1?3:0)} ${r.unit||''}`.trim(), koszt:r.cost}));
    const polprodukty = c.rows.filter(r=>r.kind === 'prep').reduce((a,r)=>a+r.cost, 0);
    detail = podgladPozycji({
      typ:'item', id:sel.id, nazwa:itName(sel), photo:sel.photo, c,
      podtytul:`${sel.pieces} kawałków · ${sklad.length} składników`,
      sklad:[{tytul:null, pozycje:sklad}],
      wTym: polprodukty>0 ? {l:'w tym półprodukty', v:zl(polprodukty), mut:true} : null,
      chan: chanTable(sel, (o,ch)=>CALC.itemCalc(o,ch)),
      wykresId:'chBreak', wykresRows:c.rows,
      nutr: nutrBlock(CALC.itemNutr(sel), 'cała rolka'),
    });
  }

  const cards=list.map(i=>{
    const c=CALC.itemCalc(i), st=CALC.status(c.fc);
    return `<div class="card tcard ${SEL.item===i.id?'sel':''} ${i.archived?'arch':''}" data-pick-item="${i.id}">
      ${i.photo?`<img class="hero" src="${i.photo}" alt="${esc(itName(i))}">`:''}
      <div class="th"><h3>${esc(itName(i))}${i.archived?' <span class="tag">archiwum</span>':''}</h3>
        <span class="tag ${st==='none'?'':st}">${pct(c.fc)}</span></div>
      <div class="hint" style="margin:0 0 8px">${i.pieces} kawałków${c.missing.length?' · <span class="tag crit">brak cen</span>':''}</div>
      <div class="kv"><span>Koszt</span><b>${zl(c.net)}</b></div>
      <div class="kv"><span>Koszt kawałka</span><b>${zl(c.perPiece)}</b></div>
      <div class="kv"><span>Cena (${esc(chanLabel(CHAN))})</span><b>${c.priceGross?zl(c.priceGross):'<span class="tag warn">brak</span>'}</b></div>
      <div class="kv"><span>Marża netto</span><b>${c.margin!=null?zl(c.margin):'—'}</b></div>
      <div class="acts">${rowActions('items', i)}</div></div>`;
  }).join('');

  return paskListy({tytul:'Rolki', licznik:`${active(DB.items).length} aktywnych`,
    klucz:'items', kanal:true, kolejnosc:true,
    szukaj:{id:'itQ', ph:'Szukaj rolki…', val:itemQ},
    akcje:'<button class="btn" data-act="pdfItems" title="Receptury wszystkich rolek na kartkę">⎙ PDF</button>',
    dodaj:{act:'addItem2', lab:'+ Rolka'}}) + `
  ${ordHint('items','zwijania rolek')}
  ${listLayout('items',
    `<div class="tw"><table data-tbl="items" ${ORD.items?'data-no-sort-now':''}>
      <thead><tr><th data-ordth title="Kolejność zwijania">#</th><th>Nazwa</th><th class="r">Kaw.</th><th class="r">Koszt</th>
      <th class="r">Koszt/kaw.</th><th class="r">Cena</th><th class="r">Food cost</th><th class="r">Marża</th>
      </tr></thead><tbody data-dnd="items">${rows||'<tr><td colspan="8" class="empty">Brak wyników</td></tr>'}</tbody></table></div>`,
    cards||'<div class="empty">Brak wyników</div>',
    detail)}`;
}

function editItem(id){
  const it = id ? clone(CALC.item(id))
    : {id:uid('it'), name:'', cat:'', pieces:8, comps:[], photo:null,
       prices:{vending:null, dostawa:null}, vats:Object.assign({}, DB.settings.vats)};
  migrateChannels(it);
  const draw=()=>{
    const body=document.getElementById('itComps');
    body.dataset.dnd = 'itComps';                       // kolejność = kolejność nakładania
    body.innerHTML = it.comps.map((c,i)=>{
      const info = c.refId ? CALC.compInfo(c.refId) : {name:'', unit:'', unitCost:null};
      return `<div class="compline ord ${c.refId?'':'pusty'}" data-di="${i}" draggable="true">
        ${ordCell(i+1, i>0?`${i}|${i-1}`:'', i<it.comps.length-1?`${i}|${i+1}`:'', true)}
        <div>${combo('iC'+i, 'Szukaj składnika lub półproduktu…')}${
          c.refId && info.unitCost==null?' <span class="tag crit">brak ceny</span>':''}</div>
        <input type="number" step="any" value="${c.qty??''}" data-q="${i}" placeholder="ilość">
        <span class="mut small">${esc(info.unit||'')}</span>
        <span class="cost">${zl((c.qty||0)*(info.unitCost||0))}</span>
        <button type="button" class="btn sm danger" data-rm="${i}">✕</button></div>`;
    }).join('') || '<div class="empty" style="padding:16px">Brak składników — kliknij „+ Dodaj składnik”</div>';
    // każdy wiersz sam pyta, co w nim stoi — pozycję można też podmienić bez kasowania
    const inUse = new Set(it.comps.map(c=>c.refId));
    const pick = x=>!x.archived || inUse.has(x.id);
    const opcje = [PUSTY_WYBOR,
      ...DB.preps.filter(pick).map(p=>({v:p.id, l:`◍ ${p.name}`})),
      ...DB.ingredients.filter(pick).map(g=>({v:g.id, l:`${g.name} — ${g.cat}`}))];
    it.comps.forEach((c,i)=>fillCombo('iC'+i, opcje, c.refId||'',
      v=>{ c.refId=v; setTimeout(draw,0); }));
    body.querySelectorAll('[data-q]').forEach(inp=>inp.addEventListener('input',()=>{ it.comps[+inp.dataset.q].qty=parseFloat(inp.value)||0; recalc(); }));
    body.querySelectorAll('[data-rm]').forEach(b=>b.addEventListener('click',()=>{ it.comps.splice(+b.dataset.rm,1); draw(); }));
    wireDnd(body.parentElement, (od,doo)=>{ if(przestawIndeks(it.comps, od, doo)) draw(); });
    recalc();
  };
  const recalc=()=>{
    it.pieces=numOrNull('iPieces')||1;
    CHANNELS.forEach(ch=>{ it.prices[ch.k]=numOrNull('iP_'+ch.k);
                           it.vats[ch.k]=(numOrNull('iV_'+ch.k)??(ch.vat*100))/100; });
    const c=CALC.itemCalc(it);
    document.querySelectorAll('#itComps .compline').forEach((el,i)=>{
      const info=CALC.compInfo(it.comps[i].refId);
      el.querySelector('.cost').textContent=zl((it.comps[i].qty||0)*(info.unitCost||0));
    });
    document.getElementById('iNet').textContent=zl(c.net);
    document.getElementById('iPer').textContent=zl(c.perPiece);
    document.getElementById('iFc').textContent=pct(c.fc);
    document.getElementById('iFc').style.color = c.fc==null?'':CALC.status(c.fc)==='crit'?'var(--crit-ink)':CALC.status(c.fc)==='warn'?'var(--warn-ink)':'var(--good-ink)';
    document.getElementById('iMar').textContent=c.margin!=null?zl(c.margin):'—';
    document.getElementById('iSug').textContent=c.suggested?zl(c.suggested):'—';
  };
  openDlg(id?'Edytuj rolkę':'Nowa rolka',`
    <div class="grid" style="grid-template-columns:2fr 1fr 1fr 1fr">
      <div><label class="f">Kategoria</label>${combo('iKat','— bez kategorii —')}</div>
      <div><label class="f">Nazwa</label><input id="iName" type="text" value="${esc(it.name)}"
        placeholder="sama nazwa, bez kategorii"></div>
      <div><label class="f">Liczba kawałków</label><input id="iPieces" type="number" step="1" value="${it.pieces}"></div>
      ${CHANNELS.map(ch=>`
      <div><label class="f">${esc(ch.l)} — cena brutto</label>
        <input id="iP_${ch.k}" type="number" step="any" value="${it.prices[ch.k]??''}"></div>
      <div><label class="f">${esc(ch.l)} — VAT %</label>
        <input id="iV_${ch.k}" type="number" step="any" value="${num((it.vats[ch.k]??ch.vat)*100,0)}"></div>`).join('')}
    </div>
    <div style="margin-top:14px">${photoField('iPhoto','iPhotoIn','Zdjęcie rolki')}</div>
    <h3 style="margin:16px 0 4px">Receptura</h3>
    <div class="hint" style="margin-bottom:8px">Kolejność wierszy to kolejność nakładania na matę —
      przeciągnij za ⠿ albo przestaw strzałkami.</div>
    <div id="itComps"></div>
    <div class="row" style="margin-top:8px">
      <button type="button" class="btn sm" id="iAddBtn">+ Dodaj składnik</button></div>
    <div class="card" style="background:var(--surface-2);border:0;margin-top:14px">

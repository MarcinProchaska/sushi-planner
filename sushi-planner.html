/* ---------------------------------------------------------------------------
   KATEGORIE ROLEK
   „Hosomaki Ogórek" to w istocie kategoria i nazwa sklejone w jeden ciąg. Rozbite
   dają się filtrować, sortować i skracać: tam, gdzie jest miejsce, piszemy
   „Hosomaki Ogórek", a gdzie go nie ma — „HS Ogórek".
   ------------------------------------------------------------------------- */
const KAT_ROLEK = [{name:'Hosomaki', code:'HS', pref:'hosomak'},
                   {name:'Uramaki',  code:'UR', pref:'uramak'},
                   {name:'Futomaki', code:'FT', pref:'futomak'}];

function katRolki(it){
  return (it && it.catId) ? (DB.cats||[]).find(k=>k.id===it.catId) || null : null;
}
/** pełna nazwa rolki — kategoria i nazwa */
function itName(it){
  if(!it) return '';
  const k = katRolki(it);
  return k ? k.name + ' ' + it.name : it.name;
}
/** krótka nazwa — kod kategorii i nazwa; tam, gdzie mało miejsca */
function itNameK(it){
  if(!it) return '';
  const k = katRolki(it);
  return k ? k.code + ' ' + it.name : it.name;
}
/** unikalny kod dla nowej kategorii: dwie pierwsze litery, w razie kolizji z cyfrą */
function nowyKodKategorii(nazwa){
  const baza = (bezOgonkow(nazwa).replace(/[^a-z]/g,'').slice(0,2) || 'KA').toUpperCase();
  let kod = baza, i = 2;
  while((DB.cats||[]).some(k=>k.code === kod)) kod = baza + (i++);
  return kod;
}
/** Wydziela kategorię z pierwszego członu nazwy. Robi to raz — potem pole `catId`
    już jest i migracja przestaje cokolwiek ruszać. Nazwy, których nie rozpoznaje,
    zostawia w spokoju: lepiej rolka bez kategorii niż przycięta nazwa. */
function migrateCats(){
  DB.cats = DB.cats || [];
  DB.items.forEach(it=>{
    if('catId' in it) return;
    const czesci = String(it.name||'').trim().split(/\s+/);
    const wzor = czesci.length > 1 &&
      KAT_ROLEK.find(k=>bezOgonkow(czesci[0]).toLowerCase().indexOf(k.pref) === 0);
    if(!wzor){ it.catId = null; return; }
    let kat = DB.cats.find(k=>k.name === wzor.name);
    if(!kat){
      kat = {id:'kat-' + wzor.code.toLowerCase(), name:wzor.name, code:wzor.code};
      DB.cats.push(kat);
    }
    it.catId = kat.id;
    it.name = czesci.slice(1).join(' ');
  });
}

/** JEDNO miejsce na wszystkie migracje i uzupełnienia struktury.
    Dane wchodzą do aplikacji trzema drogami — localStorage, serwer i import —
    i każda musi przejść przez tę funkcję. Trzymanie tego w dwóch miejscach
    już dwa razy skończyło się pustym widokiem po aktualizacji. */
/* ============================================================================
   GRAFIK ZMIAN

   Trzy warstwy, od ogólnej do szczegółowej:

   1. `DB.shiftTpl`   — szablon tygodniowy: dla każdego dnia tygodnia lista zmian.
                        Obowiązuje bezterminowo, więc kalendarz jest wypełniony
                        na wszystkie miesiące w przód bez żadnej pracy.
   2. `DB.shiftWeeks` — nadpisania konkretnego tygodnia (klucz ISO, np. „2026-W33").
                        Tydzień z nadpisaniem ignoruje szablon w całości — kopiujemy
                        do niego szablon w momencie tworzenia, żeby nie trzeba było
                        wpisywać wszystkiego od nowa.
   3. `DB.signups`    — kto się zgłosił i kto jest przypisany, per dzień i zmiana.

   Zgłoszenie i przypisanie to dwie różne rzeczy: na jeden slot może się zgłosić
   pięć osób, a stoi ta, którą wybierze menedżer. Dlatego trzymamy dwie listy,
   a nie jedną z flagą — „chętny" nie znika po odrzuceniu, tylko czeka.
   ========================================================================== */

/** Domyślny szablon: dwie zmiany w tygodniu, jedna w weekend. Punkt wyjścia
    do przestawienia, nie żadna prawda objawiona. */
function domyslnySzablon(){
  const zm = (n, od, doo, sl) => ({id:uid('zm'), name:n, from:od, to:doo, slots:sl});
  const tydzien = () => [zm('I zmiana','08:00','16:00',2), zm('II zmiana','16:00','22:00',1)];
  const weekend = () => [zm('I zmiana','10:00','18:00',1)];
  const t = {};
  DNI.forEach(d=>{ t[d.k] = (d.k==='so'||d.k==='nd') ? weekend() : tydzien(); });
  return t;
}

/** Poniedziałek tygodnia, w którym leży `iso`. Liczymy w UTC, bo strefa czasowa
    potrafi przesunąć północ o godzinę i wtedy dzień tygodnia wychodzi o jeden obok. */
function poniedzialek(iso){
  const d = new Date(iso + 'T00:00:00Z');
  d.setUTCDate(d.getUTCDate() - ((d.getUTCDay() + 6) % 7));
  return d.toISOString().slice(0,10);
}
/** Numer tygodnia w formacie ISO-8601 („2026-W33"). Tydzień należy do roku,
    w którym leży jego czwartek — inaczej przełom roku dawałby dwa tygodnie nr 1. */
function isoTydzien(iso){
  const d = new Date(iso + 'T00:00:00Z');
  d.setUTCDate(d.getUTCDate() - ((d.getUTCDay() + 6) % 7) + 3);
  const rok = d.getUTCFullYear();
  const czw = new Date(Date.UTC(rok, 0, 4));
  czw.setUTCDate(czw.getUTCDate() - ((czw.getUTCDay() + 6) % 7) + 3);
  const nr = 1 + Math.round((d - czw) / 604800000);
  return rok + '-W' + String(nr).padStart(2, '0');
}
function dniKod(iso){ return DNI[(new Date(iso + 'T00:00:00Z').getUTCDay() + 6) % 7].k; }
function przesunISO(iso, dni){
  const d = new Date(iso + 'T00:00:00Z'); d.setUTCDate(d.getUTCDate() + dni);
  return d.toISOString().slice(0,10);
}
function czyNadpisany(iso){ return !!(DB.shiftWeeks||{})[isoTydzien(iso)]; }

/** Zmiany obowiązujące danego dnia — z nadpisania tygodnia, a jak go nie ma,
    z szablonu. Zwracamy kopie referencji z bazy, nie klony: id musi zostać ten sam,
    bo po nim wiszą zgłoszenia. */
function zmianyDnia(iso){
  const nad = (DB.shiftWeeks||{})[isoTydzien(iso)];
  const zrodlo = nad || DB.shiftTpl || {};
  return (zrodlo[dniKod(iso)] || []).filter(z=>z && z.id);
}

function zapisKlucz(iso, sid){ return iso + '|' + sid; }

/* Zapisy to JEDNA lista. Kto pierwszy kliknie, ten stoi; gdy miejsc nie ma, zapis
   się nie udaje i trzeba się z kimś dogadać, żeby się wypisał. Kolejka chętnych,
   z której menedżer wybierał, brzmiała rozsądnie, a w praktyce znaczyła, że nikt
   nie wie, czy przyjdzie, dopóki ktoś nie kliknie — i że każdy zapis wymagał
   drugiej decyzji. Teraz zapis jest decyzją. */
function zapisy(iso, sid){
  const w = (DB.signups||{})[zapisKlucz(iso, sid)] || {};
  return {osoby: w.osoby || []};
}
function zapisyZapisz(iso, sid, osoby){
  DB.signups = DB.signups || {};
  const k = zapisKlucz(iso, sid);
  if(!osoby.length) delete DB.signups[k];
  else DB.signups[k] = {osoby: osoby.slice()};
}

/** Obsada slotu: ile miejsc, kto stoi, ile jeszcze wolnych. */
function obsada(iso, z){
  const osoby = zapisy(iso, z.id).osoby;
  const slots = z.slots || 0;
  return {slots, osoby, pelna: osoby.length >= slots,
          wolne: Math.max(0, slots - osoby.length)};
}

/* ---------- osoby ----------
   Kartoteka to odbicie kont w aplikacji: w grafiku może stać wyłącznie ktoś,
   kto ma konto, więc nie ma osobnej listy nazwisk do utrzymywania. Wpis powstaje
   sam przy pierwszym zgłoszeniu albo wtedy, gdy właściciel nada komuś skrót
   lub kolor w Użytkownikach. `email` jest kluczem tożsamości, `id` — kluczem
   technicznym, po którym wiszą zapisy. */

/* Osiem kolorów, nie dowolny wybór z tęczy. Dobrane tak, żeby różniły się między
   sobą także dla oka nierozróżniającego czerwieni i zieleni, i żeby żaden nie
   udawał firmowej czerwieni ani kolorów stanu zmiany (zielony/pomarańczowy/czerwony)
   — inaczej „kto stoi" myliłoby się z „czy jest komplet". */
const KOLORY_OSOB = [
  {v:'#2E6FB7', l:'niebieski'},
  {v:'#106A7E', l:'turkusowy'},
  {v:'#1E7A4B', l:'zielony'},
  {v:'#5F6D19', l:'oliwkowy'},
  {v:'#B25C0E', l:'pomarańczowy'},
  {v:'#A02C6B', l:'wrzosowy'},
  {v:'#6B45B0', l:'fioletowy'},
  {v:'#55606E', l:'grafitowy'},
];
const KOLOR_DOMYSLNY = '#55606E';

/** Jasność względna wg WCAG — potrzebna, żeby dobrać kolor tekstu na plakietce. */
function jasnosc(hex){
  const k = String(hex||'').replace('#','');
  if(k.length !== 6) return 0;
  const kanal = i => {
    const c = parseInt(k.slice(i*2, i*2+2), 16) / 255;
    return c <= 0.03928 ? c/12.92 : Math.pow((c + 0.055)/1.055, 2.4);
  };
  return 0.2126*kanal(0) + 0.7152*kanal(1) + 0.0722*kanal(2);
}
/** Biały albo czarny napis — ten, który daje większy kontrast. Plakietka ma
    9-10 px, więc nie ma marginesu na zgadywanie. */
function kontrastNa(hex){
  const l = jasnosc(hex);
  return (l + 0.05) > Math.sqrt(0.05 * 1.05) ? '#101010' : '#ffffff';
}

function osoba(id){ return (DB.staff||[]).find(o=>o.id===id) || null; }
function osobaNazwa(id){ const o = osoba(id); return o ? (o.name || o.email || '?') : '— usunięta —'; }
function osobaKolor(o){ return (o && o.color) || KOLOR_DOMYSLNY; }
/** Skrót nadany ręcznie, a jak go nie ma — pierwsze sześć znaków nazwy. Na kalendarzu
    zawsze coś stoi, nawet zanim właściciel przejdzie przez listę kont. */
function osobaSkrot(o){
  if(!o) return '?';
  const s = String(o.code || '').trim();
  if(s) return s;
  // pierwszy człon nazwy, nie pierwsze sześć znaków całości: „Zosia Wiśniewska"
  // ma dać „Zosia", a nie „Zosia " z wiszącą spacją
  const slowo = String(o.name || o.email || '').split(/[^\p{L}\p{N}]+/u).filter(Boolean)[0];
  return (slowo || '?').slice(0, 6);
}
function skrotHtml(o){
  const k = osobaKolor(o);
  return `<span class="kod" style="background:${k};color:${kontrastNa(k)}"
    data-tip="${esc(o ? (o.name || o.email || '') : '')}">${esc(osobaSkrot(o))}</span>`;
}

/** Lista godzin co kwadrans do wyboru w szablonie zmian.

    Pole `type=time` w przeglądarce wygląda niepozornie, ale obsługuje się je wyłącznie
    z klawiatury: trzeba trafić w segment godziny, wpisać dwie cyfry, przejść do minut.
    Układanie szablonu to kilkanaście takich pól pod rząd. Lista rozwijana załatwia to
    jednym kliknięciem, a przy okazji nie wpuści „25:70". Kwadrans wystarcza — zmiana
    zaczynająca się o 8:07 nie istnieje. */
function godzinyOpcje(){
  const l = [];
  for(let h = 0; h < 24; h++)
    for(let m = 0; m < 60; m += 15)
      l.push(String(h).padStart(2,'0') + ':' + String(m).padStart(2,'0'));
  return l;
}
/** Wybór godziny; wartość spoza kwadransów (ze starych danych) dokładamy do listy,
    żeby otwarcie szablonu nie skasowało po cichu czyjegoś 8:20. */
function polePory(wartosc, atrybut){
  const opcje = godzinyOpcje();
  const v = String(wartosc || '');
  if(v && opcje.indexOf(v) < 0) opcje.push(v);
  return '<select ' + atrybut + '><option value="">—</option>'
    + opcje.map(g=>'<option value="' + g + '"' + (g === v ? ' selected' : '') + '>' + g + '</option>').join('')
    + '</select>';
}

/* ---------- godziny ---------- */
/** Długość zmiany w godzinach. Zmiana przez północ (22:00–06:00) to normalna rzecz
    w gastronomii, więc doba się dokłada zamiast wyjść liczbą ujemną. */
function godzinyZmiany(z){
  const m = t => { const p = String(t||'').match(/^(\d{1,2}):(\d{2})$/);
                   return p ? (+p[1]) * 60 + (+p[2]) : null; };
  const od = m(z && z.from), doo = m(z && z.to);
  if(od == null || doo == null) return 0;
  return ((doo - od + 1440) % 1440) / 60;
}
/** Godziny i liczba dni w podanych dniach. `osId === null` znaczy „wszyscy razem" —
    tak liczy się nagłówek w trybie lokalnym, gdzie nie ma zalogowanej osoby. */
function godzinyDni(osId, dni){
  let godziny = 0, ile = 0;
  dni.forEach(iso=>{
    let ma = false;
    zmianyDnia(iso).forEach(z=>{
      const osoby = zapisy(iso, z.id).osoby;
      const n = osId ? (osoby.indexOf(osId) >= 0 ? 1 : 0) : osoby.length;
      if(n){ godziny += godzinyZmiany(z) * n; ma = true; }
    });
    if(ma) ile++;
  });
  return {godziny, dni: ile};
}
/** Wszystkie dni miesiąca „2026-08" po kolei. */
function dniMiesiaca(ym){
  const out = [], koniec = przesunMies(ym, 1) + '-01';
  for(let d = ym + '-01'; d < koniec; d = przesunISO(d, 1)) out.push(d);
  return out;
}

/** Godziny osoby w danym miesiącu („2026-08"): osobno te już w grafiku i te,
    na które się zapisała, ale decyzji jeszcze nie ma. */
function godzinyOsoby(osId, ym){
  let wgrafiku = 0, zmian = 0;
  const koniec = przesunMies(ym, 1) + '-01';
  for(let iso = ym + '-01'; iso < koniec; iso = przesunISO(iso, 1)){
    zmianyDnia(iso).forEach(z=>{
      if(zapisy(iso, z.id).osoby.indexOf(osId) >= 0){ wgrafiku += godzinyZmiany(z); zmian++; }
    });
  }
  return {wgrafiku, zmian};
}
/** Wszyscy, którzy w tym miesiącu gdziekolwiek figurują — z godzinami.
    Najpierw ci z największą liczbą godzin: przy układaniu grafiku patrzy się,
    komu się należy, a komu już wystarczy. */
function godzinyMiesiaca(ym){
  const widziani = new Set();
  const koniec = przesunMies(ym, 1) + '-01';
  for(let iso = ym + '-01'; iso < koniec; iso = przesunISO(iso, 1))
    zmianyDnia(iso).forEach(z=>zapisy(iso, z.id).osoby.forEach(i=>widziani.add(i)));
  return [...widziani].map(id=>({os: osoba(id) || {id, name:'— usunięta —'},
                                 ...godzinyOsoby(id, ym)}))
    .sort((a,b)=> b.wgrafiku - a.wgrafiku
                  || String(a.os.name||'').localeCompare(String(b.os.name||''), 'pl'));
}
function godz(h){
  if(!h) return '0 h';
  return (Math.round(h * 10) / 10).toString().replace('.', ',') + ' h';
}
/** Konto zalogowanego użytkownika w kartotece pracowników. Dopisujemy je przy
    pierwszym zetknięciu, żeby menedżer nie musiał zakładać kartoteki ręcznie
    dla każdego, komu założył konto. */
function osobaZMaila(mail, dopisz){
  if(!mail) return null;
  DB.staff = DB.staff || [];
  let o = DB.staff.find(x=>String(x.email||'').toLowerCase() === String(mail).toLowerCase());
  if(!o && dopisz){
    o = {id: uid('os'), name: String(mail).split('@')[0], email: mail, archived: false};
    DB.staff.push(o);
  }
  return o;
}

/* ---------- kto co może ----------
   Układanie grafiku to OSOBNE uprawnienie, nie pochodna roli. Zmianami zajmuje się
   zwykle ktoś inny niż osoba od cen i receptur — kucharz z pełnym dostępem do bazy
   nie musi mieć nic do grafiku, a kierownik zmiany, który poza grafikiem nie ma
   w aplikacji nic do roboty, musi. Właściciel ma to uprawnienie zawsze, bo to on
   je nadaje i nie może się od niego odciąć. */
function mojEmail(){ return (SRV.on && SRV.user) ? SRV.user.email : null; }
function czyPracownik(){ return !!(SRV.on && SRV.user && SRV.user.role === 'staff'); }
/** Poza trybem serwerowym nie ma kont — przy pliku z dysku siedzi ten, kto go otworzył. */
function mozeGrafik(){
  if(!(SRV.on && SRV.user)) return true;
  return SRV.user.role === 'owner' || !!SRV.user.sched;
}
function mojaOsoba(){ return osobaZMaila(mojEmail(), false); }

/** Wpisanie na zmianę albo wypisanie. Zwraca `true`, gdy coś się zmieniło,
    i `false`, gdy zabrakło miejsca — to jedyny powód, dla którego zapis odpada. */
function wpis(iso, z, osId, on){
  const osoby = zapisy(iso, z.id).osoby.slice();
  const i = osoby.indexOf(osId);
  if(on){
    if(i >= 0) return true;                       // już stoi — nic do roboty
    if(osoby.length >= (z.slots || 0)) return false;
    osoby.push(osId);
  }else{
    if(i < 0) return true;
    osoby.splice(i, 1);
  }
  zapisyZapisz(iso, z.id, osoby);
  return true;
}

/** Zgłoszenia sprzed pół roku nikomu już nie służą, a puchną w każdym zapisie.
    Kasujemy przy wczytaniu, cicho — to nie jest informacja, po którą ktoś wraca. */
/** Przejście z kolejki chętnych na jedną listę.

    Przypisani wchodzą wprost, a chętni, którzy się nie załapali, dopełniają wolne
    miejsca w kolejności zgłoszeń — bo od teraz właśnie tak by to wyszło. Reszta
    odpada: nie ma już gdzie ich trzymać, a udawanie, że ktoś „czeka", gdy nikt tej
    kolejki nie ogląda, byłoby gorsze niż jasny brak wpisu. */
function migrujZapisy(){
  Object.keys(DB.signups || {}).forEach(k=>{
    const w = DB.signups[k];
    if(!w || Array.isArray(w.osoby)) return;
    const iso = k.slice(0, 10), sid = k.slice(11);
    const z = zmianyDnia(iso).find(x=>x.id === sid);
    const miejsc = z ? (z.slots || 0) : (w.przypisani || []).length;
    const osoby = (w.przypisani || []).slice();
    (w.chetni || []).forEach(id=>{
      if(osoby.length < miejsc && osoby.indexOf(id) < 0) osoby.push(id);
    });
    if(osoby.length) DB.signups[k] = {osoby};
    else delete DB.signups[k];
  });
}

function przytnijZapisy(){
  const prog = przesunISO(todayISO(), -180);
  Object.keys(DB.signups || {}).forEach(k=>{
    if(k.slice(0,10) < prog) delete DB.signups[k];
  });
}

function migrateGrafik(){
  DB.shiftTpl   = DB.shiftTpl || domyslnySzablon();
  DB.shiftWeeks = DB.shiftWeeks || {};
  DB.signups    = DB.signups || {};
  DB.staff      = DB.staff || [];
  // skrót obcinamy przy wczytaniu, nie tylko w formularzu — dane mogą przyjść
  // z importu albo ze starszej wersji, a plakietka ma stałą szerokość
  DB.staff.forEach(o=>{
    if(o.code) o.code = String(o.code).trim().slice(0, 6);
    if(o.color && KOLORY_OSOB.every(k=>k.v !== o.color)) o.color = null;
  });
  migrujZapisy();
  // zmiana bez identyfikatora nie da się powiązać ze zgłoszeniem
  DNI.forEach(d=>{ (DB.shiftTpl[d.k] || []).forEach(z=>{ if(!z.id) z.id = uid('zm'); }); });
  Object.keys(DB.shiftWeeks).forEach(t=>{
    DNI.forEach(d=>{ (DB.shiftWeeks[t][d.k] || []).forEach(z=>{ if(!z.id) z.id = uid('zm'); }); });
  });
  przytnijZapisy();
}

function migrateAll(){
  if(!DB) return;
  DB.settings = Object.assign({targetFc:.30, alertFc:.35, currency:'zł', roundTo:.9,
                               pdfMinFont:11, pdfMaxCols:3}, DB.settings||{});
  DB.settings.vats = Object.assign({vending:0.05, dostawa:0.08}, DB.settings.vats||{});
  DB.history     = DB.history || [];
  DB.preps       = DB.preps || [];
  DB.ingredients = DB.ingredients || [];
  DB.items       = DB.items || [];
  DB.sets        = DB.sets || [];
  migrateVending();
  migrateLoads();
  DB.preps.forEach(p=>migrateWaste(p));
  DB.sets.forEach(s=>{ s.comps = s.comps||[]; migratePack(s); migrateChannels(s); });
  DB.items.forEach(i=>{ i.comps = i.comps||[]; migrateChannels(i); });
  migrateCats();
  migrateGrafik();
}

function load(){
  const s = safeGet();
  if(s){ try{ DB = JSON.parse(s); }catch(e){ DB=null; } }
  if(!DB) DB = clone(SEED);
  migrateAll();
  STORAGE_OK = safeSet('probe')!==false; try{localStorage.removeItem('probe');}catch(e){}
}
function save(){
  if(!canEdit()){ alert('Twoje konto ma tylko podgląd — zmiany nie zostaną zapisane.'); return; }
  const ok = safeSet(JSON.stringify(DB));
  if(!ok) STORAGE_OK=false;
  if(SRV.on && SRV.user) SRV.push();
  else if(SUPA.on) SUPA.push();
}

/* ============================================================================
   LISTY ROZWIJANE Z WYSZUKIWANIEM
   Zwykły <select> pozwala skakać tylko po pierwszej literze, a przy 50 składnikach
   to za mało. Ten komponent filtruje po dowolnym fragmencie i ignoruje polskie
   ogonki, więc „losos" znajduje „Łosoś". Ukryty input trzyma id wybranej pozycji,
   dzięki czemu reszta kodu czyta wartość tak samo jak z selecta.
   ========================================================================== */
const COMBO = {};
function bezOgonkow(s){
  return String(s||'').toLowerCase()
    .replace(/ą/g,'a').replace(/ć/g,'c').replace(/ę/g,'e').replace(/ł/g,'l').replace(/ń/g,'n')
    .replace(/ó/g,'o').replace(/ś/g,'s').replace(/ź/g,'z').replace(/ż/g,'z');
}
/** markup listy: widoczne pole tekstowe + ukryta wartość + wysuwana lista */
function combo(id, ph, style){
  return `<div class="combo" style="${style||''}">
    <input type="text" class="combo-q" id="${id}_q" placeholder="${esc(ph||'Szukaj…')}"
           autocomplete="off" spellcheck="false">
    <input type="hidden" id="${id}">
    <div class="combo-pop" id="${id}_p"></div>
  </div>`;
}
/* Pozycja „nic nie wybrano”. Bez niej fillCombo podstawiłby pierwszą opcję z listy,
   a pusty wiersz zaczynałby życie z przypadkowym składnikiem. */
const PUSTY_WYBOR = {v:'', l:'— wybierz —', pin:true};
/** listy w wierszach przerysowują się przy każdym draw() — nasłuch przewijania
    wieszamy raz na identyfikator, żeby nie mnożył się bez końca */
const COMBO_SCROLL = new Set();

/** opts: [{v,l}] — sortowane po etykiecie, po polsku */
function fillCombo(id, opts, current, onPick){
  const q=document.getElementById(id+'_q'), h=document.getElementById(id), pop=document.getElementById(id+'_p');
  if(!q||!h||!pop) return;
  // pozycje z `pin` zostają na górze w podanej kolejności (np. „Wszystkie kategorie")
  const przypiete=opts.filter(o=>o.pin), reszta=opts.filter(o=>!o.pin);
  reszta.sort((a,b)=>String(a.l).localeCompare(String(b.l),'pl',{numeric:true,sensitivity:'base'}));
  const lista=[...przypiete, ...reszta];
  COMBO[id]={lista, onPick, idx:-1};
  const wybierz=o=>{ h.value=o?o.v:''; q.value=o?o.l:''; };
  wybierz(lista.find(o=>o.v===current) || lista[0] || null);

  const rysuj=()=>{
    const f=bezOgonkow(q.value.trim());
    const wid = (f && q.dataset.tknieto==='1') ? lista.filter(o=>bezOgonkow(o.l).includes(f)) : lista;
    COMBO[id].widoczne=wid; if(COMBO[id].idx>=wid.length) COMBO[id].idx=wid.length-1;
    pop.innerHTML = wid.length
      ? wid.map((o,i)=>`<div class="opt ${i===COMBO[id].idx?'on':''}" data-i="${i}">${esc(o.l)}</div>`).join('')
      : '<div class="none">Nic nie pasuje</div>';
    pop.querySelectorAll('.opt').forEach(el=>el.addEventListener('mousedown',e=>{
      e.preventDefault(); const o=wid[+el.dataset.i]; wybierz(o); zamknij();
      if(COMBO[id].onPick) COMBO[id].onPick(o.v);
    }));
  };
  const ustawPozycje=()=>{
    const r=q.getBoundingClientRect();
    const podSpodem = window.innerHeight - r.bottom;
    pop.style.left=r.left+'px'; pop.style.width=r.width+'px';
    if(podSpodem < 180 && r.top > podSpodem){ pop.style.top='auto'; pop.style.bottom=(window.innerHeight-r.top+4)+'px'; }
    else { pop.style.bottom='auto'; pop.style.top=(r.bottom+4)+'px'; }
  };
  const otworz=()=>{ rysuj(); ustawPozycje(); pop.classList.add('open'); };
  const zamknij=()=>{ pop.classList.remove('open'); q.dataset.tknieto='0'; COMBO[id].idx=-1;
    const o=lista.find(x=>x.v===h.value); if(o) q.value=o.l; };
  COMBO[id].zamknij=zamknij;

  q.addEventListener('focus',()=>{ q.dataset.tknieto='0'; q.select(); otworz(); });
  q.addEventListener('input',()=>{ q.dataset.tknieto='1'; COMBO[id].idx=0; rysuj(); ustawPozycje(); pop.classList.add('open'); });
  q.addEventListener('blur',()=>setTimeout(zamknij,120));
  q.addEventListener('keydown',e=>{
    const w=COMBO[id].widoczne||lista;
    if(e.key==='ArrowDown'||e.key==='ArrowUp'){
      e.preventDefault();
      if(!pop.classList.contains('open')) otworz();
      COMBO[id].idx=Math.max(0,Math.min(w.length-1,COMBO[id].idx+(e.key==='ArrowDown'?1:-1)));
      rysuj();
      const on=pop.querySelector('.opt.on'); if(on) on.scrollIntoView({block:'nearest'});
    } else if(e.key==='Enter'){
      e.preventDefault();
      const o=w[COMBO[id].idx<0?0:COMBO[id].idx]; if(o){ wybierz(o); zamknij(); if(COMBO[id].onPick) COMBO[id].onPick(o.v); }
    } else if(e.key==='Escape'){
      // Escape ma zamknąć samą listę, nie cały dialog pod spodem
      if(pop.classList.contains('open')){ e.preventDefault(); e.stopPropagation(); zamknij(); }
    }
  });
  if(!COMBO_SCROLL.has(id)){
    COMBO_SCROLL.add(id);
    window.addEventListener('scroll',()=>{
      const p2=document.getElementById(id+'_p');
      if(p2 && p2.classList.contains('open')){
        const q2=document.getElementById(id+'_q'); if(!q2) return;
        const r=q2.getBoundingClientRect(), podSpodem=window.innerHeight-r.bottom;
        p2.style.left=r.left+'px'; p2.style.width=r.width+'px';
        if(podSpodem < 180 && r.top > podSpodem){ p2.style.top='auto'; p2.style.bottom=(window.innerHeight-r.top+4)+'px'; }
        else { p2.style.bottom='auto'; p2.style.top=(r.bottom+4)+'px'; }
      }
    }, true);
  }
}

function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function kb(n){ return n>1048576 ? (n/1048576).toFixed(1).replace('.',',')+' MB' : Math.round(n/1024)+' kB'; }

/** wczytuje zdjęcie z pliku i zmniejsza je do miniatury (max 1200 px, JPEG) */
function readPhoto(file, cb){
  if(!file){ cb(null); return; }
  if(!/^image\//.test(file.type)){ alert('To nie jest plik graficzny.'); cb(null); return; }
  const fr=new FileReader();
  fr.onload=()=>{
    const img=new Image();
    img.onload=()=>{
      const MAX=1200;
      let {width:w, height:h}=img;
      if(w>MAX||h>MAX){ const r=Math.min(MAX/w,MAX/h); w=Math.round(w*r); h=Math.round(h*r); }
      const cv=document.createElement('canvas'); cv.width=w; cv.height=h;
      const cx=cv.getContext('2d');
      cx.fillStyle='#fff'; cx.fillRect(0,0,w,h);
      cx.drawImage(img,0,0,w,h);
      cb(cv.toDataURL('image/jpeg',0.72));
    };
    img.onerror=()=>{ alert('Nie udało się odczytać zdjęcia.'); cb(null); };
    img.src=fr.result;
  };
  fr.onerror=()=>{ alert('Nie udało się odczytać pliku.'); cb(null); };
  fr.readAsDataURL(file);
}

/** podpina pole wgrywania zdjęcia (element .drop + ukryty input) */
function wirePhoto(dropId, inputId, obj, onDone){
  const drop=document.getElementById(dropId), inp=document.getElementById(inputId);
  if(!drop||!inp) return;
  const paint=()=>{
    drop.className = 'drop'+(obj.photo?' has':'');
    drop.innerHTML = obj.photo
      ? `<img src="${obj.photo}" alt="">`
      : '⊕ Kliknij, żeby dodać zdjęcie<br><span class="small">JPG lub PNG — zostanie zmniejszone do 1200 px</span>';
  };
  drop.addEventListener('click',()=>inp.click());
  drop.addEventListener('dragover',e=>{e.preventDefault();});
  drop.addEventListener('drop',e=>{ e.preventDefault();
    readPhoto(e.dataTransfer.files[0], d=>{ if(d){ obj.photo=d; paint(); if(onDone)onDone(); } }); });
  inp.addEventListener('change',()=>{
    readPhoto(inp.files[0], d=>{ if(d){ obj.photo=d; paint(); if(onDone)onDone(); } inp.value=''; }); });
  const rm=document.getElementById(dropId+'Rm');
  if(rm) rm.addEventListener('click',()=>{ obj.photo=null; paint(); if(onDone)onDone(); });
  paint();
}
function photoField(dropId, inputId, label){

}

/* ============================================================================
   WARTOŚCI ODŻYWCZE I ALERGENY
   Tabela składnika jest zawsze **na 100 g** — tak podają ją producenci i tego
   wymaga rozporządzenie 1169/2011. Przeliczenie na jednostkę składnika idzie
   przez masę tej jednostki (`gPerUnit`), bo nori liczymy w arkuszach,
   a krewetki w sztukach.
   ========================================================================== */
const NUTR = [
  {k:'kcal',    l:'Wartość energetyczna', u:'kcal'},
  {k:'fat',     l:'Tłuszcz',              u:'g'},
  {k:'satfat',  l:'w tym kwasy nasycone', u:'g', sub:true},
  {k:'carbs',   l:'Węglowodany',          u:'g'},
  {k:'sugars',  l:'w tym cukry',          u:'g', sub:true},
  {k:'protein', l:'Białko',               u:'g'},
  {k:'salt',    l:'Sól',                  u:'g'},
];
const ALERG = [
  ['gluten','Zboża zawierające gluten'], ['skorupiaki','Skorupiaki'], ['jaja','Jaja'],
  ['ryby','Ryby'], ['orzeszki','Orzeszki ziemne'], ['soja','Soja'], ['mleko','Mleko'],
  ['orzechy','Orzechy'], ['seler','Seler'], ['gorczyca','Gorczyca'], ['sezam','Nasiona sezamu'],
  ['siarczyny','Dwutlenek siarki i siarczyny'], ['lubin','Łubin'], ['mieczaki','Mięczaki'],
];
const ALERG_NAME = {}; ALERG.forEach(a=>ALERG_NAME[a[0]]=a[1]);

/** ile surowca schodzi na linię receptury: to, co zostaje, plus to, co się wyrzuca */
function lineQty(c){ return (c.qty||0) + (c.waste||0); }

function emptyNutr(){ const o={}; NUTR.forEach(n=>o[n.k]=0); return o; }
function addNutr(a,b,f){ NUTR.forEach(n=>a[n.k]+=(b[n.k]||0)*(f==null?1:f)); return a; }
/** czy składnik ma wypełnioną tabelę. Same zera to też odpowiedź —
    tacka naprawdę ma zero kalorii i nie powinna trafiać na listę braków. */
function hasNutr(n){ return !!n && NUTR.some(x=>n[x.k]!=null); }
/** ile gramów waży jedna jednostka; null = nie wiadomo */
function unitGrams(unit, explicit){
  if(unit==='g'||unit==='ml') return 1;
  if(unit==='kg'||unit==='l') return 1000;
  return explicit==null ? null : explicit;
}

const CALC = {
  ing(id){ return DB.ingredients.find(x=>x.id===id); },
  prep(id){ return DB.preps.find(x=>x.id===id); },
  item(id){ return DB.items.find(x=>x.id===id); },
  set(id){ return DB.sets.find(x=>x.id===id); },

  /** koszt jednostkowy składnika (za 1 jednostkę bazową) */
  ingUnitCost(id){
    const g = this.ing(id);
    if(!g || g.packPrice==null || !g.packQty) return null;
    return g.packPrice / g.packQty;
  },

  /** koszt jednostkowy półproduktu (za 1 jednostkę wydajności) */
  prepUnitCost(id, seen){
    seen = seen || new Set();
    if(seen.has(id)) return null;         // ochrona przed pętlą
    seen.add(id);
    const p = this.prep(id);
    if(!p || !p.yieldQty) return null;
    let tot = 0;
    for(const c of p.items){
      let uc = 0;
      if(c.kind==='raw') uc = c.unitCost||0;
      else if(c.kind==='ing') uc = this.ingUnitCost(c.refId)||0;
      else if(c.kind==='prep') uc = this.prepUnitCost(c.refId, seen)||0;
      tot += ((c.qty||0)+(c.waste||0))*uc;   // odpad też kosztuje
    }
    return tot / p.yieldQty;
  },

  /** koszt jednostkowy dowolnego komponentu + etykieta */
  compInfo(refId){
    const g = this.ing(refId);
    if(g) return {name:g.name, unit:g.unit, unitCost:this.ingUnitCost(refId), kind:'ing', cat:g.cat};
    const p = this.prep(refId);
    if(p) return {name:p.name, unit:p.yieldUnit, unitCost:this.prepUnitCost(refId), kind:'prep', cat:'Półprodukt'};
    return {name:'⚠ brak: '+refId, unit:'', unitCost:null, kind:'missing', cat:'—'};
  },

  /** rozbicie kosztu listy komponentów */
  breakdown(comps){
    const rows=[]; let tot=0; const missing=[];
    for(const c of comps){
      const info = this.compInfo(c.refId);
      const uc = info.unitCost;
      const cost = (c.qty||0) * (uc||0);
      if(uc==null) missing.push(info.name);
      rows.push({refId:c.refId, name:info.name, unit:info.unit, qty:c.qty, unitCost:uc, cost, kind:info.kind});
      tot += cost;
    }
    rows.sort((a,b)=>b.cost-a.cost);
    return {rows, total:tot, missing};
  },

  /** cena brutto w danym kanale */
  priceOf(o, chan){ return (o && o.prices) ? o.prices[chan||CHAN] : null; },
  /** stawka VAT w danym kanale */
  vatOf(o, chan){
    const c = chan||CHAN;
    if(o && o.vats && o.vats[c]!=null) return o.vats[c];
    return (DB.settings.vats && DB.settings.vats[c]!=null)
      ? DB.settings.vats[c]
      : (CHANNELS.find(x=>x.k===c)||{vat:0.08}).vat;
  },

  /** pełna kalkulacja pozycji menu w wybranym kanale */
  itemCalc(it, chan){
    const b = this.breakdown(it.comps);
    const vat = this.vatOf(it, chan);
    const pieces = it.pieces||1;
    const priceGross = this.priceOf(it, chan)||0;
    const priceNet = priceGross/(1+vat);
    return {
      ...b,
      net: b.total,
      gross: b.total*(1+vat),
      perPiece: b.total/pieces,
      pricePerPiece: priceGross/pieces,
      priceGross, priceNet, vat, pieces, chan: chan||CHAN,
      fc: priceNet>0 ? b.total/priceNet : null,
      margin: priceNet>0 ? priceNet-b.total : null,
      suggested: this.suggest(b.total, vat, DB.settings.targetFc),
    };
  },

  /** pełna kalkulacja zestawu */
  setCalc(st, chan){
    let cost=0, pieces=0; const parts=[]; const missing=[];
    for(const e of (st.entries||[])){
      const it = this.item(e.itemId);
      if(!it){ missing.push('pozycja '+e.itemId); continue; }
      const ic = this.itemCalc(it, chan);
      const c = ic.perPiece*(e.pieces||0);
      cost += c; pieces += (e.pieces||0);
      parts.push({name:itName(it), itemId:it.id, pieces:e.pieces, perPiece:ic.perPiece, cost:c,
                  alaCarte: ic.pricePerPiece*(e.pieces||0)});
      ic.missing.forEach(m=>missing.push(m));
    }
    const extra = this.breakdown(st.comps||[]);
    extra.missing.forEach(m=>missing.push(m));
    cost += extra.total;
    const vat = this.vatOf(st, chan);
    const priceGross = this.priceOf(st, chan)||0, priceNet = priceGross/(1+vat);
    const alaCarte = parts.reduce((s,p)=>s+p.alaCarte,0);
    return {
      parts, extra, packaging:extra.total,
      pieces, net:cost, gross:cost*(1+vat),
      priceGross, priceNet, vat, alaCarte, chan: chan||CHAN,
      discount: alaCarte>0 ? 1-priceGross/alaCarte : null,
      fc: priceNet>0 ? cost/priceNet : null,
      margin: priceNet>0 ? priceNet-cost : null,
      perPiece: pieces? cost/pieces : null,
      suggested: this.suggest(cost, vat, DB.settings.targetFc),
      missing:[...new Set(missing)],
    };
  },

  /** cena sprzedaży brutto dla zadanego food cost */
  suggest(net, vat, targetFc){
    if(!targetFc||!net) return null;
    const raw = net*(1+vat)/targetFc;
    const step = DB.settings.roundTo;
    if(!step) return raw;
    // zaokrąglenie w górę do najbliższej końcówki ,90 / pełnej złotówki
    if(step===0.9){ const base=Math.floor(raw); return (raw<=base+0.9? base+0.9 : base+1.9); }
    return Math.ceil(raw/step)*step;
  },

  /* -------- wartości odżywcze -------- */

  /** masa 1 jednostki składnika w gramach */
  ingGrams(id){ const g=this.ing(id); return g ? unitGrams(g.unit, g.gPerUnit) : null; },

  /** wartości odżywcze 1 jednostki składnika (tabela jest na 100 g) */
  ingNutr(id){
    const g=this.ing(id);
    if(!g || !hasNutr(g.nutr)) return null;
    const gr=unitGrams(g.unit, g.gPerUnit);
    if(gr==null) return null;
    const o={}; NUTR.forEach(n=>o[n.k]=(g.nutr[n.k]||0)*gr/100);
    return o;
  },

  /** wartości odżywcze 1 jednostki półproduktu.
      Linie oznaczone jako **odpad** wchodzą do kosztu, ale nie do wartości
      odżywczych — z kilograma ogórka zostaje pół kilo miąższu i pół kilo
      obierek, a płacisz za całość. */
  prepNutr(id, seen){
    // przyjmuje id albo gotowy obiekt — dzięki temu edytor liczy na kopii,
    // bez podmieniania czegokolwiek w DB
    const p = (id && typeof id === 'object') ? id : this.prep(id);
    if(!p || !p.yieldQty) return null;
    seen = seen || new Set();
    if(seen.has(p.id)) return null;
    seen.add(p.id);
    const tot=emptyNutr(); let any=false; const missing=[];
    for(const c of p.items){
      if(!(c.qty>0)) continue;             // linia to sam odpad — kosztuje, nie odżywia
      let n=null, nazwa='';
      if(c.kind==='raw'){
        nazwa=c.name;
        if(hasNutr(c.nutr)){
          const gr=unitGrams(c.unit, c.gPerUnit);
          if(gr!=null){ n={}; NUTR.forEach(x=>n[x.k]=(c.nutr[x.k]||0)*gr/100); }
        }
      } else if(this.prep(c.refId)){
        const r=this.prepNutr(c.refId, seen); nazwa=(this.prep(c.refId)||{}).name;
        if(r && r.ok) n=r.nutr;
      } else {
        n=this.ingNutr(c.refId); nazwa=this.compInfo(c.refId).name;
      }
      if(!n){ missing.push(nazwa); continue; }
      addNutr(tot, n, c.qty||0); any=true;
    }
    const o={}; NUTR.forEach(x=>o[x.k]=tot[x.k]/p.yieldQty);
    return {nutr:o, grams:unitGrams(p.yieldUnit, p.gPerUnit), ok:any&&!missing.length, missing};
  },

  /** alergeny półproduktu — także z linii oznaczonych jako odpad,
      bo obierki i tak dotykają produktu */
  prepAlerg(id, seen){
    seen = seen || new Set();
    if(seen.has(id)) return [];
    seen.add(id);
    const p=this.prep(id); if(!p) return [];
    const out=new Set();
    p.items.forEach(c=>{
      if(c.kind==='raw'){ (c.alerg||[]).forEach(a=>out.add(a)); return; }
      if(this.prep(c.refId)) this.prepAlerg(c.refId, seen).forEach(a=>out.add(a));
      else { const g=this.ing(c.refId); if(g) (g.alerg||[]).forEach(a=>out.add(a)); }
    });
    return [...out];
  },

  /** suma wartości odżywczych i masy dla listy komponentów */
  nutrOf(comps){
    const tot=emptyNutr(); let mass=0; const missing=[], noMass=[]; const al=new Set();
    for(const c of (comps||[])){
      const g=this.ing(c.refId), p=this.prep(c.refId);
      const nazwa=this.compInfo(c.refId).name;
      let n=null, gr=null;
      if(g){ n=this.ingNutr(c.refId); gr=unitGrams(g.unit,g.gPerUnit); (g.alerg||[]).forEach(a=>al.add(a)); }
      else if(p){ const r=this.prepNutr(c.refId); if(r){ n=r.ok?r.nutr:null; gr=r.grams; }
                  this.prepAlerg(c.refId).forEach(a=>al.add(a)); }
      if(gr==null) noMass.push(nazwa); else mass += (c.qty||0)*gr;
      if(!n){ if(g||p) missing.push(nazwa); continue; }
      addNutr(tot, n, c.qty||0);
    }
    return {nutr:tot, mass, missing:[...new Set(missing)], noMass:[...new Set(noMass)], alerg:[...al]};
  },

  /** wartości odżywcze rolki */
  itemNutr(it){ return this.nutrOf(it.comps); },

  /** wartości odżywcze zestawu: rolki przeliczone po kawałkach + dodatki */
  setNutr(st){
    const tot=emptyNutr(); let mass=0; const missing=[], noMass=[]; const al=new Set();
    for(const e of (st.entries||[])){
      const it=this.item(e.itemId); if(!it || !it.pieces) continue;
      const r=this.itemNutr(it); const f=(e.pieces||0)/it.pieces;
      addNutr(tot, r.nutr, f); mass += r.mass*f;
      r.missing.forEach(m=>missing.push(m)); r.noMass.forEach(m=>noMass.push(m));
      r.alerg.forEach(a=>al.add(a));
    }
    const ex=this.nutrOf(st.comps);
    addNutr(tot, ex.nutr, 1); mass += ex.mass;
    ex.missing.forEach(m=>missing.push(m)); ex.noMass.forEach(m=>noMass.push(m));
    ex.alerg.forEach(a=>al.add(a));
    return {nutr:tot, mass, missing:[...new Set(missing)], noMass:[...new Set(noMass)], alerg:[...al]};
  },

  /** gdzie użyty jest składnik */
  usedBy(refId){
    const out=[];
    DB.items.forEach(i=>{ if(i.comps.some(c=>c.refId===refId)) out.push({type:'item',id:i.id,name:itName(i)}); });
    DB.preps.forEach(p=>{ if(p.items.some(c=>c.refId===refId)) out.push({type:'prep',id:p.id,name:p.name}); });
    DB.sets.forEach(s=>{
      if((s.comps||[]).some(c=>c.refId===refId)
         || (s.entries||[]).some(e=>e.itemId===refId))
        out.push({type:'set',id:s.id,name:s.name});
    });
    return out;
  },

  status(fc){
    if(fc==null) return 'none';
    const t=DB.settings.targetFc, a=DB.settings.alertFc;
    if(fc>a) return 'crit';
    if(fc>t) return 'warn';
    return 'good';
  },
};

/* ============================================================================
   PROBLEMY / ALERTY
   ========================================================================== */
function problems(){
  const out=[];
  const idle=[];
  active(DB.ingredients).forEach(g=>{
    if(g.packPrice==null || !g.packQty){
      const used = CALC.usedBy(g.id);
      if(used.length) out.push({sev:'crit', k:'noprice',
        title:'Brak ceny: '+g.name,
        msg:'Używany w '+used.length+' recepturach ('+used.map(u=>u.name).join(', ')+') — ich koszt jest zaniżony.',
        go:{v:'ing', id:g.id}});
      else idle.push(g.name);
    }
  });
  if(idle.length) out.push({sev:'info',k:'idle',
    title:idle.length+' składników bez ceny, nieużywanych w recepturach',
    msg:idle.join(', ')+'. Uzupełnij ceny, zanim dopiszesz je do receptur lub zestawów.',
    go:{v:'ing'}});
  active(DB.items).forEach(i=>{
    const c = CALC.itemCalc(i);
    const bezCeny = CHANNELS.filter(ch=>!CALC.priceOf(i, ch.k));
    if(bezCeny.length && i.comps.length)
      out.push({sev: bezCeny.length===CHANNELS.length?'warn':'info', k:'noprice2',
        title:'Brak ceny sprzedaży: '+itName(i),
        msg:'Nie podano ceny w kanale: '+bezCeny.map(ch=>ch.l).join(', ')+'. Bez niej nie da się policzyć food costu.',
        go:{v:'items',id:i.id}});
    if(c.missing.length) out.push({sev:'crit', k:'itemmiss',
      title:'Rolka '+itName(i)+' — niekompletne dane',
      msg:'Brakuje ceny: '+c.missing.join(', ')+'. Koszt jest zaniżony o ten składnik, '
          +'więc food cost tej rolki jest za niski. Pozycja nie wchodzi do średniej.',
      go:{v:'items',id:i.id}});
    if(!CALC.priceOf(i)) return;
    if(c.fc!=null && c.fc>DB.settings.alertFc)
      out.push({sev:'crit',k:'fc',title:itName(i)+' — food cost '+pct(c.fc),
        msg:'Powyżej progu alertu '+pct(DB.settings.alertFc)+'. Sugerowana cena: '+zl(c.suggested)+'.',go:{v:'items',id:i.id}});
    else if(c.fc!=null && c.fc>DB.settings.targetFc)
      out.push({sev:'warn',k:'fc',title:itName(i)+' — food cost '+pct(c.fc),
        msg:'Powyżej celu '+pct(DB.settings.targetFc)+'.',go:{v:'items',id:i.id}});
  });
  const bezNutr = active(DB.ingredients).filter(g=>!hasNutr(g.nutr) && CALC.usedBy(g.id).length);
  if(bezNutr.length) out.push({sev:'info',k:'nonutr',
    title:bezNutr.length+' składników bez tabeli odżywczej',
    msg:bezNutr.map(g=>g.name).join(', ')+'. Bez nich wartości odżywcze rolek i zestawów są niepełne.',
    go:{v:'ing'}});
  const bezMasy = active(DB.ingredients).filter(g=>unitGrams(g.unit,g.gPerUnit)==null && CALC.usedBy(g.id).length);
  if(bezMasy.length) out.push({sev:'warn',k:'nomass',
    title:bezMasy.length+' składników bez wagi jednostki',
    msg:bezMasy.map(g=>g.name).join(', ')+'. Liczone w sztukach — podaj, ile waży jedna, inaczej nie da się policzyć wartości na 100 g.',
    go:{v:'ing'}});
  const noExtra = active(DB.sets).filter(s=>!(s.comps||[]).length);
  if(noExtra.length) out.push({sev:'warn',k:'nopack',
    title:noExtra.length+' zestawów bez dodatków',
    msg:'Poza rolkami nie mają nic — ani tacki, ani pałeczek, ani sosu: '+noExtra.map(s=>s.name).join(', ')+'. Food cost tych zestawów jest zaniżony.',
    go:{v:'sets'}});
  active(DB.sets).forEach(s=>{
    const c = CALC.setCalc(s);
    if(c.missing.length) out.push({sev:'crit',k:'setmiss',title:'Zestaw '+s.name+' — niekompletne dane',msg:'Brakuje: '+c.missing.join(', '),go:{v:'sets',id:s.id}});
    if(c.fc!=null && c.fc>DB.settings.alertFc)
      out.push({sev:'crit',k:'setfc',title:s.name+' — food cost '+pct(c.fc),msg:'Powyżej progu alertu. Sugerowana cena: '+zl(c.suggested)+'.',go:{v:'sets',id:s.id}});
  });
  [['ing',DB.ingredients],['prep',DB.preps],['items',DB.items]].forEach(([k,list])=>{
    list.filter(x=>x.archived).forEach(o=>{
      const used = usedByActive(o.id);
      if(used.length) out.push({sev:'warn', k:'archused',
        title:'W archiwum, ale wciąż używane: '+o.name,
        msg:'Występuje w: '+used.map(u=>u.name).join(', ')+'. Koszt liczy się normalnie, '
            +'ale warto podmienić na aktualny odpowiednik albo przywrócić z archiwum.',
        go:{v:k, id:o.id}});
    });
  });
  const rank={crit:0,warn:1,info:2};
  out.sort((a,b)=>rank[a.sev]-rank[b.sev]);
  return out;
}

/* ============================================================================
   WYKRESY (inline SVG, hover + tooltip)
   ========================================================================== */
const TIP = document.getElementById('tip');
function showTip(html,x,y){ TIP.innerHTML=html; TIP.style.opacity=1;
  const r=TIP.getBoundingClientRect();
  TIP.style.left=Math.min(x+14, innerWidth-r.width-10)+'px';
  TIP.style.top=Math.max(8, y-r.height-12)+'px'; }
function hideTip(){ TIP.style.opacity=0; }

/* Dymek przeglądarki (`title`) wygląda w każdym systemie inaczej i nigdzie nie wygląda
   jak nasza aplikacja: żółte pudełko, systemowy krój, sekunda opóźnienia. Skoro mamy
   własny dymek do wykresów, to samo pudełko obsługuje teraz plakietki osób. */
document.addEventListener('mouseover', e=>{
  const el = e.target.closest && e.target.closest('[data-tip]');
  if(!el || !el.dataset.tip) return;
  const r = el.getBoundingClientRect();
  showTip(esc(el.dataset.tip), r.left + r.width / 2 - 14, r.top);
});
document.addEventListener('mouseout', e=>{
  if(e.target.closest && e.target.closest('[data-tip]')) hideTip();
});
/* Klawiatura też musi go dostać — plakietka bywa jedynym miejscem, gdzie widać,
   kto się kryje pod skrótem. */
document.addEventListener('focusin', e=>{
  const el = e.target.closest && e.target.closest('[data-tip]');
  if(!el || !el.dataset.tip) return;
  const r = el.getBoundingClientRect();
  showTip(esc(el.dataset.tip), r.left + r.width / 2 - 14, r.top);
});
document.addEventListener('focusout', hideTip);

/** poziomy wykres słupkowy z progiem — status wg food cost */
function barChartFc(rows, opts){
  opts = opts||{};
  const H=26, PAD=6, LW=opts.labelW||168, RW=64, W=opts.width||760;
  const h = rows.length*H + 34;
  const max = Math.max(opts.max||0, ...rows.map(r=>r.v||0), DB.settings.alertFc*1.15);
  const plotW = W-LW-RW;
  const x = v => LW + (v/max)*plotW;
  const ticks=[];
  const stepN = 0.1;
  for(let t=0;t<=max+1e-9;t+=stepN) ticks.push(t);
  let s = `<svg class="chart" viewBox="0 0 ${W} ${h}" width="100%" height="${h}" role="img">`;
  ticks.forEach(t=>{ s+=`<line class="gl" x1="${x(t).toFixed(1)}" y1="20" x2="${x(t).toFixed(1)}" y2="${rows.length*H+20}"/>
    <text x="${x(t).toFixed(1)}" y="13" text-anchor="middle">${Math.round(t*100)}%</text>`; });
  // linia celu
  const tx = x(DB.settings.targetFc);
  s+=`<line x1="${tx.toFixed(1)}" y1="16" x2="${tx.toFixed(1)}" y2="${rows.length*H+20}" stroke="var(--ink-2)" stroke-width="1.5" stroke-dasharray="3 3"/>`;
  s+=`<text class="lbl" x="${tx.toFixed(1)}" y="${rows.length*H+32}" text-anchor="middle">cel ${Math.round(DB.settings.targetFc*100)}%</text>`;
  rows.forEach((r,i)=>{
    const y=20+i*H, bw=Math.max(2,x(r.v)-LW);
    const col = r.st==='crit'?'var(--crit)':r.st==='warn'?'var(--warn)':'var(--good)';
    s+=`<text class="lbl" x="${LW-10}" y="${y+15}" text-anchor="end">${esc(r.label.length>26?r.label.slice(0,25)+'…':r.label)}</text>`;
    s+=`<rect class="bar" x="${LW}" y="${y+4}" width="${bw.toFixed(1)}" height="14" fill="${col}"/>`;
    s+=`<text class="val" x="${(LW+bw+8).toFixed(1)}" y="${y+15}">${pct(r.v)}</text>`;
    s+=`<rect class="hit" x="0" y="${y}" width="${W}" height="${H}" data-i="${i}"/>`;
  });
  s+='</svg>';
  return s;
}

/** pionowy/poziomy wykres udziału kosztów (jedna seria → sekwencyjny błękit) */
function barChartCost(rows, W){
  W = W||520;
  const H=24, LW=Math.min(170, W*0.36), RW=78;
  const h=rows.length*H+8;
  const max=Math.max(...rows.map(r=>r.cost),0.0001);
  const plotW=W-LW-RW;
  const RAMP=['#2a78d6','#3987e5','#5598e7','#6da7ec','#86b6ef','#9ec5f4','#b7d3f6','#cde2fb'];
  let s=`<svg class="chart" viewBox="0 0 ${W} ${h}" width="100%" height="${h}">`;
  const maxCh=Math.max(8, Math.floor((LW-12)/5.9));
  rows.forEach((r,i)=>{
    const y=i*H, bw=Math.max(2,(r.cost/max)*plotW);
    s+=`<text class="lbl" x="${LW-9}" y="${y+15}" text-anchor="end">${esc(r.name.length>maxCh?r.name.slice(0,maxCh-1)+'…':r.name)}</text>`;
    s+=`<rect class="bar" x="${LW}" y="${y+4}" width="${bw.toFixed(1)}" height="13" fill="${RAMP[Math.min(i,RAMP.length-1)]}"/>`;
    s+=`<text class="val" x="${(LW+bw+7).toFixed(1)}" y="${y+15}">${num(r.cost)}</text>`;
    s+=`<rect class="hit" x="0" y="${y}" width="${W}" height="${H}" data-i="${i}"/>`;
  });
  s+='</svg>';
  return s;
}

/** wykres liniowy historii ceny */
function lineChart(pts, W, Hh){
  W=W||640; Hh=Hh||190;
  if(pts.length<2) return '<div class="empty">Za mało punktów, żeby narysować wykres (potrzebne min. 2 zmiany ceny).</div>';
  const PL=52,PR=16,PT=14,PB=26;
  const xs=pts.map((p,i)=>i), ys=pts.map(p=>p.v);
  const ymin=Math.min(...ys), ymax=Math.max(...ys);
  const pad=(ymax-ymin)*0.15||Math.abs(ymax*0.1)||1;
  const lo=Math.max(0,ymin-pad), hi=ymax+pad;
  const X=i=>PL+(i/(pts.length-1))*(W-PL-PR);
  const Y=v=>PT+(1-(v-lo)/(hi-lo||1))*(Hh-PT-PB);
  let s=`<svg class="chart" viewBox="0 0 ${W} ${Hh}" width="100%" height="${Hh}">`;
  for(let k=0;k<=4;k++){ const v=lo+(hi-lo)*k/4;
    s+=`<line class="gl" x1="${PL}" y1="${Y(v).toFixed(1)}" x2="${W-PR}" y2="${Y(v).toFixed(1)}"/>
        <text x="${PL-8}" y="${(Y(v)+4).toFixed(1)}" text-anchor="end">${num(v)}</text>`; }
  const d=pts.map((p,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(p.v).toFixed(1)).join(' ');
  s+=`<path d="${d}" fill="none" stroke="var(--dane)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
  pts.forEach((p,i)=>{
    s+=`<circle cx="${X(i).toFixed(1)}" cy="${Y(p.v).toFixed(1)}" r="4" fill="var(--dane)" stroke="var(--surface)" stroke-width="2"/>`;
    if(i===0||i===pts.length-1) s+=`<text x="${X(i).toFixed(1)}" y="${Hh-8}" text-anchor="${i?'end':'start'}">${esc(p.d)}</text>`;
    s+=`<rect class="hit" x="${(X(i)-14).toFixed(1)}" y="0" width="28" height="${Hh}" data-i="${i}"/>`;
  });
  s+='</svg>';
  return s;
}

function wireChart(el, rows, fmt){
  el.querySelectorAll('.hit').forEach(h=>{
    h.addEventListener('mousemove',e=>{ const r=rows[+h.dataset.i]; if(r) showTip(fmt(r), e.clientX, e.clientY); });
    h.addEventListener('mouseleave',hideTip);
    h.addEventListener('click',()=>{ const r=rows[+h.dataset.i]; if(r&&r.go) go(r.go.v, r.go.id); });
  });
}

/** który element listy jest wybrany w danym widoku */
const SEL_KEY = {items:'item', sets:'set', ing:'ing', prep:'prep', vend:'mach', load:'load'};
/* Ekrany, które ktoś czyta w ruchu: kuchnia przy blacie, kierowca w aucie, pracownik
   w telefonie. Dostają większe pismo i luźniejsze wiersze — reszta zostaje gęsta. */
const EKRANY_DNIA = new Set(['dHome','dPrep','dRolki','dZest','dPack','driver','stock',
                             'dSklad','graf']);

/** `go(v)` bez id znaczy „pokaż listę" — dlatego czyści wybór.
    `go(v, id)` znaczy „pokaż tę jedną pozycję". */
function go(v, id){
  const klucz = SEL_KEY[v];
  const bylTen = VIEW===v;
  VIEW=v;
  if(klucz) SEL[klucz] = id || null;
  document.querySelectorAll('.nav').forEach(b=>b.classList.toggle('on', b.dataset.v===v));
  odslonGrupeAktywnej();
  odswiezBurger();
  render();
  if(!bylTen || !id) window.scrollTo(0,0);
}
document.querySelectorAll('.nav[data-v]').forEach(b=>b.addEventListener('click',()=>go(b.dataset.v)));
/* Grupy poza Pulpitem można zwinąć — Pulpit to codzienna praca, reszta to zaglądanie
   z doskoku. Startują rozwinięte (żeby nic nie zniknęło bez uprzedzenia), a wybór
   pamiętamy w przeglądarce. Grupa z bieżącą zakładką rozwija się sama. */
const GRP_KEY = 'sp_grupy';
let GRUPY = {grafik:false, edycja:false, analizy:false, narzedzia:false};
try{
  const z = JSON.parse(localStorage.getItem(GRP_KEY)||'null');
  if(z) Object.keys(GRUPY).forEach(k=>{ if(typeof z[k]==='boolean') GRUPY[k]=z[k]; });
}catch(e){}
function malujGrupy(){
  document.querySelectorAll('button.navgrp').forEach(b=>{
    const zwin = !!GRUPY[b.dataset.grp];
    b.classList.toggle('zwin', zwin);
    const box = document.getElementById('grp-'+b.dataset.grp);
    if(box) box.classList.toggle('zwin', zwin);
  });
}
/** grupa z bieżącą zakładką musi być widoczna, inaczej „gdzie ja jestem?" */
function odslonGrupeAktywnej(){
  const akt = document.querySelector('.nav.on');
  const box = akt && akt.closest('.navitems');
  if(box && box.id.indexOf('grp-')===0 && GRUPY[box.id.slice(4)]){
    GRUPY[box.id.slice(4)] = false;
    try{ localStorage.setItem(GRP_KEY, JSON.stringify(GRUPY)); }catch(e){}
  }
  malujGrupy();
}
document.querySelectorAll('button.navgrp').forEach(b=>b.addEventListener('click',()=>{
  GRUPY[b.dataset.grp] = !GRUPY[b.dataset.grp];
  try{ localStorage.setItem(GRP_KEY, JSON.stringify(GRUPY)); }catch(e){}
  malujGrupy();
}));
malujGrupy();

   Wybór trzyma przeglądarka, nie baza lokalu: to ustawienie stanowiska, a nie

const MENU_KEY = 'sp_menu_ikony';

/* ============================================================================
   SORTOWANIE TABEL
   Jeden mechanizm dla wszystkich tabel: <table data-tbl="klucz">, a kolumny
   bez sensu do sortowania dostają <th data-nosort>. Wybór trzyma się między
   przerysowaniami widoku, bo siedzi w SORT, a nie w DOM-ie.
   ========================================================================== */
const SORT = {};
const ORD = {items:false, sets:false};   // tryb „Ustaw kolejność" na listach

/** liczba wyciągnięta z komórki („6,48 zł" → 6.48); null gdy to nie liczba */
function cellNum(t){
  const s = t.replace(/[\s\u00a0]/g,'').replace(/zł|%/g,'').replace(',','.');
  return /^[+-]?\d*\.?\d+$/.test(s) ? parseFloat(s) : null;
}
function cellTxt(td){
  return td.dataset.sv !== undefined ? td.dataset.sv : td.textContent.trim();
}
function applySort(tb, key){
  const st = SORT[key]; if(!st) return;
  const body = tb.tBodies[0]; if(!body) return;
  const rows = [...body.rows].filter(r=>!r.querySelector('.empty'));
  if(rows.length < 2) return;
  rows.sort((ra,rb)=>{
    const a = ra.cells[st.i], b = rb.cells[st.i];
    if(!a || !b) return 0;
    const A = cellTxt(a), B = cellTxt(b);
    // puste zawsze na końcu, w obie strony — inaczej połowa sortowań
    // pokazuje najpierw same myślniki
    const ea = A===''||A==='—', eb = B===''||B==='—';
    if(ea !== eb) return ea ? 1 : -1;
    if(ea && eb) return 0;
    const na = cellNum(A), nb = cellNum(B);
    if(na!=null && nb!=null) return (na-nb)*st.dir;
    return A.localeCompare(B,'pl',{numeric:true,sensitivity:'base'})*st.dir;
  });
  rows.forEach(r=>body.appendChild(r));
}
/* ---------------------------------------------------------------------------
   FINANSE ZAŁADUNKÓW
   Tydzień to naturalna jednostka: plan tygodnia mówi, który załadunek jedzie
   którego dnia, więc wolumen tygodniowy da się policzyć wprost, bez zgadywania.
   Miesiąc liczymy jako 30 dni, czyli 30/7 tygodnia — okrągło i tak samo dla
   każdego miesiąca, żeby porównywać jabłka z jabłkami. To wolumen ZAŁADOWANY,
   nie sprzedany: mówi, ile towaru wjeżdża do maszyn, a nie ile z nich wyjeżdża.
   ------------------------------------------------------------------------- */
const DNI_MIES = 30;
const TYG_W_MIES = DNI_MIES / 7;

function finanseTygodnia(){
  const maszyny = active(DB.machines);
  const perM = maszyny.map(m=>({m, szt:0, wartosc:0, netto:0, koszt:0, dni:0}));
  const perZest = {};
  const dni = DNI.map(d=>{
    const z = zaladunekNaDzien(d.k);
    const s = z ? zalSuma(z) : {szt:0, wartosc:0, netto:0, koszt:0, wgZestawu:{}};
    if(z){
      perM.forEach(x=>{
        const sm = zalSuma(z, x.m.id);
        x.szt += sm.szt; x.wartosc += sm.wartosc; x.netto += sm.netto;
        x.koszt += sm.koszt; x.dni++;
      });
      Object.keys(s.wgZestawu).forEach(id=>{
        perZest[id] = (perZest[id]||0) + s.wgZestawu[id];
      });
    }
    // rozpiska dnia wchodzi do wyniku, bo tabele tygodniowe liczą z niej rolki i zestawy
    return {d, z, r: z ? zalRozpiska(z) : null,
            szt:s.szt, wartosc:s.wartosc, netto:s.netto, koszt:s.koszt};
  });
  const suma = perM.reduce((a,x)=>({szt:a.szt+x.szt, wartosc:a.wartosc+x.wartosc,
                                    netto:a.netto+x.netto, koszt:a.koszt+x.koszt}),
                           {szt:0, wartosc:0, netto:0, koszt:0});
  const zestawy = Object.keys(perZest).map(id=>{
    const s = CALC.set(id);
    if(!s) return {id, name:'⚠ brak zestawu', szt:perZest[id], wartosc:0, koszt:0};
    const c = CALC.setCalc(s, 'vending');
    return {id, name:s.name, szt:perZest[id],
            wartosc:(c.priceGross||0)*perZest[id], koszt:c.net*perZest[id]};
  }).sort((a,b)=>b.wartosc-a.wartosc);
  return {perM, dni, suma, zestawy, dniBezZaladunku: dni.filter(x=>!x.z).length};
}
/** Food cost liczony po stronie przychodu netto, tak jak wszędzie w aplikacji.
    Netto przychodzi policzone zestaw po zestawie — każdy ze swoją stawką VAT. */
function fcZ(koszt, netto){
  return netto > 0 ? koszt/netto : null;
}
/** ważony food cost zbioru kalkulacji: suma kosztów ÷ suma przychodu netto.
    Średnia arytmetyczna po pozycjach kłamie — tania rolka waży w niej tyle samo,
    co Party Mix. Pozycje z niekompletną recepturą wypadają, bo ich koszt jest
    zaniżony o brakujący składnik i ciągnęłyby wynik w dół po cichu. */
function fcWazony(kalkulacje){
  const zCena = kalkulacje.filter(c=>c.priceNet>0);
  const pelne = zCena.filter(c=>!c.missing.length);
  // licznik pominiętych musi wyjść także wtedy, gdy pominięte są wszystkie —
  // wtedy właśnie najbardziej trzeba o tym powiedzieć
  const pominiete = zCena.length - pelne.length;
  if(!pelne.length) return {fc:null, n:0, pominiete};
  const koszt = pelne.reduce((a,c)=>a+c.net, 0);
  const netto = pelne.reduce((a,c)=>a+c.priceNet, 0);
  return {fc: netto>0 ? koszt/netto : null, n:pelne.length, pominiete};
}

/* ---------------------------------------------------------------------------
   WYDRUKI
   Serwer ma Gotenberga, więc PDF powstaje po jego stronie — HTML leci do
   /api/pdf i wraca gotowy plik. Poza trybem serwerowym (plik z dysku) nie ma
   czym generować, więc otwieramy okno drukowania: „Zapisz jako PDF" daje ten
   sam efekt, tylko rękami.
   ------------------------------------------------------------------------- */
function drukujOkno(html){
  const w = window.open('', '_blank');
  if(!w){ alert('Przeglądarka zablokowała nowe okno — zezwól na wyskakujące okna i spróbuj ponownie.'); return; }
  w.document.write(html);
  w.document.close();
  w.focus();
  setTimeout(()=>{ try{ w.print(); }catch(e){} }, 350);
}
async function zrobPdf(html, nazwa, stopka){
  if(!SRV.on){ drukujOkno(html); return; }
  try{
    const r = await fetch('/api/pdf', {method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({html, name:nazwa, footer:stopka})});
    if(!r.ok){
      const o = await r.json().catch(()=>({}));
      if(!confirm((o.error||'Serwer nie wygenerował PDF-u.')
        + '\n\nOtworzyć okno drukowania zamiast tego?')) return;
      drukujOkno(html); return;
    }
    const blob = await r.blob();
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = nazwa + '.pdf';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
  }catch(e){
    drukujOkno(html);
  }
}
/* Kolumny dobieramy pod treść: im mniej, tym czytelniej, ale wszystko ma się
   zmieścić na jednej stronie. Mierzymy naprawdę — w ukrytej ramce o wymiarach
   pola zadruku A4 (210×297 mm minus marginesy, przy 96 dpi). */
/* Pole zadruku A4 przy 96 dpi, dokładnie takie, jakie wycina Gotenberg
   (marginesy 0,4″ na boki i 0,5″ na górę i dół). Zapas na dole bierze na siebie
   drobne różnice w metrykach fontów między przeglądarką a kontenerem. */
const DRUK_SZER = 710, DRUK_WYS = 1026, DRUK_ZAPAS = 0.96;
const DRUK_MAX_PX = 26;
/** Dobiera układ wydruku: liczy się jak największa czcionka, nie jak mało kolumn.

    Dla każdej dozwolonej liczby kolumn szukamy największego stopnia pisma, przy
    którym całość mieści się na jednej stronie, i bierzemy najlepszy wynik; przy
    remisie wygrywa mniej kolumn. Gdy nawet minimum nie wchodzi na stronę, nie
    schodzimy poniżej minimum — wtedy wydruk po prostu ma więcej stron. */
/** Skraca pierwszy wyraz nazwy: „Średni Mieszany" → „Śre. Mieszany" → „Ś. Mieszany".

    Skracamy pierwszy, a nie ostatni, bo w nazwach zestawów pierwszy wyraz to rozmiar
    („Mały", „Średni", „Duży”), a drugi mówi, co jest w środku — i to on musi zostać
    czytelny. Poziom 0 zostawia nazwę w spokoju. */
function skrocPierwszy(nazwa, poziom){
  if(!poziom) return nazwa;
  const i = String(nazwa).indexOf(' ');
  if(i < 1) return nazwa;                       // jeden wyraz — nie ma czego skracać
  const ile = poziom === 1 ? 3 : 1;
  if(i <= ile + 1) return nazwa;                // skrót byłby dłuższy niż zysk
  return nazwa.slice(0, ile) + '.' + nazwa.slice(i);
}

/** Czy w gotowym dokumencie któryś tytuł karty zajmuje więcej niż jedną linię.
    Liczymy prostokąty zakresu, a nie wysokość elementu — element bywa wyższy
    z powodu rezerwy na drugą linię, a nas interesuje samo złamanie tekstu. */
function maLamaneTytuly(html){
  const ram = document.createElement('iframe');
  ram.setAttribute('aria-hidden','true');
  ram.style.cssText = 'position:fixed;left:-10000px;top:0;border:0;width:'
    + DRUK_SZER + 'px;height:' + DRUK_WYS + 'px';
  document.body.appendChild(ram);
  let lamane = false;
  try{
    const d = ram.contentDocument;
    d.open(); d.write(html); d.close();
    lamane = [].slice.call(d.querySelectorAll('.rolka > h2')).some(h=>{
      // Zakres musi objąć SAM tekst nazwy. Objęcie całego nagłówka dałoby osobny
      // prostokąt dla numeru w <span> i każdy tytuł wyglądałby na złamany.
      const t = h.lastChild;
      if(!t || t.nodeType !== 3) return false;
      const r = d.createRange(); r.selectNode(t);
      return r.getClientRects().length > 1;
    });
  }catch(e){ /* gdyby przeglądarka blokowała ramkę — zostawiamy nazwy w spokoju */ }
  ram.remove();
  return lamane;
}

function dopasujDruk(buduj, maksKolumn, minPx){
  const maks = Math.max(1, Math.min(6, maksKolumn || 3));
  const min = Math.max(6, minPx || 11);
  const ram = document.createElement('iframe');
  ram.setAttribute('aria-hidden','true');
  ram.style.cssText = 'position:fixed;left:-10000px;top:0;border:0;width:'
    + DRUK_SZER + 'px;height:' + DRUK_WYS + 'px';
  document.body.appendChild(ram);
  let best = null;
  // Gdy nic nie mieści się na jednej stronie, ratunkiem jest najwięcej kolumn,
  // które mieszczą się WSZERZ — w bok nic nie może wystawać, bo wiersze się nie
  // zawijają i tekst zostałby ucięty. W pionie wolno dołożyć stronę.
  let zapasowy = {kol:1, px:min, wieleStron:true};
  try{
    const zmierz = (k, px) => {
      const d = ram.contentDocument;
      d.open(); d.write(buduj(k, px)); d.close();
      // W układzie wielokolumnowym za długi wiersz NIE rozpycha strony — wychodzi
      // na sąsiednią kolumnę i nachodzi na cudzy tekst, a body.scrollWidth tego nie
      // widzi. Dlatego pytamy każdy wiersz z osobna, czy mieści się w swojej kolumnie.
      const wiersze = [].slice.call(d.querySelectorAll('.siatka .skl div'));
      const wystaje = wiersze.some(el=>el.scrollWidth > el.clientWidth + 1);
      return {wszerz: !wystaje && d.body.scrollWidth <= DRUK_SZER + 1,
              wpion:  d.body.scrollHeight <= DRUK_WYS * DRUK_ZAPAS};
    };
    const mieści = (k, px) => { const m = zmierz(k, px); return m.wszerz && m.wpion; };
    for(let k=1; k<=maks; k++){
      const m = zmierz(k, min);
      if(m.wszerz) zapasowy = {kol:k, px:min, wieleStron:true};
      if(!m.wszerz || !m.wpion) continue;           // przy tylu kolumnach się nie da
      let lo = min, hi = DRUK_MAX_PX;               // największe pismo, które wchodzi
      for(let i=0; i<7; i++){
        const mid = (lo + hi) / 2;
        if(mieści(k, mid)) lo = mid; else hi = mid;
      }
      const px = Math.floor(lo * 4) / 4;
      if(!best || px > best.px + 0.01) best = {kol:k, px};
    }
  }catch(e){ /* gdyby przeglądarka blokowała ramkę — zostaje bezpieczne minimum */ }
  ram.remove();
  return best || zapasowy;
}
/** wspólna oprawa dokumentu do druku */
/** Główka jest jedna dla wszystkich sześciu wydruków — kartka z kuchni ma wyglądać

/* ---------------------------------------------------------------------------
   KOLEJNOŚĆ RĘCZNA
   Kolejność nakładania składników i zwijania rolek to informacja z arkusza,
   której nie da się odtworzyć z żadnej innej kolumny. Trzymamy ją jako kolejność
   tablicy — sortowanie tabeli przestawia tylko wiersze w widoku, więc nigdy jej
   nie nadpisze. Trzeci klik w nagłówek (albo klik w „#") wraca do kolejności ręcznej.
   ------------------------------------------------------------------------- */
function przestawIndeks(arr, od, doo){
  od = +od; doo = +doo;
  if(!Array.isArray(arr) || od===doo) return false;
  if(od<0 || doo<0 || od>=arr.length || doo>=arr.length) return false;
  const [x] = arr.splice(od,1);
  arr.splice(doo,0,x);
  return true;
}
/** przestawia po identyfikatorach — indeks widoku ≠ indeks w bazie, gdy działa filtr */
function przestawPoId(arr, idOd, idDo){
  if(!Array.isArray(arr)) return false;
  return przestawIndeks(arr, arr.findIndex(x=>x.id===idOd), arr.findIndex(x=>x.id===idDo));
}
const DND = {};   // klucz kontenera → funkcja(od, do); ustawiają ją widoki

/** przeciąganie i strzałki: kontener [data-dnd="klucz"], dzieci [data-di="klucz pozycji"] */
function wireDnd(root, handler){
  root.querySelectorAll('[data-dnd]').forEach(box=>{
    const fn = handler || DND[box.dataset.dnd];
    if(!fn) return;
    let od = null;
    box.querySelectorAll('[data-di]').forEach(el=>{
      el.addEventListener('dragstart',e=>{
        od = el.dataset.di; el.classList.add('dragging');
        e.dataTransfer.effectAllowed = 'move';
        try{ e.dataTransfer.setData('text/plain', String(od)); }catch(_){}
      });
      el.addEventListener('dragend',()=>{
        el.classList.remove('dragging');
        box.querySelectorAll('.dropzone').forEach(x=>x.classList.remove('dropzone'));
      });
      el.addEventListener('dragover',e=>{ e.preventDefault(); el.classList.add('dropzone'); });
      el.addEventListener('dragleave',()=>el.classList.remove('dropzone'));
      el.addEventListener('drop',e=>{
        e.preventDefault(); el.classList.remove('dropzone');
        const doo = el.dataset.di;
        if(od==null || od===doo) return;
        fn(od, doo);
      });
    });
    box.querySelectorAll('[data-mv]').forEach(b=>b.addEventListener('click',e=>{
      e.preventDefault(); e.stopPropagation();
      const [a,bb] = b.dataset.mv.split('|');
      fn(a, bb);
    }));
  });
}
/** komórka z uchwytem, numerem i strzałkami; `sasiedzi` to [poprzedni, następny] */
function ordCell(nr, poprz, nast, edytowalne){

    ${edytowalne?'<span class="uch" title="Przeciągnij, żeby zmienić kolejność">⠿</span>':''}
    <span class="nr">${nr}</span>

function wireSort(root){
  root.querySelectorAll('table[data-tbl]').forEach(tb=>{
    const key = tb.dataset.tbl;
    if(!tb.tHead || !tb.tHead.rows.length) return;
    if(tb.dataset.noSortNow !== undefined) return;   // tryb ustawiania kolejności
    const ths = [...tb.tHead.rows[0].cells];
    const paint = ()=>{
      ths.forEach(x=>x.classList.remove('asc','desc'));
      const st = SORT[key];
      if(st && ths[st.i]) ths[st.i].classList.add(st.dir>0?'asc':'desc');
    };
    const kolOrd = ths.findIndex(x=>x.dataset.ordth !== undefined);
    if(kolOrd >= 0){
      const th = ths[kolOrd];
      th.classList.add('ordth');
      th.classList.toggle('on', !SORT[key]);
      th.title = SORT[key] ? 'Wróć do kolejności ręcznej' : 'Kolejność ręczna';
      th.addEventListener('click',()=>{ if(SORT[key]){ SORT[key] = null; render(); } });
    }
    ths.forEach((th,i)=>{
      if(th.dataset.nosort !== undefined || th.dataset.ordth !== undefined) return;
      th.classList.add('sortable');
      th.title = 'Kliknij, żeby posortować';
      th.addEventListener('click',()=>{
        const st = SORT[key];
        // rosnąco → malejąco → kolejność ręczna
        if(st && st.i===i && st.dir<0){ SORT[key] = null; render(); return; }
        SORT[key] = (st && st.i===i) ? {i, dir:-st.dir} : {i, dir:1};
        applySort(tb, key); paint();
      });
    });
    applySort(tb, key); paint();
  });
}

/* Straż przed wejściem render() w samego siebie.

   Podmiana `innerHTML` wyrzuca z DOM pole, które trzyma ognisko. Przeglądarka
   wystawia wtedy drugie zdarzenie `change` — na odpiętym już węźle, ze starym
   uchwytem, który znowu woła render(). Zagnieżdżony przebieg rysuje ekran
   i podpina uchwyty, ale przerwana zewnętrzna podmiana zaraz potem nadpisuje
   ten DOM swoim, a jej kolejka POST jest już pusta. Wychodzi ekran bez żadnych
   uchwytów: pola się wpisują, tylko nic nie zapisują.

   Dlatego zagnieżdżone wywołanie nie rysuje — zgłasza powtórkę, a pętla wykonuje
   ją po zamknięciu bieżącego przebiegu. Ostatni przebieg zawsze podpina uchwyty
   do DOM-u, który naprawdę został na ekranie. */
let RYSUJE = false, PONOWNIE = false;
function render(){
  if(RYSUJE){ PONOWNIE = true; return; }
  RYSUJE = true;
  try{
    let bezpiecznik = 0;
    do{ PONOWNIE = false; rysuj(); }while(PONOWNIE && ++bezpiecznik < 5);
  }finally{ RYSUJE = false; }
}

function rysuj(){
  document.getElementById('cIng').textContent=active(DB.ingredients).length;
  document.getElementById('cPrep').textContent=active(DB.preps).length;
  document.getElementById('cItems').textContent=active(DB.items).length;
  document.getElementById('cSets').textContent=active(DB.sets).length;
  document.getElementById('cVend').textContent=active(DB.machines||[]).length;
  document.getElementById('cLoad').textContent=active(DB.loads||[]).length||'';
  document.getElementById('cHist').textContent=DB.history.length||'';
  const m=document.getElementById('main');
  const navU=document.getElementById('navUsers');
  const canUsers = SRV.on && SRV.user && SRV.user.role==='owner';
  navU.classList.toggle('hidden', !canUsers);
  document.getElementById('navUpd').classList.toggle('hidden', !canUsers);
  document.getElementById('navOut').classList.toggle('hidden', !(SRV.on||SUPA.on));
  if(VIEW==='users' && !canUsers) VIEW='dash';

  if(!menedzer && VIEW==='grafSzab') VIEW='graf';
  const braki = brakiGrafiku();
  const licznikGraf = document.getElementById('cGraf');
  licznikGraf.textContent = braki || '';
  licznikGraf.title = braki
    ? braki + (braki === 1 ? ' zmiana bez kompletu' : (braki % 10 >= 2 && braki % 10 <= 4
        && (braki % 100 < 12 || braki % 100 > 14) ? ' zmiany bez kompletu' : ' zmian bez kompletu'))
      + ' w najbliższych dwóch tygodniach'
    : '';
  // pracownik dostaje aplikację zwiniętą do jednej zakładki; wylogowanie musi
  // przy nim zostać, więc przenosimy przycisk do widocznej grupy
  const tylkoGraf = czyPracownik();
  document.body.classList.toggle('tylkoGrafik', tylkoGraf);
  if(tylkoGraf){
    const grp = document.getElementById('grp-pulpit'), out = document.getElementById('navOut');
    if(out && out.parentNode !== grp) grp.appendChild(out);
    if(VIEW.indexOf('graf') !== 0) VIEW = 'graf';
  }
  // podświetlenie w menu musi nadążyć za podmianą widoku zrobioną tutaj, a nie w go()
  if(VIEW === 'graf')
    document.querySelectorAll('.nav').forEach(b=>b.classList.toggle('on', b.dataset.v==='graf'));
  if(!DAY) DAY = todayISO();
  // ekrany dnia i grafik idą w luźniejszej gęstości — patrz reguła `.main.dzien`
  m.classList.toggle('dzien', EKRANY_DNIA.has(VIEW));
  m.innerHTML = ({dash:vDash, ing:vIng, prep:vPrep, items:vItems, sets:vSets, vend:vVend,
                  graf:vGrafik, grafSzab:vGrafikSzablon,
                  load:vLoad, hist:vHist, sim:vSim, users:vUsers, set:vSet, fin:vFinanse,
                  dHome:vPulpit, dSklad:vSklad, dPrep:vDzienPrzygotowanie, dRolki:vDzienRolki, dZest:vDzienZestawy,
                  dPack:vDzienPakowanie, driver:vKierowca, stock:vZasoby})[VIEW]();
  (POST[VIEW]||[]).forEach(f=>f());
  POST[VIEW]=[];
  m.querySelectorAll('[data-go]').forEach(el=>el.addEventListener('click',e=>{
    e.preventDefault();                       // to zwykle <a href="#">, nie chcemy skoku na górę
    const [v,id]=el.dataset.go.split(':'); go(v,id);
  }));
  wireArchPills(m);
  wireSort(m);
  wireDnd(m);
  m.querySelectorAll('[data-ordtoggle]').forEach(b=>b.addEventListener('click',()=>{
    const k = b.dataset.ordtoggle;
    ORD[k] = !ORD[k];
    if(ORD[k]){ SORT[k] = null; setVMode(k, 'list'); }   // przeciąganie tylko na liście
    render();
  }));
  wireViewPills(m);
  wireChanPills(m);
  wireDay(m);
  m.querySelectorAll('[data-sektog]').forEach(b=>b.addEventListener('click',()=>{
    const sek = b.closest('.sek'), t = b.dataset.sektog;
    const zwin = !sek.classList.contains('zwin');
    sek.classList.toggle('zwin', zwin);
    SEKCJE[t] = !zwin;
    try{ localStorage.setItem('sp_sekcje', JSON.stringify(SEKCJE)); }catch(e){}
  }));
  m.querySelectorAll('[data-arch-toggle]').forEach(b=>b.addEventListener('click',e=>{
    e.stopPropagation();
    const [k,id]=b.dataset.archToggle.split(':');
    if(toggleArchive(k,id)) render();
  }));
  m.querySelectorAll('[data-del-row]').forEach(b=>b.addEventListener('click',e=>{
    e.stopPropagation();
    const [k,id]=b.dataset.delRow.split(':');
    if(deleteEntity(k,id)) render();
  }));
  if(!canEdit()){
    m.querySelectorAll('[data-edit-ing],[data-del-ing],[data-edit-item],[data-edit-set],'
      +'[data-edit-prep],[data-act],#fillPack,#saveSet,#resetBtn,#supaSave,#supaLogin')
      .forEach(el=>el.style.display='none');
    const imp=m.querySelector('#impJson'); if(imp) imp.closest('.card').querySelectorAll('input[type=file]').forEach(e=>e.disabled=true);
  }
}
const POST={};
function after(v,fn){ (POST[v]=POST[v]||[]).push(fn); }

/* ============================================================================
   WIDOK: PULPIT
   ========================================================================== */
function vDash(){
  const prob = problems();
  const fcs = active(DB.items).filter(i=>CALC.priceOf(i))
    .map(i=>CALC.itemCalc(i)).filter(c=>c.fc!=null);
  // Automat sprzedaje zestawy, nie pojedyncze rolki, więc kafelek pokazuje food cost
  // zestawów — ważony, czyli suma kosztów ÷ suma przychodu netto. Rolki idą pod spodem
  // drobnym drukiem: ich ceny à la carte to punkt odniesienia, a nie realna sprzedaż.
  const wZest = fcWazony(active(DB.sets).map(s=>CALC.setCalc(s)));
  const wRol  = fcWazony(fcs);
  const avg = wZest.fc;
  const pominiete = wZest.pominiete + wRol.pominiete;
  const over = fcs.filter(c=>c.fc>DB.settings.alertFc).length;
  const noPrice = active(DB.ingredients).filter(g=>g.packPrice==null||!g.packQty).length;

  const setRows = active(DB.sets).map(s=>{ const c=CALC.setCalc(s);
    return {label:s.name, v:c.fc||0, st:CALC.status(c.fc), c, go:{v:'sets',id:s.id}}; })
    .filter(r=>r.v>0).sort((a,b)=>b.v-a.v);

  const itemRows = active(DB.items).map(i=>{ const c=CALC.itemCalc(i);
    return {label:itNameK(i), v:c.fc||0, st:CALC.status(c.fc), c, go:{v:'items',id:i.id}}; })
    .filter(r=>r.v>0).sort((a,b)=>b.v-a.v).slice(0,12);

  after('dash',()=>{
    const a=document.getElementById('chSets'); if(a) wireChart(a,setRows,r=>
      `<b>${esc(r.label)}</b>food cost ${pct(r.v)} · koszt ${zl(r.c.net)} · cena ${zl(r.c.priceGross)}<br><span class="mut">marża ${zl(r.c.margin)} netto · ${r.c.pieces} kawałków</span>`);
    const b=document.getElementById('chItems'); if(b) wireChart(b,itemRows,r=>
      `<b>${esc(r.label)}</b>food cost ${pct(r.v)} · koszt ${zl(r.c.net)} · cena ${zl(r.c.priceGross)}`);
  });

  const alertsHtml = prob.length
    ? prob.slice(0,14).map(p=>`<div class="alert ${p.sev}" ${p.go?`data-go="${p.go.v}:${p.go.id||''}" style="cursor:pointer"`:''}>
        <div class="ic">${p.sev==='crit'?'!':p.sev==='warn'?'?':'i'}</div>
        <div class="txt"><b>${esc(p.title)}</b><br>${esc(p.msg)}</div></div>`).join('')
      + (prob.length>14?`<div class="small mut" style="padding:4px 2px">…i jeszcze ${prob.length-14}</div>`:'')
    : '<div class="empty">Brak problemów. Wszystkie pozycje mieszczą się w progach.</div>';

  return `
  <div class="topbar"><h1>Foodcost</h1><span class="sub">stan na ${todayISO()}</span><div class="spacer"></div>
    <button class="btn sm" data-act="addItem">+ Rolka</button>
    <button class="btn sm pri" data-act="addSet">+ Zestaw</button></div>

  ${STORAGE_OK?'':'<div class="banner">Przeglądarka blokuje zapis lokalny w tym trybie. Zmiany są tylko w pamięci karty — <b>eksportuj plik JSON</b> w Ustawieniach albo podłącz Supabase, żeby ich nie stracić.</div>'}

  <div class="tiles">
    <div class="tile"><div class="lab">Rolek w menu</div><div class="val num">${active(DB.items).length}</div>
      <div class="note">${active(DB.sets).length} zestawów · ${active(DB.ingredients).length} składników</div></div>
    <div class="tile"><div class="lab">Food cost zestawów</div>
      <div class="val num" style="color:${avg==null?'var(--muted)':avg>DB.settings.alertFc?'var(--crit-ink)':avg>DB.settings.targetFc?'var(--warn-ink)':'var(--good-ink)'}">${pct(avg)}</div>
      <div class="note">ważony · cel ${pct(DB.settings.targetFc,0)} · alert ${pct(DB.settings.alertFc,0)}<br>
        rolki ${pct(wRol.fc)} po cenach à la carte${pominiete
          ? ` · <b style="color:var(--crit-ink)">${pominiete} poza średnią</b> (niekompletna receptura)` : ''}</div></div>
    <div class="tile"><div class="lab">Powyżej progu</div><div class="val num" style="color:${over?'var(--crit-ink)':'var(--good-ink)'}">${over}</div>
      <div class="note">pozycji z food cost > ${pct(DB.settings.alertFc,0)}</div></div>
    <div class="tile"><div class="lab">Braki w danych</div><div class="val num" style="color:${noPrice?'var(--warn-ink)':'var(--good-ink)'}">${noPrice}</div>
      <div class="note">składników bez ceny zakupu</div></div>
  </div>

  <div class="split" style="margin-top:12px">
    <div class="grid">
      <div class="card"><h2>Food cost zestawów</h2>
        <div class="hint">Kliknij słupek, żeby otworzyć zestaw. Przerywana linia to cel ${pct(DB.settings.targetFc,0)}.</div>
        <div id="chSets">${setRows.length?barChartFc(setRows):'<div class="empty">Brak zestawów z ceną.</div>'}</div>
        <div class="legend"><span><i style="background:var(--good)"></i>w celu</span><span><i style="background:var(--warn)"></i>powyżej celu</span><span><i style="background:var(--crit)"></i>powyżej alertu</span></div>
      </div>
      <div class="card"><h2>Rolki o najwyższym food cost</h2>
        <div class="hint">12 rolek z najgorszym stosunkiem kosztu do ceny.</div>
        <div id="chItems">${itemRows.length?barChartFc(itemRows):'<div class="empty">Brak pozycji z ceną.</div>'}</div>
      </div>
    </div>
    <div class="card"><h2>Do sprawdzenia</h2><div class="hint">${prob.length} pozycji wymaga uwagi</div>${alertsHtml}</div>
  </div>`;
}

/* ============================================================================
   WSPÓLNY UKŁAD LIST
   Cztery listy — składniki, półprodukty, rolki, zestawy — wyglądają i zachowują
   się tak samo: przełącznik widoku, filtr archiwum, ta sama siatka kafelków
   i ten sam panel podglądu po prawej (albo pod spodem w trybie kafelków).
   ========================================================================== */
/** przycisk trybu ustawiania kolejności + podpowiedź, gdy jest włączony */
function ordBtn(key){
  return `<button class="btn sm ${ORD[key]?'pri':''}" data-ordtoggle="${key}"
    title="Przeciąganie wierszy — kolejność zapisuje się od razu">⇅ Kolejność</button>`;
}
function ordHint(key, co){
  return ORD[key] ? `<div class="banner">Ustawiasz <b>kolejność ${co}</b> — przeciągnij wiersz
    za uchwyt ⠿ albo użyj strzałek. Zapisuje się od razu, sortowanie jest na ten czas wyłączone.</div>` : '';
}
/** Pasek listy — ten sam we wszystkich sześciu widokach z listą.

    Dwa rzędy, bo to dwie różne rzeczy: górny robi coś nowego (dodaj, wydrukuj),
    dolny zmienia sposób patrzenia na to, co już jest (szukaj, filtruj, przełącz).
    Wcześniej wszystko stało w jednym rzędzie i przy dziewięciu elementach akcja główna
    zawijała się pod tytuł — czyli najważniejszy przycisk lądował tam, gdzie nikt go
    nie szuka. */
function paskListy(o){
  const opcje = [
    o.szukaj ? `<input id="${o.szukaj.id}" type="search" placeholder="${esc(o.szukaj.ph)}"
      value="${esc(o.szukaj.val || '')}" style="max-width:${o.szukaj.szer || '240px'}">` : '',
    o.pola || '',
    o.kanal ? chanPills() : '',
    viewPills(o.klucz),
    archPills(o.klucz),
    o.kolejnosc ? ordBtn(o.klucz) : '',
    o.info ? `<div class="spacer"></div><span class="mut small">${o.info}</span>` : '',
  ].filter(Boolean).join('');

  return `<div class="topbar">
    <h1>${esc(o.tytul)}</h1>${o.licznik ? `<span class="sub">${esc(o.licznik)}</span>` : ''}
    <div class="spacer"></div>${o.akcje || ''}
    ${o.dodaj ? `<button class="btn pri" data-act="${o.dodaj.act}">${esc(o.dodaj.lab)}</button>` : ''}
  </div>
  <div class="paskopcji">${opcje}</div>`;
}

function listLayout(key, tabela, kafelki, podglad){
  return VMODE[key]==='cards'
    ? `<div class="tiles-grid" style="margin-bottom:12px">${kafelki}</div>${podglad}`
    : `<div class="split">${tabela}${podglad}</div>`;
}

/** porównanie obu kanałów sprzedaży dla rolki albo zestawu */

    <tr><td>Sugestia przy ${pct(DB.settings.targetFc,0)}</td>${w.map(x=>`<td class="r num wylicz">${x.c.suggested?zl(x.c.suggested):'—'}</td>`).join('')}</tr>

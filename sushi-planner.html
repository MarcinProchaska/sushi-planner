/* ---------- stan ---------- */
let DB = null;
let VIEW = 'dHome';   // kuchnia zaczyna dzień od przygotowania
let SEL = {item:null, set:null, ing:null, prep:null, mach:null, load:null};

const STORE_KEY = 'sushi-planner-v1';
function safeGet(){ try{ return localStorage.getItem(STORE_KEY); }catch(e){ return null; } }
function safeSet(v){ try{ localStorage.setItem(STORE_KEY,v); return true; }catch(e){ return false; } }
let STORAGE_OK = true;

function uid(p){ return p+'-'+Math.random().toString(36).slice(2,9); }

/* ---------- archiwum ---------- */
const ARCH = {ing:'active', prep:'active', items:'active', sets:'active', mach:'active', load:'active'};
const ARCH_LIST = {ing:()=>DB.ingredients, prep:()=>DB.preps, items:()=>DB.items,
                   sets:()=>DB.sets, mach:()=>DB.machines, load:()=>DB.loads};

function active(list){ return list.filter(x=>!x.archived); }
function archFilter(list, key){
  const m = ARCH[key];
  if(m==='all') return list;
  if(m==='arch') return list.filter(x=>x.archived);
  return list.filter(x=>!x.archived);
}
/* ---------- lista czy kafelki ----------
   To ustawienie interfejsu, a nie dane lokalu — trzymamy je w osobnym kluczu
   localStorage, żeby nie wędrowało na serwer i nie zmieniało widoku kolegom. */
/* ---------- kanały sprzedaży ----------
   Ta sama rolka sprzedana z automatu i przez aplikację dostawczą ma inną cenę
   i inną stawkę VAT. Koszt wytworzenia jest jeden, więc food cost różni się
   między kanałami — i o to właśnie chodzi, żeby było widać. */
const CHANNELS = [
  {k:'vending', l:'Vending', vat:0.05},
  {k:'dostawa', l:'Dostawa', vat:0.08},
];
const CHAN_KEY = 'sp_kanal';
let CHAN = 'vending';
try{ const z=localStorage.getItem(CHAN_KEY); if(CHANNELS.some(c=>c.k===z)) CHAN=z; }catch(e){}
function setChan(k){ CHAN=k; try{ localStorage.setItem(CHAN_KEY,k); }catch(e){} }
function chanLabel(k){ const c=CHANNELS.find(x=>x.k===k); return c?c.l:k; }
function chanPills(){
  return `<div class="pill-group" data-changroup="1">
    ${CHANNELS.map(c=>`<button type="button" data-ch="${c.k}" class="${CHAN===c.k?'on':''}">${esc(c.l)}</button>`).join('')}
  </div>`;
}
function wireChanPills(root){
  root.querySelectorAll('[data-changroup] button').forEach(b=>
    b.addEventListener('click',()=>{ setChan(b.dataset.ch); render(); }));
}

/** starsze dane miały jedną cenę i jedną stawkę — rozdzielamy na dwa kanały */
function migrateChannels(o){
  if(!o.prices || typeof o.prices!=='object')
    o.prices = {vending: o.price==null?null:o.price, dostawa: o.price==null?null:o.price};
  if(!o.vats || typeof o.vats!=='object')
    o.vats = {vending:0.05, dostawa:0.08};
  CHANNELS.forEach(c=>{
    if(o.prices[c.k]===undefined) o.prices[c.k]=null;
    if(o.vats[c.k]==null) o.vats[c.k]=c.vat;
  });
  delete o.price; delete o.vat;
}

const VIEW_KEY = 'sp_widok';
const VMODE = {ing:'list', prep:'cards', items:'list', sets:'list', mach:'cards', load:'cards'};
try{
  const z = JSON.parse(localStorage.getItem(VIEW_KEY)||'{}');
  Object.keys(VMODE).forEach(k=>{ if(z[k]==='list'||z[k]==='cards') VMODE[k]=z[k]; });
}catch(e){}
function setVMode(key, tryb){
  VMODE[key]=tryb;
  try{ localStorage.setItem(VIEW_KEY, JSON.stringify(VMODE)); }catch(e){}
}
function viewPills(key){
  return `<div class="pill-group" data-viewgroup="${key}">
    <button type="button" data-vm="list" class="${VMODE[key]==='list'?'on':''}" title="Widok listy">☰ Lista</button>
    <button type="button" data-vm="cards" class="${VMODE[key]==='cards'?'on':''}" title="Widok kafelków">▦ Kafelki</button>
  </div>`;
}
/** na przycisku hamburgera piszemy, gdzie jesteśmy */
function odswiezBurger(){
  const el = document.getElementById('burgerNazwa');
  if(!el) return;
  const b = document.querySelector('.nav.on');
  if(!b){ el.textContent = 'Menu'; return; }
  const k = b.cloneNode(true);                       // ikona i licznik nie są nazwą
  k.querySelectorAll('.ic,.cnt').forEach(x=>x.remove());
  el.textContent = k.textContent.trim() || 'Menu';
}
function wireViewPills(root){
  root.querySelectorAll('[data-viewgroup]').forEach(g=>{
    g.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{
      setVMode(g.dataset.viewgroup, b.dataset.vm); render();
    }));
  });
}

function archPills(key){
  const n = ARCH_LIST[key]().filter(x=>x.archived).length;
  return `<div class="pill-group" data-archgroup="${key}">
    <button type="button" data-av="active" class="${ARCH[key]==='active'?'on':''}">Aktywne</button>
    <button type="button" data-av="arch" class="${ARCH[key]==='arch'?'on':''}">Archiwum${n?' '+n:''}</button>
    <button type="button" data-av="all" class="${ARCH[key]==='all'?'on':''}">Wszystko</button>
  </div>`;
}
function wireArchPills(root){
  root.querySelectorAll('[data-archgroup]').forEach(g=>{
    g.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{
      ARCH[g.dataset.archgroup]=b.dataset.av; render();
    }));
  });
}
/** gdzie obiekt jest jeszcze używany przez coś nieazarchiwizowanego */
function usedByActive(id){
  return CALC.usedBy(id).filter(u=>{
    const o = u.type==='item'?CALC.item(u.id) : u.type==='prep'?CALC.prep(u.id) : CALC.set(u.id);
    return o && !o.archived;
  });
}
/** przełącza archiwum; zwraca true gdy coś się zmieniło */
function toggleArchive(key, id){
  const o = ARCH_LIST[key]().find(x=>x.id===id);
  if(!o) return false;
  if(o.archived){ delete o.archived; save(); return true; }
  const used = key==='sets' ? [] : usedByActive(id);
  if(used.length && !confirm(
      '„'+o.name+'” jest nadal używany w: '+used.map(u=>u.name).join(', ')+'.\n\n'
      +'Archiwizacja tylko schowa tę pozycję z list — koszty będą liczone dalej, '
      +'żeby receptury nie zaczęły nagle wychodzić taniej.\n\nZarchiwizować mimo to?')) return false;
  o.archived = todayISO();
  save(); return true;
}
/* ---------- trzy akcje w każdym wierszu listy ---------- */
const EDIT_ATTR = {ing:'data-edit-ing', prep:'data-edit-prep', items:'data-edit-item',
                   sets:'data-edit-set', mach:'data-edit-mach', load:'data-edit-load'};
const KIND_PL   = {ing:'składnik', prep:'półprodukt', items:'rolkę', sets:'zestaw', mach:'automat', load:'załadunek'};

/* Kafelek dostaje jedno wejście — „Edytuj”. Archiwum i usuwanie siedzą na końcu
   edycji, bo to decyzje, a nie klikanie w przelocie: „✕” obok „Edytuj” w gęstej
   liście prosi się o pomyłkę, a jedna z tych operacji jest nieodwracalna. */
/* ---------------------------------------------------------------------------
   ZWIJANE SEKCJE PODGLĄDU
   Stan siedzi w przeglądarce, nie w danych lokalu — kucharz może mieć zwinięte
   wartości odżywcze, a właściciel rozwinięte, i nikt nikomu nic nie przestawia.
   Klucz to nazwa sekcji, więc „Wartości odżywcze" zwinięte przy składniku
   zostają zwinięte także przy rolce. Domyślnie wszystko jest rozwinięte.
   ------------------------------------------------------------------------- */
const SEKCJE = (()=>{ try{ return JSON.parse(localStorage.getItem('sp_sekcje')||'{}'); }
                      catch(e){ return {}; } })();
function sekcjaZwinieta(t){ return SEKCJE[t] === false; }
function sekcjaBlok(tytul, tresc){
  return `<section class="sek ${sekcjaZwinieta(tytul)?'zwin':''}">
    <h3><button type="button" class="sekh" data-sektog="${esc(tytul)}">${esc(tytul)}</button></h3>
    <div class="sekb">${tresc}</div></section>`;
}

function rowActions(key, o){
  return `<button class="btn sm" ${EDIT_ATTR[key]}="${o.id}">Edytuj</button>`;
}

/** usuwanie z blokadą, gdy coś jeszcze tego używa */
function deleteEntity(key, id){
  const list = ARCH_LIST[key]();
  const o = list.find(x=>x.id===id);
  if(!o) return false;
  let used = key==='sets' ? [] : (key==='mach' ? [] : CALC.usedBy(id));
  if(key==='sets'){
    const szafki = Object.keys(DB.vending.layout||{}).filter(n=>DB.vending.layout[n]===id);
    if(szafki.length) used = [{name:'układ automatów — szafki '+szafki.sort((a,b)=>a-b).join(', ')}];
  }
  if(used.length){
    alert('Nie można usunąć — „'+o.name+'” jest używany w:\n\n'
      +used.map(u=>'• '+u.name).join('\n')
      +'\n\nUsunięcie po cichu zmieniłoby koszty tych pozycji. '
      +'Użyj przycisku Archiwum — schowa z list, a koszty zostaną nienaruszone.');
    return false;
  }
  if(!confirm('Usunąć '+KIND_PL[key]+' „'+o.name+'” bezpowrotnie?\n\n'
      +'Jeśli chcesz tylko uporządkować listę, wybierz Archiwum.')) return false;
  const idx = list.findIndex(x=>x.id===id);
  list.splice(idx,1);
  if(key==='items'){ SEL.item = SEL.item===id?null:SEL.item; }
  if(key==='sets'){ SEL.set = SEL.set===id?null:SEL.set; }
  if(key==='ing'){ SEL.ing = SEL.ing===id?null:SEL.ing; }
  if(key==='mach'){ SEL.mach = SEL.mach===id?null:SEL.mach; }
  if(key==='load'){
    SEL.load = SEL.load===id?null:SEL.load;
    Object.keys(DB.week||{}).forEach(k=>{ if(DB.week[k]===id) delete DB.week[k]; });
  }
  save(); return true;
}

/* ---------- automaty vendingowe ----------
   Sześć maszyn, każda z dwiema kolumnami po dziesięć szafek: 1–10 i 11–20.
   Układ szafek jest wspólny dla wszystkich — tak jest w rzeczywistości i tak
   jest prościej planować załadunek. */
const VEND_SLOTS = 20;
const VEND_PER_COL = 10;
const AUTOMATY_START = [
  {id:'aut-zabierzow',   code:'ZAB', name:'Zabierzów, Biedronka',       addr:'Krakowska 232, 32-080 Zabierzów'},
  {id:'aut-imbramowski', code:'IMB', name:'Plac Imbramowski',           addr:'pl. Imbramowski 179, 31-212 Kraków'},
  {id:'aut-przewoz',     code:'PRZ', name:'Przewóz, Delikatesy Premium', addr:'Przewóz 34A, 30-603 Kraków'},
  {id:'aut-galicyjska',  code:'GAL', name:'Kaufland, Galicyjska',       addr:'Galicyjska 8, 31-586 Kraków'},
  {id:'aut-jasnogorska', code:'JAS', name:'Kraków, Jasnogórska',        addr:'Jasnogórska 62, 31-358 Kraków'},
  {id:'aut-norymberska', code:'NOR', name:'Kaufland, Norymberska',      addr:'Norymberska 1, 30-376 Kraków'},
];
/** krótki kod z nazwy — awaryjnie, gdy ktoś doda automat bez kodu */
/** Kod z nazwy: pierwsze trzy litery, a przy nazwie dwuczłonowej — trzy i trzy
    przez spację. „Kaufland, Galicyjska" daje KAU GAL, a nie KAU i KA2, bo druga
    Kaufland dostałaby numer, którego nikt nie skojarzy z lokalizacją. */
function kodZNazwy(nazwa, zajete){
  const slowa = bezOgonkow(nazwa).split(/[^a-z0-9]+/).filter(w=>w.length > 2);
  const trzy = w => w.slice(0,3).toUpperCase();
  const krotki = slowa.length ? trzy(slowa[0]) : 'AUT';
  const dlugi  = slowa.length > 1 ? krotki + ' ' + trzy(slowa[1]) : krotki;
  if(!zajete.has(krotki)) return krotki;
  if(!zajete.has(dlugi)) return dlugi;
  let k = dlugi, i = 1;
  while(zajete.has(k)) k = dlugi + (++i);
  return k;
}
function migrateVending(){
  if(!DB) return;
  if(!Array.isArray(DB.machines))
    DB.machines = AUTOMATY_START.map(a=>Object.assign({note:''}, a));
  // kod identyfikuje automat na stronie załadunku i w wersji mobilnej
  const zajete = new Set(DB.machines.map(m=>m.code).filter(Boolean));
  DB.machines.forEach(m=>{
    if(m.code) return;
    const wzor = AUTOMATY_START.find(a=>a.id===m.id);
    m.code = (wzor && !zajete.has(wzor.code)) ? wzor.code : kodZNazwy(m.name, zajete);
    zajete.add(m.code);
  });
  DB.vending = Object.assign({perCol:VEND_PER_COL, slots:VEND_SLOTS, layout:{}}, DB.vending||{});
  if(!DB.vending.layout || typeof DB.vending.layout!=='object') DB.vending.layout={};
}
/** świeży załadunek: wszystkie szafki z przypisanym zestawem włączone */
function nowyZaladunek(nazwa){
  const z = {id:uid('zal'), name:nazwa||'', note:'', slots:{}};
  DB.machines.forEach(m=>{
    z.slots[m.id] = {};
    for(let n=1;n<=DB.vending.slots;n++)
      if(DB.vending.layout[String(n)]) z.slots[m.id][String(n)] = true;
  });
  return z;
}
/** czy szafka `n` automatu `mid` jest w tym załadunku zaznaczona */
function slotOn(z, mid, n){
  return !!(z.slots && z.slots[mid] && z.slots[mid][String(n)]);
}
function setSlotOn(z, mid, n, on){
  z.slots = z.slots||{}; z.slots[mid] = z.slots[mid]||{};
  if(on) z.slots[mid][String(n)] = true; else delete z.slots[mid][String(n)];
}
/** podsumowanie załadunku: ile szafek, wartość brutto i koszt netto (kanał Vending) */
function zalSuma(z, mid){
  // netto zbieramy zestaw po zestawie, bo stawka VAT siedzi przy zestawie, nie przy
  // załadunku — dzielenie sumy brutto przez jedną stawkę myli się, gdy któryś zestaw ma inną
  let szt=0, wartosc=0, netto=0, koszt=0; const wgZestawu={};
  const maszyny = mid ? DB.machines.filter(m=>m.id===mid) : active(DB.machines);
  maszyny.forEach(m=>{
    for(let n=1;n<=DB.vending.slots;n++){
      if(!slotOn(z, m.id, n)) continue;
      const s = slotSet(n); if(!s) continue;
      const c = CALC.setCalc(s,'vending');
      szt++; wartosc += c.priceGross||0; netto += c.priceNet||0; koszt += c.net;
      wgZestawu[s.id] = (wgZestawu[s.id]||0)+1;
    }
  });
  return {szt, wartosc, netto, koszt, wgZestawu};
}
/** wartość pełnego załadunku jednego automatu — wszystkie szafki z zestawem */
function pelnyAutomat(){
  let wartosc=0, netto=0, koszt=0, szt=0;
  for(let n=1;n<=DB.vending.slots;n++){
    const s = slotSet(n); if(!s) continue;
    const c = CALC.setCalc(s,'vending');
    szt++; wartosc += c.priceGross||0; netto += c.priceNet||0; koszt += c.net;
  }
  return {szt, wartosc, netto, koszt};
}

/** Rozwija załadunek w dół: z zestawów na rolki, z rolek na półprodukty
    i surowe składniki. Półprodukty pokazujemy osobno (bo kucharz je robi)
    i jednocześnie rozkładamy na surowce (bo trzeba je mieć w lodówce).
    Odpad wchodzi do zapotrzebowania — kupujesz całe kilo, nie pół. */
function zalRozpiska(z){
  const zestawy={}, rolki={}, polprodukty={}, skladniki={};

  const dodajSkladnik = (refId, ile, seen) => {
    if(!(ile>0)) return;
    const p = CALC.prep(refId);
    if(p){
      polprodukty[refId] = (polprodukty[refId]||0) + ile;
      if(seen.has(refId)) return;                       // ochrona przed pętlą
      const s2 = new Set(seen); s2.add(refId);
      if(!p.yieldQty) return;
      const partii = ile / p.yieldQty;
      p.items.forEach(c=>{
        const potrzeba = ((c.qty||0)+(c.waste||0)) * partii;
        if(c.kind==='raw'){ skladniki['raw:'+c.name] = (skladniki['raw:'+c.name]||0) + potrzeba; return; }
        dodajSkladnik(c.refId, potrzeba, s2);
      });
      return;
    }
    if(CALC.ing(refId)) skladniki[refId] = (skladniki[refId]||0) + ile;
  };

  active(DB.machines).forEach(m=>{
    for(let n=1;n<=DB.vending.slots;n++){
      if(!slotOn(z, m.id, n)) continue;
      const s = slotSet(n); if(!s) continue;
      zestawy[s.id] = (zestawy[s.id]||0) + 1;
    }
  });
  Object.keys(zestawy).forEach(sid=>{
    const s = CALC.set(sid), n = zestawy[sid];
    (s.entries||[]).forEach(e=>{ rolki[e.itemId] = (rolki[e.itemId]||0) + (e.pieces||0)*n; });
    (s.comps||[]).forEach(c=>dodajSkladnik(c.refId, (c.qty||0)*n, new Set()));
  });
  Object.keys(rolki).forEach(iid=>{
    const it = CALC.item(iid); if(!it || !it.pieces) return;
    const mnoznik = rolki[iid] / it.pieces;
    (it.comps||[]).forEach(c=>dodajSkladnik(c.refId, (c.qty||0)*mnoznik, new Set()));
  });
  return {zestawy, rolki, polprodukty, skladniki};
}

/* ---------- wybrany dzień ----------
   Widoki z grupy „Pulpit" pokazują jeden dzień: co ugotować, co zwinąć,
   co spakować. Dzień → dzień tygodnia → załadunek standardowy. */
let DAY = null;   // ustawiane przy starcie na dziś
function przesunDate(iso, n){
  const d = new Date(iso+'T12:00:00'); d.setDate(d.getDate()+n);
  return d.toISOString().slice(0,10);
}
function dzienKlucz(iso){
  const d = new Date(iso+'T12:00:00');
  return ['nd','pn','wt','sr','cz','pt','so'][d.getDay()];
}
function dzienNazwa(iso){
  const d = DNI.find(x=>x.k===dzienKlucz(iso));
  return d ? d.pl : '';
}
/** Data tak, jak się ją mówi: „piątek 07.08.2026". Nazwa dnia stała wcześniej obok,
    w osobnej plakietce — a to jest jedna informacja, nie dwie, i czyta się ją razem. */
function dataDluga(iso){
  return dzienNazwa(iso) + ' ' + iso.slice(8) + '.' + iso.slice(5,7) + '.' + iso.slice(0,4);
}
function zaladunekNaDate(iso){ return zaladunekNaDzien(dzienKlucz(iso)); }
/** komplet danych dnia: załadunek i rozpisany na czynniki plan produkcji */
function daneDnia(iso){
  const z = zaladunekNaDate(iso);
  return {iso, z, r: z ? zalRozpiska(z) : null};
}

/* ---------- dni tygodnia ----------
   Załadunek standardowy obowiązuje w wybrane dni. Każdy dzień może należeć
   tylko do jednego załadunku — inaczej nie wiadomo, co jedzie w poniedziałek. */
const DNI = [
  {k:'pn', l:'Pn', pl:'poniedziałek'},
  {k:'wt', l:'Wt', pl:'wtorek'},
  {k:'sr', l:'Śr', pl:'środa'},
  {k:'cz', l:'Cz', pl:'czwartek'},
  {k:'pt', l:'Pt', pl:'piątek'},
  {k:'so', l:'So', pl:'sobota'},
  {k:'nd', l:'Nd', pl:'niedziela'},
];
const DZIEN_IDX = {}; DNI.forEach((d,i)=>DZIEN_IDX[d.k]=i);

/** „Pn–Cz, So" zamiast „Pn, Wt, Śr, Cz, So" — zakresy zwijamy */
function dniLabel(days){
  const idx = (days||[]).map(k=>DZIEN_IDX[k]).filter(i=>i!=null).sort((a,b)=>a-b);
  if(!idx.length) return '';
  const grupy=[]; let od=idx[0], po=idx[0];
  for(let i=1;i<idx.length;i++){
    if(idx[i]===po+1){ po=idx[i]; continue; }
    grupy.push([od,po]); od=po=idx[i];
  }
  grupy.push([od,po]);
  return grupy.map(([a,b])=> a===b ? DNI[a].l : (b-a===1 ? DNI[a].l+', '+DNI[b].l : DNI[a].l+'–'+DNI[b].l)).join(', ');
}
/* Plan tygodnia trzymamy jako mapa dzień → załadunek, a nie listę dni przy
   załadunku. Dzięki temu „jeden dzień, jeden załadunek" wynika z samej
   struktury danych i nie da się tego złamać — nie ma czego walidować. */
function zaladunekNaDzien(k){
  const id = (DB.week||{})[k];
  if(!id) return null;
  const z = DB.loads.find(x=>x.id===id);
  return (z && !z.archived) ? z : null;
}
/** w które dni jedzie ten załadunek */
function dniZaladunku(z){
  return DNI.filter(d=>(DB.week||{})[d.k]===z.id).map(d=>d.k);
}
function ustawDzien(k, loadId){
  DB.week = DB.week || {};
  if(loadId) DB.week[k] = loadId; else delete DB.week[k];
}
function migrateLoads(){
  if(!Array.isArray(DB.loads)) DB.loads = [];
  DB.week = DB.week || {};
  // starszy zapis trzymał dni przy załadunku — przenosimy do mapy tygodnia
  DB.loads.forEach(z=>{
    if(!Array.isArray(z.days)) return;
    z.days.forEach(k=>{ if(DZIEN_IDX[k]!=null && !DB.week[k]) DB.week[k] = z.id; });
    delete z.days;
  });
  // wpisy wskazujące na nieistniejący załadunek tylko myliłyby plan
  Object.keys(DB.week).forEach(k=>{
    if(DZIEN_IDX[k]==null || !DB.loads.some(z=>z.id===DB.week[k])) delete DB.week[k];
  });
}

/** zestaw przypisany do szafki (null = pusta) */
function slotSet(n){
  const id = DB.vending.layout[String(n)];
  return id ? CALC.set(id) : null;
}

/** Do wersji 1.14 odpad był osobną linią receptury z flagą `waste:true`.
    Teraz jest drugą ilością przy tym samym składniku: `qty` idzie do produktu,
    `waste` tylko do kosztu. Czytelniej i o połowę mniej wierszy. */
function migrateWaste(p){
  if(!p || !Array.isArray(p.items)) return;
  const out = [];
  p.items.forEach(c=>{
    if(c.waste === true) return;                       // stare linie odpadu w drugim przebiegu
    out.push(Object.assign({}, c, {waste: typeof c.waste === 'number' ? c.waste : 0}));
  });
  p.items.forEach(c=>{
    if(c.waste !== true) return;
    const cel = out.find(x=>x.kind===c.kind && x.refId===c.refId && x.name===c.name);
    if(cel) cel.waste = (cel.waste||0) + (c.qty||0);
    else out.push(Object.assign({}, c, {qty:0, waste:(c.qty||0)}));
  });
  p.items = out;
}

/** Do wersji 1.8 zestaw trzymał tackę, pałeczki i sos w osobnym polu `pack`.
    Teraz to zwykłe dodatki — przenosimy je do `comps` i kasujemy stare pole.
    Ilości sumują się, gdy ten sam składnik był i w opakowaniu, i w dodatkach. */
function migratePack(s){
  s.comps = s.comps || [];
  const p = s.pack;
  if(!p) return;
  [[p.trayId,p.trayQty],[p.chopId,p.chopQty],[p.sauceId,p.sauceQty]].forEach(pair=>{
    const id=pair[0], q=pair[1];
    if(!id || !q) return;
    const ex = s.comps.find(c=>c.refId===id);
    if(ex) ex.qty = (ex.qty||0) + q; else s.comps.push({refId:id, qty:q});
  });
  delete s.pack;
}

/* ---------- podmiana składnika w całym menu ---------- */

/** wszystkie miejsca, w których występuje dany składnik lub półprodukt */
function occurrences(refId){
  const out=[];
  DB.items.forEach(i=>i.comps.forEach((c,idx)=>{ if(c.refId===refId)
    out.push({where:'rolka', name:itName(i), obj:i, list:i.comps, idx, kindField:false}); }));
  DB.preps.forEach(p=>p.items.forEach((c,idx)=>{ if(c.refId===refId)
    out.push({where:'półprodukt', name:p.name, obj:p, list:p.items, idx, kindField:true}); }));
  DB.sets.forEach(st=>{
    (st.comps||[]).forEach((c,idx)=>{ if(c.refId===refId)
      out.push({where:'dodatek zestawu', name:st.name, obj:st, list:st.comps, idx, kindField:false}); });
  });
  return out;
}

/** wystąpienia, których NIE wolno podmienić na `toId` — bo powstałaby pętla.

    Klasyczny przypadek: zamiana „Ryż” na półprodukt „Ryż gotowany”. Ryż surowy jest
    składnikiem tego półproduktu, więc podmiana w jego wnętrzu kazałaby mu liczyć
    samego siebie i koszt zapadłby się do zera. */
function skipsForCycle(fromId, toId){
  return occurrences(fromId).filter(o => o.obj && o.obj.id === toId);
}

/** podmienia wszystkie wystąpienia; qty przemnożone przez factor.
    Zwraca {zmienione, pominiete}. */
function replaceEverywhere(fromId, toId, factor){
  const isPrep = !!CALC.prep(toId);
  let n=0, skip=0;
  occurrences(fromId).forEach(o=>{
    if(o.obj && o.obj.id === toId){ skip++; return; }      // ochrona przed pętlą
    const c=o.list[o.idx];
    c.refId=toId;
    c.qty=(c.qty||0)*factor;
    if(o.kindField) c.kind = isPrep ? 'prep' : 'ing';
    n++;
  });
  return {zmienione:n, pominiete:skip};
}

/** czy któryś półprodukt przestał dawać się policzyć (pętla) */
function prepsBroken(){
  return DB.preps.some(p=>CALC.prepUnitCost(p.id)==null);
}

/* ---------------------------------------------------------------------------
   ARCHIWUM I USUWANIE — na końcu edycji, nie w ramce okna
   Stopka okna to miejsce na „Zapisz” i „Anuluj”. Przycisk, który kasuje pozycję
   bezpowrotnie, nie ma prawa stać obok przycisku klikanego dziesięć razy dziennie.
   Trafia więc na koniec bloku edycji, za wszystkie pola, z opisem, co robi.
   ------------------------------------------------------------------------- */
/** Co archiwum robi z TĄ rzeczą i kiedy usunięcie zadziała — osobno dla każdego rodzaju.

    Jeden wspólny opis mówił o recepturach i kosztach, co przy składniku jest prawdą,
    a przy załadunku nie znaczy nic: załadunek nie stoi w żadnej recepturze i niczego
    nie kosztuje. */
const OPIS_RYZYKA = {
  ing:  'Archiwum chowa składnik z list, ale zostawia go w recepturach — koszty liczą się '
      + 'dalej. Usunięcie zadziała tylko wtedy, gdy żadna receptura już go nie używa.',
  prep: 'Archiwum chowa półprodukt z list, ale zostawia go w recepturach — koszty liczą się '
      + 'dalej. Usunięcie zadziała tylko wtedy, gdy żadna receptura już go nie używa.',
  items:'Archiwum chowa rolkę z list, ale zostawia ją w zestawach — koszty liczą się dalej. '
      + 'Usunięcie zadziała tylko wtedy, gdy żaden zestaw już jej nie zawiera.',
  sets: 'Archiwum chowa zestaw z list i z automatów, ale zostawia go w policzonych '
      + 'załadunkach. Usunięcie zadziała tylko wtedy, gdy żadna szafka nie ma go w układzie.',
  mach: 'Archiwum chowa automat z list i pomija go przy liczeniu załadunków. '
      + 'Usunięcie jest nieodwracalne — razem z automatem znika jego układ szafek.',
  load: 'Archiwum chowa załadunek z listy; dni tygodnia, do których był przypisany, '
      + 'zostają bez planu. Usunięcie jest nieodwracalne.'
};
function strefaRyzykowna(o, rodzaj){
  if(!o) return '';
  return `<div class="ryzyko">
    <div class="txt"><b>Archiwum i usuwanie</b>
      <div class="hint">${OPIS_RYZYKA[rodzaj] || OPIS_RYZYKA.ing}</div></div>
    <div class="row">
      <button type="button" class="btn sm" data-strefa-arch>${
        o.archived?'Przywróć z archiwum':'Przenieś do archiwum'}</button>
      <button type="button" class="btn sm danger" data-strefa-del>Usuń bezpowrotnie</button>
    </div></div>`;
}
/** podpina oba przyciski strefy; `po` sprząta stan widoku po usunięciu */
function wireStrefa(key, id, po){
  const a = document.querySelector('[data-strefa-arch]');
  if(a) a.addEventListener('click', ()=>{
    if(toggleArchive(key, id)){ DLG.close(); render(); } });
  const d = document.querySelector('[data-strefa-del]');
  if(d) d.addEventListener('click', ()=>{
    if(deleteEntity(key, id)){ DLG.close(); if(po) po(); render(); } });
}
/* --- CZTERY POZIOMY UPRAWNIEŃ ---------------------------------------------
   właściciel     — wszystko; jego konta nikt inny nie usunie ani nie zdegraduje
   administrator  — to samo, poza kontem właściciela
   pracownik      — panel dnia, grafik i receptury BEZ CEN; zapisuje się na zmiany
   podgląd        — to samo, ale niczego nie zmienia (tablet w kuchni)

   To są tylko zamki w interfejsie. Prawdziwa granica jest na serwerze: konto poziomu
   3 i 4 dostaje bazę już bez cen, więc nie ma ich także w konsoli przeglądarki.
   ------------------------------------------------------------------------- */
const ZARZAD = ['owner', 'admin'];
/** Poza trybem serwerowym nie ma kont — przy pliku z dysku siedzi ten, kto go otworzył. */
function rolaMoja(){ return (SRV.on && SRV.user) ? SRV.user.role : null; }
/** czy bieżący użytkownik może edytować dane */
function canEdit(){
  const r = rolaMoja();
  return !r || ZARZAD.indexOf(r) >= 0;
}
/** Poziomy bez cen: aplikacja zwija się dla nich do podglądów. */
function bezCen(){
  const r = rolaMoja();
  return r === 'staff' || r === 'viewer';
}
/** „Podgląd" nie rusza nawet własnego wpisu w grafiku. */
function mogeSam(){ return rolaMoja() !== 'viewer'; }
/** Konta zakłada i kasuje właściciel oraz administrator. */
function mozeKonta(){
  const r = rolaMoja();
  return !!r && ZARZAD.indexOf(r) >= 0;
}
function clone(o){ return JSON.parse(JSON.stringify(o)); }
function todayISO(){ return new Date().toISOString().slice(0,10); }

/* ---------------------------------------------------------------------------
   ZNAK FIRMOWY
   Oryginalne pliki SVG z identyfikacji Noto Sushi, odchudzone z metadanych.
   Czerń znaku jedzie na `currentColor`, więc ten sam rysunek działa na jasnym
   i na ciemnym tle — nie trzymamy dwóch wersji tego samego logo.

/** Znak w menu. Jedna siatka, jedna grubość kreski, kolor dziedziczony po zakładce. */
function ikona(k, rozm){
  const r = rozm || 17;
  return '<svg viewBox="0 0 24 24" width="' + r + '" height="' + r + '" fill="none"'
    + ' stroke="currentColor" stroke-width="1.6" stroke-linecap="round"'
    + ' stroke-linejoin="round" aria-hidden="true">'
    + (IKONY[k] || '') + '</svg>';
}

function logoHtml(atrybuty){
  return `<svg viewBox="${LOGO_VB}" ${atrybuty||''} xmlns="http://www.w3.org/2000/svg"
    role="img" aria-label="Noto Sushi">${LOGO_D}</svg>`;
}
/** sam sygnet — tam, gdzie na napis nie ma miejsca */
function znakHtml(atrybuty){
  return `<svg viewBox="${ZNAK_VB}" ${atrybuty||''} xmlns="http://www.w3.org/2000/svg"
    role="img" aria-label="Noto Sushi">${ZNAK_D}</svg>`;
}

   KATEGORIE ROLEK
   „Hosomaki Ogórek" to w istocie kategoria i nazwa sklejone w jeden ciąg. Rozbite
   dają się filtrować, sortować i skracać: tam, gdzie jest miejsce, piszemy
   „Hosomaki Ogórek", a gdzie go nie ma — „HS Ogórek".
   ------------------------------------------------------------------------- */
const KAT_ROLEK = [{name:'Hosomaki', code:'HS', pref:'hosomak'},
                   {name:'Uramaki',  code:'UR', pref:'uramak'},
                   {name:'Futomaki', code:'FT', pref:'futomak'}];

function katRolki(it){
  return (it && it.catId) ? (DB.cats||[]).find(k=>k.id===it.catId) || null : null;
}
/** pełna nazwa rolki — kategoria i nazwa */
function itName(it){
  if(!it) return '';
  const k = katRolki(it);
  return k ? k.name + ' ' + it.name : it.name;
}
/** krótka nazwa — kod kategorii i nazwa; tam, gdzie mało miejsca */
function itNameK(it){
  if(!it) return '';
  const k = katRolki(it);
  return k ? k.code + ' ' + it.name : it.name;
}
/** unikalny kod dla nowej kategorii: dwie pierwsze litery, w razie kolizji z cyfrą */
function nowyKodKategorii(nazwa){
  const baza = (bezOgonkow(nazwa).replace(/[^a-z]/g,'').slice(0,2) || 'KA').toUpperCase();
  let kod = baza, i = 2;
  while((DB.cats||[]).some(k=>k.code === kod)) kod = baza + (i++);
  return kod;
}
/** Wydziela kategorię z pierwszego członu nazwy. Robi to raz — potem pole `catId`
    już jest i migracja przestaje cokolwiek ruszać. Nazwy, których nie rozpoznaje,
    zostawia w spokoju: lepiej rolka bez kategorii niż przycięta nazwa. */
function migrateCats(){
  DB.cats = DB.cats || [];
  DB.items.forEach(it=>{
    if('catId' in it) return;
    const czesci = String(it.name||'').trim().split(/\s+/);
    const wzor = czesci.length > 1 &&
      KAT_ROLEK.find(k=>bezOgonkow(czesci[0]).toLowerCase().indexOf(k.pref) === 0);
    if(!wzor){ it.catId = null; return; }
    let kat = DB.cats.find(k=>k.name === wzor.name);
    if(!kat){
      kat = {id:'kat-' + wzor.code.toLowerCase(), name:wzor.name, code:wzor.code};
      DB.cats.push(kat);
    }
    it.catId = kat.id;
    it.name = czesci.slice(1).join(' ');
  });
}

/** JEDNO miejsce na wszystkie migracje i uzupełnienia struktury.
    Dane wchodzą do aplikacji trzema drogami — localStorage, serwer i import —
    i każda musi przejść przez tę funkcję. Trzymanie tego w dwóch miejscach
    już dwa razy skończyło się pustym widokiem po aktualizacji. */
/* ============================================================================
   GRAFIK ZMIAN

   Trzy warstwy, od ogólnej do szczegółowej:

   1. `DB.shiftTpl`   — szablon tygodniowy: dla każdego dnia tygodnia lista zmian.
                        Obowiązuje bezterminowo, więc kalendarz jest wypełniony
                        na wszystkie miesiące w przód bez żadnej pracy.
   2. `DB.shiftWeeks` — nadpisania konkretnego tygodnia (klucz ISO, np. „2026-W33").
                        Tydzień z nadpisaniem ignoruje szablon w całości — kopiujemy
                        do niego szablon w momencie tworzenia, żeby nie trzeba było
                        wpisywać wszystkiego od nowa.
   3. `DB.signups`    — kto się zgłosił i kto jest przypisany, per dzień i zmiana.

   Zgłoszenie i przypisanie to dwie różne rzeczy: na jeden slot może się zgłosić
   pięć osób, a stoi ta, którą wybierze menedżer. Dlatego trzymamy dwie listy,
   a nie jedną z flagą — „chętny" nie znika po odrzuceniu, tylko czeka.
   ========================================================================== */

/** Domyślny szablon: dwie zmiany w tygodniu, jedna w weekend. Punkt wyjścia
    do przestawienia, nie żadna prawda objawiona. */
function domyslnySzablon(){
  const zm = (n, od, doo, sl) => ({id:uid('zm'), name:n, from:od, to:doo, slots:sl});
  const tydzien = () => [zm('I zmiana','08:00','16:00',2), zm('II zmiana','16:00','22:00',1)];
  const weekend = () => [zm('I zmiana','10:00','18:00',1)];
  const t = {};
  DNI.forEach(d=>{ t[d.k] = (d.k==='so'||d.k==='nd') ? weekend() : tydzien(); });
  return t;
}

/** Poniedziałek tygodnia, w którym leży `iso`. Liczymy w UTC, bo strefa czasowa
    potrafi przesunąć północ o godzinę i wtedy dzień tygodnia wychodzi o jeden obok. */
function poniedzialek(iso){
  const d = new Date(iso + 'T00:00:00Z');
  d.setUTCDate(d.getUTCDate() - ((d.getUTCDay() + 6) % 7));
  return d.toISOString().slice(0,10);
}
/** Numer tygodnia w formacie ISO-8601 („2026-W33"). Tydzień należy do roku,
    w którym leży jego czwartek — inaczej przełom roku dawałby dwa tygodnie nr 1. */
function isoTydzien(iso){
  const d = new Date(iso + 'T00:00:00Z');
  d.setUTCDate(d.getUTCDate() - ((d.getUTCDay() + 6) % 7) + 3);
  const rok = d.getUTCFullYear();
  const czw = new Date(Date.UTC(rok, 0, 4));
  czw.setUTCDate(czw.getUTCDate() - ((czw.getUTCDay() + 6) % 7) + 3);
  const nr = 1 + Math.round((d - czw) / 604800000);
  return rok + '-W' + String(nr).padStart(2, '0');
}
function dniKod(iso){ return DNI[(new Date(iso + 'T00:00:00Z').getUTCDay() + 6) % 7].k; }
function przesunISO(iso, dni){
  const d = new Date(iso + 'T00:00:00Z'); d.setUTCDate(d.getUTCDate() + dni);
  return d.toISOString().slice(0,10);
}
function czyNadpisany(iso){ return !!(DB.shiftWeeks||{})[isoTydzien(iso)]; }

/** Zmiany obowiązujące danego dnia — z nadpisania tygodnia, a jak go nie ma,
    z szablonu. Zwracamy kopie referencji z bazy, nie klony: id musi zostać ten sam,
    bo po nim wiszą zgłoszenia. */
function zmianyDnia(iso){
  const nad = (DB.shiftWeeks||{})[isoTydzien(iso)];
  const zrodlo = nad || DB.shiftTpl || {};
  return (zrodlo[dniKod(iso)] || []).filter(z=>z && z.id);
}

function zapisKlucz(iso, sid){ return iso + '|' + sid; }

/* Zapisy to JEDNA lista. Kto pierwszy kliknie, ten stoi; gdy miejsc nie ma, zapis
   się nie udaje i trzeba się z kimś dogadać, żeby się wypisał. Kolejka chętnych,
   z której menedżer wybierał, brzmiała rozsądnie, a w praktyce znaczyła, że nikt
   nie wie, czy przyjdzie, dopóki ktoś nie kliknie — i że każdy zapis wymagał
   drugiej decyzji. Teraz zapis jest decyzją. */
function zapisy(iso, sid){
  const w = (DB.signups||{})[zapisKlucz(iso, sid)] || {};
  return {osoby: w.osoby || []};
}
function zapisyZapisz(iso, sid, osoby){
  DB.signups = DB.signups || {};
  const k = zapisKlucz(iso, sid);
  if(!osoby.length) delete DB.signups[k];
  else DB.signups[k] = {osoby: osoby.slice()};
}

/** Obsada slotu: ile miejsc, kto stoi, ile jeszcze wolnych. */
function obsada(iso, z){
  const osoby = zapisy(iso, z.id).osoby;
  const slots = z.slots || 0;
  return {slots, osoby, pelna: osoby.length >= slots,
          wolne: Math.max(0, slots - osoby.length)};
}

/* --- REJESTR ZDARZEŃ DNIA -------------------------------------------------
   Dwa zdarzenia: wyjazd samochodu z kuchni i zatowarowanie automatu. Jedno na dzień —
   samochód wyjeżdża raz, automat jest uzupełniany raz. Klucz płaski, jak w zapisach
   grafiku, żeby każda operacja ruszała dokładnie jeden wiersz.

   Czas zawsze pochodzi z SERWERA. W trybie lokalnym (plik z dysku) bierzemy zegar
   przeglądarki, bo innego nie ma — ale wtedy i tak nie ma kont, więc nie ma czego dowodzić.
   ------------------------------------------------------------------------- */
const ZDARZENIA_PL = {wyjazd: 'Wyjazd z kuchni', automat: 'Zatowarowano'};

function kluczZdarzenia(iso, rodzaj, mid){
  return iso + '|' + rodzaj + (rodzaj === 'automat' ? '|' + (mid||'') : '');
}
function zdarzenie(iso, rodzaj, mid){
  return (DB.zdarzenia || {})[kluczZdarzenia(iso, rodzaj, mid)] || null;
}
/** Godzina rejestracji. Gdy stempel padł innego dnia niż ten, którego dotyczy wpis
    (ktoś zapomniał kliknąć i nadrobił nazajutrz), pokazujemy też datę — inaczej zapis
    kłamałby o tym, kiedy powstał. */
function czasZdarzenia(w, iso){
  if(!w || !w.czas) return '';
  const d = new Date(w.czas * 1000);
  const hm = String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
  const dzien = d.toISOString().slice(0,10);
  return dzien === iso ? hm : dataKrotko(dzien) + ' ' + hm;
}
/** Czy wolno mi cofnąć ten wpis: swój cofa każdy, cudzy właściciel albo administrator. */
function mogeCofnac(w){
  if(!w) return false;
  if(mozeGrafik()) return true;
  const o = mojaOsoba();
  return !!o && w.osoba === o.id;
}
function przytnijZdarzenia(){
  // Rok z okładem: tyle, żeby dało się porównać ten miesiąc z tym samym rok wcześniej.
  // Dłużej trzymany rejestr rósłby w każdym zapisie bazy, a nikt do niego nie wraca.
  const prog = przesunISO(todayISO(), -400);
  Object.keys(DB.zdarzenia || {}).forEach(k=>{
    if(k.slice(0,10) < prog) delete DB.zdarzenia[k];
  });
}

/* ---------- osoby ----------
   Kartoteka to odbicie kont w aplikacji: w grafiku może stać wyłącznie ktoś,
   kto ma konto, więc nie ma osobnej listy nazwisk do utrzymywania. Wpis powstaje
   sam przy pierwszym zgłoszeniu albo wtedy, gdy właściciel nada komuś skrót
   lub kolor w Użytkownikach. `email` jest kluczem tożsamości, `id` — kluczem
   technicznym, po którym wiszą zapisy. */

/* --- SZESNAŚCIE KOLORÓW OSÓB ----------------------------------------------
   Nie dowolny wybór z tęczy, tylko policzona paleta: odcienie rozłożone równo po kole
   barw z pominięciem pasa firmowej czerwieni, co drugi ciemniejszy — więc sąsiedzi
   różnią się nie tylko barwą, ale i jasnością, a to jedyne, co widać pewnie także przy
   niedowidzeniu barw i na wydruku.

   Najmniejsza różnica między dowolną parą to 16 jednostek ΔE2000 (2 to próg
   dostrzegalności), a do firmowej czerwieni — 20. Każdy kolor ma co najmniej 6:1
   kontrastu z bielą albo czernią, bo plakietka ma 9 px i napis musi być czytelny.

   Żadnej szarości: szarość w tej aplikacji jest kolorem interfejsu, nie kolorem osoby.
   Kto nie wybrał nic, dostaje `KOLOR_DOMYSLNY` — i to właśnie ma znaczyć „nikt tego
   jeszcze nie ustawił", więc nie ma go w palecie do wyboru. */
const KOLORY_OSOB = [
  {v:'#924300', l:'brązowy'},
  {v:'#C77926', l:'bursztynowy'},
  {v:'#705600', l:'musztardowy'},
  {v:'#8B9216', l:'oliwkowy'},
  {v:'#4A6102', l:'mchowy'},
  {v:'#409E45', l:'zielony'},
  {v:'#04673F', l:'butelkowy'},
  {v:'#089D86', l:'morski'},
  {v:'#0C6465', l:'petrolowy'},
  {v:'#0599B0', l:'turkusowy'},
  {v:'#085F88', l:'granatowy'},
  {v:'#0C91E3', l:'niebieski'},
  {v:'#514DAF', l:'indygo'},
  {v:'#9F77DF', l:'lawendowy'},
  {v:'#8F328E', l:'śliwkowy'},
  {v:'#DF5BA3', l:'różowy'},
];
const KOLOR_DOMYSLNY = '#55606E';
/* Osiem kolorów ze starej palety przechodzi na najbliższy z nowych, żeby nikomu nie
   zmienił się podpis na kalendarzu bardziej, niż musi. Grafit był wcześniej wyborem,
   a teraz jest kolorem „nie wybrano" — więc wraca do domyślnego. */
const KOLORY_STARE = {
  '#2E6FB7': '#085F88', '#106A7E': '#0C6465', '#1E7A4B': '#04673F', '#5F6D19': '#4A6102',
  '#B25C0E': '#924300', '#A02C6B': '#8F328E', '#6B45B0': '#514DAF', '#55606E': null,
};

/** Jasność względna wg WCAG — potrzebna, żeby dobrać kolor tekstu na plakietce. */
function jasnosc(hex){
  const k = String(hex||'').replace('#','');
  if(k.length !== 6) return 0;
  const kanal = i => {
    const c = parseInt(k.slice(i*2, i*2+2), 16) / 255;
    return c <= 0.03928 ? c/12.92 : Math.pow((c + 0.055)/1.055, 2.4);
  };
  return 0.2126*kanal(0) + 0.7152*kanal(1) + 0.0722*kanal(2);
}
/** Biały albo czarny napis — ten, który daje większy kontrast. Plakietka ma
    9-10 px, więc nie ma marginesu na zgadywanie. */
function kontrastNa(hex){
  const l = jasnosc(hex);
  return (l + 0.05) > Math.sqrt(0.05 * 1.05) ? '#101010' : '#ffffff';
}

function osoba(id){ return (DB.staff||[]).find(o=>o.id===id) || null; }
function osobaNazwa(id){ const o = osoba(id); return o ? (o.name || o.email || '?') : '— usunięta —'; }
function osobaKolor(o){ return (o && o.color) || KOLOR_DOMYSLNY; }
/** Skrót nadany ręcznie, a jak go nie ma — pierwsze sześć znaków nazwy. Na kalendarzu
    zawsze coś stoi, nawet zanim właściciel przejdzie przez listę kont. */
function osobaSkrot(o){
  if(!o) return '?';
  const s = String(o.code || '').trim();
  if(s) return s;
  // pierwszy człon nazwy, nie pierwsze sześć znaków całości: „Zosia Wiśniewska"
  // ma dać „Zosia", a nie „Zosia " z wiszącą spacją
  const slowo = String(o.name || o.email || '').split(/[^\p{L}\p{N}]+/u).filter(Boolean)[0];
  return (slowo || '?').slice(0, 6);
}
function skrotHtml(o){
  const k = osobaKolor(o);
  return `<span class="kod" style="background:${k};color:${kontrastNa(k)}"
    data-tip="${esc(o ? (o.name || o.email || '') : '')}">${esc(osobaSkrot(o))}</span>`;
}

/** Lista godzin co kwadrans do wyboru w szablonie zmian.

    Pole `type=time` w przeglądarce wygląda niepozornie, ale obsługuje się je wyłącznie
    z klawiatury: trzeba trafić w segment godziny, wpisać dwie cyfry, przejść do minut.
    Układanie szablonu to kilkanaście takich pól pod rząd. Lista rozwijana załatwia to
    jednym kliknięciem, a przy okazji nie wpuści „25:70". Kwadrans wystarcza — zmiana
    zaczynająca się o 8:07 nie istnieje. */
function godzinyOpcje(){
  const l = [];
  for(let h = 0; h < 24; h++)
    for(let m = 0; m < 60; m += 15)
      l.push(String(h).padStart(2,'0') + ':' + String(m).padStart(2,'0'));
  return l;
}
/** Wybór godziny; wartość spoza kwadransów (ze starych danych) dokładamy do listy,
    żeby otwarcie szablonu nie skasowało po cichu czyjegoś 8:20. */
function polePory(wartosc, atrybut){
  const opcje = godzinyOpcje();
  const v = String(wartosc || '');
  if(v && opcje.indexOf(v) < 0) opcje.push(v);
  return '<select ' + atrybut + '><option value="">—</option>'
    + opcje.map(g=>'<option value="' + g + '"' + (g === v ? ' selected' : '') + '>' + g + '</option>').join('')
    + '</select>';
}

/* ---------- godziny ---------- */
/** Długość zmiany w godzinach. Zmiana przez północ (22:00–06:00) to normalna rzecz
    w gastronomii, więc doba się dokłada zamiast wyjść liczbą ujemną. */
function godzinyZmiany(z){
  const m = t => { const p = String(t||'').match(/^(\d{1,2}):(\d{2})$/);
                   return p ? (+p[1]) * 60 + (+p[2]) : null; };
  const od = m(z && z.from), doo = m(z && z.to);
  if(od == null || doo == null) return 0;
  return ((doo - od + 1440) % 1440) / 60;
}
/** Godziny i liczba dni w podanych dniach. `osId === null` znaczy „wszyscy razem" —
    tak liczy się nagłówek w trybie lokalnym, gdzie nie ma zalogowanej osoby. */
function godzinyDni(osId, dni){
  let godziny = 0, ile = 0;
  dni.forEach(iso=>{
    let ma = false;
    zmianyDnia(iso).forEach(z=>{
      const osoby = zapisy(iso, z.id).osoby;
      const n = osId ? (osoby.indexOf(osId) >= 0 ? 1 : 0) : osoby.length;
      if(n){ godziny += godzinyZmiany(z) * n; ma = true; }
    });
    if(ma) ile++;
  });
  return {godziny, dni: ile};
}
/** Wszystkie dni miesiąca „2026-08" po kolei. */
function dniMiesiaca(ym){
  const out = [], koniec = przesunMies(ym, 1) + '-01';
  for(let d = ym + '-01'; d < koniec; d = przesunISO(d, 1)) out.push(d);
  return out;
}

/** Godziny osoby w danym miesiącu („2026-08"): osobno te już w grafiku i te,
    na które się zapisała, ale decyzji jeszcze nie ma. */
function godzinyOsoby(osId, ym){
  let wgrafiku = 0, zmian = 0;
  const koniec = przesunMies(ym, 1) + '-01';
  for(let iso = ym + '-01'; iso < koniec; iso = przesunISO(iso, 1)){
    zmianyDnia(iso).forEach(z=>{
      if(zapisy(iso, z.id).osoby.indexOf(osId) >= 0){ wgrafiku += godzinyZmiany(z); zmian++; }
    });
  }
  return {wgrafiku, zmian};
}
/** Wszyscy, którzy w tym miesiącu gdziekolwiek figurują — z godzinami.
    Najpierw ci z największą liczbą godzin: przy układaniu grafiku patrzy się,
    komu się należy, a komu już wystarczy. */
function godzinyMiesiaca(ym){
  const widziani = new Set();
  const koniec = przesunMies(ym, 1) + '-01';
  for(let iso = ym + '-01'; iso < koniec; iso = przesunISO(iso, 1))
    zmianyDnia(iso).forEach(z=>zapisy(iso, z.id).osoby.forEach(i=>widziani.add(i)));
  return [...widziani].map(id=>({os: osoba(id) || {id, name:'— usunięta —'},
                                 ...godzinyOsoby(id, ym)}))
    .sort((a,b)=> b.wgrafiku - a.wgrafiku
                  || String(a.os.name||'').localeCompare(String(b.os.name||''), 'pl'));
}
function godz(h){
  if(!h) return '0 h';
  return (Math.round(h * 10) / 10).toString().replace('.', ',') + ' h';
}
/** Konto zalogowanego użytkownika w kartotece pracowników. Dopisujemy je przy
    pierwszym zetknięciu, żeby menedżer nie musiał zakładać kartoteki ręcznie
    dla każdego, komu założył konto. */
function osobaZMaila(mail, dopisz){
  if(!mail) return null;
  DB.staff = DB.staff || [];
  let o = DB.staff.find(x=>String(x.email||'').toLowerCase() === String(mail).toLowerCase());
  if(!o && dopisz){
    o = {id: uid('os'), name: String(mail).split('@')[0], email: mail, archived: false};
    DB.staff.push(o);
  }
  return o;
}

/* ---------- kto co może ----------
   Układanie grafiku to OSOBNE uprawnienie, nie pochodna roli. Zmianami zajmuje się
   zwykle ktoś inny niż osoba od cen i receptur — kucharz z pełnym dostępem do bazy
   grafiku wynika teraz wprost z poziomu uprawnień — patrz `mozeGrafik`. */
function mojEmail(){ return (SRV.on && SRV.user) ? SRV.user.email : null; }
/** Czy to konto układa grafik INNYM ludziom. Kto zarządza bazą, ten zarządza i grafikiem;
    pracownik wpisuje wyłącznie siebie, a podgląd nawet tego. */
function mozeGrafik(){
  const r = rolaMoja();
  return !r || ZARZAD.indexOf(r) >= 0;
}
function mojaOsoba(){ return osobaZMaila(mojEmail(), false); }

/** Wpisanie na zmianę albo wypisanie. Zwraca `true`, gdy coś się zmieniło,
    i `false`, gdy zabrakło miejsca — to jedyny powód, dla którego zapis odpada. */
function wpis(iso, z, osId, on){
  const osoby = zapisy(iso, z.id).osoby.slice();
  const i = osoby.indexOf(osId);
  if(on){
    if(i >= 0) return true;                       // już stoi — nic do roboty
    if(osoby.length >= (z.slots || 0)) return false;
    osoby.push(osId);
  }else{
    if(i < 0) return true;
    osoby.splice(i, 1);
  }
  zapisyZapisz(iso, z.id, osoby);
  return true;
}

/** Zgłoszenia sprzed pół roku nikomu już nie służą, a puchną w każdym zapisie.
    Kasujemy przy wczytaniu, cicho — to nie jest informacja, po którą ktoś wraca. */
/** Przejście z kolejki chętnych na jedną listę.

    Przypisani wchodzą wprost, a chętni, którzy się nie załapali, dopełniają wolne
    miejsca w kolejności zgłoszeń — bo od teraz właśnie tak by to wyszło. Reszta
    odpada: nie ma już gdzie ich trzymać, a udawanie, że ktoś „czeka", gdy nikt tej
    kolejki nie ogląda, byłoby gorsze niż jasny brak wpisu. */
function migrujZapisy(){
  Object.keys(DB.signups || {}).forEach(k=>{
    const w = DB.signups[k];
    if(!w || Array.isArray(w.osoby)) return;
    const iso = k.slice(0, 10), sid = k.slice(11);
    const z = zmianyDnia(iso).find(x=>x.id === sid);
    const miejsc = z ? (z.slots || 0) : (w.przypisani || []).length;
    const osoby = (w.przypisani || []).slice();
    (w.chetni || []).forEach(id=>{
      if(osoby.length < miejsc && osoby.indexOf(id) < 0) osoby.push(id);
    });
    if(osoby.length) DB.signups[k] = {osoby};
    else delete DB.signups[k];
  });
}

function przytnijZapisy(){
  const prog = przesunISO(todayISO(), -180);
  Object.keys(DB.signups || {}).forEach(k=>{
    if(k.slice(0,10) < prog) delete DB.signups[k];
  });
}

function migrateGrafik(){
  DB.shiftTpl   = DB.shiftTpl || domyslnySzablon();
  DB.shiftWeeks = DB.shiftWeeks || {};
  DB.signups    = DB.signups || {};
  DB.staff      = DB.staff || [];
  DB.zdarzenia  = DB.zdarzenia || {};
  // skrót obcinamy przy wczytaniu, nie tylko w formularzu — dane mogą przyjść
  // z importu albo ze starszej wersji, a plakietka ma stałą szerokość
  DB.staff.forEach(o=>{
    if(o.code) o.code = String(o.code).trim().slice(0, 6);
    if(o.color && Object.prototype.hasOwnProperty.call(KOLORY_STARE, o.color))
      o.color = KOLORY_STARE[o.color];
    if(o.color && KOLORY_OSOB.every(k=>k.v !== o.color)) o.color = null;
  });
  migrujZapisy();
  // zmiana bez identyfikatora nie da się powiązać ze zgłoszeniem
  DNI.forEach(d=>{ (DB.shiftTpl[d.k] || []).forEach(z=>{ if(!z.id) z.id = uid('zm'); }); });
  Object.keys(DB.shiftWeeks).forEach(t=>{
    DNI.forEach(d=>{ (DB.shiftWeeks[t][d.k] || []).forEach(z=>{ if(!z.id) z.id = uid('zm'); }); });
  });
  przytnijZapisy();
  przytnijZdarzenia();
}

function migrateAll(){
  if(!DB) return;
  DB.settings = Object.assign({targetFc:.30, alertFc:.35, currency:'zł', roundTo:.9,
                               pdfMinFont:11, pdfMaxCols:3}, DB.settings||{});
  DB.settings.vats = Object.assign({vending:0.05, dostawa:0.08}, DB.settings.vats||{});
  DB.history     = DB.history || [];
  DB.preps       = DB.preps || [];
  DB.ingredients = DB.ingredients || [];
  DB.items       = DB.items || [];
  DB.sets        = DB.sets || [];
  migrateVending();
  migrateLoads();
  DB.preps.forEach(p=>migrateWaste(p));
  DB.sets.forEach(s=>{ s.comps = s.comps||[]; migratePack(s); migrateChannels(s); });
  DB.items.forEach(i=>{ i.comps = i.comps||[]; migrateChannels(i); });
  migrateCats();
  migrateGrafik();
}

/* ============================================================================
   LISTY ROZWIJANE Z WYSZUKIWANIEM
   Zwykły <select> pozwala skakać tylko po pierwszej literze, a przy 50 składnikach
   to za mało. Ten komponent filtruje po dowolnym fragmencie i ignoruje polskie
   ogonki, więc „losos" znajduje „Łosoś". Ukryty input trzyma id wybranej pozycji,
   dzięki czemu reszta kodu czyta wartość tak samo jak z selecta.
   ========================================================================== */
const COMBO = {};
function bezOgonkow(s){
  return String(s||'').toLowerCase()
    .replace(/ą/g,'a').replace(/ć/g,'c').replace(/ę/g,'e').replace(/ł/g,'l').replace(/ń/g,'n')
    .replace(/ó/g,'o').replace(/ś/g,'s').replace(/ź/g,'z').replace(/ż/g,'z');
}
/** markup listy: widoczne pole tekstowe + ukryta wartość + wysuwana lista */
function combo(id, ph, style){
  return `<div class="combo" style="${style||''}">
    <input type="text" class="combo-q" id="${id}_q" placeholder="${esc(ph||'Szukaj…')}"
           autocomplete="off" spellcheck="false">
    <input type="hidden" id="${id}">
    <div class="combo-pop" id="${id}_p"></div>
  </div>`;
}
/* Pozycja „nic nie wybrano”. Bez niej fillCombo podstawiłby pierwszą opcję z listy,
   a pusty wiersz zaczynałby życie z przypadkowym składnikiem. */
const PUSTY_WYBOR = {v:'', l:'— wybierz —', pin:true};
/** listy w wierszach przerysowują się przy każdym draw() — nasłuch przewijania
    wieszamy raz na identyfikator, żeby nie mnożył się bez końca */
const COMBO_SCROLL = new Set();

/** opts: [{v,l}] — sortowane po etykiecie, po polsku */
function fillCombo(id, opts, current, onPick){
  const q=document.getElementById(id+'_q'), h=document.getElementById(id), pop=document.getElementById(id+'_p');
  if(!q||!h||!pop) return;
  // pozycje z `pin` zostają na górze w podanej kolejności (np. „Wszystkie kategorie")
  const przypiete=opts.filter(o=>o.pin), reszta=opts.filter(o=>!o.pin);
  reszta.sort((a,b)=>String(a.l).localeCompare(String(b.l),'pl',{numeric:true,sensitivity:'base'}));
  const lista=[...przypiete, ...reszta];
  COMBO[id]={lista, onPick, idx:-1};
  const wybierz=o=>{ h.value=o?o.v:''; q.value=o?o.l:''; };
  wybierz(lista.find(o=>o.v===current) || lista[0] || null);

  const rysuj=()=>{
    const f=bezOgonkow(q.value.trim());
    const wid = (f && q.dataset.tknieto==='1') ? lista.filter(o=>bezOgonkow(o.l).includes(f)) : lista;
    COMBO[id].widoczne=wid; if(COMBO[id].idx>=wid.length) COMBO[id].idx=wid.length-1;
    pop.innerHTML = wid.length
      ? wid.map((o,i)=>`<div class="opt ${i===COMBO[id].idx?'on':''}" data-i="${i}">${esc(o.l)}</div>`).join('')
      : '<div class="none">Nic nie pasuje</div>';
    pop.querySelectorAll('.opt').forEach(el=>el.addEventListener('mousedown',e=>{
      e.preventDefault(); const o=wid[+el.dataset.i]; wybierz(o); zamknij();
      if(COMBO[id].onPick) COMBO[id].onPick(o.v);
    }));
  };
  const ustawPozycje=()=>{
    const r=q.getBoundingClientRect();
    const podSpodem = window.innerHeight - r.bottom;
    pop.style.left=r.left+'px'; pop.style.width=r.width+'px';
    if(podSpodem < 180 && r.top > podSpodem){ pop.style.top='auto'; pop.style.bottom=(window.innerHeight-r.top+4)+'px'; }
    else { pop.style.bottom='auto'; pop.style.top=(r.bottom+4)+'px'; }
  };
  const otworz=()=>{ rysuj(); ustawPozycje(); pop.classList.add('open'); };
  const zamknij=()=>{ pop.classList.remove('open'); q.dataset.tknieto='0'; COMBO[id].idx=-1;
    const o=lista.find(x=>x.v===h.value); if(o) q.value=o.l; };
  COMBO[id].zamknij=zamknij;

  q.addEventListener('focus',()=>{ q.dataset.tknieto='0'; q.select(); otworz(); });
  q.addEventListener('input',()=>{ q.dataset.tknieto='1'; COMBO[id].idx=0; rysuj(); ustawPozycje(); pop.classList.add('open'); });
  q.addEventListener('blur',()=>setTimeout(zamknij,120));
  q.addEventListener('keydown',e=>{
    const w=COMBO[id].widoczne||lista;
    if(e.key==='ArrowDown'||e.key==='ArrowUp'){
      e.preventDefault();
      if(!pop.classList.contains('open')) otworz();
      COMBO[id].idx=Math.max(0,Math.min(w.length-1,COMBO[id].idx+(e.key==='ArrowDown'?1:-1)));
      rysuj();
      const on=pop.querySelector('.opt.on'); if(on) on.scrollIntoView({block:'nearest'});
    } else if(e.key==='Enter'){
      e.preventDefault();
      const o=w[COMBO[id].idx<0?0:COMBO[id].idx]; if(o){ wybierz(o); zamknij(); if(COMBO[id].onPick) COMBO[id].onPick(o.v); }
    } else if(e.key==='Escape'){
      // Escape ma zamknąć samą listę, nie cały dialog pod spodem
      if(pop.classList.contains('open')){ e.preventDefault(); e.stopPropagation(); zamknij(); }
    }
  });
  if(!COMBO_SCROLL.has(id)){
    COMBO_SCROLL.add(id);
    window.addEventListener('scroll',()=>{
      const p2=document.getElementById(id+'_p');
      if(p2 && p2.classList.contains('open')){
        const q2=document.getElementById(id+'_q'); if(!q2) return;
        const r=q2.getBoundingClientRect(), podSpodem=window.innerHeight-r.bottom;
        p2.style.left=r.left+'px'; p2.style.width=r.width+'px';
        if(podSpodem < 180 && r.top > podSpodem){ p2.style.top='auto'; p2.style.bottom=(window.innerHeight-r.top+4)+'px'; }
        else { p2.style.bottom='auto'; p2.style.top=(r.bottom+4)+'px'; }
      }
    }, true);
  }
}

function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/** wczytuje zdjęcie z pliku i zmniejsza je do miniatury (max 1200 px, JPEG) */
function readPhoto(file, cb){
  if(!file){ cb(null); return; }
  if(!/^image\//.test(file.type)){ alert('To nie jest plik graficzny.'); cb(null); return; }
  const fr=new FileReader();
  fr.onload=()=>{
    const img=new Image();
    img.onload=()=>{
      const MAX=1200;
      let {width:w, height:h}=img;
      if(w>MAX||h>MAX){ const r=Math.min(MAX/w,MAX/h); w=Math.round(w*r); h=Math.round(h*r); }
      const cv=document.createElement('canvas'); cv.width=w; cv.height=h;
      const cx=cv.getContext('2d');
      cx.fillStyle='#fff'; cx.fillRect(0,0,w,h);
      cx.drawImage(img,0,0,w,h);
      cb(cv.toDataURL('image/jpeg',0.72));
    };
    img.onerror=()=>{ alert('Nie udało się odczytać zdjęcia.'); cb(null); };
    img.src=fr.result;
  };
  fr.onerror=()=>{ alert('Nie udało się odczytać pliku.'); cb(null); };
  fr.readAsDataURL(file);
}

/** podpina pole wgrywania zdjęcia (element .drop + ukryty input) */
function wirePhoto(dropId, inputId, obj, onDone){
  const drop=document.getElementById(dropId), inp=document.getElementById(inputId);
  if(!drop||!inp) return;
  const paint=()=>{
    drop.className = 'drop'+(obj.photo?' has':'');
    drop.innerHTML = obj.photo
      ? `<img src="${obj.photo}" alt="">`
      : '⊕ Kliknij, żeby dodać zdjęcie<br><span class="small">JPG lub PNG — zostanie zmniejszone do 1200 px</span>';
  };
  drop.addEventListener('click',()=>inp.click());
  drop.addEventListener('dragover',e=>{e.preventDefault();});
  drop.addEventListener('drop',e=>{ e.preventDefault();
    readPhoto(e.dataTransfer.files[0], d=>{ if(d){ obj.photo=d; paint(); if(onDone)onDone(); } }); });
  inp.addEventListener('change',()=>{
    readPhoto(inp.files[0], d=>{ if(d){ obj.photo=d; paint(); if(onDone)onDone(); } inp.value=''; }); });
  const rm=document.getElementById(dropId+'Rm');
  if(rm) rm.addEventListener('click',()=>{ obj.photo=null; paint(); if(onDone)onDone(); });
  paint();
}
